        }
        cg.computeVertexNormals();
        const cMesh = new THREE.Mesh(cg, cobbleMat);
        const sy = sampleSandHeight(cx, cz);
        cMesh.position.set(cx, sy + cr * 0.14, cz);
        cMesh.rotation.set(cobbleRand() * 0.4, cobbleRand() * Math.PI * 2, cobbleRand() * 0.4);
        cMesh.name = `prop-cobble-${i + 1}`;
        cobbleGroup.add(cMesh);
      }
      group.add(cobbleGroup);
      props.push(cobbleGroup);

      // --- 4. 左手前砂地の沈木・流木（low profile, 砂に半分埋まる） ---
      const driftGroup = new THREE.Group();
      driftGroup.name = 'prop-driftwood';
      const trunkCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-3.18, -0.02, 2.18),
        new THREE.Vector3(-2.82,  0.07, 2.12),
        new THREE.Vector3(-2.46,  0.11, 2.22),
        new THREE.Vector3(-2.18,  0.03, 2.16),
      ]);
      const trunkMesh = new THREE.Mesh(new THREE.TubeGeometry(trunkCurve, 18, 0.068, 10, false), woodMat);
      driftGroup.add(trunkMesh);
      const branchCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-2.72, 0.08, 2.14),
        new THREE.Vector3(-2.55, 0.18, 2.02),
        new THREE.Vector3(-2.42, 0.21, 1.96),
      ]);
      const branchMesh = new THREE.Mesh(new THREE.TubeGeometry(branchCurve, 10, 0.032, 8, false), woodMat);
      driftGroup.add(branchMesh);
      group.add(driftGroup);
      props.push(driftGroup);
      shadowDiscs.push({ x: -2.68, z: 2.16, rx: 0.62, rz: 0.28, strength: 0.40 });

      // --- 5. 右手前岩陰の素焼き蛸壺（瀬戸内海らしい生活感） ---
      const jarPts = [
        new THREE.Vector2(0.001, -0.17),
        new THREE.Vector2(0.085, -0.16),
        new THREE.Vector2(0.125, -0.04),
        new THREE.Vector2(0.118,  0.06),
        new THREE.Vector2(0.078,  0.13),
        new THREE.Vector2(0.095,  0.17),
        new THREE.Vector2(0.076,  0.17),
        new THREE.Vector2(0.064,  0.12),
        new THREE.Vector2(0.092, -0.04),
      ];
      const jarGeo = new THREE.LatheGeometry(jarPts, 20);
      jarGeo.computeVertexNormals();
      const amphora = new THREE.Mesh(jarGeo, terraMat);
      amphora.name = 'prop-amphora';
      amphora.position.set(3.22, 0.09, 2.14);
      amphora.rotation.set(0.15, -0.65, Math.PI * 0.44);
      group.add(amphora);
      props.push(amphora);
      shadowDiscs.push({ x: 3.22, z: 2.14, rx: 0.28, rz: 0.24, strength: 0.42 });

      const updateCaustics = (t) => {
        for (const fn of causticUpdaters) fn(t);
      };

      return { group, props, updateCaustics, shadowDiscs };
    }

    // ===== 部品：ゆらめく海藻・有機ケルプ葉群 (buildSeaweed) =====
    // 波打つ葉縁テクスチャ付きの自然な濃緑褐色の海藻を、左崖と奥岩礁の窪みに非対称に群生させる
    function buildSeaweed() {
      const group = new THREE.Group();
      group.name = 'seaweed';

      // 有機的な波打ち葉縁の海藻テクスチャ（中央主脈＋うねる半透明葉縁）
      const kCanvas = document.createElement('canvas');
      kCanvas.width = 64;
      kCanvas.height = 256;
      const kCtx = kCanvas.getContext('2d');
      kCtx.clearRect(0, 0, 64, 256);
      for (let y = 0; y < 256; y++) {
        const v = 1.0 - y / 255; // 0: root, 1: tip
        const halfW = (20 * Math.sin(Math.pow(v, 0.72) * Math.PI) + 3.5) * (0.76 + 0.24 * Math.sin(v * 24.0));
        const shift = Math.sin(v * 11.0) * 5.0;
        const cx = 32 + shift;
        const x0 = Math.max(0, Math.floor(cx - halfW));
        const x1 = Math.min(63, Math.ceil(cx + halfW));
        for (let x = x0; x <= x1; x++) {
          const edge = Math.abs(x - cx) / Math.max(halfW, 1);
          const midrib = Math.exp(-Math.pow(edge * 4.5, 2));
          const r = Math.round(32 + midrib * 20 + v * 16);
          const g = Math.round(58 + midrib * 28 + v * 26);
          const b = Math.round(28 + midrib * 10 + v * 12);
          const alpha = clamp(1.0 - Math.pow(edge, 3.2), 0, 1);
          kCtx.fillStyle = `rgba(${r},${g},${b},${alpha.toFixed(2)})`;
          kCtx.fillRect(x, y, 1, 1);
        }
      }
      const kelpTex = new THREE.CanvasTexture(kCanvas);
      kelpTex.colorSpace = THREE.SRGBColorSpace;

      const kelpMat = new THREE.MeshStandardMaterial({
        map: kelpTex,
        alphaTest: 0.18,
        roughness: 0.78,
        metalness: 0.02,
        side: THREE.DoubleSide,
      });
      const updateCaustics = applyCaustics(kelpMat, {
        mode: 'rock',
        gain: 0.10,
        underwaterScatterRate: 0.13,
        cacheTag: 'kelp-uw-v6',
      });

      // 左崖・左奥岩礁の窪みに自然な房として偏在配置（中央を均等に並べない）
      const strandSpecs = [
        // 左奥テラスのケルプ房
        { x: -3.42, y: 0.92, z: -2.02, h: 1.05, w: 0.24, leanX:  0.22, leanZ: 0.10, rotY:  0.35, phase: 0.3, period: 7.4 },
        { x: -3.26, y: 0.88, z: -2.14, h: 0.88, w: 0.20, leanX:  0.16, leanZ: 0.12, rotY: -0.45, phase: 1.2, period: 8.2 },
        { x: -2.96, y: 0.78, z: -2.06, h: 0.96, w: 0.22, leanX:  0.24, leanZ: 0.08, rotY:  0.75, phase: 2.4, period: 6.9 },
        // 左中段崖の低い海藻房（x <= -3.55）
        { x: -3.68, y: 0.72, z: -1.18, h: 0.72, w: 0.22, leanX:  0.18, leanZ: 0.14, rotY:  1.15, phase: 1.7, period: 6.6 },
        { x: -3.62, y: 0.64, z: -0.96, h: 0.58, w: 0.18, leanX:  0.14, leanZ: 0.10, rotY:  0.40, phase: 3.1, period: 7.5 },
        { x: -3.66, y: 0.55, z:  0.28, h: 0.64, w: 0.20, leanX:  0.15, leanZ: 0.12, rotY:  1.30, phase: 4.2, period: 7.9 },
        // 奥左中〜奥右の岩陰アクセント（控えめな丈で青い水の抜けを邪魔しない）
        { x: -2.12, y: 0.58, z: -2.16, h: 0.76, w: 0.21, leanX:  0.18, leanZ: 0.08, rotY: -0.25, phase: 2.9, period: 8.4 },
        { x: -1.94, y: 0.54, z: -2.22, h: 0.62, w: 0.18, leanX:  0.12, leanZ: 0.10, rotY:  0.60, phase: 4.7, period: 7.1 },
        { x:  2.76, y: 0.66, z: -2.14, h: 0.78, w: 0.22, leanX: -0.18, leanZ: 0.09, rotY:  0.50, phase: 3.8, period: 8.0 },
        { x:  2.98, y: 0.62, z: -2.20, h: 0.64, w: 0.19, leanX: -0.14, leanZ: 0.11, rotY: -0.65, phase: 5.3, period: 7.3 },
        { x:  3.62, y: 0.64, z: -1.48, h: 0.68, w: 0.20, leanX: -0.16, leanZ: 0.10, rotY: -1.10, phase: 0.8, period: 6.8 },
        { x:  3.66, y: 0.52, z:  0.65, h: 0.54, w: 0.18, leanX: -0.12, leanZ: 0.08, rotY: -1.35, phase: 2.1, period: 7.7 },
      ];

      const strands = strandSpecs.map((sp, idx) => {
        const segY = 14;
        const geo = new THREE.PlaneGeometry(sp.w, sp.h, 2, segY);
        geo.translate(0, sp.h * 0.5, 0);
        const pos = geo.attributes.position;
        const basePos = new Float32Array(pos.array);
        const mesh = new THREE.Mesh(geo, kelpMat);
        mesh.position.set(sp.x, sp.y, sp.z);
        mesh.rotation.y = sp.rotY ?? 0;
        mesh.name = `seaweed-${idx + 1}`;
        group.add(mesh);
        return { mesh, geo, pos, basePos, sp };
      });

      const update = (elapsed) => {
        updateCaustics(elapsed);
        for (const st of strands) {
          const { pos, basePos, sp } = st;
          const w = (Math.PI * 2) / sp.period;
          for (let i = 0; i < pos.count; i++) {
            const bx = basePos[i * 3];
            const by = basePos[i * 3 + 1];
            const bz = basePos[i * 3 + 2];
            const f = clamp(by / sp.h, 0, 1);
            const flex = f * f;
            const waveX = Math.sin(elapsed * w + sp.phase - f * 2.6) * 0.11 * flex + sp.leanX * flex;
            const waveZ = Math.cos(elapsed * w * 0.82 + sp.phase * 1.3 - f * 2.2) * 0.09 * flex + sp.leanZ * flex;
            const wy = Math.min(by, WATER_Y - 0.16 - sp.y);
            pos.setXYZ(i, bx + waveX, wy, bz + waveZ);
          }
          pos.needsUpdate = true;
          st.geo.computeVertexNormals();
        }
      };

      update(0);
      return { group, strands, update };
    }

    // ===== 部品：水面 (y=2.6, sin波で ±0.019m, 裏面の波紋きらめきバンプ付き) =====
    function buildWaterSurface(options = {}) {
      const geo = new THREE.PlaneGeometry(TANK_W, TANK_D, 54, 33);
      geo.rotateX(-Math.PI / 2);
      const pos = geo.attributes.position;
      const baseXZ = new Float32Array(pos.count * 2);
      for (let i = 0; i < pos.count; i++) {
        baseXZ[i * 2] = pos.getX(i);
        baseXZ[i * 2 + 1] = pos.getZ(i);
      }
      const rippleTex = options.rippleTex ?? buildWaterRippleTexture();
      const mat = new THREE.MeshStandardMaterial({
        color: options.color ?? STYLE.waterColor,
        transparent: true,
        opacity: options.opacity ?? STYLE.waterOpacity,
        side: THREE.DoubleSide,
        roughness: options.roughness ?? STYLE.waterRoughness,
        metalness: options.metalness ?? STYLE.waterMetalness,
        envMapIntensity: options.envMapIntensity ?? STYLE.waterEnvMapIntensity,
        envMap: options.envMap ?? null,
        bumpMap: rippleTex,
        bumpScale: options.bumpScale ?? STYLE.waterBumpScale,
        depthWrite: false,
        fog: false,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.y = WATER_Y;
      mesh.name = 'water-surface';
      mesh.renderOrder = 2;

      const update = (elapsed) => {
        const w1 = (Math.PI * 2) / 7.5;
        const w2 = (Math.PI * 2) / 10.5;
        for (let i = 0; i < pos.count; i++) {
          const x = baseXZ[i * 2];
          const z = baseXZ[i * 2 + 1];
          const dy = 0.011 * Math.sin(x * 0.85 + z * 0.40 + elapsed * w1)
                   + 0.008 * Math.sin(-x * 0.50 + z * 1.05 + elapsed * w2);
          pos.setY(i, dy);
        }
        pos.needsUpdate = true;
        geo.computeVertexNormals();
        rippleTex.offset.set(elapsed * 0.018, -elapsed * 0.013);
      };

      update(0);
      return { mesh, update };
    }

    // ===== 環境・水槽シーンの組み立て =====
    const grainTex = buildGrainTexture();
    const sandTex = buildSandTexture();
    const rockTex = buildRockTexture();
    const propTex = buildPropTextures();
    const rippleTex = buildWaterRippleTexture();

    const viewingRoom = buildViewingRoom();
    scene.add(viewingRoom.group);

    const backdrop = buildBackdropGradient();
    scene.add(backdrop.mesh);

    const cabinet = buildCabinet({ grainTex });
    scene.add(cabinet.group);

    const rockResult = buildRocks(rockTex);
    const rockGroup = rockResult.group;
    scene.add(rockGroup);

    const propsResult = buildSunkenProps(propTex, rockTex);
    scene.add(propsResult.group);

    const allShadowDiscs = [...rockResult.shadowDiscs, ...propsResult.shadowDiscs];
    const sandResult = buildSandFloor(sandTex, allShadowDiscs);
    scene.add(sandResult.mesh);

    const seaweedResult = buildSeaweed();
    scene.add(seaweedResult.group);

    const surfaceGlow = buildSurfaceGlow();
    scene.add(surfaceGlow.mesh);

    const water = buildWaterSurface({ envMap: scene.environment, rippleTex });
    scene.add(water.mesh);

    const lightRays = buildLightRays();
    scene.add(lightRays.group);

    const marineSnow = buildMarineSnow();
    for (const pts of marineSnow.points) scene.add(pts);

    const glassTank = buildGlassTank({ envMap: scene.environment });
    scene.add(glassTank.group);

    // ===== 状態・検証用フック (__MYAQ) =====
    const schoolAgents = [];
    const otherFishAgents = [];
    const squidAgents = [];

    const residentTotalEl = document.getElementById('resident-total');
    const schoolLabelEl = document.getElementById('school-label');
    const btnDecEl = document.getElementById('btn-school-dec');
    const btnIncEl = document.getElementById('btn-school-inc');
    const btnAutoCamEl = document.getElementById('btn-auto-cam');
    const statusOverlayEl = document.getElementById('status-overlay');
    const statusBoxEl = document.getElementById('status-box');

    function computeCounts() {
      const katakuchi = schoolAgents.length;
      let aji = 0, madai = 0, kurodai = 0, buri = 0;
      for (const f of otherFishAgents) {
        if (f.species === 'aji') aji++;
        else if (f.species === 'madai') madai++;
        else if (f.species === 'kurodai') kurodai++;
        else if (f.species === 'buri') buri++;
      }
      const squid = squidAgents.length;
      return {
        katakuchi,
        aji,
        madai,
        kurodai,
        buri,
        squid,
        total: katakuchi + aji + madai + kurodai + buri + squid,
      };
    }

    const _centerTmp = new THREE.Vector3();
    function getAllPositions() {
      const out = [];
      for (const f of schoolAgents) {
        const p = f.actor.object.position;
        out.push([p.x, p.y, p.z]);
      }
      for (const f of otherFishAgents) {
        const p = f.actor.object.position;
        out.push([p.x, p.y, p.z]);
      }
      for (const s of squidAgents) {
        s.actor.getCenter(_centerTmp);
        out.push([_centerTmp.x, _centerTmp.y, _centerTmp.z]);
      }
      return out;
    }

    function getSchoolCentroid() {
      if (schoolAgents.length === 0) return [0, 0, 0];
      let sx = 0, sy = 0, sz = 0;
      for (const f of schoolAgents) {
        const p = f.actor.object.position;
        sx += p.x;
        sy += p.y;
        sz += p.z;
      }
      const n = schoolAgents.length;
      return [sx / n, sy / n, sz / n];
    }

    function computeSchoolSpread() {
      const n = schoolAgents.length;
      if (n === 0) return { rms: 0, maxDist: 0, count: 0 };
      const [cx, cy, cz] = getSchoolCentroid();
      let sumSq = 0;
      let maxDist = 0;
      for (const f of schoolAgents) {
        const p = f.actor.object.position;
        const dx = p.x - cx;
        const dy = p.y - cy;
        const dz = p.z - cz;
        const d2 = dx * dx + dy * dy + dz * dz;
        sumSq += d2;
        const d = Math.sqrt(d2);
        if (d > maxDist) maxDist = d;
      }
      return {
        rms: Math.sqrt(sumSq / n),
        maxDist,
        count: n,
      };
    }

    function inspectScene() {
      let egiVisibleCount = 0;
      let lineVisibleCount = 0;
      scene.traverse((obj) => {
        if (obj.name && obj.name.toLowerCase().includes('egi') && obj.visible) {
          egiVisibleCount++;
        }
      });
      const squids = squidAgents.map((s) => {
        if (s.actor.egi?.obj?.visible) egiVisibleCount++;
        if (s.actor.line?.visible) lineVisibleCount++;
        const c = s.actor.getCenter(new THREE.Vector3());
        return {
          home: [s.actor.brain.home.x, s.actor.brain.home.y, s.actor.brain.home.z],
          center: [c.x, c.y, c.z],
          motion: s.actor.motion,
          egiVisible: Boolean(s.actor.egi?.obj?.visible),
          egiShown: Boolean(s.actor.brain?.egiShown),
          targetColor: {
            dark: s.actor.squid.target.dark,
            pale: s.actor.squid.target.pale,
            cloud: s.actor.squid.target.cloud,
          },
          uniformColor: {
            uDark: s.actor.squid.uniforms.uDark.value,
            uPale: s.actor.squid.uniforms.uPale.value,
            uCloud: s.actor.squid.uniforms.uCloud.value,
          },
        };
      });
      return {
        simTime,
        squids,
        egiVisibleCount,
        lineVisibleCount,
        rockCount: rockGroup.children.length,
        cameraPos: [camera.position.x, camera.position.y, camera.position.z],
        targetPos: [controls.target.x, controls.target.y, controls.target.z],
      };
    }

    function collectObjectBounds(list) {
      return list.map((m) => {
        m.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(m);
        const cx = (box.min.x + box.max.x) * 0.5;
        const cz = (box.min.z + box.max.z) * 0.5;
        const sandY = sampleSandHeight(cx, cz);
        const insideTank =
          box.min.x >= -HALF_X + 0.02 && box.max.x <= HALF_X - 0.02 &&
          box.min.z >= -HALF_Z + 0.02 && box.max.z <= HALF_Z - 0.02 &&
          box.min.y >= -0.45 && box.max.y <= WATER_Y - 0.04;
        const grounded = box.min.y <= sandY + 0.06;
        return {
          name: m.name,
          min: box.min.toArray(),
          max: box.max.toArray(),
          sandY,
          insideTank,
          grounded,
        };
      });
    }

    const myaq = {
      ready: false,
      get counts() {
        return computeCounts();
      },
      positions: getAllPositions,
      schoolCentroid: getSchoolCentroid,
      inspect: inspectScene,
      v2: {
        cabinet: Boolean(cabinet.pedestal),
        glassCount: glassTank.glassMeshes.length,
        frameCount: glassTank.frameMeshes.length,
        particleCount: marineSnow.count,
        particleSample: () => marineSnow.sample(10),
        causticsTime: () => sandResult.updateCaustics.uniforms.uCausticTime.value,
        get rayCount() { return lightRays.rays.length; },
        get rockCount() { return rockGroup.children.length; },
        get bgColor() { return scene.background.getHex(); },
        get cameraFov() { return camera.fov; },
        rayOpacities: () => lightRays.rays.map((r) => r.mesh.material.opacity),
        particlesOutOfBounds: () => marineSnow.countOutOfBounds(),
        glassMaxOpacity: () => Math.max(...glassTank.glassMeshes.map((m) => m.material.opacity)),
        glassEnvMapIntensity: glassTank.glassMeshes[0].material.envMapIntensity,
        waterEnvMapIntensity: water.mesh.material.envMapIntensity,
        waterOpacity: water.mesh.material.opacity,
        glassMaterialInfo: () => ({
          color: glassTank.glassMeshes[0].material.color.getHex(),
          opacity: glassTank.glassMeshes[0].material.opacity,
          roughness: glassTank.glassMeshes[0].material.roughness,
          envMapIntensity: glassTank.glassMeshes[0].material.envMapIntensity,
        }),
        waterMaterialInfo: () => ({
          color: water.mesh.material.color.getHex(),
          opacity: water.mesh.material.opacity,
          roughness: water.mesh.material.roughness,
          envMapIntensity: water.mesh.material.envMapIntensity,
        }),
        particleLayers: () => marineSnow.points.map((pts) => ({
          name: pts.name,
          count: pts.geometry.attributes.position.count,
          size: pts.material.size,
          opacity: pts.material.opacity,
          color: pts.material.color.getHex(),
        })),
        causticsInfo: () => ({
          scale1: STYLE.causticsScale1,
          scale2: STYLE.causticsScale2,
          speed1: STYLE.causticsSpeed1,
          speed2: STYLE.causticsSpeed2,
          pow: STYLE.causticsPow,
          sandGain: STYLE.causticsSandGain,
          rockGain: STYLE.causticsRockGain,
          color: STYLE.causticsColor,
        }),
        rayMaterialInfo: () => lightRays.rays.map((r) => ({
          name: r.mesh.name,
          width: r.width,
          opacity: r.mesh.material.opacity,
          hasAlphaMap: Boolean(r.mesh.material.alphaMap),
        })),
        rockMaterialInfo: () => ({
          baseColor: STYLE.rockBaseColor,
          vertexColors: Boolean(rockResult.material.vertexColors),
          bumpMap: Boolean(rockResult.material.bumpMap),
          bumpScale: rockResult.material.bumpScale,
          roughness: rockResult.material.roughness,
        }),
        sandMaterialInfo: () => ({
          baseColor: STYLE.sandBaseColor,
          vertexColors: Boolean(sandResult.material.vertexColors),
          bumpMap: Boolean(sandResult.material.bumpMap),
          bumpScale: sandResult.material.bumpScale,
          shadeVariance: STYLE.sandShadeVariance,
          causticsGain: STYLE.causticsSandGain,
        }),
        rockBounds: () => rockGroup.children.map((m) => {
          m.updateMatrixWorld(true);
          const box = new THREE.Box3().setFromObject(m);
          return { name: m.name, min: box.min.toArray(), max: box.max.toArray() };
        }),
      },
      v3: {
        get bgColor() {
          return scene.background.getHex();
        },
        get rayCount() {
          return lightRays.rays.length;
        },
        get rayWidths() {
          return lightRays.rays.map((r) => r.width);
        },
        get rayOpacities() {
          return lightRays.rays.map((r) => r.mesh.material.opacity);
        },
        get surfaceGlowOpacity() {
          return surfaceGlow.mesh.material.opacity;
        },
        get backdropPresent() {
          return Boolean(backdrop && backdrop.mesh && backdrop.mesh.parent === scene);
        },
      },
      v4: {
        schoolRMS: () => computeSchoolSpread().rms,
        schoolMaxDist: () => computeSchoolSpread().maxDist,
        schoolCount: () => schoolAgents.length,
      },
      v5: {
        schoolModel: 'sardine-original',
      },
      v6: {
        get roomPresent() { return Boolean(viewingRoom && viewingRoom.group.parent === scene); },
        get waterEnclosurePresent() { return Boolean(backdrop && backdrop.mesh.parent === scene); },

    // ===== 群れ・遊泳制御 =====
    const schoolState = {
      pos: new THREE.Vector3(-0.1, STYLE.schoolGoalCenterY, -0.15),

    function pickSchoolGoal(currentPos) {
      const next = new THREE.Vector3();
      for (let tries = 0; tries < 8; tries++) {
        next.set(
          (Math.random() * 2 - 1) * STYLE.schoolGoalRangeX,
          STYLE.schoolGoalCenterY + (Math.random() * 2 - 1) * STYLE.schoolGoalRangeY,
          (Math.random() * 2 - 1) * STYLE.schoolGoalRangeZ
        );
        if (next.distanceTo(currentPos) >= 1.1) break;
      }
      return next;
    }

    function halton(index, base) {
      let result = 0;
      let f = 1 / base;
      let i = index + 1;
      while (i > 0) {
        result += f * (i % base);
        i = Math.floor(i / base);
        f /= base;
      }
      return result;
    }

    // 部品：群れ楕円体スロット基底の生成（流用要件：パラメータ外出し・関数分離）
    function buildSchoolSlotSeeds(maxCount = SCHOOL_MAX, options = {}) {
      const rx = options.radiusX ?? STYLE.schoolRadiusX;
      const ry = options.radiusY ?? STYLE.schoolRadiusY;
      const rz = options.radiusZ ?? STYLE.schoolRadiusZ;
      const densityPow = options.densityPow ?? STYLE.schoolDensityPow;
      const minSlotGap = options.minSlotGap ?? STYLE.schoolMinSlotGap;

      const seeds = [];
      for (let i = 0; i < maxCount; i++) {
        const r = Math.pow(halton(i, 3), densityPow);
        const uCos = halton(i, 2) * 2 - 1;
        const uPhi = halton(i, 5) * Math.PI * 2;
        const sinTheta = Math.sqrt(Math.max(0, 1 - uCos * uCos));
        seeds.push(new THREE.Vector3(
          r * sinTheta * Math.cos(uPhi) * rx,
          r * uCos * ry,
          r * sinTheta * Math.sin(uPhi) * rz
        ));
      }

      for (let iter = 0; iter < 14; iter++) {
        for (let i = 0; i < maxCount; i++) {
          for (let j = i + 1; j < maxCount; j++) {
            const dx = seeds[j].x - seeds[i].x;
            const dy = seeds[j].y - seeds[i].y;
            const dz = seeds[j].z - seeds[i].z;
            const d2 = dx * dx + dy * dy + dz * dz;
            if (d2 < minSlotGap * minSlotGap) {
              const d = Math.max(1e-4, Math.sqrt(d2));
              const push = (minSlotGap - d) * 0.52;
              const w1 = i < 12 ? 0.25 : 0.45;
              const w2 = 1.0 - w1;
              seeds[i].x -= (dx / d) * push * w1;
              seeds[i].y -= (dy / d) * push * w1;
              seeds[i].z -= (dz / d) * push * w1;
              seeds[j].x += (dx / d) * push * w2;
              seeds[j].y += (dy / d) * push * w2;
              seeds[j].z += (dz / d) * push * w2;
            }
          }
          const s = seeds[i];
          const ellip = Math.hypot(s.x / rx, s.y / ry, s.z / rz);
          if (ellip > 1.0) s.divideScalar(ellip);
        }
      }
      return seeds;
    }

    let cachedSlotSeedsKey = '';
    let cachedSlotSeeds = [];
    function getSchoolSlotSeeds(options = {}) {
      const rx = options.radiusX ?? STYLE.schoolRadiusX;
      const ry = options.radiusY ?? STYLE.schoolRadiusY;
      const rz = options.radiusZ ?? STYLE.schoolRadiusZ;
      const densityPow = options.densityPow ?? STYLE.schoolDensityPow;
      const minSlotGap = options.minSlotGap ?? STYLE.schoolMinSlotGap;
      const maxCount = options.maxCount ?? SCHOOL_MAX;
      const key = `${maxCount}:${rx}:${ry}:${rz}:${densityPow}:${minSlotGap}`;
      if (key !== cachedSlotSeedsKey) {
        cachedSlotSeeds = buildSchoolSlotSeeds(maxCount, options);
        cachedSlotSeedsKey = key;
      }
      return cachedSlotSeeds;
    }

    // 部品：群れ各個体の楕円体オフセット計算（進行方向回転＋穏やかなトルネード渦循環＋個体数スケーリング）
    function schoolSlotOffset(slotIndex, t, out, options = {}) {
      const rx = options.radiusX ?? STYLE.schoolRadiusX;
      const ry = options.radiusY ?? STYLE.schoolRadiusY;
      const rz = options.radiusZ ?? STYLE.schoolRadiusZ;
      const seeds = options.seeds ?? getSchoolSlotSeeds(options);
      const count = options.count ?? Math.max(schoolAgents.length, 1);
      const baseCount = options.baseCount ?? STYLE.schoolBaseCount;
      const scaleExp = options.scaleExp ?? STYLE.schoolScaleExp;
      const wobbleAmp = options.wobbleAmp ?? STYLE.schoolWobbleAmp;
      const wobbleFreq = options.wobbleFreq ?? STYLE.schoolWobbleFreq;
      const swirlRate = options.swirlRate ?? STYLE.schoolSwirlRate;
      const wobblePhase = options.wobblePhase ?? (halton(slotIndex, 7) * Math.PI * 2);
      const headingYaw = options.headingYaw ?? schoolState.headingYaw;

      const scale = Math.pow(Math.max(1, count) / baseCount, scaleExp);
      const s = seeds[slotIndex % seeds.length];

      // 楕円体正規化空間で緩やかに螺旋回転させ、ベイトボール／トルネードのうねりを出す（楕円体境界は維持）
      const nx = s.x / rx;
      const ny = s.y / ry;
      const nz = s.z / rz;
      const swirlAngle = t * swirlRate + ny * 0.55;
      const swCos = Math.cos(swirlAngle);
      const swSin = Math.sin(swirlAngle);
      const rxSw = (nx * swCos - nz * swSin) * rx;
      const rzSw = (nx * swSin + nz * swCos) * rz;

      const wbT = t * wobbleFreq + wobblePhase;
      const lx = rxSw * scale + Math.sin(wbT * 1.1) * wobbleAmp;
      const ly = s.y * scale + Math.sin(wbT * 0.85 + 1.3) * wobbleAmp * 0.65;
      const lz = rzSw * scale + Math.cos(wbT * 0.95 + 2.1) * wobbleAmp * 0.75;

      const hSin = Math.sin(headingYaw);
      const hCos = Math.cos(headingYaw);
      return out.set(
        lx * hSin + lz * hCos,
        ly,
        lx * hCos - lz * hSin
      );
    }

    // 部品：群れの進行方向更新
    function computeSchoolHeadingYaw(state, dt, options = {}) {
      const turnRate = options.turnRate ?? MAX_TURN_RATE;
      const speedXZ = Math.hypot(state.vel.x, state.vel.z);
      if (speedXZ > 0.02) {
        const targetHeading = Math.atan2(state.vel.x, state.vel.z);
        const hDiff = wrapAngle(targetHeading - state.headingYaw);
        const maxStep = turnRate * 0.72 * dt;
        const gain = Math.min(1, dt * 4 * smoothstep(speedXZ, 0.02, 0.14));
        state.headingYaw = wrapAngle(state.headingYaw + clamp(hDiff * gain, -maxStep, maxStep));
      }
      return state.headingYaw;
    }

    const _schoolSlotWorld = new THREE.Vector3();
    const _schoolSep = new THREE.Vector3();
    const _schoolToSlot = new THREE.Vector3();

    // 部品：群れ個体の凝集＋近距離分離＋目標速度算出
    function computeSchoolSteer(agent, agents, state, t, outGoal, options = {}) {
      const cohesion = options.cohesion ?? STYLE.schoolCohesion;
      const speedGain = options.speedGain ?? STYLE.schoolSpeedGain;
      const alignLead = options.alignLead ?? STYLE.schoolAlignLead;
      const minForwardBias = options.minForwardBias ?? STYLE.schoolMinForwardBias;
      const sepDist = options.separationDist ?? STYLE.schoolSeparationDist;
      const sepMinDist = options.separationMinDist ?? STYLE.schoolSeparationMinDist;
      const sepWeight = options.separationWeight ?? STYLE.schoolSeparationWeight;
      const sepSpeedGain = options.separationSpeedGain ?? STYLE.schoolSeparationSpeedGain;
      const minSpeed = options.minSpeed ?? STYLE.schoolMinSpeed;
      const maxSpeed = options.maxSpeed ?? STYLE.schoolMaxSpeed;

      schoolSlotOffset(agent.slotIndex, t, _schoolSlotWorld, {
        ...options,
        count: agents.length,
        headingYaw: state.headingYaw,
        wobblePhase: agent.wobblePhase,
      }).add(state.pos);

      const pos = agent.actor.object.position;
      _schoolSep.set(0, 0, 0);
      const sepDist2 = sepDist * sepDist;
      for (const other of agents) {
        if (other === agent) continue;
        const op = other.actor.object.position;
        const dx = pos.x - op.x;
        const dy = pos.y - op.y;
        const dz = pos.z - op.z;
        const d2 = dx * dx + dy * dy + dz * dz;
        if (d2 > 1e-8 && d2 < sepDist2) {
          const d = Math.sqrt(d2);
          const t1 = (sepDist - d) / sepDist;
          const t2 = Math.max(0, (sepMinDist - d) / sepMinDist);
          const push = t1 + 2.2 * t2;
          _schoolSep.x += (dx / d) * push;
          _schoolSep.y += (dy / d) * push;
          _schoolSep.z += (dz / d) * push;
        }
      }

      _schoolSlotWorld.addScaledVector(_schoolSep, sepWeight);
      _schoolToSlot.subVectors(_schoolSlotWorld, pos);

      const hSin = Math.sin(state.headingYaw);
      const hCos = Math.cos(state.headingYaw);
      outGoal.set(
        hSin * alignLead + _schoolToSlot.x * cohesion,
        0,
        hCos * alignLead + _schoolToSlot.z * cohesion
      );
      const fwdComp = outGoal.x * hSin + outGoal.z * hCos;
      if (fwdComp < minForwardBias) {
        const boost = minForwardBias - fwdComp;
        outGoal.x += hSin * boost;
        outGoal.z += hCos * boost;
      }
      outGoal.x += pos.x;
      outGoal.y = _schoolSlotWorld.y + _schoolToSlot.y * 0.45;
      outGoal.z += pos.z;

      const schoolSpeed = state.vel.length();
      const sepFwd = _schoolSep.x * hSin + _schoolSep.z * hCos;
      const aheadAlongHeading = _schoolToSlot.x * hSin + _schoolToSlot.z * hCos + sepFwd * sepSpeedGain;
      return clamp(
        schoolSpeed + agent.speedOffset + aheadAlongHeading * speedGain,
        minSpeed,
        maxSpeed
      );
    }

    function pickFishWaypoint(spec) {
      return new THREE.Vector3(
        (Math.random() * 2 - 1) * 3.45,
        spec.zoneCenter + (Math.random() * 2 - 1) * spec.zoneHalf * 0.85,
        (Math.random() * 2 - 1) * 1.75
      );
    }

    const _steerGoal = new THREE.Vector3();
    const _fwd = new THREE.Vector3();
    const _slotNow = new THREE.Vector3();
    const _slotAhead = new THREE.Vector3();

    function stepFishAgent(agent, desiredGoal, desiredSpeed, dt) {
      const actor = agent.actor;
      const pos = actor.object.position;
      const spec = agent.spec;
      const zoneMin = spec.zoneCenter - spec.zoneHalf;
      const zoneMax = spec.zoneCenter + spec.zoneHalf;

      // 壁（|x|>4.0, |z|>2.2）や遊泳帯上下限に近づいたら中心方向へ目標方位を寄せる（v5 と不変）
      const wallX = smoothstep(Math.abs(pos.x), 3.45, 4.02);
      const wallZ = smoothstep(Math.abs(pos.z), 1.68, 2.22);
      const wallWeight = Math.max(wallX, wallZ);

      _steerGoal.copy(desiredGoal);
      if (wallWeight > 0) {
        _steerGoal.lerp(_centerTmp.set(0, spec.zoneCenter, 0), wallWeight);
      }

      if (pos.y < zoneMin + 0.14) {
        const pull = smoothstep(zoneMin + 0.14 - pos.y, 0, 0.22);
        _steerGoal.y = THREE.MathUtils.lerp(_steerGoal.y, spec.zoneCenter + spec.zoneHalf * 0.35, pull);
      } else if (pos.y > zoneMax - 0.14) {
        const pull = smoothstep(pos.y - (zoneMax - 0.14), 0, 0.22);
        _steerGoal.y = THREE.MathUtils.lerp(_steerGoal.y, spec.zoneCenter - spec.zoneHalf * 0.35, pull);
      }
      _steerGoal.y = clamp(_steerGoal.y, zoneMin, zoneMax);

      const dx = _steerGoal.x - pos.x;
      const dz = _steerGoal.z - pos.z;
      const targetYaw = Math.atan2(dx, dz);
      const diff = wrapAngle(targetYaw - agent.yaw);
      const wantTurn = clamp(diff * 1.85, -MAX_TURN_RATE, MAX_TURN_RATE);
      agent.turnRate += (wantTurn - agent.turnRate) * Math.min(1, dt * 6);
      agent.turnRate = clamp(agent.turnRate, -MAX_TURN_RATE, MAX_TURN_RATE);

      const dy = _steerGoal.y - pos.y;
      const wantVy = clamp(dy * 0.85, -0.22, 0.22);
      const wantPitch = clamp(-Math.atan2(wantVy, Math.max(actor.currentSpeed, 0.2)), -0.24, 0.24);
      agent.pitch += (wantPitch - agent.pitch) * Math.min(1, dt * 4);

      actor.drive = { speed: desiredSpeed, turnRate: agent.turnRate };
      actor.update(dt);

      agent.yaw = wrapAngle(agent.yaw + agent.turnRate * dt);
      actor.object.rotation.set(agent.pitch, agent.yaw, 0, 'YXZ');
      _fwd.set(0, 0, 1).applyEuler(actor.object.rotation);
      pos.addScaledVector(_fwd, actor.currentSpeed * dt);

      pos.x = clamp(pos.x, -HALF_X + 0.08, HALF_X - 0.08);
      pos.z = clamp(pos.z, -HALF_Z + 0.08, HALF_Z - 0.08);
      pos.y = clamp(pos.y, 0.12, WATER_Y - 0.12);
    }

    // 部品：群れ専用オリジナルモデル（sardine.js）のアダプタ（sardine.js 本体は未変更）
    function createSardineActor(options = {}) {
      const length = options.length ?? 0.12;
      const phase = options.phase ?? 0;
      const sardine = createSardine({
        length,
        phase,
        metalness: options.metalness ?? STYLE.sardineMetalness,
        roughness: options.roughness ?? STYLE.sardineRoughness,
      });

      const object = new THREE.Group();
      object.name = 'sardine-actor';

      const bankGroup = new THREE.Group();
      bankGroup.name = 'sardine-bank';
      sardine.object.rotation.y = -Math.PI / 2;
      bankGroup.add(sardine.object);
      object.add(bankGroup);

      const swimParams = sardine.object.userData?.sardineSpec?.swimParams ?? {
        baseFreqHz: 1.6,
        freqPerSpeed: 2.6,
      };
      const nominalSpeed = options.nominalSpeed ?? FISH_SPECS.katakuchi.speed;

      let speed = options.initialSpeed ?? 0.18;
      let turn = 0;
      let roll = 0;
      let swimCycles = 0;

      sardine.update(0, 1.0);

      const actor = {
        object,
        drive: null,
        get currentSpeed() {
          return speed;
        },
        setMotion() {},
        update(dt) {
          const wantSpeed = actor.drive ? Math.max(0, actor.drive.speed) : nominalSpeed;
          const wantTurn = actor.drive ? actor.drive.turnRate : 0;

          speed += (wantSpeed - speed) * Math.min(1, dt * 2.2);
          turn += (wantTurn - turn) * Math.min(1, dt * 5.0);
          const targetRoll = clamp(-turn * 0.28, -0.45, 0.45);
          roll += (targetRoll - roll) * Math.min(1, dt * 4.0);
          bankGroup.rotation.z = roll;

          const swimIntensity = clamp(speed / Math.max(nominalSpeed, 0.1), 0.30, 1.85);
          const freqHz = swimParams.baseFreqHz + swimParams.freqPerSpeed * swimIntensity;
          swimCycles += dt * freqHz;
          const effTime = freqHz > 1e-6 ? swimCycles / freqHz : 0;
          sardine.update(effTime, swimIntensity);
        },
        dispose() {
          object.removeFromParent();
          object.traverse((o) => {
            if (o.isMesh) {
              if (o.geometry) o.geometry.dispose();
              if (o.material) {
                if (Array.isArray(o.material)) o.material.forEach((m) => m.dispose());
                else o.material.dispose();
              }
            }
          });
        },
      };
      Object.defineProperty(actor, 'sardineInfo', {
        enumerable: false,
        value: () => ({
          length,
          phase,
          swimIntensity: clamp(speed / Math.max(nominalSpeed, 0.1), 0.30, 1.85),
          swimCycles,
          modelName: sardine.object.name,
          rotY: sardine.object.rotation.y,
        }),
      });
      return actor;
    }

    function createSchoolFish(slotIndex, simTime, targetCount = INITIAL_SCHOOL_COUNT) {
      const spec = FISH_SPECS.katakuchi;
      const swimPhase = ((slotIndex * 0.61803398875) % 1) * Math.PI * 2;
      const length = 0.114 + halton(slotIndex, 17) * 0.012;
      const actor = createSardineActor({
        length,
        phase: swimPhase,
        nominalSpeed: spec.speed,
      });
      actor.setMotion('swim');

      const wobblePhase = halton(slotIndex, 7) * Math.PI * 2;
      schoolSlotOffset(slotIndex, simTime, _slotNow, {
        count: targetCount,
        headingYaw: schoolState.headingYaw,
        wobblePhase,
      }).add(schoolState.pos);
      actor.object.position.set(
        clamp(_slotNow.x, -HALF_X + 0.2, HALF_X - 0.2),
        clamp(_slotNow.y, spec.zoneCenter - spec.zoneHalf + 0.05, spec.zoneCenter + spec.zoneHalf - 0.05),
        clamp(_slotNow.z, -HALF_Z + 0.2, HALF_Z - 0.2)
      );

      const yaw = wrapAngle(schoolState.headingYaw + (Math.random() - 0.5) * 0.16);
      actor.object.rotation.set(0, yaw, 0, 'YXZ');
      scene.add(actor.object);

      return {
        species: 'katakuchi',
        spec,
        actor,
        slotIndex,
        yaw,
        pitch: 0,
        turnRate: 0,
        wobblePhase,
        speedOffset: (Math.random() - 0.5) * 0.015,
      };
    }

    function setSchoolCount(targetCount, simTime) {
      const clamped = clamp(Math.round(targetCount / SCHOOL_STEP) * SCHOOL_STEP, SCHOOL_MIN, SCHOOL_MAX);
      while (schoolAgents.length < clamped) {
        const agent = createSchoolFish(schoolAgents.length, simTime, clamped);
        schoolAgents.push(agent);
      }
      while (schoolAgents.length > clamped) {
        const removed = schoolAgents.pop();
        removed.actor.dispose();
      }
      updateHudUI();
    }

    function updateHudUI() {
      const c = computeCounts();
      residentTotalEl.textContent = String(c.total);
      schoolLabelEl.textContent = `群れ ${c.katakuchi}`;
      btnDecEl.disabled = c.katakuchi <= SCHOOL_MIN;
      btnIncEl.disabled = c.katakuchi >= SCHOOL_MAX;
    }

    // ===== メイン初期化 & ループ =====
    let simTime = 0;

    btnDecEl.addEventListener('click', () => {
      if (!myaq.ready) return;
      setSchoolCount(schoolAgents.length - SCHOOL_STEP, simTime);
    });

    btnIncEl.addEventListener('click', () => {
      if (!myaq.ready) return;
      setSchoolCount(schoolAgents.length + SCHOOL_STEP, simTime);
    });

    btnAutoCamEl.addEventListener('click', () => {
      controls.autoRotate = !controls.autoRotate;
      btnAutoCamEl.classList.toggle('is-on', controls.autoRotate);
      btnAutoCamEl.setAttribute('aria-pressed', String(controls.autoRotate));
      btnAutoCamEl.textContent = controls.autoRotate ? '自動カメラ ON' : '自動カメラ OFF';
    });

    async function initAquarium() {
      try {
        await Promise.all([
          loadFish('./vendor/fish-kit/fish/', ['aji', 'madai', 'kurodai', 'buri']),
          loadSquids('./vendor/squid-kit/', ['aori']),
        ]);

        // カタクチイワシ 42 匹の群れ
        setSchoolCount(INITIAL_SCHOOL_COUNT, 0);

        // その他 4 種の魚（アジ 5, マダイ 2, クロダイ 2, ブリ 2）— 行動ロジック不変
        for (const species of ['aji', 'madai', 'kurodai', 'buri']) {
          const spec = FISH_SPECS[species];
          for (let i = 0; i < spec.count; i++) {
            const actor = createFish(species, spec.lengthCm);
            actor.setMotion('swim');
            const startPos = pickFishWaypoint(spec);
            const yaw = Math.random() * Math.PI * 2 - Math.PI;
            actor.object.position.copy(startPos);
            actor.object.rotation.set(0, yaw, 0, 'YXZ');
            scene.add(actor.object);
            otherFishAgents.push({
              species,
              spec,
              actor,
              yaw,
              pitch: 0,
              turnRate: 0,
              waypoint: pickFishWaypoint(spec),
              waypointTimer: 4 + Math.random() * 5,
              speedBias: (Math.random() - 0.5) * 0.04,
            });
          }
        }

        // アオリイカ 2 匹（home = (±1.6, 1.0, ∓0.6), floorY = 0）— 行動ロジック不変
        const squidConfigs = [
          { home: new THREE.Vector3( 1.6, 1.0, -0.6), initialDelay: 16.5, colorPhase: 0.4 },
          { home: new THREE.Vector3(-1.6, 1.0,  0.6), initialDelay: 24.0, colorPhase: 3.1 },
        ];
        for (const cfg of squidConfigs) {
          const actor = createSquid('aori', { home: cfg.home, floorY: 0 });
          actor.setMotion('hover');
          const origBrainUpdate = actor.brain.update.bind(actor.brain);
          actor.brain.update = (stepDt) => {
            origBrainUpdate(stepDt);
            const cT = simTime + cfg.colorPhase;
            const tg = actor.squid.target;
            tg.dark = 0.33 + 0.14 * Math.sin(cT * 0.32) + 0.05 * Math.sin(cT * 0.17 + 1.1);
            tg.cloud = Math.max(0, Math.sin(cT * 0.24 + 0.7) - 0.35) * 0.45;
            tg.pale = Math.max(0, Math.sin(cT * 0.19 + 2.2) - 0.58) * 0.42;
          };
          scene.add(actor.object);
          squidAgents.push({
            actor,
            timer: cfg.initialDelay,
            isForward: false,
          });
        }

        updateHudUI();
        statusOverlayEl.classList.add('hidden');
        myaq.ready = true;
      } catch (err) {
        myaq.ready = false;
        const msg = err && err.message ? err.message : String(err);
        console.error('Aquarium load failed:', err);
        statusBoxEl.classList.add('error');
        statusBoxEl.textContent = `読み込みに失敗しました: ${msg}`;
      }
    }

    initAquarium();

    const clock = new THREE.Clock();
    const _desiredVel = new THREE.Vector3();
    const _schoolDiff = new THREE.Vector3();

    function stepSimulation(dt) {
      simTime += dt;

      // 1) 群れ目標点の滑らかな移動（光柱の下をゆっくり回遊）
      schoolState.timer -= dt;
      _schoolDiff.subVectors(schoolState.goal, schoolState.pos);
      const distToGoal = _schoolDiff.length();
      if (schoolState.timer <= 0 || distToGoal < 0.25) {
        schoolState.goal = pickSchoolGoal(schoolState.pos);
        schoolState.timer = 8 + Math.random() * 7;
        _schoolDiff.subVectors(schoolState.goal, schoolState.pos);
      }
      const goalDist = _schoolDiff.length();
      if (goalDist > 1e-4) {
        const cruise = Math.min(0.24, goalDist * 0.35);
        _desiredVel.copy(_schoolDiff).multiplyScalar(cruise / goalDist);
      } else {
        _desiredVel.set(0, 0, 0);
      }
      schoolState.vel.lerp(_desiredVel, 1 - Math.exp(-1.4 * dt));
      schoolState.pos.addScaledVector(schoolState.vel, dt);
      schoolState.pos.x = clamp(schoolState.pos.x, -STYLE.schoolGoalRangeX - 0.2, STYLE.schoolGoalRangeX + 0.2);
      schoolState.pos.y = clamp(schoolState.pos.y, 1.28, 1.74);
      schoolState.pos.z = clamp(schoolState.pos.z, -STYLE.schoolGoalRangeZ - 0.2, STYLE.schoolGoalRangeZ + 0.2);

      // 2) カタクチイワシ群れの更新（ベイトボール／トルネード隊形＋凝集・分離）
      computeSchoolHeadingYaw(schoolState, dt);
      for (const agent of schoolAgents) {
        const speed = computeSchoolSteer(agent, schoolAgents, schoolState, simTime, _slotAhead);
        stepFishAgent(agent, _slotAhead, speed, dt);
      }

      // 3) その他 4 種の魚を更新（v5 と同一ロジック）
      for (const agent of otherFishAgents) {
        agent.waypointTimer -= dt;
        if (agent.waypointTimer <= 0 || agent.actor.object.position.distanceTo(agent.waypoint) < 0.75) {
          agent.waypoint = pickFishWaypoint(agent.spec);
          agent.waypointTimer = 4.5 + Math.random() * 5.5;
        }
        const speed = Math.max(0.15, agent.spec.speed + agent.speedBias);
        stepFishAgent(agent, agent.waypoint, speed, dt);
      }

      // 4) アオリイカ 2 匹を更新（v5 と同一ロジック）
      for (const s of squidAgents) {
        s.timer -= dt;
        if (s.timer <= 0) {
          if (!s.isForward) {
            s.isForward = true;
            s.actor.setMotion('forward');
            s.timer = 4.0 + Math.random() * 2.0;
          } else {
            s.isForward = false;
            s.actor.setMotion('hover');
            s.timer = 15.0 + Math.random() * 15.0;
          }
        }
        s.actor.update(dt);
      }
    }

    renderer.setAnimationLoop(() => {
      const rawDt = Math.min(clock.getDelta(), 0.25);

      if (myaq.ready) {
        let rem = rawDt;
        while (rem > 1e-6) {
          const stepDt = Math.min(rem, 0.05);
          stepSimulation(stepDt);
          rem -= stepDt;
        }
      } else {
        simTime += rawDt;
      }

      backdrop.update(simTime);
      surfaceGlow.update(simTime);
      water.update(simTime);
      marineSnow.update(rawDt, simTime);
      lightRays.update(simTime);
      sandResult.updateCaustics(simTime);
      rockResult.updateCaustics(simTime);
      propsResult.updateCaustics(simTime);
      seaweedResult.update(simTime);

      controls.target.x = clamp(controls.target.x, -4.0, 4.0);
      controls.target.y = clamp(controls.target.y, 0.25, 2.35);
      controls.target.z = clamp(controls.target.z, -2.3, 2.3);
      controls.update();
      if (camera.position.y < 0.15) camera.position.y = 0.15;

      renderer.render(scene, camera);
    });
  </script>
