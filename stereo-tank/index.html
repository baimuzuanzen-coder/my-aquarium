<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>立体ナノ水槽 — Stereo Nano Aquarium</title>
  <link rel="icon" href="data:," />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #b9cad6;
      color: #162634;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    body.is-night {
      background: #09131c;
      color: #edf7ff;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* 立体視（交差法・平行法）用の中央区切り線と視線合わせドット */
    #stereo-guides {
      position: fixed;
      inset: 0;
      z-index: 6;
      pointer-events: none;
      display: none;
    }
    #stereo-guides.visible {
      display: block;
    }
    #stereo-divider {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1px;
      background: rgba(20, 42, 60, 0.24);
    }
    body.is-night #stereo-divider {
      background: rgba(160, 220, 245, 0.28);
    }
    .fusion-dot {
      position: absolute;
      top: 14px;
      width: 8px;
      height: 8px;
      margin-left: -4px;
      border-radius: 50%;
      background: rgba(20, 52, 74, 0.65);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.7);
    }
    body.is-night .fusion-dot {
      background: rgba(140, 232, 255, 0.85);
      box-shadow: 0 0 0 2px rgba(8, 22, 34, 0.85);
    }
    #fusion-dot-left { left: 25%; }
    #fusion-dot-right { left: 75%; }
    .eye-tag {
      position: absolute;
      top: 28px;
      transform: translateX(-50%);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: rgba(22, 46, 66, 0.78);
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(25, 65, 92, 0.16);
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }
    body.is-night .eye-tag {
      color: rgba(210, 240, 255, 0.9);
      background: rgba(12, 28, 42, 0.74);
      border-color: rgba(120, 210, 240, 0.28);
    }
    #eye-tag-left { left: 25%; }
    #eye-tag-right { left: 75%; }

    .hud-panel {
      position: fixed;
      z-index: 10;
      background: rgba(246, 251, 255, 0.84);
      border: 1px solid rgba(24, 62, 88, 0.16);
      box-shadow: 0 4px 16px rgba(14, 34, 52, 0.12);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 12px;
      color: #162a3a;
    }
    body.is-night .hud-panel {
      background: rgba(12, 24, 38, 0.82);
      border-color: rgba(128, 212, 242, 0.28);
      box-shadow: 0 4px 18px rgba(0, 6, 14, 0.50);
      color: #eef7ff;
    }
    body.is-night #hud-title h1 {
      color: #f2faff;
    }

    #hud-title {
      top: 12px;
      left: 12px;
      padding: 7px 12px;
      pointer-events: none;
      max-width: min(300px, calc(100vw - 150px));
    }
    body.is-headtrack #hud-title {
      padding: 5px 10px;
      opacity: 0.78;
    }
    #hud-title h1 {
      margin: 0;
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: 0.03em;
      line-height: 1.2;
    }
    body.is-headtrack #hud-title h1 {
      font-size: 12.5px;
    }
    #hud-sub {
      margin-top: 2px;
      font-size: 11px;
      color: #466176;
    }
    body.is-night #hud-sub {
      color: #96bfd4;
    }
    body.is-headtrack #hud-sub {
      font-size: 10px;
    }

    /* 右上：カメラ視点追従モニタ（起動時のみ表示） */
    #cam-monitor {
      top: 12px;
      right: 12px;
      padding: 7px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      width: 120px;
    }
    #cam-monitor.visible {
      display: flex;
    }
    #cam-preview-wrap {
      position: relative;
      width: 106px;
      height: 78px;
      border-radius: 8px;
      overflow: hidden;
      background: #10202d;
      border: 1px solid rgba(20, 70, 102, 0.22);
    }
    #cam-monitor.is-minimized #cam-preview-wrap {
      display: none;
    }
    #cam-preview {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #cam-badge-local {
      position: absolute;
      left: 4px;
      bottom: 4px;
      font-size: 9px;
      font-weight: 600;
      color: #e9f8ff;
      background: rgba(12, 34, 48, 0.72);
      padding: 1px 5px;
      border-radius: 4px;
      pointer-events: none;
    }
    #cam-status-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 10.5px;
      font-weight: 600;
      color: #244357;
      line-height: 1.2;
    }
    body.is-night #cam-status-row {
      color: #cae8f7;
    }
    #cam-status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #9aaeb9;
      flex-shrink: 0;
    }
    #cam-status-dot.tracking {
      background: #1ca66b;
      box-shadow: 0 0 0 2px rgba(28, 166, 107, 0.24);
    }
    #cam-status-dot.searching {
      background: #e09624;
      box-shadow: 0 0 0 2px rgba(224, 150, 36, 0.22);
    }
    .cam-mini-actions {
      width: 100%;
      display: flex;
      gap: 4px;
    }
    .mini-btn {
      flex: 1;
      appearance: none;
      border: 1px solid rgba(20, 74, 108, 0.22);
      background: rgba(255, 255, 255, 0.85);
      color: #1f445c;
      font: inherit;
      font-size: 10px;
      font-weight: 600;
      padding: 4px 5px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.12s ease;
    }
    body.is-night .mini-btn {
      background: rgba(22, 46, 66, 0.78);
      border-color: rgba(120, 206, 236, 0.28);
      color: #d6eefc;
    }
    .mini-btn:hover {
      background: rgba(20, 120, 168, 0.14);
      border-color: rgba(20, 120, 168, 0.38);
    }

    /* 下部コントロール一式（主役：カメラ視点追従、脇役：既存の立体視） */
    #hud-bottom {
      position: fixed;
      left: 50%;
      bottom: max(8px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      max-width: calc(100vw - 16px);
      pointer-events: none;
    }
    #hud-bottom > * {
      pointer-events: auto;
    }

    /* 窓モード（カメラ視点追従）中は下部中央を完全に空け、右下隅にコンパクト最小化 */
    body.is-headtrack #hud-bottom {
      left: auto;
      right: 12px;
      bottom: max(10px, env(safe-area-inset-bottom));
      transform: none;
      align-items: flex-end;
    }
    body.is-headtrack #hud-tip:not(.is-notice) {
      display: none;
    }
    body.is-headtrack #privacy-note {
      display: none;
    }
    body.is-headtrack:not(.is-menu-open) #secondary-row {
      display: none;
    }
    body.is-headtrack #hud-dock {
      padding: 5px 7px;
      border-radius: 10px;
      background: rgba(244, 250, 255, 0.72);
    }
    body.is-headtrack.is-night #hud-dock {
      background: rgba(10, 22, 34, 0.76);
    }
    body.is-headtrack #camera-track-btn {
      font-size: 11.5px;
      padding: 6px 10px;
      border-radius: 8px;
      gap: 5px;
    }
    body.is-headtrack #recenter-btn,
    body.is-headtrack #light-toggle-btn,
    body.is-headtrack #menu-toggle-btn {
      font-size: 11px;
      padding: 5px 8px;
      border-radius: 7px;
    }

    #hud-tip {
      position: static;
      transform: none;
      padding: 3px 10px;
      font-size: 10.5px;
      color: #244156;
      text-align: center;
      pointer-events: none;
      max-width: min(560px, calc(100vw - 24px));
      line-height: 1.25;
    }
    body.is-night #hud-tip {
      color: #d6eefc;
    }
    #hud-tip.is-notice {
      background: rgba(255, 249, 236, 0.94);
      border-color: rgba(196, 130, 32, 0.34);
      color: #6b430e;
    }
    body.is-night #hud-tip.is-notice {
      background: rgba(58, 38, 12, 0.92);
      border-color: rgba(235, 175, 76, 0.45);
      color: #ffe3b0;
    }

    #hud-dock {
      position: static;
      transform: none;
      padding: 5px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      max-width: calc(100vw - 16px);
    }

    #primary-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      flex-wrap: wrap;
      width: 100%;
    }
    #camera-track-btn {
      appearance: none;
      border: 1px solid rgba(10, 88, 128, 0.28);
      background: linear-gradient(180deg, #1b8ec4 0%, #1171a1 100%);
      color: #ffffff;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.2;
      padding: 7px 15px;
      border-radius: 9px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      box-shadow: 0 3px 10px rgba(17, 113, 161, 0.28);
      transition: transform 0.12s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    #camera-track-btn:hover {
      background: linear-gradient(180deg, #2199d1 0%, #147cb0 100%);
      box-shadow: 0 4px 14px rgba(17, 113, 161, 0.40);
    }
    #camera-track-btn:active {
      transform: translateY(1px);
    }
    #camera-track-btn.is-active {
      background: linear-gradient(180deg, #d84d46 0%, #bd3832 100%);
      border-color: rgba(145, 34, 28, 0.35);
      box-shadow: 0 3px 10px rgba(189, 56, 50, 0.28);
    }
    #camera-track-btn.is-busy {
      opacity: 0.78;
      cursor: wait;
    }
    .cam-btn-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #9ff0ff;
      box-shadow: 0 0 6px rgba(159, 240, 255, 0.85);
    }
    #camera-track-btn.is-active .cam-btn-dot {
      background: #fff2b2;
      box-shadow: 0 0 6px rgba(255, 242, 178, 0.9);
    }
    .hud-sub-btn {
      appearance: none;
      border: 1px solid rgba(20, 74, 108, 0.22);
      background: rgba(255, 255, 255, 0.86);
      color: #1f445c;
      font: inherit;
      font-size: 11.5px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: transform 0.12s ease;
    }
    body.is-night .hud-sub-btn {
      background: rgba(24, 52, 76, 0.90);
      border-color: rgba(132, 214, 244, 0.38);
      color: #eaf7ff;
    }
    .hud-sub-btn:hover {
      background: rgba(20, 120, 168, 0.14);
    }
    body.is-night .hud-sub-btn:hover {
      background: rgba(52, 130, 176, 0.36);
    }
    #light-toggle-btn.is-night {
      background: rgba(28, 68, 98, 0.94);
      border-color: rgba(142, 224, 255, 0.50);
      color: #eef9ff;
    }
    #recenter-btn {
      display: none;
    }
    #recenter-btn.visible {
      display: inline-flex;
    }
    #menu-toggle-btn {
      display: none;
    }
    body.is-headtrack #menu-toggle-btn {
      display: inline-flex;
    }
    #privacy-note {
      font-size: 10px;
      color: #557084;
      white-space: nowrap;
    }
    body.is-night #privacy-note {
      color: #a8cde2;
    }

    #secondary-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding-top: 4px;
      border-top: 1px solid rgba(24, 62, 88, 0.10);
      max-width: 100%;
      overflow-x: auto;
    }
    body.is-night #secondary-row {
      border-top-color: rgba(120, 206, 236, 0.16);
    }
    .secondary-label {
      font-size: 10.5px;
      font-weight: 600;
      color: #5b7588;
      padding: 0 4px 0 2px;
      white-space: nowrap;
    }
    body.is-night .secondary-label {
      color: #a6cde0;
    }
    .mode-btn {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: #36546a;
      font: inherit;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.2;
      padding: 4px 8px;
      border-radius: 7px;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.12s ease;
    }
    body.is-night .mode-btn {
      color: #d0ecfa;
    }
    .mode-btn:hover {
      background: rgba(24, 108, 152, 0.10);
    }
    .mode-btn.is-active {
      background: rgba(20, 120, 168, 0.16);
      color: #0f5f87;
      border-color: rgba(20, 120, 168, 0.28);
    }
    body.is-night .mode-btn.is-active {
      background: rgba(68, 184, 232, 0.30);
      color: #f0fbff;
      border-color: rgba(138, 224, 255, 0.52);
    }

    #status-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(220, 231, 239, 0.55);
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #status-overlay.hidden {
      display: none;
    }
    #status-box {
      padding: 12px 18px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(20, 70, 102, 0.18);
      box-shadow: 0 6px 24px rgba(18, 44, 66, 0.14);
      font-size: 13px;
      font-weight: 500;
      color: #1a3346;
      max-width: min(440px, calc(100vw - 32px));
      text-align: center;
    }
    #status-box.error {
      border-color: rgba(205, 65, 58, 0.5);
      color: #9e241f;
    }

    @media (max-width: 680px) {
      #hud-title {
        top: 10px;
        left: 10px;
        padding: 6px 10px;
        max-width: calc(100vw - 134px);
      }
      #hud-title h1 { font-size: 13.5px; }
      #hud-sub { font-size: 10.5px; }
      #cam-monitor {
        top: 10px;
        right: 10px;
        padding: 6px;
        width: 110px;
      }
      #cam-preview-wrap {
        width: 98px;
        height: 74px;
      }
      #camera-track-btn {
        font-size: 12.5px;
        padding: 8px 14px;
      }
      #recenter-btn {
        font-size: 11px;
        padding: 7px 9px;
      }
      .secondary-label { display: none; }
      .mode-btn {
        font-size: 11px;
        padding: 5px 7px;
      }
      #hud-tip {
        font-size: 10.5px;
        padding: 4px 10px;
      }
    }
  </style>

  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/",

<body>
  <div id="stereo-guides" aria-hidden="true">
    <div id="stereo-divider"></div>
    <div id="fusion-dot-left" class="fusion-dot"></div>
    <div id="fusion-dot-right" class="fusion-dot"></div>
    <div id="eye-tag-left" class="eye-tag"></div>
    <div id="eye-tag-right" class="eye-tag"></div>
  </div>

  <div id="hud-title" class="hud-panel">
    <h1>立体ナノ水槽（30cm）</h1>
    <div id="hud-sub">小魚 <span id="fish-count-label">--</span> 匹・<span id="hud-mode-label">カメラ視点追従に対応</span></div>
  </div>

  <div id="cam-monitor" class="hud-panel" aria-live="polite">
    <div id="cam-preview-wrap">
      <canvas id="cam-preview" width="160" height="120"></canvas>
      <span id="cam-badge-local">端末内処理</span>
    </div>
    <div id="cam-status-row">
      <span id="cam-status-dot"></span>
      <span id="cam-status-text">準備中…</span>
    </div>
    <div class="cam-mini-actions">
      <button type="button" id="cam-toggle-preview-btn" class="mini-btn">映像を隠す</button>
    </div>
  </div>

  <div id="hud-bottom">
    <div id="hud-tip" class="hud-panel">「カメラ視点追従」で覗き込み立体視・未起動時はドラッグで見回せます</div>

    <div id="hud-dock" class="hud-panel">
      <div id="primary-row">
        <button type="button" id="camera-track-btn" aria-pressed="false">
          <span class="cam-btn-dot" aria-hidden="true"></span>
          <span id="camera-track-btn-label">カメラ視点追従をはじめる</span>
        </button>
        <button type="button" id="recenter-btn" class="hud-sub-btn">正面リセット</button>

        <button type="button" class="mode-btn" data-mode="parallel" aria-pressed="false">平行法</button>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
    import { loadFish, createFish } from './vendor/fish-kit/fish-kit.js';

    // ===== 水槽寸法（30cm 立方体。中心を原点 (0,0,0) に配置） =====
    const INNER_W = 0.30;
    const INNER_H = 0.30;
    const INNER_D = 0.30;
    const HALF_X = INNER_W / 2;   // 0.15 m
    const HALF_Y = INNER_H / 2;   // 0.15 m
    const HALF_Z = INNER_D / 2;   // 0.15 m
    const GLASS_T = 0.004;        // ガラス厚 4mm
    const WATER_Y = 0.124;        // 水面高さ（縁から 2.6cm 下）
    const DESK_Y = -HALF_Y - GLASS_T - 0.004; // -0.158 m（マット下＝机天板）

    const VALID_MODES = ['headtrack', 'normal', 'cross', 'parallel', 'anaglyph'];
    const MODE_HINTS = {
      headtrack: '顔を左右・上下に動かしたり近づけたりすると、水槽の奥を覗き込めます',
      normal: '「カメラ視点追従」で覗き込み立体視・未起動時はドラッグで見回せます',
      cross: '交差法：寄り目で左右の点を1つに重ねると奥行きが飛び出します',
      parallel: '平行法：遠くを見るように左右の点を重ねると立体に見えます',
      anaglyph: 'アナグリフ：赤青メガネ（左＝赤・右＝青）で立体に見えます',
    };
    const MODE_LABELS = {
      headtrack: 'カメラ視点追従（窓モード）',
      normal: '通常・ドラッグで見回し可',
      cross: '立体視（交差法）',
      parallel: '立体視（平行法）',
      anaglyph: '立体視（アナグリフ）',
    };

    const { clamp } = THREE.MathUtils;

    // 決定論的乱数（配置やテクスチャ生成用）
    function makePrng(seed) {
      let s = seed >>> 0;
      return () => {
        s = (s + 0x6D2B79F5) >>> 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function wrapAngle(a) {
      return Math.atan2(Math.sin(a), Math.cos(a));
    }

    // 砂利の高さ関数（奥に向かって緩やかに高くして奥行き感を強調）
    function getSubstrateHeight(x, z) {
      const slope = -0.111 - z * 0.105; // 手前 z=+0.15 で -0.127、奥 z=-0.15 で -0.095
      const moundLeft = 0.014 * Math.exp(-((x + 0.068) ** 2 + (z + 0.042) ** 2) / 0.0045);
      const moundRight = 0.011 * Math.exp(-((x - 0.072) ** 2 + (z + 0.056) ** 2) / 0.0048);
      const ripple = 0.0022 * Math.sin(x * 38.0 + z * 19.0) * Math.cos(z * 32.0 - x * 14.0);
      return clamp(slope + moundLeft + moundRight + ripple, -HALF_Y + 0.016, -0.078);
    }

    // ===== レンダラ・シーン・照明・カメラ =====
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.94;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xb9cad6);

    // 環境マップ（ガラスや魚の光沢を自然に引き出す。白飛びを防ぐため控えめ強度に）
    const pmrem = new THREE.PMREMGenerator(renderer);
    const roomEnv = new RoomEnvironment();
    const envRT = pmrem.fromScene(roomEnv, 0.04);
    scene.environment = envRT.texture;
    if ('environmentIntensity' in scene) {
      scene.environmentIntensity = 0.28;
    }
    roomEnv.dispose();
    pmrem.dispose();

    // 周囲の補助光は抑え、水槽真上の LED を主役にした明暗設計
    const hemiLight = new THREE.HemisphereLight(0xd4e8f2, 0x525d62, 0.44);
    scene.add(hemiLight);

    // 水槽真上の LED ライト（主光源）
    const ledLight = new THREE.DirectionalLight(0xf6fcff, 1.75);
    ledLight.position.set(0.05, 0.92, 0.14);
    scene.add(ledLight);

    // 手前の立体をわずかに起こす柔らかい補助光
    const fillLight = new THREE.DirectionalLight(0xa4d6eb, 0.24);
    fillLight.position.set(-0.48, 0.30, 0.62);
    scene.add(fillLight);

    // 魚の銀鱗と水草の輪郭を浮かび上がらせる後方リムライト
    const rimLight = new THREE.DirectionalLight(0xb8ecfc, 0.28);
    rimLight.position.set(0.22, 0.42, -0.68);
    scene.add(rimLight);

    // 水槽直上の LED 点光源（水槽内だけを澄んで明るく照らし、部屋は落ち着かせる）
    const tankLampPoint = new THREE.PointLight(0xeefaff, 0.46, 0.62, 1.8);
    tankLampPoint.position.set(0, 0.195, 0.005);
    scene.add(tankLampPoint);

    const BASE_FOV = 34;
    const camera = new THREE.PerspectiveCamera(BASE_FOV, window.innerWidth / window.innerHeight, 0.02, 20);
    camera.position.set(0.0, 0.095, 0.89);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0.0, -0.052, 0.0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.enablePan = false;
    controls.minDistance = 0.42;
    controls.maxDistance = 1.35;
    controls.minPolarAngle = 0.20;
    controls.maxPolarAngle = Math.PI * 0.51;
    controls.update();

    const stereo = new THREE.StereoCamera();

    // ===== アナグリフ（赤青）用オフスクリーン描画ターゲット＋合成シェーダー =====
    let anaglyphRTLeft = null;
    let anaglyphRTRight = null;
    const anaglyphScene = new THREE.Scene();
    const anaglyphCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const anaglyphUniforms = {
      mapLeft: { value: null },
      mapRight: { value: null },
      uExposure: { value: renderer.toneMappingExposure },
    };
    const anaglyphMat = new THREE.ShaderMaterial({
      uniforms: anaglyphUniforms,
      depthTest: false,
      depthWrite: false,
      toneMapped: false,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D mapLeft;
        uniform sampler2D mapRight;
        uniform float uExposure;
        varying vec2 vUv;

        vec3 acesApprox(vec3 x) {
          x *= uExposure;
          return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
        }
        vec3 linToSrgb(vec3 c) {
          return pow(clamp(c, 0.0, 1.0), vec3(1.0 / 2.2));
        }

        void main() {
          vec3 cL = linToSrgb(acesApprox(texture2D(mapLeft, vUv).rgb));
          vec3 cR = linToSrgb(acesApprox(texture2D(mapRight, vUv).rgb));
          // Dubois 最適化赤青アナグリフ行列（左目＝赤・右目＝シアン）
          mat3 matL = mat3(
             0.456100, -0.0400822, -0.0152161,
             0.500484, -0.0378246, -0.0205971,
             0.176381, -0.0157589, -0.00546856
          );
          mat3 matR = mat3(
            -0.0434706,  0.378476,  -0.0721527,
            -0.0879388,  0.733640,  -0.112961,
            -0.00155529, -0.0184503, 1.22640
          );
          vec3 color = clamp(matL * cL + matR * cR, 0.0, 1.0);
          gl_FragColor = vec4(color, 1.0);
        }
      `,
    });
    anaglyphScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), anaglyphMat));

    function ensureAnaglyphTargets() {
      const dpr = renderer.getPixelRatio();
      const rtW = Math.max(2, Math.floor(window.innerWidth * dpr));
      const rtH = Math.max(2, Math.floor(window.innerHeight * dpr));
      if (!anaglyphRTLeft || anaglyphRTLeft.width !== rtW || anaglyphRTLeft.height !== rtH) {
        if (anaglyphRTLeft) anaglyphRTLeft.dispose();
        if (anaglyphRTRight) anaglyphRTRight.dispose();
        const opts = { minFilter: THREE.LinearFilter, magFilter: THREE.NearestFilter };
        anaglyphRTLeft = new THREE.WebGLRenderTarget(rtW, rtH, opts);
        anaglyphRTRight = new THREE.WebGLRenderTarget(rtW, rtH, opts);
        anaglyphUniforms.mapLeft.value = anaglyphRTLeft.texture;
        anaglyphUniforms.mapRight.value = anaglyphRTRight.texture;
      }
    }

    // ===== 手続きテクスチャ（濡れた自然な川砂利・木目机・流木） =====
    function makeGravelTextures(size = 512) {
      const cMap = document.createElement('canvas');
      cMap.width = cMap.height = size;
      const ctx = cMap.getContext('2d');

      const cBump = document.createElement('canvas');
      cBump.width = cBump.height = size;
      const bCtx = cBump.getContext('2d');

      const rand = makePrng(20261123);
      ctx.fillStyle = '#92826c';
      ctx.fillRect(0, 0, size, size);
      bCtx.fillStyle = '#808080';
      bCtx.fillRect(0, 0, size, size);

      // 細かい濡れた川砂の粒感（白飛びしない落ち着いた明度）
      const img = ctx.getImageData(0, 0, size, size);
      const bImg = bCtx.getImageData(0, 0, size, size);
      for (let i = 0; i < size * size; i++) {
        const n = (rand() - 0.5) * 38;
        const o = i * 4;
        img.data[o]     = clamp(Math.round(146 + n), 92, 194);
        img.data[o + 1] = clamp(Math.round(130 + n * 0.94), 80, 178);
        img.data[o + 2] = clamp(Math.round(108 + n * 0.86), 66, 152);
        img.data[o + 3] = 255;

        const bv = clamp(Math.round(128 + n * 2.4), 24, 240);
        bImg.data[o] = bImg.data[o + 1] = bImg.data[o + 2] = bv;
        bImg.data[o + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      bCtx.putImageData(bImg, 0, 0);

      // 自然な濡れ川砂利の粒（石英・黄土・茶灰・黒玄武岩）
      const pebbleCount = 8000;
      for (let i = 0; i < pebbleCount; i++) {
        const px = rand() * size;
        const py = rand() * size;
        const rx = 1.0 + rand() * 2.7;
        const ry = rx * (0.62 + rand() * 0.56);
        const rot = rand() * Math.PI;
        const k = rand();
        let fill, bump;
        if (k < 0.22) {
          const r = 186 + Math.floor(rand() * 26);
          const g = 172 + Math.floor(rand() * 24);
          const b = 148 + Math.floor(rand() * 22);
          fill = `rgba(${r},${g},${b},${0.55 + rand() * 0.35})`;
          bump = 'rgba(232, 232, 232, 0.78)';
        } else if (k < 0.58) {
          const r = 144 + Math.floor(rand() * 28);
          const g = 126 + Math.floor(rand() * 24);
          const b = 100 + Math.floor(rand() * 22);
          fill = `rgba(${r},${g},${b},${0.54 + rand() * 0.36})`;
          bump = 'rgba(178, 178, 178, 0.72)';
        } else if (k < 0.84) {
          const r = 104 + Math.floor(rand() * 24);
          const g = 94 + Math.floor(rand() * 22);
          const b = 80 + Math.floor(rand() * 20);
          fill = `rgba(${r},${g},${b},${0.52 + rand() * 0.34})`;
          bump = 'rgba(105, 105, 105, 0.72)';
        } else {
          const r = 56 + Math.floor(rand() * 26);
          const g = 52 + Math.floor(rand() * 24);
          const b = 46 + Math.floor(rand() * 22);
          fill = `rgba(${r},${g},${b},${0.48 + rand() * 0.38})`;
          bump = 'rgba(54, 54, 54, 0.78)';
        }
        for (const ox of [0, px < 6 ? size : px > size - 6 ? -size : 9999]) {
          if (ox === 9999) continue;
          ctx.save();
          ctx.translate(px + ox, py);
          ctx.rotate(rot);
          ctx.fillStyle = fill;
          ctx.beginPath();
          ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          bCtx.save();
          bCtx.translate(px + ox, py);
          bCtx.rotate(rot);
          bCtx.fillStyle = bump;
          bCtx.beginPath();
          bCtx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
          bCtx.fill();
          bCtx.restore();
        }
      }

      const map = new THREE.CanvasTexture(cMap);
      map.colorSpace = THREE.SRGBColorSpace;
      map.wrapS = map.wrapT = THREE.RepeatWrapping;
      map.repeat.set(2.4, 2.4);

      const bumpMap = new THREE.CanvasTexture(cBump);
      bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
      bumpMap.repeat.set(2.4, 2.4);

      return { map, bumpMap };
    }

    function makeDeskTexture(size = 512) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const rand = makePrng(88103);

      // 落ち着いたミディアムオーク調の机天板（水槽の明るさを引き立てる）
      const grad = ctx.createLinearGradient(0, 0, 0, size);
      grad.addColorStop(0, '#ae9474');
      grad.addColorStop(0.5, '#a68b6b');
      grad.addColorStop(1, '#9d8262');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);

      for (let i = 0; i < 280; i++) {
        const y = rand() * size;
        const h = 1 + rand() * 3.5;
        const dark = rand() > 0.42;
        ctx.fillStyle = dark
          ? `rgba(74, 52, 32, ${0.06 + rand() * 0.09})`
          : `rgba(218, 198, 168, ${0.04 + rand() * 0.07})`;
        ctx.fillRect(0, y, size, h);
      }

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4.1, 4.1);
      return tex;
    }

    function makeWoodTextures(size = 512) {
      const cMap = document.createElement('canvas');
      cMap.width = cMap.height = size;
      const ctx = cMap.getContext('2d');
      const cBump = document.createElement('canvas');
      cBump.width = cBump.height = size;
      const bCtx = cBump.getContext('2d');

      const rand = makePrng(51923);
      ctx.fillStyle = '#5a3e28';
      ctx.fillRect(0, 0, size, size);
      bCtx.fillStyle = '#787878';
      bCtx.fillRect(0, 0, size, size);

      // うねりながら縦に走る濡れた流木の樹皮繊維と裂け目
      for (let i = 0; i < 340; i++) {
        const x0 = rand() * size;
        const w = 0.8 + rand() * 3.2;
        const amp = 2 + rand() * 8;
        const freq = 1 + Math.floor(rand() * 3);
        const ph = rand() * Math.PI * 2;
        const dark = rand() > 0.38;
        const col = dark
          ? `rgba(28, 17, 10, ${0.20 + rand() * 0.34})`
          : `rgba(138, 102, 68, ${0.16 + rand() * 0.26})`;
        const bCol = dark
          ? `rgba(34, 34, 34, ${0.35 + rand() * 0.45})`
          : `rgba(218, 218, 218, ${0.28 + rand() * 0.42})`;

        for (const ox of [0, -size, size]) {
          ctx.strokeStyle = col;
          ctx.lineWidth = w;
          ctx.beginPath();
          bCtx.strokeStyle = bCol;
          bCtx.lineWidth = w;
          bCtx.beginPath();
          for (let s = 0; s <= 16; s++) {
            const t = s / 16;
            const y = t * size;
            const x = x0 + ox + Math.sin(t * Math.PI * 2 * freq + ph) * amp;
            if (s === 0) { ctx.moveTo(x, y); bCtx.moveTo(x, y); }
            else { ctx.lineTo(x, y); bCtx.lineTo(x, y); }
          }
          ctx.stroke();
          bCtx.stroke();
        }
      }
      // 節（コブ）のアクセント
      for (let i = 0; i < 14; i++) {
        const kx = rand() * size;
        const ky = rand() * size;
        const rx = 5 + rand() * 10;
        const ry = 12 + rand() * 24;
        ctx.fillStyle = 'rgba(20, 12, 7, 0.38)';
        ctx.beginPath(); ctx.ellipse(kx, ky, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
        bCtx.fillStyle = 'rgba(210, 210, 210, 0.45)';
        bCtx.beginPath(); bCtx.ellipse(kx, ky, rx * 1.1, ry * 1.1, 0, 0, Math.PI * 2); bCtx.fill();
        bCtx.fillStyle = 'rgba(42, 42, 42, 0.55)';
        bCtx.beginPath(); bCtx.ellipse(kx, ky, rx * 0.5, ry * 0.5, 0, 0, Math.PI * 2); bCtx.fill();
      }

      const map = new THREE.CanvasTexture(cMap);
      map.colorSpace = THREE.SRGBColorSpace;
      map.wrapS = map.wrapT = THREE.RepeatWrapping;
      map.repeat.set(2, 4);

      const bumpMap = new THREE.CanvasTexture(cBump);
      bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
      bumpMap.repeat.set(2, 4);
      return { map, bumpMap };
    }

    // 青龍石（龍王石）風の岩肌カラー＋バンプテクスチャ（暗めグレー＋斜めの白石英脈＋細かい段差）
    function makeRockTextures(size = 512) {
      const cMap = document.createElement('canvas');
      cMap.width = cMap.height = size;
      const ctx = cMap.getContext('2d');
      const cBump = document.createElement('canvas');
      cBump.width = cBump.height = size;
      const bCtx = cBump.getContext('2d');

      const rand = makePrng(64219);
      ctx.fillStyle = '#4a535b';
      ctx.fillRect(0, 0, size, size);
      bCtx.fillStyle = '#808080';
      bCtx.fillRect(0, 0, size, size);

      // 細かな鉱物の粒子ノイズ
      const img = ctx.getImageData(0, 0, size, size);
      const bImg = bCtx.getImageData(0, 0, size, size);
      for (let i = 0; i < size * size; i++) {
        const n = (rand() - 0.5) * 34;
        const o = i * 4;
        img.data[o]     = clamp(Math.round(74 + n), 38, 128);
        img.data[o + 1] = clamp(Math.round(83 + n), 44, 136);
        img.data[o + 2] = clamp(Math.round(91 + n * 0.95), 50, 146);
        img.data[o + 3] = 255;
        const bv = clamp(Math.round(128 + n * 2.3), 20, 240);
        bImg.data[o] = bImg.data[o + 1] = bImg.data[o + 2] = bv;
        bImg.data[o + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      bCtx.putImageData(bImg, 0, 0);

      // 層理（斜めの岩段差と色ムラ）
      for (let i = 0; i < 160; i++) {
        const y0 = rand() * size;
        const h = 2 + rand() * 11;
        const tilt = (rand() - 0.5) * 28;
        const dark = rand() > 0.42;
        ctx.strokeStyle = dark
          ? `rgba(24, 30, 36, ${0.14 + rand() * 0.24})`
          : `rgba(130, 142, 150, ${0.10 + rand() * 0.16})`;
        ctx.lineWidth = h;
        ctx.beginPath();
        ctx.moveTo(-20, y0);
        ctx.bezierCurveTo(size * 0.35, y0 + tilt, size * 0.7, y0 - tilt * 0.8, size + 20, y0 + tilt * 0.4);
        ctx.stroke();

        bCtx.strokeStyle = dark
          ? `rgba(38, 38, 38, ${0.28 + rand() * 0.38})`
          : `rgba(218, 218, 218, ${0.24 + rand() * 0.34})`;
        bCtx.lineWidth = h * 0.7;
        bCtx.beginPath();
        bCtx.moveTo(-20, y0);
        bCtx.bezierCurveTo(size * 0.35, y0 + tilt, size * 0.7, y0 - tilt * 0.8, size + 20, y0 + tilt * 0.4);
        bCtx.stroke();
      }

      // 青龍石らしい細い白石英の脈（カルサイト脈）＋鋭い割れ目
      for (let i = 0; i < 42; i++) {
        const x0 = rand() * size;
        const y0 = rand() * size;
        const isVein = rand() > 0.46;
        ctx.strokeStyle = isVein
          ? `rgba(212, 222, 226, ${0.22 + rand() * 0.38})`
          : `rgba(18, 22, 28, ${0.32 + rand() * 0.42})`;
        ctx.lineWidth = isVein ? 0.7 + rand() * 1.8 : 0.9 + rand() * 2.2;
        bCtx.strokeStyle = isVein ? 'rgba(230, 230, 230, 0.50)' : 'rgba(20, 20, 20, 0.78)';
        bCtx.lineWidth = ctx.lineWidth * 1.1;

        ctx.beginPath();
        bCtx.beginPath();
        let px = x0, py = y0;
        ctx.moveTo(px, py); bCtx.moveTo(px, py);
        const segs = 5 + Math.floor(rand() * 7);
        for (let s = 0; s < segs; s++) {
          px += (rand() - 0.25) * 44;
          py += (rand() - 0.5) * 24;
          ctx.lineTo(px, py);
          bCtx.lineTo(px, py);
        }
        ctx.stroke();
        bCtx.stroke();
      }

      // 岩のくぼみにうっすら付着した苔の斑点
      for (let i = 0; i < 65; i++) {
        const x = rand() * size;
        const y = rand() * size;
        const r = 4 + rand() * 14;
        ctx.fillStyle = `rgba(42, 66, 36, ${0.08 + rand() * 0.14})`;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }

      const map = new THREE.CanvasTexture(cMap);
      map.colorSpace = THREE.SRGBColorSpace;
      map.wrapS = map.wrapT = THREE.RepeatWrapping;

      const bumpMap = new THREE.CanvasTexture(cBump);
      bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
      return { map, bumpMap };
    }

    // 活着苔（ウィローモス風）の細密テクスチャ＋バンプ
    function makeMossTextures(size = 256) {
      const cMap = document.createElement('canvas');
      cMap.width = cMap.height = size;
      const ctx = cMap.getContext('2d');
      const cBump = document.createElement('canvas');
      cBump.width = cBump.height = size;
      const bCtx = cBump.getContext('2d');
      const rand = makePrng(91207);

      ctx.fillStyle = '#20451d';
      ctx.fillRect(0, 0, size, size);
      bCtx.fillStyle = '#505050';
      bCtx.fillRect(0, 0, size, size);

      for (let i = 0; i < 2400; i++) {
        const x = rand() * size;
        const y = rand() * size;
        const len = 3 + rand() * 8;
        const ang = rand() * Math.PI * 2;
        const bright = rand();
        const r = Math.round(28 + bright * 52);
        const g = Math.round(68 + bright * 88);
        const b = Math.round(24 + bright * 28);
        ctx.strokeStyle = `rgba(${r},${g},${b},${0.55 + rand() * 0.4})`;
        ctx.lineWidth = 0.8 + rand() * 1.4;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
        ctx.stroke();

        const bv = Math.round(80 + bright * 165);
        bCtx.strokeStyle = `rgb(${bv},${bv},${bv})`;
        bCtx.lineWidth = ctx.lineWidth;
        bCtx.beginPath();
        bCtx.moveTo(x, y);
        bCtx.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
        bCtx.stroke();
      }
      const map = new THREE.CanvasTexture(cMap);
      map.colorSpace = THREE.SRGBColorSpace;
      map.wrapS = map.wrapT = THREE.RepeatWrapping;
      map.repeat.set(2, 2);
      const bumpMap = new THREE.CanvasTexture(cBump);
      bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
      bumpMap.repeat.set(2, 2);
      return { map, bumpMap };
    }

    // バリスネリア用 平行葉脈テクスチャ
    function makeTapeLeafTexture(size = 256) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const g = ctx.createLinearGradient(0, size, 0, 0);
      g.addColorStop(0, '#5a8f58');
      g.addColorStop(0.5, '#86ba6d');
      g.addColorStop(1, '#b6dc8a');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);

      // 縁をわずかに引き締め、縦の平行葉脈を描く
      ctx.fillStyle = 'rgba(26, 62, 28, 0.24)';
      ctx.fillRect(0, 0, size * 0.08, size);
      ctx.fillRect(size * 0.92, 0, size * 0.08, size);

      for (let i = 1; i <= 9; i++) {
        const x = (i / 10) * size;
        const isMid = i === 5;
        ctx.strokeStyle = isMid ? 'rgba(220, 250, 185, 0.55)' : 'rgba(42, 86, 40, 0.28)';
        ctx.lineWidth = isMid ? 4 : 1.8;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, size); ctx.stroke();
      }
      // 横の微細な細胞仕切り（バリスネリアの透明感）
      for (let y = 0; y < size; y += 14) {
        ctx.strokeStyle = 'rgba(35, 76, 38, 0.11)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(size, y); ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // 丸葉・楕円葉用（ロタラ／アヌビアス・クリプト風）有機的輪郭＋葉脈カラー＆バンプ
    function makeBroadLeafTextures(size = 256) {
      const cMap = document.createElement('canvas');
      cMap.width = cMap.height = size;
      const ctx = cMap.getContext('2d');
      const cBump = document.createElement('canvas');
      cBump.width = cBump.height = size;
      const bCtx = cBump.getContext('2d');

      ctx.clearRect(0, 0, size, size);
      bCtx.fillStyle = '#808080';
      bCtx.fillRect(0, 0, size, size);

      // 有機的な丸みのある葉輪郭パス（UV: v=0 が葉元、v=1 が葉先 → canvas では下が v=0, 上が v=1）
      function leafPath(targetCtx) {
        targetCtx.beginPath();
        targetCtx.moveTo(size * 0.50, size * 0.98);
        targetCtx.bezierCurveTo(size * 0.06, size * 0.80, size * 0.04, size * 0.28, size * 0.50, size * 0.03);
        targetCtx.bezierCurveTo(size * 0.96, size * 0.28, size * 0.94, size * 0.80, size * 0.50, size * 0.98);
        targetCtx.closePath();
      }

      ctx.save();
      leafPath(ctx);
      ctx.clip();
      const grad = ctx.createLinearGradient(0, size, 0, 0);
      grad.addColorStop(0.0, '#6a9866');
      grad.addColorStop(0.55, '#92bf7d');
      grad.addColorStop(1.0, '#bedd96');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);

      // 葉縁のほのかな陰影
      leafPath(ctx);
      ctx.strokeStyle = 'rgba(24, 58, 28, 0.34)';
      ctx.lineWidth = 10;
      ctx.stroke();

      // 中央主脈＋斜め側脈
      ctx.strokeStyle = 'rgba(225, 250, 190, 0.62)';
      ctx.lineWidth = 4.2;
      ctx.beginPath();
      ctx.moveTo(size * 0.5, size * 0.97);
      ctx.lineTo(size * 0.5, size * 0.09);
      ctx.stroke();

      bCtx.strokeStyle = 'rgba(235, 235, 235, 0.85)';
      bCtx.lineWidth = 5;
      bCtx.beginPath();
      bCtx.moveTo(size * 0.5, size * 0.97);
      bCtx.lineTo(size * 0.5, size * 0.09);
      bCtx.stroke();

      for (let i = 1; i <= 6; i++) {
        const t = i / 7;
        const y0 = size * (0.90 - t * 0.72);
        const spanX = size * 0.38 * Math.sin(t * Math.PI);
        const y1 = y0 - size * 0.13;
        for (const s of [-1, 1]) {
          ctx.strokeStyle = 'rgba(205, 238, 170, 0.42)';
          ctx.lineWidth = 2.0;
          ctx.beginPath();
          ctx.moveTo(size * 0.5, y0);
          ctx.quadraticCurveTo(size * 0.5 + s * spanX * 0.55, y0 - size * 0.03, size * 0.5 + s * spanX, y1);
          ctx.stroke();

          bCtx.strokeStyle = 'rgba(200, 200, 200, 0.65)';
          bCtx.lineWidth = 2.5;
          bCtx.beginPath();
          bCtx.moveTo(size * 0.5, y0);
          bCtx.quadraticCurveTo(size * 0.5 + s * spanX * 0.55, y0 - size * 0.03, size * 0.5 + s * spanX, y1);
          bCtx.stroke();
        }
      }
      ctx.restore();

      const map = new THREE.CanvasTexture(cMap);
      map.colorSpace = THREE.SRGBColorSpace;
      const bumpMap = new THREE.CanvasTexture(cBump);
      return { map, bumpMap };
    }

    // ===== 共通シェーダーユニフォーム（コースティクス・水中霞み・昼夜・水草揺れ・水面） =====
    const envUniforms = {
      uTime: { value: 0 },
      uNightMix: { value: 0 },
      uCausticsBoost: { value: 1.0 },
      uWaterFogColor: { value: new THREE.Color(0x529ba8) },
      uWaterFogStrength: { value: 0.20 },
      uRayStrength: { value: 0.075 },
      uTapRipple: { value: new THREE.Vector4(0, 0, -100, 0) }, // (x, z, tapTime, strength)
    };

    // 細い光の網目（フィラメント状コースティクス）共通 GLSL（底砂・岩・流木・苔・魚で共有）
    const CAUSTICS_GLSL = `
      float calcCaustics(vec2 xz, float y, float t) {
        float depth = max(0.0, ${WATER_Y.toFixed(4)} - y);
        vec2 p = xz * 36.0 + vec2(depth * 4.6, -depth * 3.0);
        vec2 warp = vec2(
          sin(p.y * 0.72 + t * 1.18) + 0.46 * cos((p.x - p.y) * 0.56 - t * 0.86),
          cos(p.x * 0.68 - t * 1.06) + 0.46 * sin((p.x + p.y) * 0.58 + t * 0.94)
        );
        vec2 p1 = p + warp * 0.72;
        vec2 p2 = p * 1.46 - warp.yx * 0.54 + vec2(t * 0.46, -t * 0.38);
        float r1 = 1.0 - abs(sin(p1.x * 0.98 + sin(p1.y * 0.88 + t * 0.92)));
        float r2 = 1.0 - abs(sin(p1.y * 1.08 - cos(p1.x * 0.84 - t * 0.84)));
        float r3 = 1.0 - abs(sin((p2.x + p2.y) * 0.82 + t * 0.74));
        float r4 = 1.0 - abs(sin((p2.x - p2.y) * 0.86 - t * 0.68));
        float netA = pow(r1 * r2, 2.75);
        float netB = pow(r3 * r4, 2.95);
        float ridge = pow(max(r1 * r3, r2 * r4), 4.0) * 0.48;
        float web = clamp(netA * 1.65 + netB * 1.25 + ridge, 0.0, 2.0);
        float ledFalloff = mix(0.60, 1.26, exp(-dot(xz, xz) * 26.0));
        float focusDepth = smoothstep(0.0, 0.030, depth);
        return web * ledFalloff * (0.45 + 0.55 * focusDepth);
      }
    `;

    // 水中だけのほのかな遠近霞み＋コースティクスをリニア空間（トーンマップ前）で適用
    function applyCausticsToMaterial(material, strength = 0.36, fogScale = 1.0) {
      material.onBeforeCompile = (shader) => {
        shader.uniforms.uTime = envUniforms.uTime;
        shader.uniforms.uCausticsBoost = envUniforms.uCausticsBoost;
        shader.uniforms.uWaterFogColor = envUniforms.uWaterFogColor;
        shader.uniforms.uWaterFogStrength = envUniforms.uWaterFogStrength;
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', '#include <common>\nvarying vec3 vCaustPos;\nvarying vec3 vCaustWorldNorm;')
          .replace(
            '#include <begin_vertex>',
            `#include <begin_vertex>
            vCaustPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
            vCaustWorldNorm = normalize(mat3(modelMatrix) * objectNormal);`
          );
        shader.fragmentShader = shader.fragmentShader
          .replace(
            '#include <common>',
            `#include <common>
            uniform float uTime;
            uniform float uCausticsBoost;
            uniform vec3 uWaterFogColor;
            uniform float uWaterFogStrength;
            varying vec3 vCaustPos;
            varying vec3 vCaustWorldNorm;
            ${CAUSTICS_GLSL}`
          )
          .replace(
            '#include <opaque_fragment>',
            `#include <opaque_fragment>
            {
              float inTankXZ = step(abs(vCaustPos.x), 0.152) * step(abs(vCaustPos.z), 0.152);
              float underW = smoothstep(${(WATER_Y + 0.004).toFixed(4)}, ${(WATER_Y - 0.006).toFixed(4)}, vCaustPos.y);
              float inWater = inTankXZ * underW;
              if (inWater > 0.001) {
                float c = calcCaustics(vCaustPos.xz, vCaustPos.y, uTime);
                float upMask = smoothstep(-0.12, 0.52, normalize(vCaustWorldNorm).y);
                gl_FragColor.rgb += vec3(0.72, 0.96, 1.0) * c * ${strength.toFixed(3)} * uCausticsBoost * upMask * inWater;
                float zDepth = clamp((${HALF_Z.toFixed(4)} - vCaustPos.z) / ${INNER_D.toFixed(4)}, 0.0, 1.0);
                float fogF = clamp(pow(zDepth, 1.15) * uWaterFogStrength * ${fogScale.toFixed(3)}, 0.0, 0.42) * inWater;
                gl_FragColor.rgb = mix(gl_FragColor.rgb, uWaterFogColor, fogF);
              }
            }`
          );
      };
      material.customProgramCacheKey = () => `nano-uw2-${strength.toFixed(2)}-${fogScale.toFixed(2)}`;
    }

    // 魚キット（fish-kit.js）の材質を壊さずにコースティクス＋ほのかな水中霞みを載せるラッパー
    function applyCausticsToFish(actor, strength = 0.36, fogScale = 0.56) {
      actor.object.traverse((obj) => {
        if (!obj.isMesh || !obj.material || !obj.material.isMeshStandardMaterial) return;
        const mat = obj.material;
        if (mat.userData.__nanoCaustics) return;
        mat.userData.__nanoCaustics = true;
        const origCompile = mat.onBeforeCompile;
        mat.onBeforeCompile = (shader, rendererRef) => {
          if (typeof origCompile === 'function') origCompile.call(mat, shader, rendererRef);
          // fish-kit 側が uTime を使用しているため、衝突回避のため uEnvTime として渡す
          shader.uniforms.uEnvTime = envUniforms.uTime;
          shader.uniforms.uCausticsBoost = envUniforms.uCausticsBoost;
          shader.uniforms.uWaterFogColor = envUniforms.uWaterFogColor;
          shader.uniforms.uWaterFogStrength = envUniforms.uWaterFogStrength;
          shader.vertexShader = shader.vertexShader
            .replace('#include <common>', '#include <common>\nvarying vec3 vFishCaustPos;\nvarying vec3 vFishWorldNorm;')
            .replace(
              '#include <project_vertex>',
              `vFishCaustPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
              vFishWorldNorm = normalize(mat3(modelMatrix) * objectNormal);
              #include <project_vertex>`
            );
          shader.fragmentShader = shader.fragmentShader
            .replace(
              '#include <common>',
              `#include <common>
              uniform float uEnvTime;
              uniform float uCausticsBoost;
              uniform vec3 uWaterFogColor;
              uniform float uWaterFogStrength;
              varying vec3 vFishCaustPos;
              varying vec3 vFishWorldNorm;
              ${CAUSTICS_GLSL}`
            )
            .replace(
              '#include <opaque_fragment>',
              `#include <opaque_fragment>
              {
                float c = calcCaustics(vFishCaustPos.xz, vFishCaustPos.y, uEnvTime);
                float upMask = smoothstep(-0.22, 0.68, normalize(vFishWorldNorm).y);
                float notEye = 1.0 - step(5.5, vPart) * step(vPart, 6.5);
                gl_FragColor.rgb += vec3(0.76, 0.98, 1.0) * c * ${strength.toFixed(3)} * uCausticsBoost * upMask * notEye;
                float zDepth = clamp((${HALF_Z.toFixed(4)} - vFishCaustPos.z) / ${INNER_D.toFixed(4)}, 0.0, 1.0);
                float fogF = clamp(pow(zDepth, 1.2) * uWaterFogStrength * ${fogScale.toFixed(3)}, 0.0, 0.28);
                gl_FragColor.rgb = mix(gl_FragColor.rgb, uWaterFogColor, fogF);
              }`
            );
        };
        mat.customProgramCacheKey = () => `photo-fish-nano-uw-${strength.toFixed(2)}`;
        mat.needsUpdate = true;
      });
    }

    // 非インデックス多面体（IcosahedronGeometry 等）の共有頂点法線を平均してカクカク感を消す
    function smoothNonIndexedNormals(geo) {
      geo.computeVertexNormals();
      const pos = geo.getAttribute('position');
      const norm = geo.getAttribute('normal');
      if (!pos || !norm) return geo;
      const accum = new Map();
      const q = 2000;
      const keys = new Array(pos.count);
      for (let i = 0; i < pos.count; i++) {
        const key = `${Math.round(pos.getX(i) * q)},${Math.round(pos.getY(i) * q)},${Math.round(pos.getZ(i) * q)}`;
        keys[i] = key;
        let acc = accum.get(key);
        if (!acc) {
          acc = [0, 0, 0];
          accum.set(key, acc);
        }
        acc[0] += norm.getX(i);
        acc[1] += norm.getY(i);
        acc[2] += norm.getZ(i);
      }
      for (let i = 0; i < pos.count; i++) {
        const acc = accum.get(keys[i]);
        const len = Math.hypot(acc[0], acc[1], acc[2]) || 1;
        norm.setXYZ(i, acc[0] / len, acc[1] / len, acc[2] / len);
      }
      norm.needsUpdate = true;
      return geo;
    }

    // ジオメトリ結合用の属性正規化ヘルパー
    function normalizeForMerge(geo, colorFn = null, swayFn = null) {
      const g = geo.index ? geo.toNonIndexed() : geo.clone();
      if (!g.getAttribute('normal')) g.computeVertexNormals();
      const pos = g.getAttribute('position');
      if (!g.getAttribute('uv')) {
        g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(pos.count * 2), 2));
      }
      if (colorFn) {
        const cols = new Float32Array(pos.count * 3);
        const col = new THREE.Color();
        for (let i = 0; i < pos.count; i++) {
          colorFn(col, pos.getX(i), pos.getY(i), pos.getZ(i), i);
          cols[i * 3] = col.r;
          cols[i * 3 + 1] = col.g;
          cols[i * 3 + 2] = col.b;
        }
        g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
      }
      if (swayFn) {
        const sw = new Float32Array(pos.count * 3);
        for (let i = 0; i < pos.count; i++) {
          const [w, ph, dir] = swayFn(pos.getX(i), pos.getY(i), pos.getZ(i), i);
          sw[i * 3] = w;
          sw[i * 3 + 1] = ph;
          sw[i * 3 + 2] = dir;
        }
        g.setAttribute('aSway', new THREE.Float32BufferAttribute(sw, 3));
      }
      return g;
    }

    // ===== 1. 机の天板と水槽マット・LED照明バー・すりガラス背面スクリーン =====
    let ledStripMat = null;
    let deskShadowMat = null;
    {
      const deskTex = makeDeskTexture();
      const deskGeo = new THREE.BoxGeometry(2.40, 0.036, 1.56);
      const deskMat = new THREE.MeshStandardMaterial({
        map: deskTex,
        roughness: 0.78,
        metalness: 0.02,
      });
      // 机天板：水槽から離れるほど緩やかに落ち着かせ、夜モードは水槽周囲だけLEDの光が漏れる
      deskMat.onBeforeCompile = (shader) => {
        shader.uniforms.uNightMix = envUniforms.uNightMix;
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', '#include <common>\nvarying vec3 vDeskWPos;')
          .replace('#include <begin_vertex>', '#include <begin_vertex>\nvDeskWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', '#include <common>\nuniform float uNightMix;\nvarying vec3 vDeskWPos;')
          .replace(
            '#include <opaque_fragment>',
            `#include <opaque_fragment>
            {
              float dTank = length(vDeskWPos.xz);
              float dayFalloff = mix(1.0, 0.78, smoothstep(0.24, 1.15, dTank));
              float nightFalloff = mix(0.26, 0.035, smoothstep(0.16, 0.72, dTank));
              gl_FragColor.rgb *= mix(dayFalloff, nightFalloff, uNightMix);
              // 水槽側面から机へ淡くこぼれる水色の光（夜は水槽直近だけがポッと照らされる）
              float spill = exp(-pow(max(0.0, dTank - 0.165) / 0.19, 2.0)) * smoothstep(0.12, 0.18, dTank);
              gl_FragColor.rgb += vec3(0.06, 0.17, 0.23) * spill * (0.18 + 0.55 * uNightMix);
            }`
          );
      };
      deskMat.customProgramCacheKey = () => 'nano-desk-spill';
      const desk = new THREE.Mesh(deskGeo, deskMat);
      desk.position.set(0, DESK_Y - 0.018, 0.02);
      scene.add(desk);

      // 水槽下の薄い黒保護マット＋柔らかい接地影
      const matGeo = new THREE.BoxGeometry(INNER_W + GLASS_T * 2 + 0.004, 0.004, INNER_D + GLASS_T * 2 + 0.004);
      const matMesh = new THREE.Mesh(matGeo, new THREE.MeshStandardMaterial({
        color: 0x1e242a,
        roughness: 0.92,
        metalness: 0.0,
      }));
      matMesh.position.set(0, DESK_Y + 0.002, 0);
      scene.add(matMesh);

      // 接地感を高めるソフトシャドウ用デカール（机天板のすぐ上）
      const shCanvas = document.createElement('canvas');
      shCanvas.width = shCanvas.height = 128;
      const sCtx = shCanvas.getContext('2d');
      const rg = sCtx.createRadialGradient(64, 64, 28, 64, 64, 62);
      rg.addColorStop(0, 'rgba(12, 20, 28, 0.44)');
      rg.addColorStop(0.65, 'rgba(12, 20, 28, 0.22)');
      rg.addColorStop(1, 'rgba(12, 20, 28, 0.0)');
      sCtx.fillStyle = rg;
      sCtx.fillRect(0, 0, 128, 128);
      const shTex = new THREE.CanvasTexture(shCanvas);
      deskShadowMat = new THREE.MeshBasicMaterial({ map: shTex, transparent: true, opacity: 1.0, depthWrite: false });
      const shPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(0.46, 0.46),
        deskShadowMat
      );
      shPlane.rotation.x = -Math.PI / 2;
      shPlane.position.set(0, DESK_Y + 0.0006, 0);
      scene.add(shPlane);

      // ミニマルな外掛けナノ LED ライトバー（金属フレームを1メッシュに結合）
      const lampParts = [];
      const barGeo = new THREE.BoxGeometry(0.21, 0.009, 0.044);
      barGeo.translate(0, HALF_Y + 0.056, 0.005);
      lampParts.push(normalizeForMerge(barGeo));

      // 左右の背面アーム
      for (const sx of [-0.075, 0.075]) {
        const post = new THREE.CylinderGeometry(0.0026, 0.0026, 0.072, 8);
        post.translate(sx, HALF_Y + 0.022, -HALF_Z - GLASS_T * 0.5);
        lampParts.push(normalizeForMerge(post));

        const arm = new THREE.CylinderGeometry(0.0024, 0.0024, 0.16, 8);
        arm.rotateX(Math.PI / 2);
        arm.translate(sx, HALF_Y + 0.056, -0.072);
        lampParts.push(normalizeForMerge(arm));

        const clip = new THREE.BoxGeometry(0.014, 0.018, 0.014);
        clip.translate(sx, HALF_Y - 0.003, -HALF_Z - GLASS_T * 0.5);
        lampParts.push(normalizeForMerge(clip));
      }
      const lampFrame = new THREE.Mesh(
        mergeGeometries(lampParts),
        new THREE.MeshStandardMaterial({ color: 0xcbd5dc, roughness: 0.36, metalness: 0.65 })
      );
      scene.add(lampFrame);

      // LED 発光面（下面）
      ledStripMat = new THREE.MeshBasicMaterial({ color: 0xf4fcff, side: THREE.DoubleSide });
      const ledStrip = new THREE.Mesh(
        new THREE.PlaneGeometry(0.194, 0.032),
        ledStripMat
      );
      ledStrip.rotation.x = Math.PI / 2;
      ledStrip.position.set(0, HALF_Y + 0.051, 0.005);
      scene.add(ledStrip);

      // すりガラス風バックスクリーン（背面ガラスの外側に貼り、奥行きと水の澄み感を強調）
      const backScreenGeo = new THREE.PlaneGeometry(INNER_W + GLASS_T * 1.4, INNER_H + GLASS_T * 0.5);
      const backScreenMat = new THREE.ShaderMaterial({
        uniforms: {
          uNightMix: envUniforms.uNightMix,
          uTime: envUniforms.uTime,
        },
        side: THREE.DoubleSide,
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform float uNightMix;
          uniform float uTime;
          varying vec2 vUv;
          float hash21(vec2 p) {
            p = fract(p * vec2(123.34, 456.21));
            p += dot(p, p + 45.32);
            return fract(p.x * p.y);
          }
          void main() {
            // すりガラスの微細なフロスト粒子感
            float grain = (hash21(floor(vUv * 260.0)) - 0.5) * 0.022;
            // LED 真下からの柔らかいグラデーション照明（アクア用ライトスクリーン風）
            float y = vUv.y;
            float ledGlow = exp(-pow((vUv.x - 0.5) * 2.1, 2.0) - pow((1.0 - y) * 1.9, 2.0));
            // 昼：爽やかな淡い水色〜白のすりガラス
            vec3 dayBot = vec3(0.42, 0.56, 0.62);
            vec3 dayMid = vec3(0.67, 0.81, 0.86);
            vec3 dayTop = vec3(0.84, 0.93, 0.96);
            vec3 dayCol = y < 0.45
              ? mix(dayBot, dayMid, y / 0.45)
              : mix(dayMid, dayTop, (y - 0.45) / 0.55);
            dayCol += vec3(0.08, 0.10, 0.09) * ledGlow;
            // 夜：LEDの光が上から落ちる深いアクアブルーのすりガラス
            vec3 nightBot = vec3(0.025, 0.068, 0.105);
            vec3 nightMid = vec3(0.055, 0.165, 0.245);
            vec3 nightTop = vec3(0.14, 0.38, 0.50);
            vec3 nightCol = y < 0.48
              ? mix(nightBot, nightMid, y / 0.48)
              : mix(nightMid, nightTop, (y - 0.48) / 0.52);
            nightCol += vec3(0.10, 0.24, 0.30) * ledGlow;
            // 水面ラインより上（空気部分）は少しだけ落ち着いた反射に
            float waterLineY = ${( (WATER_Y + HALF_Y) / INNER_H ).toFixed(4)};
            float aboveWater = smoothstep(waterLineY - 0.015, waterLineY + 0.015, y);
            dayCol = mix(dayCol, vec3(0.75, 0.84, 0.89), aboveWater * 0.38);
            nightCol = mix(nightCol, vec3(0.06, 0.13, 0.19), aboveWater * 0.45);
            vec3 col = mix(dayCol, nightCol, uNightMix) + grain;
            // 裏側から見たときは落ち着いた背面シート色
            if (!gl_FrontFacing) {
              col = mix(vec3(0.68, 0.75, 0.79), vec3(0.06, 0.10, 0.14), uNightMix) + grain * 0.5;
            }
            gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
          }
        `,
      });
      const backScreen = new THREE.Mesh(backScreenGeo, backScreenMat);
      backScreen.position.set(0, -GLASS_T * 0.25, -HALF_Z - GLASS_T - 0.0012);
      scene.add(backScreen);
    }

    // ===== 2. 濡れた川砂利の底（上面＋4側面の断面スカート・深さ陰影と粒凹凸） =====
    {
      const gravelTex = makeGravelTextures();
      const seg = 30;
      const w = INNER_W - 0.002;
      const d = INNER_D - 0.002;
      const topGeo = new THREE.PlaneGeometry(w, d, seg, seg);
      topGeo.rotateX(-Math.PI / 2);
      const tPos = topGeo.getAttribute('position');
      for (let i = 0; i < tPos.count; i++) {
        tPos.setY(i, getSubstrateHeight(tPos.getX(i), tPos.getZ(i)));
      }
      topGeo.computeVertexNormals();

      // ガラス越しに見える砂利層の側面スカート（底面 y = -HALF_Y + 0.0005 まで閉じる）
      const bottomY = -HALF_Y + 0.0005;
      const skirtParts = [
        normalizeForMerge(topGeo, (col, x, y, z) => {
          // ほんのり自然な色幅（奥側や四隅を少し落ち着かせる）
          const edgeDark = 1.0 - 0.07 * clamp((Math.hypot(x, z) - 0.09) / 0.12, 0, 1);
          const shade = edgeDark * (0.97 + 0.03 * Math.sin(x * 26 + z * 21));
          col.setRGB(shade, shade * 0.99, shade * 0.97);
        }),
      ];
      const halfW = w / 2;
      const halfD = d / 2;
      const vSegs = 4; // 断面を縦4段に分けて滑らかな深さ陰影と地層感を出す

      function buildSkirtSide(isXEdge, sign) {
        const positions = [];
        const uvs = [];
        const colors = [];
        const span = isXEdge ? d : w;
        for (let i = 0; i < seg; i++) {
          const t0 = i / seg;
          const t1 = (i + 1) / seg;
          const a0 = (t0 - 0.5) * span;
          const a1 = (t1 - 0.5) * span;
          const x0 = isXEdge ? sign * halfW : a0;
          const z0 = isXEdge ? a0 : sign * halfD;
          const x1 = isXEdge ? sign * halfW : a1;
          const z1 = isXEdge ? a1 : sign * halfD;
          const yTop0 = getSubstrateHeight(x0, z0);
          const yTop1 = getSubstrateHeight(x1, z1);
          const flip = (isXEdge && sign > 0) || (!isXEdge && sign < 0);

          for (let j = 0; j < vSegs; j++) {
            const f0 = j / vSegs;       // 0=上端, 1=底端
            const f1 = (j + 1) / vSegs;
            const ya0 = THREE.MathUtils.lerp(yTop0, bottomY, f0);
            const yb0 = THREE.MathUtils.lerp(yTop1, bottomY, f0);
            const ya1 = THREE.MathUtils.lerp(yTop0, bottomY, f1);
            const yb1 = THREE.MathUtils.lerp(yTop1, bottomY, f1);

            // 粒が縦に伸びない実寸比の UV
            const va0 = (ya0 - bottomY) / span;
            const vb0 = (yb0 - bottomY) / span;
            const va1 = (ya1 - bottomY) / span;
            const vb1 = (yb1 - bottomY) / span;

            // ガラスに接する砂利断面は下へ行くほど暗く締まる（光が砂の奥まで届かない表現）
            const shadeAt = (f, a) => {
              const depthSh = THREE.MathUtils.lerp(0.84, 0.34, Math.pow(f, 0.85));
              const strata = 0.94 + 0.06 * Math.sin(f * 13.0 + a * 34.0);
              return depthSh * strata;
            };
            const cA = shadeAt(f0, a0);
            const cB = shadeAt(f0, a1);
            const cC = shadeAt(f1, a1);
            const cD = shadeAt(f1, a0);

            const pA = [x0, ya0, z0];
            const pB = [x1, yb0, z1];
            const pC = [x1, yb1, z1];
            const pD = [x0, ya1, z0];
            const quad = flip ? [pA, pB, pC, pA, pC, pD] : [pA, pC, pB, pA, pD, pC];
            const uvQuad = flip
              ? [[t0, va0], [t1, vb0], [t1, vb1], [t0, va0], [t1, vb1], [t0, va1]]
              : [[t0, va0], [t1, vb1], [t1, vb0], [t0, va0], [t0, va1], [t1, vb1]];
            const colQuad = flip
              ? [cA, cB, cC, cA, cC, cD]
              : [cA, cC, cB, cA, cD, cC];
            for (let k = 0; k < 6; k++) {
              positions.push(...quad[k]);
              uvs.push(...uvQuad[k]);
              const cv = colQuad[k];
              colors.push(cv, cv * 0.97, cv * 0.93);
            }
          }
        }
        const sg = new THREE.BufferGeometry();
        sg.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        sg.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
        sg.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        sg.computeVertexNormals();
        return sg;
      }

      skirtParts.push(
        buildSkirtSide(false, +1),
        buildSkirtSide(false, -1),
        buildSkirtSide(true, +1),
        buildSkirtSide(true, -1)
      );

      const gravelMat = new THREE.MeshStandardMaterial({
        map: gravelTex.map,
        bumpMap: gravelTex.bumpMap,
        bumpScale: 0.88,
        vertexColors: true,
        roughness: 0.88,
        metalness: 0.0,
      });
      applyCausticsToMaterial(gravelMat, 0.42);

      const gravelMesh = new THREE.Mesh(mergeGeometries(skirtParts), gravelMat);
      scene.add(gravelMesh);
    }

    // ===== 3. 青龍石風の岩（高精細岩肌＋バンプ＋足元の小石 56 粒を 1 メッシュに結合） =====
    const rockObstacles = [];
    {
      const rockTex = makeRockTextures(512);
      const rockConfigs = [
        { x: -0.056, z: -0.036, rx: 0.052, ry: 0.048, rz: 0.040, ryRot: 0.42, seed: 11 }, // 主役の親石
        { x: -0.098, z:  0.015, rx: 0.030, ry: 0.024, rz: 0.026, ryRot: 1.75, seed: 29 }, // 左手前の添石
        { x:  0.072, z: -0.054, rx: 0.040, ry: 0.034, rz: 0.034, ryRot: 2.65, seed: 47 }, // 右奥の副石
        { x:  0.098, z:  0.104, rx: 0.024, ry: 0.016, rz: 0.020, ryRot: 0.90, seed: 71 }, // 右手前隅の前景石（窓モード視差アクセント）
        { x: -0.108, z:  0.110, rx: 0.020, ry: 0.014, rz: 0.017, ryRot: 2.15, seed: 93 }, // 左手前隅の前景石（窓モード視差アクセント）
      ];

      // 三角面ごとに法線軸に合わせたボックス投影 UV を割り当て（引き伸ばし・継ぎ目ゼロ）
      function assignBoxUVs(nonIndexedGeo, scale = 9.0, offsetX = 0, offsetY = 0) {
        const pos = nonIndexedGeo.getAttribute('position');
        const uvs = new Float32Array(pos.count * 2);
        const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
        const ab = new THREE.Vector3(), ac = new THREE.Vector3(), fn = new THREE.Vector3();
        for (let i = 0; i < pos.count; i += 3) {
          a.fromBufferAttribute(pos, i);
          b.fromBufferAttribute(pos, i + 1);
          c.fromBufferAttribute(pos, i + 2);
          ab.subVectors(b, a);
          ac.subVectors(c, a);
          fn.crossVectors(ab, ac).normalize();
          const ax = Math.abs(fn.x), ay = Math.abs(fn.y), az = Math.abs(fn.z);
          for (let k = 0; k < 3; k++) {
            const idx = i + k;
            const px = pos.getX(idx), py = pos.getY(idx), pz = pos.getZ(idx);
            let u, v;
            if (ay >= ax && ay >= az) { u = px * scale + offsetX; v = pz * scale + offsetY; }
            else if (ax >= az) { u = pz * scale + offsetX; v = py * scale + offsetY; }
            else { u = px * scale + offsetX; v = py * scale + offsetY; }
            uvs[idx * 2] = u;
            uvs[idx * 2 + 1] = v;
          }
        }
        nonIndexedGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      }

      const rockGeos = [];
      for (const cfg of rockConfigs) {
        const g = new THREE.IcosahedronGeometry(1, 4);
        const pos = g.getAttribute('position');
        const disp = new Float32Array(pos.count);
        for (let i = 0; i < pos.count; i++) {
          const vx = pos.getX(i);
          const vy = pos.getY(i);
          const vz = pos.getZ(i);
          // 傾斜した層理＋丸みと細かい段差（青龍石らしい造形）
          const tiltPlane = vy * 5.8 + vx * 3.4 - vz * 2.1 + cfg.seed;
          const strata = Math.sin(tiltPlane) * 0.075 + Math.sin(tiltPlane * 2.2) * 0.025;
          const ridge1 = (1.0 - Math.abs(Math.sin(vx * 3.8 - vz * 3.2 + cfg.seed * 1.3))) * 0.13 - 0.065;
          const ridge2 = (1.0 - Math.abs(Math.cos(vz * 6.2 + vy * 4.5 + cfg.seed * 2.1))) * 0.055 - 0.025;
          const micro = Math.sin((vx * 11.0 + vy * 9.0 - vz * 13.0) + cfg.seed) * 0.022;
          const rad = 0.96 + strata + ridge1 + ridge2 + micro;
          disp[i] = rad;
          // 底面側を平らめにして砂利にどっしり座らせる
          const flatY = vy < -0.22 ? -0.22 + (vy + 0.22) * 0.40 : vy;
          pos.setXYZ(i, vx * rad * cfg.rx, flatY * rad * cfg.ry, vz * rad * cfg.rz);
        }
        g.rotateY(cfg.ryRot);
        const baseY = getSubstrateHeight(cfg.x, cfg.z);
        const centerY = baseY + cfg.ry * 0.32; // 下部を砂利にしっかり埋め込み浮きゼロ
        g.translate(cfg.x, centerY, cfg.z);

        const nonIdx = g.index ? g.toNonIndexed() : g.clone();
        smoothNonIndexedNormals(nonIdx);
        assignBoxUVs(nonIdx, 8.8, cfg.seed * 0.17, cfg.seed * 0.31);
        const norm = nonIdx.getAttribute('normal');
        const nPos = nonIdx.getAttribute('position');
        const cols = new Float32Array(nPos.count * 3);
        const col = new THREE.Color();
        const mossCol = new THREE.Color(0x3a5832);
        for (let i = 0; i < nPos.count; i++) {
          const x = nPos.getX(i), y = nPos.getY(i), z = nPos.getZ(i);
          const ny = norm ? norm.getY(i) : 0.5;
          const localH = y - baseY;
          // 砂利際ほど暗くなる接地 AO ＋ 岩面の陰影コントラスト
          const ao = clamp(0.48 + (localH / Math.max(cfg.ry * 0.85, 0.015)) * 0.52, 0.44, 1.0);
          const ridgeLight = 0.88 + 0.16 * Math.sin(x * 42 + y * 58 - z * 36 + cfg.seed);
          const v = ao * ridgeLight;
          col.setRGB(v * 0.95, v * 0.98, v * 1.02);
          // 上面にはうっすら湿った苔色
          if (ny > 0.52) {
            const mossNoise = 0.5 + 0.5 * Math.sin(x * 78 + z * 64 + cfg.seed);
            const mossW = clamp((ny - 0.52) * 0.65 * mossNoise, 0, 0.38);
            col.lerp(mossCol, mossW);
          }
          cols[i * 3] = col.r;
          cols[i * 3 + 1] = col.g;
          cols[i * 3 + 2] = col.b;
        }
        nonIdx.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
        rockGeos.push(nonIdx);

        rockObstacles.push({
          x: cfg.x,
          y: centerY,
          z: cfg.z,
          r: Math.max(cfg.rx, cfg.ry, cfg.rz) + 0.012,
        });
      }

      // 岩や流木の足元に小さな石を 56 粒散らして砂利との境目を自然に馴染ませる
      {
        const rand = makePrng(30319);
        const scatterAnchors = [
          { x: -0.056, z: -0.036, rMin: 0.044, rMax: 0.074, count: 16 },
          { x: -0.098, z:  0.015, rMin: 0.025, rMax: 0.048, count: 10 },
          { x:  0.072, z: -0.054, rMin: 0.032, rMax: 0.060, count: 12 },
          { x:  0.098, z:  0.104, rMin: 0.018, rMax: 0.038, count: 7 },
          { x: -0.108, z:  0.110, rMin: 0.016, rMax: 0.034, count: 6 },
          { x: -0.008, z:  0.024, rMin: 0.010, rMax: 0.032, count: 5 },
        ];
        for (const anc of scatterAnchors) {
          for (let k = 0; k < anc.count; k++) {
            const ang = rand() * Math.PI * 2;
            const dist = anc.rMin + rand() * (anc.rMax - anc.rMin);
            const px = clamp(anc.x + Math.cos(ang) * dist, -HALF_X + 0.012, HALF_X - 0.012);
            const pz = clamp(anc.z + Math.sin(ang) * dist, -HALF_Z + 0.012, HALF_Z - 0.012);
            const rx = 0.0032 + rand() * 0.0058;
            const ry = rx * (0.48 + rand() * 0.36);
            const rz = rx * (0.72 + rand() * 0.42);
            const pg = new THREE.IcosahedronGeometry(1, 1);
            const pPos = pg.getAttribute('position');
            for (let i = 0; i < pPos.count; i++) {
              const x = pPos.getX(i), y = pPos.getY(i), z = pPos.getZ(i);
              const n = 0.85 + 0.25 * Math.sin(x * 4.5 + y * 5.2 + k * 2.1);
              pPos.setXYZ(i, x * rx * n, y * ry * n, z * rz * n);
            }
            pg.rotateY(rand() * Math.PI * 2);
            pg.rotateX((rand() - 0.5) * 0.35);
            const subY = getSubstrateHeight(px, pz);
            pg.translate(px, subY + ry * 0.28, pz);
            const nonIdx = pg.index ? pg.toNonIndexed() : pg.clone();
            smoothNonIndexedNormals(nonIdx);
            assignBoxUVs(nonIdx, 14.0, rand(), rand());
            const tone = 0.68 + rand() * 0.34;
            const cols = new Float32Array(nonIdx.getAttribute('position').count * 3);
            for (let i = 0; i < cols.length; i += 3) {
              cols[i] = tone * 0.96;
              cols[i + 1] = tone * 0.98;
              cols[i + 2] = tone * 1.00;
            }
            nonIdx.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
            rockGeos.push(nonIdx);
          }
        }
      }

      const rockMat = new THREE.MeshStandardMaterial({
        map: rockTex.map,
        bumpMap: rockTex.bumpMap,
        bumpScale: 1.05,
        vertexColors: true,
        roughness: 0.85,
        metalness: 0.03,
      });
      applyCausticsToMaterial(rockMat, 0.38);
      scene.add(new THREE.Mesh(mergeGeometries(rockGeos), rockMat));

      // 右奥の石の脇に置く小さなエアストーン（泡の発生源）
      const airStonePos = new THREE.Vector3(0.088, getSubstrateHeight(0.088, -0.072) + 0.004, -0.072);
      const airStone = new THREE.Mesh(
        new THREE.CylinderGeometry(0.007, 0.008, 0.011, 10),
        new THREE.MeshStandardMaterial({ color: 0xb8c3ca, roughness: 0.90 })
      );
      airStone.position.copy(airStonePos);
      scene.add(airStone);
    }

    // ===== 4. 流木（太いうねり＋樹皮凹凸＋継ぎ目を隠す濃い緑の苔クラスター） =====
    {
      function makeTaperedBranch(points, rStart, rEnd, tubularSegs = 22, radialSegs = 10, seed = 1.0) {
        const curve = new THREE.CatmullRomCurve3(points);
        const frames = curve.computeFrenetFrames(tubularSegs, false);
        const positions = [];
        const normals = [];
        const uvs = [];
        const colors = [];
        const indices = [];

        const v = new THREE.Vector3();
        const n = new THREE.Vector3();
        for (let i = 0; i <= tubularSegs; i++) {
          const t = i / tubularSegs;
          const p = curve.getPointAt(t);
          // 根元をやや膨らませてから枝先へ繊細に細める
          const flare = t < 0.22 ? 1.0 + 0.22 * Math.pow(1.0 - t / 0.22, 2.0) : 1.0;
          const radius = THREE.MathUtils.lerp(rStart, rEnd, Math.pow(t, 0.78)) * flare;
          const N = frames.normals[i];
          const B = frames.binormals[i];
          for (let j = 0; j <= radialSegs; j++) {
            const u = j / radialSegs;
            const theta = u * Math.PI * 2;
            const sin = Math.sin(theta);
            const cos = Math.cos(theta);
            // 樹皮の縦溝とうねり（完全な円柱感を消す）
            const flute = 1.0
              + 0.11 * Math.sin(theta * 3.0 + t * 9.5 + seed)
              + 0.07 * Math.cos(theta * 5.0 - t * 14.0 + seed * 1.7)
              + 0.05 * Math.sin(t * 21.0 + seed * 2.3);
            n.set(
              cos * N.x + sin * B.x,
              cos * N.y + sin * B.y,
              cos * N.z + sin * B.z
            ).normalize();
            v.copy(p).addScaledVector(n, radius * flute);
            positions.push(v.x, v.y, v.z);
            normals.push(n.x, n.y, n.z);
            uvs.push(u, t * 2.2);
            // 下側面と根元に陰影（自然な立体感。暗部も樹皮が読める明るさを確保）
            const shade = clamp(0.72 + 0.22 * (n.y * 0.5 + 0.5) + 0.12 * t, 0.62, 1.0);
            colors.push(shade, shade * 0.96, shade * 0.90);
          }
        }
        const stride = radialSegs + 1;
        for (let i = 0; i < tubularSegs; i++) {
          for (let j = 0; j < radialSegs; j++) {
            const a = i * stride + j;
            const b = (i + 1) * stride + j;
            const c = (i + 1) * stride + (j + 1);
            const d = i * stride + (j + 1);
            indices.push(a, b, d, b, c, d);
          }
        }
        // 枝先の丸いキャップを閉じて中空断面を見せない
        const tipCenterIdx = positions.length / 3;
        const pEnd = curve.getPointAt(1.0);
        const tangEnd = curve.getTangentAt(1.0).normalize();
        positions.push(pEnd.x + tangEnd.x * rEnd * 0.6, pEnd.y + tangEnd.y * rEnd * 0.6, pEnd.z + tangEnd.z * rEnd * 0.6);
        normals.push(tangEnd.x, tangEnd.y, tangEnd.z);
        uvs.push(0.5, 2.3);
        colors.push(0.72, 0.68, 0.62);
        const lastRow = tubularSegs * stride;
        for (let j = 0; j < radialSegs; j++) {
          indices.push(lastRow + j, tipCenterIdx, lastRow + j + 1);
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
        geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
        geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        geo.setIndex(indices);
        const out = geo.toNonIndexed();
        out.computeVertexNormals();
        return out;
      }

      const woodBaseY = getSubstrateHeight(-0.048, -0.052) - 0.012;
      const branches = [
        // 主幹：左奥の親石の陰から大きくうねって右前やや上へ伸びる
        makeTaperedBranch([
          new THREE.Vector3(-0.054, woodBaseY, -0.060),
          new THREE.Vector3(-0.038, woodBaseY + 0.036, -0.032),
          new THREE.Vector3(-0.014, woodBaseY + 0.058, -0.008),
          new THREE.Vector3( 0.014, woodBaseY + 0.074,  0.012),
          new THREE.Vector3( 0.050, woodBaseY + 0.098,  0.044),
        ], 0.0165, 0.0024, 24, 10, 1.1),
        // 上へうねり伸びる枝1
        makeTaperedBranch([
          new THREE.Vector3(-0.016, woodBaseY + 0.056, -0.009),
          new THREE.Vector3(-0.028, woodBaseY + 0.088,  0.002),
          new THREE.Vector3(-0.022, woodBaseY + 0.118,  0.016),
          new THREE.Vector3(-0.012, woodBaseY + 0.140,  0.026),
        ], 0.0082, 0.0017, 16, 8, 2.3),
        // 右奥へ伸びる枝2
        makeTaperedBranch([
          new THREE.Vector3( 0.009, woodBaseY + 0.071,  0.008),
          new THREE.Vector3( 0.032, woodBaseY + 0.098, -0.008),
          new THREE.Vector3( 0.056, woodBaseY + 0.126, -0.020),
          new THREE.Vector3( 0.072, woodBaseY + 0.144, -0.028),
        ], 0.0072, 0.0015, 16, 8, 3.7),
        // 右前枝から分かれる細い小枝
        makeTaperedBranch([
          new THREE.Vector3( 0.030, woodBaseY + 0.084,  0.026),
          new THREE.Vector3( 0.052, woodBaseY + 0.076,  0.042),
          new THREE.Vector3( 0.072, woodBaseY + 0.086,  0.052),
        ], 0.0044, 0.0012, 12, 7, 5.1),
        // 下を支える根1（砂利へ食い込む）
        makeTaperedBranch([
          new THREE.Vector3(-0.038, woodBaseY + 0.038, -0.030),
          new THREE.Vector3(-0.022, woodBaseY + 0.022, -0.002),
          new THREE.Vector3(-0.005, getSubstrateHeight(-0.005, 0.024) - 0.010, 0.024),
        ], 0.0092, 0.0038, 12, 8, 6.4),
        // 下を支える根2（左手前側へ）
        makeTaperedBranch([
          new THREE.Vector3(-0.044, woodBaseY + 0.028, -0.040),
          new THREE.Vector3(-0.058, woodBaseY + 0.012, -0.008),
          new THREE.Vector3(-0.064, getSubstrateHeight(-0.064, 0.016) - 0.010, 0.016),
        ], 0.0080, 0.0034, 10, 8, 7.9),
      ];

      const woodTex = makeWoodTextures(512);
      const woodMat = new THREE.MeshStandardMaterial({
        map: woodTex.map,
        bumpMap: woodTex.bumpMap,
        bumpScale: 0.95,
        vertexColors: true,
        roughness: 0.86,
        metalness: 0.02,
      });
      applyCausticsToMaterial(woodMat, 0.30);
      scene.add(new THREE.Mesh(mergeGeometries(branches), woodMat));

      // 流木の分岐継ぎ目と根元に活着する濃い緑の苔（ウィローモス）の塊
      const mossSpots = [
        { x: -0.016, y: woodBaseY + 0.060, z: -0.009, rx: 0.018, ry: 0.011, rz: 0.015 }, // 主幹×上枝の継ぎ目
        { x:  0.009, y: woodBaseY + 0.075, z:  0.009, rx: 0.017, ry: 0.010, rz: 0.014 }, // 主幹×右奥枝の継ぎ目
        { x:  0.030, y: woodBaseY + 0.088, z:  0.026, rx: 0.012, ry: 0.008, rz: 0.011 }, // 右前小枝の継ぎ目
        { x: -0.038, y: woodBaseY + 0.042, z: -0.030, rx: 0.020, ry: 0.012, rz: 0.017 }, // 根元の継ぎ目
        { x: -0.024, y: woodBaseY + 0.050, z: -0.018, rx: 0.016, ry: 0.009, rz: 0.013 }, // 主幹の背中
        { x: -0.008, y: getSubstrateHeight(-0.008, 0.020) + 0.005, z: 0.020, rx: 0.016, ry: 0.008, rz: 0.014 }, // 根1の足元
      ];
      const mossGeos = [];
      const mRand = makePrng(71042);
      for (const ms of mossSpots) {
        // 1箇所あたり 4 個のもこもこ小房を重ねて自然な苔クッションに
        const puffs = 4;
        for (let p = 0; p < puffs; p++) {
          const mg = new THREE.IcosahedronGeometry(1, 2);
          const ox = (mRand() - 0.5) * ms.rx * 0.9;
          const oy = (mRand() - 0.35) * ms.ry * 0.6;
          const oz = (mRand() - 0.5) * ms.rz * 0.9;
          const sc = 0.58 + mRand() * 0.52;
          const mPos = mg.getAttribute('position');
          for (let i = 0; i < mPos.count; i++) {
            const x = mPos.getX(i), y = mPos.getY(i), z = mPos.getZ(i);
            const lump = 0.84 + 0.22 * Math.sin(x * 7.5 + y * 9.0 + p * 2.4) * Math.cos(z * 8.0 - p);
            mPos.setXYZ(i, x * ms.rx * sc * lump, y * ms.ry * sc * lump, z * ms.rz * sc * lump);
          }
          mg.translate(ms.x + ox, ms.y + oy, ms.z + oz);
          smoothNonIndexedNormals(mg);
          const norm = mg.getAttribute('normal');
          mossGeos.push(normalizeForMerge(mg, (col, x, y, z, idx) => {
            const ny = norm ? norm.getY(idx) : 0.4;
            const light = clamp(0.48 + (ny * 0.5 + 0.5) * 0.62, 0.42, 1.08);
            col.setRGB(light * 0.85, light * 1.08, light * 0.78);
          }));
        }
      }
      const mossTex = makeMossTextures(256);
      const mossMat = new THREE.MeshStandardMaterial({
        map: mossTex.map,
        bumpMap: mossTex.bumpMap,
        bumpScale: 0.85,
        vertexColors: true,
        roughness: 0.92,
        metalness: 0.0,
      });
      applyCausticsToMaterial(mossMat, 0.24);
      scene.add(new THREE.Mesh(mergeGeometries(mossGeos), mossMat));

      rockObstacles.push({ x: -0.012, y: woodBaseY + 0.058, z: -0.005, r: 0.036 });
    }

    // ===== 5. 水草（3種・葉脈テクスチャ＋LEDエメラルド透過＋水流揺れ＋水中霞み） =====
    function applyPlantSway(material, amp = 0.016, freq = 1.25, translucency = 0.34) {
      material.onBeforeCompile = (shader) => {
        shader.uniforms.uTime = envUniforms.uTime;
        shader.uniforms.uNightMix = envUniforms.uNightMix;
        shader.uniforms.uWaterFogColor = envUniforms.uWaterFogColor;
        shader.uniforms.uWaterFogStrength = envUniforms.uWaterFogStrength;
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', `#include <common>
attribute vec3 aSway;
uniform float uTime;
varying vec3 vPlantWPos;
varying float vLeafTip;`)
          .replace(
            '#include <begin_vertex>',
            `#include <begin_vertex>
float swH = aSway.x;
float swPh = aSway.y;
float swDir = aSway.z;
float swBend = swH * swH;
float tS = uTime * ${freq.toFixed(3)};
float wave1 = sin(tS + swPh + transformed.x * 9.0 + transformed.z * 5.0);
float wave2 = 0.38 * sin(tS * 2.15 + swPh * 1.7 + transformed.y * 16.0);
float drift = (0.32 + wave1 + wave2) * ${amp.toFixed(4)} * swBend;
transformed.x += drift * cos(swDir);
transformed.z += drift * sin(swDir) * 0.72;
transformed.y -= abs(drift) * 0.22 * swH;
// 揺れの最大時でもガラス内寸・水面を超えないよう安全に収める
transformed.x = clamp(transformed.x, -0.143, 0.143);
transformed.z = clamp(transformed.z, -0.143, 0.143);
transformed.y = min(transformed.y, ${(WATER_Y - 0.005).toFixed(4)});
vPlantWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
vLeafTip = swH;`
          );
        shader.fragmentShader = shader.fragmentShader
