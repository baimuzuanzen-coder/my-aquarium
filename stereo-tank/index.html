          .replace('#include <common>', `#include <common>
uniform float uNightMix;
uniform vec3 uWaterFogColor;
uniform float uWaterFogStrength;
varying vec3 vPlantWPos;
varying float vLeafTip;`)
          .replace(
            '#include <opaque_fragment>',
            `#include <opaque_fragment>
            {
              // 上からの LED 光が薄い葉をエメラルドグリーンに透過する表現
              float ledProx = exp(-dot(vPlantWPos.xz, vPlantWPos.xz) * 18.0);
              float heightGlow = smoothstep(-0.12, 0.10, vPlantWPos.y);
              float thin = mix(0.35, 1.0, vLeafTip);
              vec3 viewD = normalize(cameraPosition - vPlantWPos);
              float backScatter = 0.55 + 0.45 * clamp(1.0 - abs(viewD.y), 0.0, 1.0);
              vec3 sssCol = vec3(0.10, 0.44, 0.16) * (0.75 + 0.55 * heightGlow) * (0.65 + 0.55 * ledProx);
              gl_FragColor.rgb += sssCol * thin * backScatter * ${translucency.toFixed(3)} * (1.0 + 0.35 * uNightMix);

              float zDepth = clamp((${HALF_Z.toFixed(4)} - vPlantWPos.z) / ${INNER_D.toFixed(4)}, 0.0, 1.0);
              float fogF = clamp(pow(zDepth, 1.15) * uWaterFogStrength * 1.05, 0.0, 0.42);
              gl_FragColor.rgb = mix(gl_FragColor.rgb, uWaterFogColor, fogF);
            }`
          );
      };
      material.customProgramCacheKey = () => `nano-plant-sway-${amp.toFixed(4)}-${freq.toFixed(2)}-${translucency.toFixed(2)}`;
    }

    const tapeLeafTex = makeTapeLeafTexture(256);
    const broadLeafTex = makeBroadLeafTextures(256);

    // 5a. バリスネリア（テープ状の長い水草 5 株・水面近くで水流に沿って横なびき）
    {
      const rand = makePrng(314159);
      const ribbonGeos = [];
      const clumps = [
        { x: -0.105, z: -0.098, blades: 11, hMin: 0.15, hMax: 0.225 },
        { x: -0.052, z: -0.110, blades: 10, hMin: 0.14, hMax: 0.215 },
        { x:  0.015, z: -0.114, blades: 9,  hMin: 0.13, hMax: 0.210 },
        { x:  0.106, z: -0.098, blades: 10, hMin: 0.14, hMax: 0.215 },
        { x: -0.116, z: -0.036, blades: 7,  hMin: 0.10, hMax: 0.165 },
      ];

      for (const cl of clumps) {
        for (let b = 0; b < cl.blades; b++) {
          const ox = cl.x + (rand() - 0.5) * 0.030;
          const oz = cl.z + (rand() - 0.5) * 0.024;
          const baseY = getSubstrateHeight(ox, oz) - 0.004;
          const maxVert = WATER_Y - 0.008 - baseY;
          const totalLen = cl.hMin + rand() * (cl.hMax - cl.hMin);
          const width = 0.0062 + rand() * 0.0038;
          const segs = 14;
          const yaw = rand() * Math.PI * 2;
          const phase = rand() * Math.PI * 2;
          // 水流に沿って緩やかに右〜やや手前方向へ揃ってなびかせる
          const flowAng = -0.18 + (rand() - 0.5) * 0.45;
          const flowCos = Math.cos(flowAng);
          const flowSin = Math.sin(flowAng);
          const swayDir = flowAng;

          const positions = [];
          const uvs = [];
          const colors = [];
          const sways = [];
          const indices = [];

          const cBase = new THREE.Color(0x275d32);
          const cTip = new THREE.Color().setHSL(0.28 + (rand() - 0.5) * 0.035, 0.56, 0.46 + rand() * 0.09);
          const cTmp = new THREE.Color();

          const cosY = Math.cos(yaw);
          const sinY = Math.sin(yaw);

          for (let s = 0; s <= segs; s++) {
            const t = s / segs;
            const wHalf = width * 0.5 * (1.0 - Math.pow(t, 2.4) * 0.85);
            // 水面に近づくほど上への伸びが緩やかになり、水流方向へ大きく横なびきする
            const rawY = totalLen * t;
            const bendStart = maxVert * 0.62;
            let cy, flowDrift;
            if (rawY <= bendStart) {
              cy = baseY + rawY;
              flowDrift = 0.012 * t * t;
            } else {
              const over = rawY - bendStart;
              const remain = Math.max(0.012, maxVert - bendStart);
              cy = baseY + bendStart + remain * Math.tanh(over / (remain * 1.15));
              flowDrift = 0.012 * t * t + over * 0.72;
            }
            const arch = (0.008 + rand() * 0.004) * t * t;
            const twist = t * 0.55 * (b % 2 === 0 ? 1 : -1);
            const cx = ox + cosY * arch + flowCos * flowDrift;
            const cz = oz + sinY * arch + flowSin * flowDrift;
            const rx = -sinY * Math.cos(twist) + cosY * Math.sin(twist) * 0.35;
            const rz =  cosY * Math.cos(twist) + sinY * Math.sin(twist) * 0.35;

            cTmp.copy(cBase).lerp(cTip, Math.pow(t, 0.72));
            for (const side of [-1, 1]) {
              positions.push(
                clamp(cx + rx * wHalf * side, -0.141, 0.141),
                Math.min(cy, WATER_Y - 0.007),
                clamp(cz + rz * wHalf * side, -0.141, 0.141)
              );
              uvs.push(side < 0 ? 0 : 1, t);
              colors.push(cTmp.r, cTmp.g, cTmp.b);
              sways.push(t, phase, swayDir);
            }
            if (s < segs) {
              const r0 = s * 2;
              indices.push(r0, r0 + 1, r0 + 2, r0 + 1, r0 + 3, r0 + 2);
            }
          }
          const bg = new THREE.BufferGeometry();
          bg.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
          bg.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
          bg.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
          bg.setAttribute('aSway', new THREE.Float32BufferAttribute(sways, 3));
          bg.setIndex(indices);
          bg.computeVertexNormals();
          ribbonGeos.push(bg.toNonIndexed());
        }
      }
      const ribbonMat = new THREE.MeshStandardMaterial({
        map: tapeLeafTex,
        vertexColors: true,
        roughness: 0.48,
        metalness: 0.02,
        side: THREE.DoubleSide,
      });
      applyPlantSway(ribbonMat, 0.018, 1.28, 0.40);
      scene.add(new THREE.Mesh(mergeGeometries(ribbonGeos), ribbonMat));
    }

    // 5b. ロタラ風の有茎水草（丸葉テクスチャの対生茎 4 株）
    {
      const rand = makePrng(271828);
      const stemGeos = [];
      const clusters = [
        { x:  0.056, z: -0.095, stems: 5, hMin: 0.10, hMax: 0.165, warmTip: true },
        { x: -0.015, z: -0.088, stems: 4, hMin: 0.08, hMax: 0.145, warmTip: false },
        { x:  0.105, z: -0.025, stems: 4, hMin: 0.07, hMax: 0.125, warmTip: true },
        { x: -0.096, z: -0.068, stems: 3, hMin: 0.08, hMax: 0.135, warmTip: false },
      ];

      function buildLeafBlade(origin, dir, up, len, wid, col, swayH, phase, swayDir) {
        const right = new THREE.Vector3().crossVectors(dir, up).normalize();
        const pBL = origin.clone().addScaledVector(right, -wid * 0.5);
        const pBR = origin.clone().addScaledVector(right,  wid * 0.5);
        const mid = origin.clone().addScaledVector(dir, len * 0.55).addScaledVector(up, len * 0.10);
        const pML = mid.clone().addScaledVector(right, -wid * 0.52);
        const pMR = mid.clone().addScaledVector(right,  wid * 0.52);
        const tip = origin.clone().addScaledVector(dir, len).addScaledVector(up, -len * 0.04);
        const pTL = tip.clone().addScaledVector(right, -wid * 0.45);
        const pTR = tip.clone().addScaledVector(right,  wid * 0.45);

        const verts = [pBL, pML, pMR, pBL, pMR, pBR, pML, pTL, pTR, pML, pTR, pMR];
        const uvList = [
          [0, 0], [0, 0.55], [1, 0.55], [0, 0], [1, 0.55], [1, 0],
          [0, 0.55], [0, 1], [1, 1], [0, 0.55], [1, 1], [1, 0.55],
        ];
        const positions = [];
        const colors = [];
        const sways = [];
        const uvs = [];
        for (let k = 0; k < verts.length; k++) {
          const p = verts[k];
          positions.push(clamp(p.x, -0.142, 0.142), Math.min(p.y, WATER_Y - 0.008), clamp(p.z, -0.142, 0.142));
          uvs.push(uvList[k][0], uvList[k][1]);
          colors.push(col.r, col.g, col.b);
          sways.push(swayH, phase, swayDir);
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
        g.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        g.setAttribute('aSway', new THREE.Float32BufferAttribute(sways, 3));
        g.computeVertexNormals();
        return g;
      }

      const upVec = new THREE.Vector3(0, 1, 0);
      for (const cl of clusters) {
        for (let s = 0; s < cl.stems; s++) {
          const sx = cl.x + (rand() - 0.5) * 0.032;
          const sz = cl.z + (rand() - 0.5) * 0.026;
          const baseY = getSubstrateHeight(sx, sz) - 0.003;
          const h = Math.min(cl.hMin + rand() * (cl.hMax - cl.hMin), WATER_Y - 0.015 - baseY);
          const phase = rand() * Math.PI * 2;
          const swayDir = 0.18 + (rand() - 0.5) * 0.7;
          const leanX = (rand() - 0.5) * 0.018;
          const leanZ = (rand() - 0.5) * 0.016;

          // 細い茎（葉テクスチャの中央の濃い不透明部分を使う UV を指定）
          const stemCyl = new THREE.CylinderGeometry(0.0009, 0.0014, h, 5, 5);
          const sPos = stemCyl.getAttribute('position');
          const sUv = stemCyl.getAttribute('uv');
          for (let i = 0; i < sPos.count; i++) {
            const t = (sPos.getY(i) + h * 0.5) / h;
            sPos.setXYZ(
              i,
              sx + sPos.getX(i) + leanX * t * t,
              baseY + t * h,
              sz + sPos.getZ(i) + leanZ * t * t
            );
            sUv.setXY(i, 0.5, 0.5);
          }
          stemCyl.computeVertexNormals();
          stemGeos.push(normalizeForMerge(
            stemCyl,
            (c) => c.setRGB(0.42, 0.65, 0.36),
            (x, y) => [clamp((y - baseY) / h, 0, 1), phase, swayDir]
          ));

          // 対生する丸葉のノード
          const nodes = 6 + Math.floor(rand() * 3);
          for (let n = 1; n <= nodes; n++) {
            const t = n / (nodes + 0.35);
            const ny = baseY + t * h;
            const nx = sx + leanX * t * t;
            const nz = sz + leanZ * t * t;
            const nodeOrigin = new THREE.Vector3(nx, ny, nz);
            const baseAng = n * 1.38 + rand() * 0.4;
            const leafLen = (0.014 + rand() * 0.006) * (1.05 - t * 0.25);
            const leafWid = leafLen * 0.70;
            const col = new THREE.Color().setHSL(
              cl.warmTip && t > 0.62 ? THREE.MathUtils.lerp(0.26, 0.07, (t - 0.62) / 0.38) : 0.28 + (rand() - 0.5) * 0.03,
              0.56,
              0.46 + t * 0.14
            );

            for (const side of [0, Math.PI]) {
              const ang = baseAng + side;
              const dir = new THREE.Vector3(Math.cos(ang), 0.24 + t * 0.15, Math.sin(ang)).normalize();
              stemGeos.push(buildLeafBlade(nodeOrigin, dir, upVec, leafLen, leafWid, col, t, phase, swayDir));
            }
          }
        }
      }
      const stemMat = new THREE.MeshStandardMaterial({
        map: broadLeafTex.map,
        bumpMap: broadLeafTex.bumpMap,
        bumpScale: 0.45,
        alphaTest: 0.42,
        vertexColors: true,
        roughness: 0.46,
        metalness: 0.02,
        side: THREE.DoubleSide,
      });
      applyPlantSway(stemMat, 0.014, 1.42, 0.36);
      scene.add(new THREE.Mesh(mergeGeometries(stemGeos), stemMat));
    }

    // 5c. 前景・岩元のロゼット水草（アヌビアス／クリプトコリネ風・葉脈＋丸葉輪郭 6 株）
    {
      const rand = makePrng(998244);
      const fgGeos = [];
      const rosettes = [
        { x: -0.114, z:  0.094, leaves: 10, scale: 0.78 }, // 左手前隅の前景アクセント
        { x: -0.072, z:  0.048, leaves: 11, scale: 1.02 },
        { x: -0.018, z:  0.036, leaves: 10, scale: 0.92 },
        { x:  0.036, z:  0.068, leaves: 9,  scale: 0.86 },
        { x:  0.106, z:  0.088, leaves: 9,  scale: 0.76 }, // 右手前隅の前景アクセント
        { x:  0.088, z:  0.015, leaves: 10, scale: 0.95 },
      ];
      for (const ro of rosettes) {
        const baseY = getSubstrateHeight(ro.x, ro.z) - 0.002;
        const phase = rand() * Math.PI * 2;
        for (let l = 0; l < ro.leaves; l++) {
          const ang = (l / ro.leaves) * Math.PI * 2 + (rand() - 0.5) * 0.45;
          const isInner = l % 3 === 0;
          const len = (isInner ? 0.017 + rand() * 0.008 : 0.024 + rand() * 0.014) * ro.scale;
          const wid = len * (0.58 + rand() * 0.14);
          const lift = (isInner ? 0.018 + rand() * 0.012 : 0.013 + rand() * 0.015) * ro.scale;
          const swayDir = ang;

          const segs = 5;
          const positions = [];
          const uvs = [];
          const colors = [];
          const sways = [];
          const indices = [];
          const c0 = new THREE.Color(0x285c36);
          const c1 = new THREE.Color().setHSL(0.32 + (rand() - 0.5) * 0.03, 0.50, 0.44 + rand() * 0.09);
          const ct = new THREE.Color();

          const dx = Math.cos(ang);
          const dz = Math.sin(ang);
          const rx = -dz;
          const rz = dx;

          for (let s = 0; s <= segs; s++) {
            const t = s / segs;
            // 有機的輪郭はテクスチャの alphaTest で切り抜くため、幅はややゆとりを持たせて自然に反らせる
            const hw = wid * 0.5 * (0.65 + 0.35 * Math.sin(t * Math.PI));
            const dist = len * t;
            // 葉元は立ち上がり、葉先が優しく外へ垂れるアーチ
            const cy = baseY + lift * Math.sin(t * Math.PI * 0.80) + 0.002;
            const cup = 0.0018 * Math.sin(t * Math.PI); // 葉の左右がわずかに上へ反る立体感
            ct.copy(c0).lerp(c1, t);
            for (const side of [-1, 1]) {
              positions.push(
                clamp(ro.x + dx * dist + rx * hw * side, -0.142, 0.142),
                cy + cup,
                clamp(ro.z + dz * dist + rz * hw * side, -0.142, 0.142)
              );
              uvs.push(side < 0 ? 0 : 1, t);
              colors.push(ct.r, ct.g, ct.b);
              sways.push(t * 0.65, phase + l * 0.35, swayDir);
            }
            if (s < segs) {
              const r0 = s * 2;
              indices.push(r0, r0 + 1, r0 + 2, r0 + 1, r0 + 3, r0 + 2);
            }
          }
          const g = new THREE.BufferGeometry();
          g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
          g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
          g.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
          g.setAttribute('aSway', new THREE.Float32BufferAttribute(sways, 3));
          g.setIndex(indices);
          g.computeVertexNormals();
          fgGeos.push(g.toNonIndexed());
        }
      }
      const fgMat = new THREE.MeshStandardMaterial({
        map: broadLeafTex.map,
        bumpMap: broadLeafTex.bumpMap,
        bumpScale: 0.55,
        alphaTest: 0.42,
        vertexColors: true,
        roughness: 0.40,
        metalness: 0.03,
        side: THREE.DoubleSide,
      });
      applyPlantSway(fgMat, 0.008, 1.05, 0.32);
      scene.add(new THREE.Mesh(mergeGeometries(fgGeos), fgMat));
    }

    // ===== 5d. 水槽内の接地影（岩・流木・水草の足元。1 描画コールに結合） =====
    {
      const aoCanvas = document.createElement('canvas');
      aoCanvas.width = aoCanvas.height = 128;
      const aCtx = aoCanvas.getContext('2d');
      const rg = aCtx.createRadialGradient(64, 64, 8, 64, 64, 62);
      rg.addColorStop(0.0, 'rgba(10, 18, 22, 0.72)');
      rg.addColorStop(0.45, 'rgba(12, 22, 26, 0.42)');
      rg.addColorStop(0.80, 'rgba(14, 26, 30, 0.12)');
      rg.addColorStop(1.0, 'rgba(14, 26, 30, 0.0)');
      aCtx.fillStyle = rg;
      aCtx.fillRect(0, 0, 128, 128);
      const aoTex = new THREE.CanvasTexture(aoCanvas);

      const contactSpots = [
        // 岩 5 個の接地影
        { x: -0.056, z: -0.036, rx: 0.072, rz: 0.058, rot: 0.42, op: 0.85 },
        { x: -0.098, z:  0.015, rx: 0.044, rz: 0.038, rot: 1.75, op: 0.72 },
        { x:  0.072, z: -0.054, rx: 0.056, rz: 0.048, rot: 2.65, op: 0.78 },
        { x:  0.098, z:  0.104, rx: 0.034, rz: 0.030, rot: 0.90, op: 0.68 },
        { x: -0.108, z:  0.110, rx: 0.030, rz: 0.026, rot: 2.15, op: 0.65 },
        // 流木の根元＆接地枝
        { x: -0.046, z: -0.050, rx: 0.038, rz: 0.034, rot: 0.30, op: 0.75 },
        { x: -0.004, z:  0.024, rx: 0.026, rz: 0.024, rot: 0.0,  op: 0.62 },
        // 水草株元（奥バリスネリア・ロタラ・前景ロゼット）
        { x: -0.105, z: -0.098, rx: 0.034, rz: 0.030, rot: 0.0,  op: 0.52 },
        { x: -0.052, z: -0.110, rx: 0.032, rz: 0.028, rot: 0.0,  op: 0.50 },
        { x:  0.015, z: -0.114, rx: 0.030, rz: 0.026, rot: 0.0,  op: 0.48 },
        { x:  0.106, z: -0.098, rx: 0.034, rz: 0.030, rot: 0.0,  op: 0.52 },
        { x:  0.056, z: -0.095, rx: 0.030, rz: 0.028, rot: 0.0,  op: 0.48 },
        { x: -0.114, z:  0.094, rx: 0.026, rz: 0.024, rot: 0.0,  op: 0.52 },
        { x: -0.072, z:  0.048, rx: 0.032, rz: 0.028, rot: 0.0,  op: 0.56 },
        { x: -0.018, z:  0.036, rx: 0.028, rz: 0.026, rot: 0.0,  op: 0.52 },
        { x:  0.036, z:  0.068, rx: 0.026, rz: 0.024, rot: 0.0,  op: 0.50 },
        { x:  0.106, z:  0.088, rx: 0.025, rz: 0.024, rot: 0.0,  op: 0.50 },
        { x:  0.088, z:  0.015, rx: 0.028, rz: 0.026, rot: 0.0,  op: 0.50 },
      ];

      const aoGeos = [];
      for (const sp of contactSpots) {
        const g = new THREE.PlaneGeometry(sp.rx * 2, sp.rz * 2, 4, 4);
        g.rotateX(-Math.PI / 2);
        g.rotateY(sp.rot);
        const pos = g.getAttribute('position');
        for (let i = 0; i < pos.count; i++) {
          const wx = clamp(pos.getX(i) + sp.x, -HALF_X + 0.002, HALF_X - 0.002);
          const wz = clamp(pos.getZ(i) + sp.z, -HALF_Z + 0.002, HALF_Z - 0.002);
          const wy = getSubstrateHeight(wx, wz) + 0.0012;
          pos.setXYZ(i, wx, wy, wz);
        }
        g.computeVertexNormals();
        aoGeos.push(normalizeForMerge(g, (col) => col.setRGB(sp.op, sp.op, sp.op)));
      }
      const contactShadowMat = new THREE.MeshBasicMaterial({
        map: aoTex,
        vertexColors: true,
        transparent: true,
        opacity: 0.85,
        depthWrite: false,
        polygonOffset: true,
        polygonOffsetFactor: -1,
        polygonOffsetUnits: -2,
      });
      const contactShadowMesh = new THREE.Mesh(mergeGeometries(aoGeos), contactShadowMat);
      contactShadowMesh.renderOrder = 1;
      scene.add(contactShadowMesh);
    }

    // ===== 5e. 泳ぐ魚の真下に落ちる軽い丸影（InstancedMesh 1 描画コールで全 20 匹分） =====
    const FISH_SHADOW_MAX = 24;
    const fishShadowAlphaAttr = new THREE.InstancedBufferAttribute(new Float32Array(FISH_SHADOW_MAX), 1);
    const fishShadowGeo = new THREE.PlaneGeometry(1, 1);
    fishShadowGeo.rotateX(-Math.PI / 2);
    fishShadowGeo.setAttribute('aAlpha', fishShadowAlphaAttr);
    const fishShadowMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      polygonOffset: true,
      polygonOffsetFactor: -2,
      polygonOffsetUnits: -4,
      vertexShader: `
        attribute float aAlpha;
        varying vec2 vUv;
        varying float vAlpha;
        void main() {
          vUv = uv;
          vAlpha = aAlpha;
          gl_Position = projectionMatrix * modelViewMatrix * instanceMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        varying vec2 vUv;
        varying float vAlpha;
        void main() {
          vec2 d = (vUv - 0.5) * 2.0;
          float r2 = dot(d, d);
          if (r2 > 1.0) discard;
          float soft = exp(-r2 * 3.2) * (1.0 - smoothstep(0.65, 1.0, r2));
          gl_FragColor = vec4(0.03, 0.07, 0.10, soft * vAlpha);
        }
      `,
    });
    const fishShadowMesh = new THREE.InstancedMesh(fishShadowGeo, fishShadowMat, FISH_SHADOW_MAX);
    fishShadowMesh.count = 0;
    fishShadowMesh.renderOrder = 2;
    scene.add(fishShadowMesh);
    const _shDummy = new THREE.Object3D();
    const _shUp = new THREE.Vector3(0, 1, 0);
    const _shNorm = new THREE.Vector3();
    const _shSlopeQ = new THREE.Quaternion();
    const _shYawQ = new THREE.Quaternion();
    const _shAxisY = new THREE.Vector3(0, 1, 0);

    function updateFishShadows() {
      const n = Math.min(fishAgents.length, FISH_SHADOW_MAX);
      fishShadowMesh.count = n;
      const eps = 0.008;
      for (let i = 0; i < n; i++) {
        const ag = fishAgents[i];
        const p = ag.actor.object.position;
        // 真上の LED はわずかに (0.05, 0.92, 0.14) に傾くので影をわずかに反対へオフセット
        const subY0 = getSubstrateHeight(p.x, p.z);
        const hRaw = Math.max(0.004, p.y - subY0);
        const sx = clamp(p.x - hRaw * 0.05, -HALF_X + 0.012, HALF_X - 0.012);
        const sz = clamp(p.z - hRaw * 0.10, -HALF_Z + 0.012, HALF_Z - 0.012);
        const subY = getSubstrateHeight(sx, sz);
        const h = Math.max(0.004, p.y - subY);

        // 底砂の法線に合わせて楕円影を傾ける
        const dhdx = (getSubstrateHeight(sx + eps, sz) - getSubstrateHeight(sx - eps, sz)) / (2 * eps);
        const dhdz = (getSubstrateHeight(sx, sz + eps) - getSubstrateHeight(sx, sz - eps)) / (2 * eps);
        _shNorm.set(-dhdx, 1.0, -dhdz).normalize();
        _shSlopeQ.setFromUnitVectors(_shUp, _shNorm);
        _shYawQ.setFromAxisAngle(_shAxisY, ag.yaw);

        const spread = 1.0 + clamp(h / 0.20, 0, 1.2) * 0.90;
        const lenShadow = ag.actor.length * 1.24 * spread;
        const widShadow = ag.actor.length * 0.46 * spread;
        const alpha = clamp(0.66 * Math.exp(-h * 3.0) + 0.16, 0.16, 0.68);

        _shDummy.position.set(sx, subY + 0.0017, sz);
        _shDummy.quaternion.copy(_shSlopeQ).multiply(_shYawQ);
        _shDummy.scale.set(widShadow, 1, lenShadow);
        _shDummy.updateMatrix();
        fishShadowMesh.setMatrixAt(i, _shDummy.matrix);
        fishShadowAlphaAttr.setX(i, alpha);
      }
      fishShadowMesh.instanceMatrix.needsUpdate = true;
      fishShadowAlphaAttr.needsUpdate = true;
    }

    // ===== 6. 演出：光学水面（LEDキラキラ・エアストーン波紋・見上げ全反射）・光の筋・光学泡・浮遊微粒子 =====
    // 6a. 水面（波勾配法線・LED鏡面反射・エアストーン同心円波紋・水面裏の全反射）
    {
      const waterGeo = new THREE.PlaneGeometry(INNER_W - 0.002, INNER_D - 0.002, 40, 40);
      waterGeo.rotateX(-Math.PI / 2);
      const WATER_WAVE_GLSL = `
        uniform vec4 uTapRipple;
        float waterHeight(vec2 xz, float t) {
          float w = sin(xz.x * 38.0 + t * 1.85) * 0.00095
                  + cos(xz.y * 33.0 - t * 2.10) * 0.00085
                  + sin((xz.x - xz.y) * 48.0 + t * 2.75) * 0.00048
                  + cos((xz.x * 0.8 + xz.y * 1.2) * 74.0 - t * 3.30) * 0.00024;
          // 右奥エアストーン (0.088, -0.072) から水面へ広がる同心円の波紋
          vec2 dAir = xz - vec2(0.088, -0.072);
          float rAir = length(dAir);
          float rip1 = sin(rAir * 145.0 - t * 6.6) * exp(-rAir * 13.5) * 0.00072;
          float rip2 = sin(rAir * 225.0 - t * 9.8 + 1.5) * exp(-rAir * 19.0) * 0.00038;
          // ガラスを軽くタップした時の小さな水面振動波紋
          float dtTap = t - uTapRipple.z;
          float tapRip = 0.0;
          if (dtTap > 0.0 && dtTap < 2.4 && uTapRipple.w > 0.01) {
            float rTap = length(xz - uTapRipple.xy);
            float waveFront = dtTap * 0.24;
            float env = exp(-dtTap * 1.9) * exp(-pow((rTap - waveFront) * 18.0, 2.0));
            tapRip = sin((rTap - waveFront) * 160.0) * env * 0.0012 * uTapRipple.w;
          }
          return w + rip1 + rip2 + tapRip;
        }
      `;
      const waterMat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: envUniforms.uTime,
          uNightMix: envUniforms.uNightMix,
          uTapRipple: envUniforms.uTapRipple,
        },
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
        vertexShader: `
          uniform float uTime;
          varying vec2 vUv;
          varying vec3 vWorldPos;
          ${WATER_WAVE_GLSL}
          void main() {
            vUv = uv;
            vec3 p = position;
            p.y += waterHeight(p.xz, uTime);
            vec4 wp = modelMatrix * vec4(p, 1.0);
            vWorldPos = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          uniform float uTime;
          uniform float uNightMix;
          varying vec2 vUv;
          varying vec3 vWorldPos;
          ${WATER_WAVE_GLSL}
          void main() {
            // ピクセル単位で波の勾配から精密な水面法線を算出
            float eps = 0.0014;
            vec2 xz = vWorldPos.xz;
            float hC = waterHeight(xz, uTime);
            float dhdx = (waterHeight(xz + vec2(eps, 0.0), uTime) - hC) / eps;
            float dhdz = (waterHeight(xz + vec2(0.0, eps), uTime) - hC) / eps;
            vec3 N = normalize(vec3(-dhdx * 1.45, 1.0, -dhdz * 1.45));
            vec3 V = normalize(cameraPosition - vWorldPos);

            // ガラス内壁に接するメニスカス（表面張力の細い光線）
            float edgeDist = min(min(vUv.x, 1.0 - vUv.x), min(vUv.y, 1.0 - vUv.y));
            float meniscus = smoothstep(0.036, 0.0, edgeDist);
            float meniscusLine = smoothstep(0.012, 0.0, edgeDist);

            // エアストーン直上の泡はじけ白リング
            float rAir = length(xz - vec2(0.088, -0.072));
            float airRing = smoothstep(0.018, 0.002, abs(rAir - 0.009 - 0.005 * fract(uTime * 1.35))) * 0.45
                          + exp(-rAir * rAir * 3200.0) * 0.35;

            // 真上の LED バー (x: -0.095..0.095, y: +0.201, z: -0.011..0.021) への面積光っぽい鏡面反射
            vec3 ledClosest = vec3(clamp(xz.x, -0.095, 0.095), ${(HALF_Y + 0.051).toFixed(4)}, clamp(xz.y, -0.011, 0.021));
            vec3 L = normalize(ledClosest - vWorldPos);

            if (gl_FrontFacing) {
              // 上面から見下ろした水面：フレネル反射＋さざ波のLEDキラキラ＋波紋ハイライト
              float ndotv = clamp(dot(N, V), 0.0, 1.0);
              float fresnel = 0.05 + 0.95 * pow(1.0 - ndotv, 3.2);
              vec3 H = normalize(L + V);
              float ndoth = max(dot(N, H), 0.0);
              float ledSparkle = pow(ndoth, 110.0) * 1.65 + pow(ndoth, 24.0) * 0.34;
              // さざ波とエアストーン波紋の細かなエッジ光
              float slopeMag = clamp(length(vec2(dhdx, dhdz)) * 3.8, 0.0, 1.0);
              float rippleGlint = pow(slopeMag, 1.8) * 0.32 * exp(-rAir * 7.5);

              vec3 baseCol = mix(vec3(0.56, 0.84, 0.92), vec3(0.16, 0.46, 0.62), uNightMix);
              vec3 reflCol = mix(vec3(0.92, 0.98, 1.0), vec3(0.64, 0.92, 1.0), uNightMix);
              vec3 col = mix(baseCol, reflCol, clamp(fresnel * 0.85 + meniscus * 0.4, 0.0, 1.0));
              col += vec3(1.0, 1.0, 1.0) * (ledSparkle + rippleGlint + airRing * 0.48 + meniscusLine * 0.55);

              float alpha = clamp(
                0.11 + fresnel * 0.42 + ledSparkle * 0.58 + rippleGlint * 0.35 + airRing * 0.36 + meniscus * 0.28 + meniscusLine * 0.26,
                0.0, 0.86
              );
              gl_FragColor = vec4(col, alpha);
            } else {
              // 下から見上げた水面の裏側：スネルの窓外で鏡のように明るく輝く全反射（TIR）
              vec3 Ndown = -N;
              float ndotv = clamp(dot(Ndown, V), 0.0, 1.0);
              // 水→空気の臨界角 cos(48.6°) ≈ 0.66。浅い角度ほど銀青の液体ミラーになる
              float tir = smoothstep(0.76, 0.28, ndotv);
              float waveShimmer = 0.5 + 0.5 * sin(xz.x * 46.0 + xz.y * 34.0 + uTime * 2.4 + hC * 900.0);
              float slopeFlash = clamp(length(vec2(dhdx, dhdz)) * 4.5, 0.0, 1.0);

              // スネルの窓の内側では真上のLEDの光が透けて見える
              float snellLed = (1.0 - tir) * exp(-pow(xz.x * 7.5, 2.0) - pow((xz.y - 0.005) * 14.0, 2.0));
              vec3 mirrorDay = mix(vec3(0.68, 0.90, 0.96), vec3(0.95, 1.0, 1.0), clamp(0.45 + waveShimmer * 0.35 + slopeFlash * 0.35, 0.0, 1.0));
              vec3 mirrorNight = mix(vec3(0.18, 0.58, 0.76), vec3(0.76, 0.96, 1.0), clamp(0.35 + waveShimmer * 0.38 + slopeFlash * 0.42, 0.0, 1.0));
              vec3 mirrorCol = mix(mirrorDay, mirrorNight, uNightMix);
              vec3 col = mirrorCol + vec3(0.95, 1.0, 1.0) * (snellLed * 0.85 + slopeFlash * tir * 0.48 + airRing * 0.45 + meniscusLine * 0.45);
              float alpha = clamp(
                0.22 + tir * (0.56 + 0.16 * waveShimmer) + snellLed * 0.38 + slopeFlash * 0.22 + airRing * 0.32 + meniscus * 0.26,
                0.0, 0.90
              );
              gl_FragColor = vec4(col, alpha);
            }
          }
        `,
      });
      const waterSurface = new THREE.Mesh(waterGeo, waterMat);
      waterSurface.position.y = WATER_Y;
      waterSurface.renderOrder = 4;
      scene.add(waterSurface);
    }

    // 6b. 水中の柔らかい光の筋（3枚の薄い光幕を結合して 1 描画コール）
    const lightRayUniforms = {
      uTime: envUniforms.uTime,
      uRayStrength: envUniforms.uRayStrength,
    };
    {
      const rayConfigs = [
        { x: -0.05, z: -0.01, w: 0.085, h: 0.21, rotY: 0.22, tiltZ: -0.10 },
        { x:  0.02, z:  0.01, w: 0.095, h: 0.22, rotY: -0.18, tiltZ: -0.08 },
        { x:  0.07, z: -0.03, w: 0.075, h: 0.20, rotY: 0.35, tiltZ: -0.12 },
      ];
      const rayGeos = [];
      for (const rc of rayConfigs) {
        const g = new THREE.PlaneGeometry(rc.w, rc.h, 1, 1);
        g.rotateZ(rc.tiltZ);
        g.rotateY(rc.rotY);
        g.translate(rc.x, WATER_Y - rc.h * 0.52, rc.z);
        rayGeos.push(normalizeForMerge(g));
      }
      const rayMat = new THREE.ShaderMaterial({
        uniforms: lightRayUniforms,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide,
        vertexShader: `
          varying vec2 vUv;
          varying vec3 vPos;
          void main() {
            vUv = uv;
            vPos = position;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform float uTime;
          uniform float uRayStrength;
          varying vec2 vUv;
          varying vec3 vPos;
          void main() {
            float horiz = sin(vUv.x * 3.14159265);
            float vert = smoothstep(0.0, 0.65, vUv.y) * smoothstep(1.0, 0.85, vUv.y);
            float shimmer = 0.72 + 0.28 * sin(uTime * 0.9 + vPos.x * 24.0 + vUv.x * 5.0);
            float a = horiz * horiz * vert * shimmer * uRayStrength;
            gl_FragColor = vec4(0.76, 0.96, 1.0, a);
          }
        `,
      });
      const rays = new THREE.Mesh(mergeGeometries(rayGeos), rayMat);
      rays.renderOrder = 3;
      scene.add(rays);
    }

    // 6c. 小さな泡（InstancedMesh 1 描画コール・フチがキラッと光り中心が透ける光学気泡）
    const BUBBLE_COUNT = 34;
    const bubbleGeo = new THREE.SphereGeometry(1, 12, 10);
    const bubbleMat = new THREE.ShaderMaterial({
      uniforms: {
        uNightMix: envUniforms.uNightMix,
      },
      transparent: true,
      depthWrite: false,
      vertexShader: `
        varying vec3 vWorldPos;
        varying vec3 vWorldNorm;
        void main() {
          vec4 localP = vec4(position, 1.0);
          #ifdef USE_INSTANCING
            localP = instanceMatrix * localP;
            vec3 localN = mat3(instanceMatrix) * normal;
          #else
            vec3 localN = normal;
          #endif
          vec4 wp = modelMatrix * localP;
          vWorldPos = wp.xyz;
          vWorldNorm = normalize(mat3(modelMatrix) * localN);
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: `
        uniform float uNightMix;
        varying vec3 vWorldPos;
        varying vec3 vWorldNorm;
        void main() {
          vec3 N = normalize(vWorldNorm);
          vec3 V = normalize(cameraPosition - vWorldPos);
          float ndotv = clamp(abs(dot(N, V)), 0.0, 1.0);
          // 中心は透き通り、フチ（全反射リング）だけが白くキラッと光る本物の気泡表現
          float rim = pow(1.0 - ndotv, 1.95);
          vec3 L = normalize(vec3(0.08, 0.96, 0.22));
          vec3 H = normalize(L + V);
          float spec = pow(max(dot(N, H), 0.0), 42.0);
          // 下側の淡い水色屈折ハイライト
          float bottomGlow = pow(max(-N.y, 0.0), 2.2) * (1.0 - ndotv) * 0.45;
          vec3 rimCol = mix(vec3(0.88, 0.98, 1.0), vec3(0.76, 0.96, 1.0), uNightMix);
          vec3 col = rimCol * (0.72 + rim * 0.35) + vec3(0.55, 0.90, 1.0) * bottomGlow + vec3(1.0) * spec * 1.15;
          float alpha = clamp(0.04 + rim * 0.82 + spec * 0.92 + bottomGlow * 0.35, 0.0, 0.95);
          gl_FragColor = vec4(col, alpha);
        }
      `,
    });
    const bubbleMesh = new THREE.InstancedMesh(bubbleGeo, bubbleMat, BUBBLE_COUNT);
    bubbleMesh.renderOrder = 5;
    scene.add(bubbleMesh);

    const bubbleDummy = new THREE.Object3D();
    const bubbles = [];
    {
      const rand = makePrng(77721);
      for (let i = 0; i < BUBBLE_COUNT; i++) {
        const fromStone = i < 24;
        const ox = fromStone ? 0.088 + (rand() - 0.5) * 0.012 : (rand() - 0.5) * 0.22;
        const oz = fromStone ? -0.072 + (rand() - 0.5) * 0.012 : (rand() - 0.5) * 0.20;
        const minY = getSubstrateHeight(ox, oz) + 0.010;
        bubbles.push({
          fromStone,
          ox,
          oz,
          y: minY + rand() * (WATER_Y - 0.006 - minY),
          minY,
          speed: 0.032 + rand() * 0.036,
          radius: fromStone ? 0.0014 + rand() * 0.0020 : 0.0011 + rand() * 0.0015,
          phase: rand() * Math.PI * 2,
          wobble: 0.0025 + rand() * 0.0040,
        });
      }
    }

    function updateBubbles(dt, t) {
      for (let i = 0; i < BUBBLE_COUNT; i++) {
        const b = bubbles[i];
        b.y += b.speed * dt;
        if (b.y > WATER_Y - 0.004) {
          b.y = b.minY;
          if (!b.fromStone) {
            b.ox = (Math.random() - 0.5) * 0.22;
            b.oz = (Math.random() - 0.5) * 0.20;
            b.minY = getSubstrateHeight(b.ox, b.oz) + 0.010;
            b.y = b.minY;
          }
        }
        const bx = clamp(b.ox + Math.sin(t * 2.8 + b.phase + b.y * 28.0) * b.wobble, -0.143, 0.143);
        const bz = clamp(b.oz + Math.cos(t * 2.4 + b.phase * 1.3 + b.y * 24.0) * b.wobble, -0.143, 0.143);
        const grow = 1.0 + ((b.y - b.minY) / 0.22) * 0.35;
        bubbleDummy.position.set(bx, b.y, bz);
        bubbleDummy.scale.setScalar(b.radius * grow);
        bubbleDummy.updateMatrix();
        bubbleMesh.setMatrixAt(i, bubbleDummy.matrix);
      }
      bubbleMesh.instanceMatrix.needsUpdate = true;
    }

    // 6d. 水中に漂う微細な酸素の粒（立体視の奥行き手がかりにもなる）
    const moteCount = 55;
    const motePos = new Float32Array(moteCount * 3);
    const motePhase = new Float32Array(moteCount);
    {
      const rand = makePrng(40499);
      for (let i = 0; i < moteCount; i++) {
        motePos[i * 3]     = (rand() - 0.5) * 0.26;
        motePos[i * 3 + 1] = -0.075 + rand() * 0.19;
        motePos[i * 3 + 2] = (rand() - 0.5) * 0.26;
        motePhase[i] = rand() * Math.PI * 2;
      }
    }
    const moteGeo = new THREE.BufferGeometry();
    moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
    const moteMat = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.0022,
      transparent: true,
      opacity: 0.42,
      depthWrite: false,
    });
    const motePoints = new THREE.Points(moteGeo, moteMat);
    scene.add(motePoints);

    function updateMotes(dt, t) {
      const attr = moteGeo.getAttribute('position');
      for (let i = 0; i < moteCount; i++) {
        const ph = motePhase[i];
        let x = attr.getX(i) + (0.0045 + 0.0025 * Math.sin(t * 0.7 + ph)) * dt;
        let y = attr.getY(i) + Math.sin(t * 0.9 + ph * 1.4) * 0.003 * dt;
        let z = attr.getZ(i) + Math.cos(t * 0.6 + ph * 1.1) * 0.003 * dt;
        if (x > 0.138) x = -0.138;
        if (z > 0.138) z = -0.138;
        if (z < -0.138) z = 0.138;
        y = clamp(y, -0.082, WATER_Y - 0.008);
        attr.setXYZ(i, x, y, z);
      }
      attr.needsUpdate = true;
    }

    // ===== 7. リムレスガラス水槽本体（光学フレネル反射ガラス＋4mm 淡緑切り口エッジ） =====
    {
      const outerW = INNER_W + GLASS_T * 2;
      const outerD = INNER_D + GLASS_T * 2;

      // 7a. 光学フレネルガラス面（正面からは透明、斜めほど白く反射＋緩やかな環境ハイライト帯）
      const paneGeos = [];
      const addGlassFace = (w, h, rx, ry, x, y, z) => {
        const g = new THREE.PlaneGeometry(w, h, 1, 1);
        if (rx) g.rotateX(rx);
        if (ry) g.rotateY(ry);
        g.translate(x, y, z);
        paneGeos.push(normalizeForMerge(g));
      };
      addGlassFace(outerW, INNER_H, 0, 0, 0, 0, HALF_Z + GLASS_T);                   // 前面
      addGlassFace(outerW, INNER_H, 0, Math.PI, 0, 0, -HALF_Z - GLASS_T);           // 背面
      addGlassFace(outerD, INNER_H, 0, -Math.PI / 2, -HALF_X - GLASS_T, 0, 0);      // 左面
      addGlassFace(outerD, INNER_H, 0,  Math.PI / 2,  HALF_X + GLASS_T, 0, 0);      // 右面

      const glassMat = new THREE.ShaderMaterial({
        uniforms: {
          uNightMix: envUniforms.uNightMix,
        },
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
        vertexShader: `
          varying vec2 vUv;
          varying vec3 vWorldPos;
          varying vec3 vWorldNorm;
          void main() {
            vUv = uv;
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPos = wp.xyz;
            vWorldNorm = normalize(mat3(modelMatrix) * normal);
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          uniform float uNightMix;
          varying vec2 vUv;
          varying vec3 vWorldPos;
          varying vec3 vWorldNorm;
          void main() {
            vec3 N = normalize(vWorldNorm);
            vec3 V = normalize(cameraPosition - vWorldPos);
            float ndotv = clamp(abs(dot(N, V)), 0.0, 1.0);
            // 正面からはほぼ無色透明、斜めから見た面ほど白く反射するシュリック・フレネル
            float fresnel = pow(1.0 - ndotv, 3.1);
            vec3 Nface = dot(N, V) >= 0.0 ? N : -N;
            vec3 R = reflect(-V, Nface);

            // 室内窓・LED の柔らかい斜め反射帯（顔を動かすとガラス表面を滑る）
            float sheen1 = exp(-pow((R.x * 1.6 + R.y * 0.7 - 0.55) * 4.2, 2.0)) * 0.24;
            float sheen2 = exp(-pow((R.x * 1.4 - R.y * 0.5 + 0.72) * 6.5, 2.0)) * 0.14;
            float topLedSheen = smoothstep(0.68, 1.0, vUv.y) * exp(-pow((vUv.x - 0.5) * 2.4, 2.0)) * 0.12;
            float sheen = (sheen1 + sheen2) * (0.45 + 0.55 * fresnel) + topLedSheen;

            // ガラス板同士が合わさる四隅 3mm のごく繊細な屈折エッジ感（線画ではなく光学の厚み）
            float sideEdge = smoothstep(0.018, 0.0, min(vUv.x, 1.0 - vUv.x));
            float botEdge = smoothstep(0.014, 0.0, vUv.y);
            float seam = max(sideEdge, botEdge * 0.55);

            vec3 dayRefl = mix(vec3(0.84, 0.94, 0.98), vec3(0.98, 1.0, 1.0), clamp(fresnel + sheen, 0.0, 1.0));
            vec3 nightRefl = mix(vec3(0.28, 0.62, 0.78), vec3(0.76, 0.94, 1.0), clamp(fresnel * 0.85 + sheen * 1.1, 0.0, 1.0));
            vec3 col = mix(dayRefl, nightRefl, uNightMix);
            // ガラス角の微かな青緑フロートガラス色味
            col = mix(col, mix(vec3(0.46, 0.80, 0.76), vec3(0.36, 0.78, 0.74), uNightMix), seam * 0.65);

            float baseClear = mix(0.014, 0.018, uNightMix);
            float reflAlpha = fresnel * mix(0.36, 0.28, uNightMix) + sheen * mix(0.48, 0.36, uNightMix);
            float seamAlpha = seam * mix(0.22, 0.24, uNightMix);
            float alpha = clamp(baseClear + reflAlpha + seamAlpha, 0.0, 0.52);
            gl_FragColor = vec4(col, alpha);
          }
        `,
      });
      const glassMesh = new THREE.Mesh(mergeGeometries(paneGeos), glassMat);
      glassMesh.renderOrder = 6;
      scene.add(glassMesh);

      // 7b. ガラスの 4mm 切り口（上面の縁と四隅縦エッジが淡い青緑に光るフロートガラス表現）
      const cutParts = [];
      const addCutBox = (w, h, d, x, y, z) => {
        const g = new THREE.BoxGeometry(w, h, d);
        g.translate(x, y, z);
        cutParts.push(normalizeForMerge(g));
      };
      const rimH = 0.0024;
      // 上面 4 辺の 4mm 切り口
      addCutBox(outerW, rimH, GLASS_T, 0, HALF_Y - rimH * 0.5,  HALF_Z + GLASS_T * 0.5);
      addCutBox(outerW, rimH, GLASS_T, 0, HALF_Y - rimH * 0.5, -HALF_Z - GLASS_T * 0.5);
      addCutBox(GLASS_T, rimH, INNER_D, -HALF_X - GLASS_T * 0.5, HALF_Y - rimH * 0.5, 0);
      addCutBox(GLASS_T, rimH, INNER_D,  HALF_X + GLASS_T * 0.5, HALF_Y - rimH * 0.5, 0);
      // 4 本の縦コーナー切り口（前面ガラスの左右小口 4mm の繊細な内部導光）
      for (const sx of [-1, 1]) {
        for (const sz of [-1, 1]) {
          addCutBox(
            GLASS_T * 0.56,
            INNER_H - rimH,
            GLASS_T * 0.56,
            sx * (HALF_X + GLASS_T * 0.5),
            -rimH * 0.5,
            sz * (HALF_Z + GLASS_T * 0.5)
          );
        }
      }
      const glassEdgeMat = new THREE.ShaderMaterial({
        uniforms: {
          uNightMix: envUniforms.uNightMix,
        },
        transparent: true,
        depthWrite: false,
        vertexShader: `
          varying vec3 vWorldPos;
          varying vec3 vWorldNorm;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPos = wp.xyz;
            vWorldNorm = normalize(mat3(modelMatrix) * normal);
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          uniform float uNightMix;
          varying vec3 vWorldPos;
          varying vec3 vWorldNorm;
          void main() {
            vec3 N = normalize(vWorldNorm);
            vec3 V = normalize(cameraPosition - vWorldPos);
            float isTopRim = smoothstep(${(HALF_Y - 0.006).toFixed(4)}, ${(HALF_Y - 0.001).toFixed(4)}, vWorldPos.y);
            // LED 真下に近い切り口ほど内部導光で淡いエメラルドグリーンに美しく光る
            float ledGlow = exp(-vWorldPos.x * vWorldPos.x * 22.0) * (0.55 + 0.45 * isTopRim);
            float rimSpec = pow(1.0 - clamp(abs(dot(N, V)), 0.0, 1.0), 1.8);
            vec3 jadeDay = vec3(0.36, 0.74, 0.68);
            vec3 jadeNight = vec3(0.42, 0.92, 0.84);
            vec3 col = mix(jadeDay, jadeNight, uNightMix);
            col += vec3(0.30, 0.44, 0.40) * (ledGlow * (0.50 + 0.55 * uNightMix) + rimSpec * 0.35);
            // 上面 4mm 切り口は上品にくっきり、縦コーナーは控えめなガラス小口として存在感を出す
            float topAlpha = mix(0.38, 0.46, uNightMix) + ledGlow * 0.24 + rimSpec * 0.16;
            float cornerAlpha = (mix(0.10, 0.15, uNightMix) + rimSpec * 0.13) * (0.75 + 0.25 * smoothstep(-0.15, 0.15, vWorldPos.y));
            float alpha = clamp(mix(cornerAlpha, topAlpha, isTopRim), 0.0, 0.78);
            gl_FragColor = vec4(col, alpha);
          }
        `,
      });
      const glassEdgeMesh = new THREE.Mesh(mergeGeometries(cutParts), glassEdgeMat);
      glassEdgeMesh.renderOrder = 7;
      scene.add(glassEdgeMesh);
    }

    // ===== 8. 小魚（nachat_dayo CC0 fish-kit を使用・計 20 匹・種別生態＆見る人への反応） =====
    const FISH_ROSTER = [
      // カタクチイワシ 9 匹（3cm 前後の小ぶりサイズで向きを揃え一斉ターンする銀の群れ）
      { species: 'katakuchi', count: 9, lenMin: 2.8, lenMax: 3.3, yMin: 0.004, yMax: 0.095, speed: 0.056, turnMax: 3.4, school: true },
      // イサキ幼魚 5 匹（中層を軽やかに巡回し、顔を近づけると手前へ寄って目を向ける）
      { species: 'isaki_young', count: 5, lenMin: 3.8, lenMax: 4.4, yMin: -0.032, yMax: 0.068, speed: 0.044, turnMax: 2.2, school: false, curious: true },
      // アジ 3 匹（中〜上層をゆったり連れ立って回遊）
      { species: 'aji', count: 3, lenMin: 4.3, lenMax: 4.9, yMin: 0.002, yMax: 0.086, speed: 0.056, turnMax: 2.2, school: false, looseSchool: true },
      // メバル 2 匹（岩陰・流木そばでホバリングし、顔接近で手前へ寄って視線を向ける）
      { species: 'mebaru', count: 2, lenMin: 4.2, lenMax: 4.7, yMin: -0.066, yMax: 0.008, speed: 0.028, turnMax: 1.9, school: false, nearRock: true, canHover: true, curious: true },
      // カサゴ 1 匹（底砂・岩陰でじっと休み、近づくとそっと目を向ける）
      { species: 'kasago', count: 1, lenMin: 4.4, lenMax: 4.4, yMin: -0.094, yMax: -0.048, speed: 0.022, turnMax: 1.7, school: false, nearRock: true, canRest: true, curious: true },
    ];

    // 岩陰・流木そばの自然なホバリング／休息ポイント
    const MEBARU_SPOTS = [
      new THREE.Vector3(-0.026, -0.038,  0.022), // 親石と流木アーチの陰
      new THREE.Vector3( 0.048, -0.034,  0.006), // 右奥副石のそば
      new THREE.Vector3(-0.064, -0.046,  0.046), // 左手前添石の陰
      new THREE.Vector3( 0.016, -0.024,  0.044), // 流木右枝の下
    ];
    const KASAGO_SPOTS = [
      new THREE.Vector3(-0.024, -0.095,  0.048), // 親石の手前砂利際
      new THREE.Vector3( 0.048, -0.092,  0.032), // 右副石の足元
      new THREE.Vector3(-0.066, -0.096,  0.062), // 左手前石のそば
    ];

    const fishAgents = [];
    const _fwd = new THREE.Vector3();
    const _steerGoal = new THREE.Vector3();
    const _centerTmp = new THREE.Vector3();
    const _schoolCenter = new THREE.Vector3(-0.035, 0.056, 0.012);
    const _schoolGoal = new THREE.Vector3(0.068, 0.062, -0.032);
    let schoolYaw = Math.atan2(_schoolGoal.x - _schoolCenter.x, _schoolGoal.z - _schoolCenter.z);
    let schoolGoalTimer = 3.2;
    let schoolSpeedBoost = 0;

    // 見る人への反応（顔接近の注目・急な動きやタップでのビクッ反応）状態
    const fishReaction = {
      viewerProximity: 0,
      startleCount: 0,
      lastStartleReason: null,
      lastStartleTime: -10,
      lastHeadStartleTime: -10,
      lastTapStartleTime: -10,
      prevHeadValid: false,
      prevHeadX: 0,
      prevHeadY: 0,
      prevHeadZ: 0,
    };

    function computeFishLimits(lengthM) {
      const halfL = lengthM * 0.55;
      const gap = 0.009;
      return {
        limX: Math.max(0.05, HALF_X - halfL - gap),
        limZ: Math.max(0.05, HALF_Z - halfL - gap),
        bodyHalfY: lengthM * 0.24,
        maxY: WATER_Y - lengthM * 0.24 - 0.009,
      };
    }

    function pickFishWaypoint(cfg, lim) {
      const margin = 0.016;
      const rx = Math.max(0.03, lim.limX - margin);
      const rz = Math.max(0.03, lim.limZ - margin);
      let x, z;
      if (cfg.nearRock) {
        x = clamp((Math.random() - 0.5) * rx * 1.75, -rx, rx);
        z = clamp(-0.005 + (Math.random() - 0.5) * rz * 1.55, -rz, rz);
      } else {
        x = (Math.random() * 2 - 1) * rx;
        z = (Math.random() * 2 - 1) * rz;
      }
      const floorY = Math.max(-HALF_Y + 0.036, getSubstrateHeight(x, z) + lim.bodyHalfY + 0.007);
      const loY = Math.max(cfg.yMin, floorY);
      const hiY = Math.max(loY + 0.005, Math.min(cfg.yMax, lim.maxY));
      const y = loY + Math.random() * (hiY - loY);
      return new THREE.Vector3(x, y, z);
    }

    function pickRockSpot(spots, lim, currentIdx) {
      let idx = Math.floor(Math.random() * spots.length);
      if (spots.length > 1 && idx === currentIdx) idx = (idx + 1) % spots.length;
      const s = spots[idx].clone();
      s.x = clamp(s.x + (Math.random() - 0.5) * 0.016, -lim.limX + 0.014, lim.limX - 0.014);
      s.z = clamp(s.z + (Math.random() - 0.5) * 0.016, -lim.limZ + 0.014, lim.limZ - 0.014);
      const subY = getSubstrateHeight(s.x, s.z);
      s.y = clamp(Math.max(s.y, subY + lim.bodyHalfY + 0.007), -HALF_Y + 0.034, lim.maxY);
      return { spot: s, idx };
    }

    // 顔の急な動きや画面タップ（ガラスを軽く叩く）で群れがビクッと反応
    function triggerFishStartle(origin, intensity = 1.0, reason = 'tap') {
      const now = simTime;
      if (reason === 'head' && now - fishReaction.lastHeadStartleTime < 0.85) return false;
      if (reason === 'tap' && now - fishReaction.lastTapStartleTime < 0.28) return false;
      if (reason === 'head') fishReaction.lastHeadStartleTime = now;
      else fishReaction.lastTapStartleTime = now;

      fishReaction.startleCount++;
      fishReaction.lastStartleReason = reason;
      fishReaction.lastStartleTime = now;

      const ox = clamp(origin ? origin.x : 0, -0.13, 0.13);
      const oy = clamp(origin ? origin.y : 0.02, -0.08, 0.10);
      const oz = clamp(origin ? origin.z : HALF_Z, -0.13, HALF_Z);

      // 水面にもタップ／振動の小さな同心円波紋を伝える
      envUniforms.uTapRipple.value.set(ox, clamp(oz, -0.13, 0.13), now, reason === 'tap' ? 1.0 : 0.55);

      // カタクチイワシ群れ全体が一斉に反対方向へビクッと鋭くターンして逃げる
      let escX = _schoolCenter.x - ox;
      let escZ = _schoolCenter.z - oz;
      if (Math.hypot(escX, escZ) < 0.03) {
        escX = _schoolCenter.x >= 0 ? -0.10 : 0.10;
        escZ = -0.09;
      }
      const escYaw = Math.atan2(escX, escZ) + (Math.random() - 0.5) * 0.35;
      _schoolGoal.set(
        clamp(_schoolCenter.x + Math.sin(escYaw) * 0.13, -0.088, 0.088),
        clamp(0.038 + Math.random() * 0.048, 0.018, 0.090),
        clamp(_schoolCenter.z + Math.cos(escYaw) * 0.13, -0.088, 0.082)
      );
      schoolYaw = wrapAngle(Math.atan2(_schoolGoal.x - _schoolCenter.x, _schoolGoal.z - _schoolCenter.z));
      schoolGoalTimer = 2.0;
      schoolSpeedBoost = clamp(1.0 * intensity, 0.65, 1.35);

      for (let i = 0; i < fishAgents.length; i++) {
        const ag = fishAgents[i];
        const pos = ag.actor.object.position;
        if (ag.cfg.school) {
          ag.startleTimer = 1.15 + Math.random() * 0.30;
          ag.startleYaw = wrapAngle(schoolYaw + (Math.random() - 0.5) * 0.22);
          ag.behavior = 'swim';
          ag.lookAtAmount = 0;
          ag.actor.setMotion('power');
        } else if (ag.cfg.looseSchool || ag.species === 'isaki_young') {
          const awayYaw = Math.atan2(pos.x - ox + (Math.random() - 0.5) * 0.05, pos.z - oz - 0.05);
          ag.startleTimer = 0.72 + Math.random() * 0.28;
          ag.startleYaw = wrapAngle(awayYaw);
          ag.waypoint.set(
            clamp(pos.x + Math.sin(awayYaw) * 0.10, -ag.lim.limX + 0.015, ag.lim.limX - 0.015),
            clamp(pos.y + (Math.random() - 0.4) * 0.03, ag.cfg.yMin, ag.lim.maxY),
            clamp(pos.z + Math.cos(awayYaw) * 0.10, -ag.lim.limZ + 0.015, ag.lim.limZ - 0.015)
          );
          ag.lookAtAmount = 0;
          ag.actor.setMotion('power');
        } else {
          // メバル・カサゴは驚いて少し岩陰側へ身を引く
          ag.startleTimer = 0.52 + Math.random() * 0.20;
          ag.startleYaw = wrapAngle(Math.atan2(-ox * 0.5 - pos.x, -0.04 - pos.z));
          ag.behavior = 'swim';
          ag.behaviorTimer = 1.6 + Math.random() * 1.4;
          ag.lookAtAmount = 0;
          ag.actor.setMotion('swim');
        }
      }
      return true;
    }

    function updateHeadStartle(dt) {
      if (currentMode !== 'headtrack') {
        fishReaction.prevHeadValid = false;
        return;
      }
      const ex = ht.eyeX;
      const ey = ht.eyeY;
      const ez = ht.eyeZ;
      if (fishReaction.prevHeadValid) {
        const dx = ex - fishReaction.prevHeadX;
        const dy = ey - fishReaction.prevHeadY;
        const dz = ez - fishReaction.prevHeadZ;
        const stepDist = Math.hypot(dx, dy, dz * 1.25);
        const speed = stepDist / Math.max(dt, 0.016);
        if (stepDist > 0.135 || speed > 0.92) {
          const origin = new THREE.Vector3(
            clamp(ex * 0.48, -0.12, 0.12),
            clamp(ey * 0.35, -0.05, 0.08),
            HALF_Z
          );
          triggerFishStartle(origin, clamp(Math.max(stepDist * 5.0, speed * 0.85), 0.75, 1.3), 'head');
        }
      }
      fishReaction.prevHeadX = ex;
      fishReaction.prevHeadY = ey;
      fishReaction.prevHeadZ = ez;
      fishReaction.prevHeadValid = true;
    }

    function computeViewerProximity() {
      if (currentMode === 'headtrack') {
        const relZ = camera.position.z - WIN_Z;
        const proxZ = clamp((0.50 - relZ) / 0.22, 0, 1);
        const proxScale = clamp((ht.scaleRatio - 1.15) / 0.55, 0, 1);
        return Math.max(proxZ, proxScale);
      }
      const dist = camera.position.distanceTo(_centerTmp.set(0, 0, HALF_Z));
      return clamp((0.56 - dist) / 0.22, 0, 1);
    }

    function updateFishAgents(dt, t) {
      // 1. 見る人の顔が水槽に近づいている度合い（0〜1）
      const targetProx = computeViewerProximity();
      fishReaction.viewerProximity += (targetProx - fishReaction.viewerProximity) * Math.min(1, dt * 4.5);

      // 2. カタクチイワシ群れリーダーの滑らかな一斉ターン軌道
      schoolSpeedBoost = Math.max(0, schoolSpeedBoost - dt * 0.95);
      schoolGoalTimer -= dt;
      const distSchoolGoal = _schoolCenter.distanceTo(_schoolGoal);
      if (schoolGoalTimer <= 0 || distSchoolGoal < 0.032) {
        // 水槽内の別コーナーへしっかり向きを変えて一斉ターンを見せる
        const nextAngle = Math.atan2(_schoolCenter.x, _schoolCenter.z) + (Math.random() > 0.5 ? 1 : -1) * (1.35 + Math.random() * 1.15);
        const r = 0.055 + Math.random() * 0.038;
        _schoolGoal.set(
          clamp(Math.sin(nextAngle) * r, -0.088, 0.088),
          0.022 + Math.random() * 0.062,
          clamp(Math.cos(nextAngle) * r, -0.086, 0.082)
        );
        schoolGoalTimer = 3.0 + Math.random() * 2.4;
      }
      const wantSchoolYaw = Math.atan2(_schoolGoal.x - _schoolCenter.x, _schoolGoal.z - _schoolCenter.z);
      const schoolYawDiff = wrapAngle(wantSchoolYaw - schoolYaw);
      const maxLeaderTurn = (schoolSpeedBoost > 0.15 ? 6.5 : 2.65) * dt;
      schoolYaw = wrapAngle(schoolYaw + clamp(schoolYawDiff, -maxLeaderTurn, maxLeaderTurn));
      const leaderSpeed = 0.048 + schoolSpeedBoost * 0.11;
      _schoolCenter.x = clamp(_schoolCenter.x + Math.sin(schoolYaw) * leaderSpeed * dt, -0.092, 0.092);
      _schoolCenter.z = clamp(_schoolCenter.z + Math.cos(schoolYaw) * leaderSpeed * dt, -0.090, 0.086);
      _schoolCenter.y += (_schoolGoal.y - _schoolCenter.y) * Math.min(1, dt * 1.15);

      // カタクチ群れの平均進行ベクトル（Boids 整列用）
      let schDirX = 0, schDirZ = 0, schCnt = 0;
      for (let i = 0; i < fishAgents.length; i++) {
        if (fishAgents[i].cfg.school) {
          schDirX += Math.sin(fishAgents[i].yaw);
          schDirZ += Math.cos(fishAgents[i].yaw);
          schCnt++;
        }
      }
      const avgSchoolYaw = schCnt > 0 && Math.hypot(schDirX, schDirZ) > 0.1
        ? Math.atan2(schDirX, schDirZ)
        : schoolYaw;
      const cosSch = Math.cos(schoolYaw);
      const sinSch = Math.sin(schoolYaw);

      // アジ（3匹）のゆるい連れ立ち平均方向
      let ajiDirX = 0, ajiDirZ = 0, ajiCnt = 0;
      for (let i = 0; i < fishAgents.length; i++) {
        if (fishAgents[i].cfg.looseSchool) {
          ajiDirX += Math.sin(fishAgents[i].yaw);
          ajiDirZ += Math.cos(fishAgents[i].yaw);
          ajiCnt++;
        }
      }
      const avgAjiYaw = ajiCnt > 0 && Math.hypot(ajiDirX, ajiDirZ) > 0.1 ? Math.atan2(ajiDirX, ajiDirZ) : 0;

      const viewerProx = fishReaction.viewerProximity;

      for (let i = 0; i < fishAgents.length; i++) {
        const ag = fishAgents[i];
        const { actor, cfg, lim } = ag;
        const pos = actor.object.position;

        const wasStartled = ag.startleTimer > 0;
        if (ag.startleTimer > 0) {
          ag.startleTimer = Math.max(0, ag.startleTimer - dt);
          if (ag.startleTimer === 0 && wasStartled) {
            actor.setMotion(ag.behavior === 'hover' || ag.behavior === 'rest' ? 'hover' : 'swim');
          }
        }
        const isStartled = ag.startleTimer > 0;

        // 3. メバル・カサゴの岩陰ホバリング／休息ステートマシン
        if ((cfg.canHover || cfg.canRest) && !isStartled) {
          ag.behaviorTimer -= dt;
          if (ag.behavior === 'swim') {
            if (pos.distanceTo(ag.waypoint) < 0.024 || ag.behaviorTimer <= 0) {
              if (cfg.canRest) {
                ag.behavior = Math.random() < 0.72 ? 'rest' : 'hover';
              } else {
                ag.behavior = Math.random() < 0.80 ? 'hover' : 'rest';
              }
              ag.behaviorTimer = ag.behavior === 'rest' ? (5.0 + Math.random() * 4.0) : (4.2 + Math.random() * 3.5);
              ag.hoverAnchor.copy(pos);
              ag.hoverYaw = ag.yaw;
              actor.setMotion('hover');
            }
          } else {
            // 顔が近づいたメバルはホバリングを解いて少し手前へ寄ってくる
            if (cfg.canHover && viewerProx > 0.35 && pos.z < 0.055) {
              ag.behavior = 'swim';
              ag.behaviorTimer = 3.2;
              actor.setMotion('swim');
            } else if (ag.behaviorTimer <= 0) {
              ag.behavior = 'swim';
              ag.behaviorTimer = 3.8 + Math.random() * 3.0;
              const spots = cfg.canRest ? KASAGO_SPOTS : MEBARU_SPOTS;
              const picked = pickRockSpot(spots, lim, ag.spotIdx);
              ag.waypoint.copy(picked.spot);
              ag.spotIdx = picked.idx;
              actor.setMotion('swim');
            }
          }
        }

        // 4. ホバリング／休息中のメバル・カサゴ更新（ピタッと止まって胸びれパタパタ＆呼吸）
        if ((ag.behavior === 'hover' || ag.behavior === 'rest') && !isStartled) {
          // 顔接近時はゆっくり体の向きをやや鑑賞者側（横目で目が合う斜め角度）へ調整
          let wantLook = 0;
          let targetHoverYaw = ag.hoverYaw;
          if (cfg.curious && viewerProx > 0.14) {
            wantLook = clamp(viewerProx * 1.15, 0, 1);
            const toCamYaw = Math.atan2(camera.position.x - pos.x, camera.position.z - pos.z);
            // 魚は横目で見るため、真正面から ±50° 斜め向きを好む
            const sideSign = wrapAngle(ag.yaw - toCamYaw) >= 0 ? 1 : -1;
            targetHoverYaw = wrapAngle(toCamYaw + sideSign * 0.88);
          }
          const yawDiff = wrapAngle(targetHoverYaw - ag.yaw);
          const gentleTurn = clamp(yawDiff * 1.1, -0.55, 0.55);
          ag.turnRate += (gentleTurn - ag.turnRate) * Math.min(1, dt * 4.0);
          ag.pitch += (0 - ag.pitch) * Math.min(1, dt * 3.5);
          ag.lookAtAmount += (wantLook - ag.lookAtAmount) * Math.min(1, dt * 5.0);

          ag.drive.speed = 0.0;
          ag.drive.turnRate = ag.turnRate;
          actor.drive = ag.drive;
          actor.update(dt);
          if (actor.mesh && typeof actor.mesh.lookAtViewer === 'function') {
            actor.mesh.lookAtViewer(ag.lookAtAmount);
          }

          ag.yaw = wrapAngle(ag.yaw + ag.turnRate * dt);
          actor.object.rotation.set(ag.pitch, ag.yaw, 0, 'YXZ');

          // 休息（カサゴ等）は底砂ギリギリへそっと沈み、ホバリングは微かな浮力ゆらぎ
          const subY = getSubstrateHeight(pos.x, pos.z);
          const restY = Math.max(-HALF_Y + 0.034, subY + lim.bodyHalfY + 0.007);
          const targetY = ag.behavior === 'rest'
            ? restY
            : clamp(ag.hoverAnchor.y + Math.sin(t * 1.45 + ag.speedPhase) * 0.0018, restY + 0.006, lim.maxY);
          pos.y += (targetY - pos.y) * Math.min(1, dt * 2.4);
          if (actor.currentSpeed > 0.0005) {
            _fwd.set(0, 0, 1).applyEuler(actor.object.rotation);
            pos.addScaledVector(_fwd, actor.currentSpeed * dt * 0.35);
          }
          pos.x = clamp(pos.x, -lim.limX, lim.limX);
          pos.z = clamp(pos.z, -lim.limZ, lim.limZ);
          pos.y = clamp(pos.y, restY, lim.maxY);
          continue;
        }

        // 5. 通常回遊・群れ行動・顔接近での接近＆視線・ビクッ逃避
        let curiousActive = false;
        let wantLook = 0;

        if (isStartled) {
          // ビクッ反応：逃避方向へ素早く反転してダッシュ
          _steerGoal.set(
            clamp(pos.x + Math.sin(ag.startleYaw) * 0.09, -lim.limX + 0.012, lim.limX - 0.012),
            clamp(pos.y + (cfg.school ? 0.008 : 0), cfg.yMin, lim.maxY),
            clamp(pos.z + Math.cos(ag.startleYaw) * 0.09, -lim.limZ + 0.012, lim.limZ - 0.012)
          );
          if (cfg.school) {
            // イワシの群れはリーダーの逃避位置へ揃って移動
            const fx = ag.schoolOffset.x * cosSch + ag.schoolOffset.z * sinSch;
            const fz = -ag.schoolOffset.x * sinSch + ag.schoolOffset.z * cosSch;
            _steerGoal.lerp(_centerTmp.set(
              clamp(_schoolCenter.x + fx * 0.85, -lim.limX + 0.014, lim.limX - 0.014),
              clamp(_schoolCenter.y + ag.schoolOffset.y * 0.8, cfg.yMin, lim.maxY),
              clamp(_schoolCenter.z + fz * 0.85, -lim.limZ + 0.014, lim.limZ - 0.014)
            ), 0.55);
          }
        } else if (cfg.school) {
          // カタクチイワシ：群れリーダーの進行方向に合わせて編隊オフセットを回転＋Boids 整列
          const fx = ag.schoolOffset.x * cosSch + ag.schoolOffset.z * sinSch;
          const fz = -ag.schoolOffset.x * sinSch + ag.schoolOffset.z * cosSch;
          const leadAhead = 0.048;
          _steerGoal.set(
            clamp(_schoolCenter.x + fx + Math.sin(schoolYaw) * leadAhead, -lim.limX + 0.016, lim.limX - 0.016),
            clamp(_schoolCenter.y + ag.schoolOffset.y + Math.sin(t * 1.1 + ag.speedPhase) * 0.005, cfg.yMin, Math.min(cfg.yMax, lim.maxY)),
            clamp(_schoolCenter.z + fz + Math.cos(schoolYaw) * leadAhead, -lim.limZ + 0.016, lim.limZ - 0.016)
          );
        } else {
          ag.waypointTimer -= dt;
          if (ag.waypointTimer <= 0 || pos.distanceTo(ag.waypoint) < 0.028) {
            if (cfg.canHover || cfg.canRest) {
              const spots = cfg.canRest ? KASAGO_SPOTS : MEBARU_SPOTS;
              const picked = pickRockSpot(spots, lim, ag.spotIdx);
              ag.waypoint.copy(picked.spot);
              ag.spotIdx = picked.idx;
            } else {
              ag.waypoint.copy(pickFishWaypoint(cfg, lim));
            }
            ag.waypointTimer = 2.6 + Math.random() * 3.4;
          }
          _steerGoal.copy(ag.waypoint);

          // 顔をグッと近づけると、メバルやイサキ幼魚が少し手前に寄ってきて目を向ける
          if (cfg.curious && viewerProx > 0.16) {
            curiousActive = true;
            wantLook = clamp(viewerProx * 1.15, 0, 1);
            const curX = clamp(camera.position.x * 0.36 + ag.curiousOffset.x, -lim.limX + 0.024, lim.limX - 0.024);
            const curY = clamp(camera.position.y * 0.25 + ag.curiousOffset.y, cfg.yMin, Math.min(cfg.yMax, lim.maxY));
            const curZ = clamp(HALF_Z - 0.048 + ag.curiousOffset.z, -lim.limZ + 0.02, lim.limZ - 0.016);
            _steerGoal.lerp(_centerTmp.set(curX, curY, curZ), clamp(viewerProx * 0.85, 0, 0.85));
          }
        }

        // ガラス壁の手前から緩やかに内側へ舵を切る
        const wallStartX = lim.limX - 0.032;
        const wallStartZ = lim.limZ - 0.032;
        let wallW = 0;
        if (Math.abs(pos.x) > wallStartX) {
          wallW = Math.max(wallW, clamp((Math.abs(pos.x) - wallStartX) / 0.032, 0, 1));
        }
        if (Math.abs(pos.z) > wallStartZ) {
          wallW = Math.max(wallW, clamp((Math.abs(pos.z) - wallStartZ) / 0.032, 0, 1));
        }
        if (wallW > 0) {
          _steerGoal.lerp(_centerTmp.set(0, (cfg.yMin + Math.min(cfg.yMax, lim.maxY)) * 0.5, 0), wallW * 0.82);
        }

        // 岩・流木からの柔らかい回避
        for (let r = 0; r < rockObstacles.length; r++) {
          const ob = rockObstacles[r];
          const ox = pos.x - ob.x;
          const oy = pos.y - ob.y;
          const oz = pos.z - ob.z;
          const dSq = ox * ox + oy * oy + oz * oz;
          const safeR = ob.r + actor.length * (cfg.nearRock ? 0.32 : 0.48);
          if (dSq < safeR * safeR && dSq > 1e-6) {
            const d = Math.sqrt(dSq);
            const push = (safeR - d) / safeR;
            _steerGoal.x += (ox / d) * push * 0.075;
            _steerGoal.y += Math.max(0, oy / d) * push * 0.045 + 0.012 * push;
            _steerGoal.z += (oz / d) * push * 0.075;
          }
        }

        // 仲間同士の分離（近すぎ防止。カタクチ群れは引き締まった間隔に）
        for (let j = 0; j < fishAgents.length; j++) {
          if (i === j) continue;
          const other = fishAgents[j];
          const otherPos = other.actor.object.position;
          const sx = pos.x - otherPos.x;
          const sy = pos.y - otherPos.y;
          const sz = pos.z - otherPos.z;
          const dSq = sx * sx + sy * sy + sz * sz;
          const minSep = (cfg.school && other.cfg.school) ? 0.024 : 0.036;
          if (dSq < minSep * minSep && dSq > 1e-6) {
            const d = Math.sqrt(dSq);
            const push = (minSep - d) / minSep;
            _steerGoal.x += (sx / d) * push * 0.038;
            _steerGoal.y += (sy / d) * push * 0.024;
            _steerGoal.z += (sz / d) * push * 0.038;
          }
        }

        const floorY = Math.max(-HALF_Y + 0.036, getSubstrateHeight(pos.x, pos.z) + lim.bodyHalfY + 0.007);
        const minY = Math.max(cfg.yMin, floorY);
        const maxY = Math.min(cfg.yMax, lim.maxY);
        _steerGoal.y = clamp(_steerGoal.y, minY, maxY);

        const dx = _steerGoal.x - pos.x;
        const dz = _steerGoal.z - pos.z;
        let targetYaw = Math.atan2(dx, dz);

        // Boids 整列ブレンド：カタクチイワシは群れ全体の向きを強く揃えて一斉にターン
        if (cfg.school && wallW < 0.55) {
          const alignRef = wrapAngle(avgSchoolYaw + wrapAngle(schoolYaw - avgSchoolYaw) * 0.58);
          const alignW = isStartled ? 0.72 : 0.62;
          targetYaw = wrapAngle(targetYaw + wrapAngle(alignRef - targetYaw) * alignW);
        } else if (cfg.looseSchool && !isStartled && wallW < 0.45 && ajiCnt > 1) {
          targetYaw = wrapAngle(targetYaw + wrapAngle(avgAjiYaw - targetYaw) * 0.25);
        }

        // 手前で鑑賞者を観察中の魚は斜め横目で向き合う
        if (curiousActive && pos.z > 0.055 && pos.distanceTo(_steerGoal) < 0.032) {
          const toCamYaw = Math.atan2(camera.position.x - pos.x, camera.position.z - pos.z);
          const sideSign = wrapAngle(ag.yaw - toCamYaw) >= 0 ? 1 : -1;
          targetYaw = wrapAngle(toCamYaw + sideSign * 0.85);
        }

        let diff = wrapAngle(targetYaw - ag.yaw);
        if (Math.abs(diff) > 2.45 && ag.turnRate * diff < 0) {
          diff -= Math.sign(diff) * Math.PI * 2;
        }
        const turnMax = isStartled ? cfg.turnMax * 2.3 : cfg.turnMax;
        const wantTurn = clamp(diff * (cfg.school ? 3.2 : 2.2), -turnMax, turnMax);
        ag.turnRate += (wantTurn - ag.turnRate) * Math.min(1, dt * (isStartled ? 12.0 : 7.5));
        ag.turnRate = clamp(ag.turnRate, -turnMax, turnMax);

        const dy = _steerGoal.y - pos.y;
        const wantVy = clamp(dy * 1.15, -0.045, 0.045);
        const wantPitch = clamp(-Math.atan2(wantVy, Math.max(actor.currentSpeed, 0.04)), -0.32, 0.32);
        ag.pitch += (wantPitch - ag.pitch) * Math.min(1, dt * 4.5);

        let desiredSpeed;
        if (isStartled) {
          const burstRatio = clamp(ag.startleTimer / 1.1, 0.25, 1.0);
          desiredSpeed = cfg.speed * (1.2 + 2.4 * burstRatio);
        } else if (curiousActive && pos.z > 0.055 && pos.distanceTo(_steerGoal) < 0.036) {
          desiredSpeed = Math.max(0.008, cfg.speed * 0.32);
        } else if (cfg.school) {
          // 群れから遅れた個体は少し加速し、先行しすぎたら少し落として編隊を保つ
          const relAhead = (pos.x - _schoolCenter.x) * sinSch + (pos.z - _schoolCenter.z) * cosSch;
          const paceAdj = clamp(-relAhead * 0.45, -0.012, 0.018);
          desiredSpeed = clamp(cfg.speed + paceAdj + 0.004 * Math.sin(t * 0.9 + ag.speedPhase), 0.034, 0.088);
        } else {
          const cruiseMod = 0.84 + 0.24 * Math.sin(t * 0.65 + ag.speedPhase);
          desiredSpeed = Math.max(0.012, (cfg.speed + ag.speedBias) * cruiseMod);
        }

        ag.lookAtAmount += (wantLook - ag.lookAtAmount) * Math.min(1, dt * 5.0);

        // drive は個体ごとに 1 つを使い回す（my-aquarium と同じ作法）
        ag.drive.speed = desiredSpeed;
        ag.drive.turnRate = ag.turnRate;
        actor.drive = ag.drive;
        actor.update(dt);
        // fish-kit の update() は通常時 lookAtViewer(0) に戻すため、直後に視線追従量を反映
        if (actor.mesh && typeof actor.mesh.lookAtViewer === 'function') {
          actor.mesh.lookAtViewer(ag.lookAtAmount);
        }

        ag.yaw = wrapAngle(ag.yaw + ag.turnRate * dt);
        actor.object.rotation.set(ag.pitch, ag.yaw, 0, 'YXZ');
        _fwd.set(0, 0, 1).applyEuler(actor.object.rotation);
        pos.addScaledVector(_fwd, actor.currentSpeed * dt);

        // 最終段の絶対ガード：水槽の内寸・水面・砂利から 1mm も出さない
        const clampedX = clamp(pos.x, -lim.limX, lim.limX);
        const clampedZ = clamp(pos.z, -lim.limZ, lim.limZ);
        if (clampedX !== pos.x || clampedZ !== pos.z) {
          const inwardYaw = Math.atan2(-clampedX, -clampedZ);
          ag.yaw = wrapAngle(ag.yaw + wrapAngle(inwardYaw - ag.yaw) * Math.min(1, dt * 6));
          actor.object.rotation.y = ag.yaw;
        }
        pos.x = clampedX;
        pos.z = clampedZ;
        const hardMinY = Math.max(-HALF_Y + 0.034, getSubstrateHeight(pos.x, pos.z) + lim.bodyHalfY + 0.006);
        pos.y = clamp(pos.y, hardMinY, lim.maxY);
      }
    }

    // 画面タップ（ガラスを軽く叩く）で群れがビクッと反応（ドラッグ操作は阻害しない）
    const tapRaycaster = new THREE.Raycaster();
    const tapNdc = new THREE.Vector2();
    const frontGlassPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -HALF_Z);
    const tapHitPoint = new THREE.Vector3();
    let pointerDownInfo = null;

    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 && e.pointerType === 'mouse') return;
      pointerDownInfo = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId };
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
      if (!pointerDownInfo || pointerDownInfo.id !== e.pointerId) return;
      const dx = e.clientX - pointerDownInfo.x;
      const dy = e.clientY - pointerDownInfo.y;
      const elapsed = performance.now() - pointerDownInfo.t;
      pointerDownInfo = null;
      if (Math.hypot(dx, dy) > 9 || elapsed > 360) return;

      const rect = renderer.domElement.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) return;
      tapNdc.set(
        ((e.clientX - rect.left) / rect.width) * 2 - 1,
        -((e.clientY - rect.top) / rect.height) * 2 + 1
      );
      tapRaycaster.setFromCamera(tapNdc, camera);
      const hit = tapRaycaster.ray.intersectPlane(frontGlassPlane, tapHitPoint);
      if (hit && Math.abs(tapHitPoint.x) <= HALF_X + 0.09 && Math.abs(tapHitPoint.y) <= HALF_Y + 0.09) {
        triggerFishStartle(tapHitPoint, 1.0, 'tap');
      }
    });

    // ===== 9. カメラ視点追従（オンデバイス顔検出＋Off-Axis Projection）＆ UI =====
    let currentMode = 'normal';
    const modeButtons = Array.from(document.querySelectorAll('.mode-btn'));
    const hudTipEl = document.getElementById('hud-tip');
    const hudModeLabelEl = document.getElementById('hud-mode-label');
    const fishCountLabelEl = document.getElementById('fish-count-label');
    const statusOverlayEl = document.getElementById('status-overlay');
    const statusBoxEl = document.getElementById('status-box');
    const stereoGuidesEl = document.getElementById('stereo-guides');
    const eyeTagLeftEl = document.getElementById('eye-tag-left');
    const eyeTagRightEl = document.getElementById('eye-tag-right');

    const cameraTrackBtn = document.getElementById('camera-track-btn');
    const cameraTrackBtnLabel = document.getElementById('camera-track-btn-label');
    const recenterBtn = document.getElementById('recenter-btn');
    const lightToggleBtn = document.getElementById('light-toggle-btn');
    const menuToggleBtn = document.getElementById('menu-toggle-btn');
    const camMonitorEl = document.getElementById('cam-monitor');
    const camPreviewCanvas = document.getElementById('cam-preview');
    const camPreviewCtx = camPreviewCanvas.getContext('2d');
    const camStatusDotEl = document.getElementById('cam-status-dot');
    const camStatusTextEl = document.getElementById('cam-status-text');
    const camTogglePreviewBtn = document.getElementById('cam-toggle-preview-btn');
    const headtrackVideo = document.getElementById('headtrack-video');

    // One Euro Filter（静止時の微振動を抑えつつ、素早い動きに低遅延で追従）
    class OneEuroFilter {
      constructor(minCutoff = 1.15, beta = 2.6, dCutoff = 1.0) {
        this.minCutoff = minCutoff;
        this.beta = beta;
        this.dCutoff = dCutoff;
        this.xPrev = null;
        this.dxPrev = 0;
      }
      reset() {
        this.xPrev = null;
        this.dxPrev = 0;
      }
      alpha(cutoff, dt) {
        const tau = 1.0 / (2.0 * Math.PI * Math.max(0.01, cutoff));
        return 1.0 / (1.0 + tau / dt);
      }
      filter(x, dt) {
        if (this.xPrev === null) {
          this.xPrev = x;
          this.dxPrev = 0;
          return x;
        }
        const safeDt = clamp(dt, 1 / 120, 0.25);
        const dx = (x - this.xPrev) / safeDt;
        const aD = this.alpha(this.dCutoff, safeDt);
        const dxHat = aD * dx + (1.0 - aD) * this.dxPrev;
        const cutoff = this.minCutoff + this.beta * Math.abs(dxHat);
        const aX = this.alpha(cutoff, safeDt);
        const xHat = aX * x + (1.0 - aX) * this.xPrev;
        this.xPrev = xHat;
        this.dxPrev = dxHat;
        return xHat;
      }
    }

    // 端末内オンデバイス顔検出・追従エンジン（完全ローカル・外部通信ゼロ）
    // 積分画像による Haar 顔構造（目帯・鼻筋・口元・対称性）＋ YCbCr 肌色分離 ＋ 12x12 ZNCC テンプレート追従
    class BuiltinFaceTracker {
      constructor() {
        this.workCanvas = document.createElement('canvas');
        this.workCtx = this.workCanvas.getContext('2d', { willReadFrequently: true });
        this.w = 0;
        this.h = 0;
        this.stride = 0;
        this.gray = null;
        this.rawGray = null;
        this.prevGray = null;
        this.motion = null;
        this.skin = null;
        this.intY = null;
        this.intY2 = null;
        this.intS = null;
        this.intM = null;
        this.hist = new Uint32Array(256);
        this.template = new Float32Array(144); // 12x12 正規化輝度パッチ
        this.hasTemplate = false;
        this.lock = null; // { cx, cy, w, h, score }
        this.frameIdx = 0;
        this.missFrames = 0;
        this.switchStreak = 0;
      }

      reset() {
        this.lock = null;
        this.hasTemplate = false;
        this.frameIdx = 0;
        this.missFrames = 0;
        this.switchStreak = 0;
        if (this.motion) this.motion.fill(0);
        if (this.prevGray) this.prevGray.fill(0);
      }

      ensureBuffers(vw, vh) {
        const longEdge = 160;
        const scale = longEdge / Math.max(vw, vh);
        const nw = Math.max(48, Math.round((vw * scale) / 2) * 2);
        const nh = Math.max(48, Math.round((vh * scale) / 2) * 2);
        if (nw === this.w && nh === this.h) return;
        this.w = nw;
        this.h = nh;
        this.stride = nw + 1;
        this.workCanvas.width = nw;
        this.workCanvas.height = nh;
        const n = nw * nh;
        const intLen = (nw + 1) * (nh + 1);
        this.gray = new Uint8Array(n);
        this.rawGray = new Uint8Array(n);
        this.prevGray = new Uint8Array(n);
        this.motion = new Float32Array(n);
        this.skin = new Uint8Array(n);
        this.intY = new Float64Array(intLen);
        this.intY2 = new Float64Array(intLen);
        this.intS = new Float64Array(intLen);
        this.intM = new Float64Array(intLen);
        this.reset();
      }

      rectMean(intArr, x0, y0, x1, y1) {
        const w = this.w;
        const h = this.h;
        const ix0 = x0 < 0 ? 0 : x0 > w ? w : (x0 | 0);
        const iy0 = y0 < 0 ? 0 : y0 > h ? h : (y0 | 0);
        const ix1 = x1 < 0 ? 0 : x1 > w ? w : Math.ceil(x1);
        const iy1 = y1 < 0 ? 0 : y1 > h ? h : Math.ceil(y1);
        const area = (ix1 - ix0) * (iy1 - iy0);
        if (area <= 0) return 0;
        const s = this.stride;
        const sum = intArr[iy1 * s + ix1] - intArr[iy0 * s + ix1] - intArr[iy1 * s + ix0] + intArr[iy0 * s + ix0];
        return sum / area;
      }

      buildMaps(video) {
        const w = this.w;
        const h = this.h;
        this.workCtx.drawImage(video, 0, 0, w, h);
        const data = this.workCtx.getImageData(0, 0, w, h).data;
        const rawGray = this.rawGray;
        const prevGray = this.prevGray;
        const motion = this.motion;
        const skin = this.skin;
        const hist = this.hist;
        hist.fill(0);
        const firstFrame = this.frameIdx === 0;
        const n = w * h;

        for (let i = 0; i < n; i++) {
          const o = i * 4;
          const r = data[o];
          const g = data[o + 1];
          const b = data[o + 2];
          const yv = (77 * r + 150 * g + 29 * b) >> 8;
          rawGray[i] = yv;
          hist[yv]++;

          // フレーム間モーション活性度（静止壁より動く顔を優先）
          const diff = firstFrame ? 0 : Math.abs(yv - prevGray[i]);
          const mNew = motion[i] * 0.88 + (diff > 5 ? Math.min(80, diff * 2.2) : 0);
          motion[i] = mNew > 255 ? 255 : mNew;
          prevGray[i] = yv;

          // YCbCr 連続肌色尤度（照明変化と多様な肌トーンに対応）
          const cb = 128 - 0.168736 * r - 0.331264 * g + 0.5 * b;
          const cr = 128 + 0.5 * r - 0.418688 * g - 0.081312 * b;
          const dCb = (cb - 104) / 19;
          const dCr = (cr - 152) / 17;
          const d2 = dCb * dCb + dCr * dCr;
          if (d2 < 6.5 && yv >= 22 && yv <= 248 && r >= g * 0.92 && r >= b * 1.00) {
            let sVal = Math.exp(-0.5 * d2) * 255;
            if (r - Math.min(g, b) < 12) sVal *= 0.45;
            skin[i] = sVal > 255 ? 255 : (sVal | 0);
          } else {
            skin[i] = 0;
          }
        }

        // 4%〜96% パーセンタイルで輝度コントラスト正規化（暗所・逆光耐性）
        const loTarget = (n * 0.04) | 0;
        const hiTarget = (n * 0.96) | 0;
        let acc = 0;
        let pLo = 0;
        let pHi = 255;
        for (let v = 0; v < 256; v++) {
          acc += hist[v];
          if (acc >= loTarget) { pLo = v; break; }
        }
        acc = 0;
        for (let v = 0; v < 256; v++) {
          acc += hist[v];
          if (acc >= hiTarget) { pHi = v; break; }
        }
        const span = Math.max(28, pHi - pLo);
        const invSpan = 255 / span;
        const gray = this.gray;
        for (let i = 0; i < n; i++) {
          const nv = (rawGray[i] - pLo) * invSpan;
          gray[i] = nv <= 0 ? 0 : nv >= 255 ? 255 : (nv | 0);
        }

        // 4 枚の積分画像を一括構築
        const stride = this.stride;
        const intY = this.intY;
        const intY2 = this.intY2;
        const intS = this.intS;
        const intM = this.intM;
        for (let x = 0; x <= w; x++) {
          intY[x] = 0; intY2[x] = 0; intS[x] = 0; intM[x] = 0;
        }
        for (let y = 0; y < h; y++) {
          let rowY = 0, rowY2 = 0, rowS = 0, rowM = 0;
          const rowOff = y * w;
          const prevOff = y * stride;
          const curOff = (y + 1) * stride;
          intY[curOff] = 0; intY2[curOff] = 0; intS[curOff] = 0; intM[curOff] = 0;
          for (let x = 0; x < w; x++) {
            const idx = rowOff + x;
            const gv = gray[idx];
            rowY += gv;
            rowY2 += gv * gv;
            rowS += skin[idx];
            rowM += motion[idx];
            const c = curOff + x + 1;
            const p = prevOff + x + 1;
            intY[c] = intY[p] + rowY;
            intY2[c] = intY2[p] + rowY2;
            intS[c] = intS[p] + rowS;
            intM[c] = intM[p] + rowM;
          }
        }
      }

      samplePatch12(x, y, bw, bh, out) {
        const gray = this.gray;
        const w = this.w;
        const h = this.h;
        let mean = 0;
        let k = 0;
        for (let py = 0; py < 12; py++) {
          const sy = clamp(Math.floor(y + ((py + 0.5) / 12) * bh), 0, h - 1);
          const row = sy * w;
          for (let px = 0; px < 12; px++) {
            const sx = clamp(Math.floor(x + ((px + 0.5) / 12) * bw), 0, w - 1);
            const v = gray[row + sx];
            out[k++] = v;
            mean += v;
          }
        }
        mean /= 144;
        let normSq = 0;
        for (let i = 0; i < 144; i++) {
          const d = out[i] - mean;
          out[i] = d;
          normSq += d * d;
        }
        const invNorm = normSq > 1e-3 ? 1 / Math.sqrt(normSq) : 0;
        for (let i = 0; i < 144; i++) out[i] *= invNorm;
        return normSq > 1e-3;
      }

      computeZncc(x, y, bw, bh) {
        if (!this.hasTemplate) return 0;
        if (!this._tmpPatch) this._tmpPatch = new Float32Array(144);
        const ok = this.samplePatch12(x, y, bw, bh, this._tmpPatch);
        if (!ok) return 0;
        let dot = 0;
        const tpl = this.template;
        const p = this._tmpPatch;
        for (let i = 0; i < 144; i++) dot += tpl[i] * p[i];
        return dot;
      }

      updateTemplate(x, y, bw, bh, blend) {
        if (!this._tmpPatch) this._tmpPatch = new Float32Array(144);
        if (!this.samplePatch12(x, y, bw, bh, this._tmpPatch)) return;
        if (!this.hasTemplate) {
          this.template.set(this._tmpPatch);
          this.hasTemplate = true;
          return;
        }
        let normSq = 0;
        for (let i = 0; i < 144; i++) {
          const v = this.template[i] * (1 - blend) + this._tmpPatch[i] * blend;
          this.template[i] = v;
          normSq += v * v;
        }
        const invNorm = normSq > 1e-4 ? 1 / Math.sqrt(normSq) : 0;
        for (let i = 0; i < 144; i++) this.template[i] *= invNorm;
      }

      evalCandidate(x, y, bw, bh, useTemplate) {
        const intY = this.intY;
        const intY2 = this.intY2;
        const intS = this.intS;
        const intM = this.intM;
        const meanY = this.rectMean(intY, x, y, x + bw, y + bh);
        const meanY2 = this.rectMean(intY2, x, y, x + bw, y + bh);
        const stdY = Math.sqrt(Math.max(0, meanY2 - meanY * meanY));
        if (stdY < 9) return -10;
        const norm = Math.max(stdY, 18);

        // Haar 特徴 1〜3：額・左右目・鼻筋・頬・口
        const yForeL = this.rectMean(intY, x + 0.18 * bw, y + 0.08 * bh, x + 0.50 * bw, y + 0.24 * bh);
        const yForeR = this.rectMean(intY, x + 0.50 * bw, y + 0.08 * bh, x + 0.82 * bw, y + 0.24 * bh);
        const yFore = 0.5 * (yForeL + yForeR);

        const yEyeL = this.rectMean(intY, x + 0.14 * bw, y + 0.27 * bh, x + 0.42 * bw, y + 0.46 * bh);
        const yBridge = this.rectMean(intY, x + 0.43 * bw, y + 0.27 * bh, x + 0.57 * bw, y + 0.52 * bh);
        const yEyeR = this.rectMean(intY, x + 0.58 * bw, y + 0.27 * bh, x + 0.86 * bw, y + 0.46 * bh);
        const yEyes = 0.5 * (yEyeL + yEyeR);
