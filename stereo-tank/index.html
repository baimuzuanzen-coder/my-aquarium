        const yCheekL = this.rectMean(intY, x + 0.14 * bw, y + 0.50 * bh, x + 0.50 * bw, y + 0.67 * bh);
        const yCheekR = this.rectMean(intY, x + 0.50 * bw, y + 0.50 * bh, x + 0.86 * bw, y + 0.67 * bh);
        const yCheek = 0.5 * (yCheekL + yCheekR);

        const yMouthL = this.rectMean(intY, x + 0.25 * bw, y + 0.70 * bh, x + 0.50 * bw, y + 0.86 * bh);
        const yMouthR = this.rectMean(intY, x + 0.50 * bw, y + 0.70 * bh, x + 0.75 * bw, y + 0.86 * bh);
        const yMouth = 0.5 * (yMouthL + yMouthR);

        const fEyeCheek = clamp((yCheek - yEyes) / norm, -0.5, 1.3);
        const fEyeFore = clamp((yFore - yEyes) / norm, -0.5, 1.2);
        const fBridge = clamp((yBridge - yEyes) / norm, -0.5, 1.2);
        const fEyeBal = 1.0 - clamp(Math.abs(yEyeL - yEyeR) / (norm * 1.25), 0, 1);
        const fMouth = clamp((yCheek - yMouth) / norm, -0.4, 1.1);

        // 左右ミラー対称性（4帯）
        const asym = (
          Math.abs(yForeL - yForeR) +
          Math.abs(yEyeL - yEyeR) +
          Math.abs(yCheekL - yCheekR) +
          Math.abs(yMouthL - yMouthR)
        ) / (4 * norm);
        const fSym = 1.0 - clamp(asym * 0.95, 0, 1);

        // 肌色充填度と背景との肌色分離（顔全体ジャストサイズに吸い付かせ、肌色の木目壁誤検出を防ぐ）
        const sIn = this.rectMean(intS, x + 0.14 * bw, y + 0.10 * bh, x + 0.86 * bw, y + 0.88 * bh) / 255;
        let sOutSum = 0;
        let sOutCnt = 0;
        let yOutDiffSum = 0;
        let yOutCnt = 0;
        const padX = Math.max(4, bw * 0.22);
        const padY = Math.max(4, bh * 0.20);
        if (x >= 3) {
          sOutSum += this.rectMean(intS, x - padX, y + 0.12 * bh, x, y + 0.88 * bh) / 255;
          sOutCnt++;
          yOutDiffSum += Math.abs(meanY - this.rectMean(intY, x - padX, y + 0.12 * bh, x, y + 0.88 * bh));
          yOutCnt++;
        }
        if (x + bw <= this.w - 3) {
          sOutSum += this.rectMean(intS, x + bw, y + 0.12 * bh, x + bw + padX, y + 0.88 * bh) / 255;
          sOutCnt++;
          yOutDiffSum += Math.abs(meanY - this.rectMean(intY, x + bw, y + 0.12 * bh, x + bw + padX, y + 0.88 * bh));
          yOutCnt++;
        }
        if (y >= 3) {
          sOutSum += this.rectMean(intS, x + 0.14 * bw, y - padY, x + 0.86 * bw, y) / 255;
          sOutCnt++;
          yOutDiffSum += Math.abs(meanY - this.rectMean(intY, x + 0.14 * bw, y - padY, x + 0.86 * bw, y));
          yOutCnt++;
        }
        const sOut = sOutCnt > 0 ? sOutSum / sOutCnt : 0;
        const sSep = clamp(sIn - 0.86 * sOut, -0.45, 1.0);
        const fSkin = sIn * 0.26 + sSep * 0.74;
        const fBorder = yOutCnt > 0 ? clamp((yOutDiffSum / yOutCnt) / (norm * 1.45), 0, 1) : 0.2;

        // モーション活性度（静止壁より生きた顔を優先）
        const fMotion = clamp(this.rectMean(intM, x + 0.12 * bw, y + 0.10 * bh, x + 0.88 * bw, y + 0.90 * bh) / 55, 0, 1);

        let structScore =
          fEyeCheek * 0.88 +
          fEyeFore * 0.45 +
          fBridge * 0.62 +
          fEyeBal * 0.26 +
          fMouth * 0.42 +
          fSym * 0.56 +
          fSkin * 1.15 +
          fBorder * 0.36 +
          fMotion * 0.12;

        // 目帯と鼻筋がどちらも反転（白飛び目）なら大きく減点
        if (fEyeCheek < -0.15 && fBridge < -0.10) {
          structScore -= 0.75;
        }
        // 画面端ギリギリより内側をわずかに優遇
        const cxN = (x + bw * 0.5) / this.w - 0.5;
        const cyN = (y + bh * 0.5) / this.h - 0.48;
        structScore -= (cxN * cxN + cyN * cyN) * 0.16;

        let total = structScore;
        if (useTemplate && this.hasTemplate) {
          const zncc = this.computeZncc(x, y, bw, bh);
          total += Math.max(-0.2, zncc) * 0.95;
        }
        return total;
      }

      fullScan() {
        const w = this.w;
        const h = this.h;
        const minDim = Math.min(w, h);
        const minSize = Math.max(18, Math.round(minDim * 0.18));
        const maxSize = Math.min(Math.round(minDim * 0.74), Math.floor(h / 1.18) - 2, w - 2);
        let best = null;

        for (let bw = minSize; bw <= maxSize; bw = Math.max(bw + 3, Math.round(bw * 1.18))) {
          const bh = Math.round(bw * 1.18);
          if (bh >= h - 1 || bw >= w - 1) break;
          const step = Math.max(2, Math.round(bw * 0.13));
          for (let y = 1; y <= h - bh - 1; y += step) {
            for (let x = 1; x <= w - bw - 1; x += step) {
              const sc = this.evalCandidate(x, y, bw, bh, false);
              if (!best || sc > best.score) {
                best = { x, y, bw, bh, score: sc };
              }
            }
          }
        }
        return best;
      }

      localSearch(lock) {
        const w = this.w;
        const h = this.h;
        const minDim = Math.min(w, h);
        const minW = Math.max(18, Math.round(minDim * 0.16));
        const maxW = Math.min(Math.round(minDim * 0.78), Math.floor(h / 1.18) - 2, w - 2);
        let best = null;

        const scaleFactors = [0.84, 0.90, 0.95, 1.0, 1.05, 1.11, 1.18];
        const prevCx = lock.cx;
        const prevCy = lock.cy;
        const searchR = Math.max(14, Math.round(lock.w * 0.68));
        const step = Math.max(2, Math.round(lock.w * 0.10));

        for (let si = 0; si < scaleFactors.length; si++) {
          const bw = clamp(Math.round(lock.w * scaleFactors[si]), minW, maxW);
          const bh = Math.round(bw * 1.18);
          const xMin = Math.max(1, Math.round(prevCx - bw * 0.5 - searchR));
          const xMax = Math.min(w - bw - 1, Math.round(prevCx - bw * 0.5 + searchR));
          const yMin = Math.max(1, Math.round(prevCy - bh * 0.5 - searchR));
          const yMax = Math.min(h - bh - 1, Math.round(prevCy - bh * 0.5 + searchR));
          for (let y = yMin; y <= yMax; y += step) {
            for (let x = xMin; x <= xMax; x += step) {
              const sc = this.evalCandidate(x, y, bw, bh, true);
              if (!best || sc > best.score) {
                best = { x, y, bw, bh, score: sc };
              }
            }
          }
        }
        return best;
      }

      refineSubpixel(cand, useTemplate) {
        const w = this.w;
        const h = this.h;
        let bx = cand.x;
        let by = cand.y;
        let bw = cand.bw;
        let bh = cand.bh;
        let bestSc = cand.score;

        // 1px 刻みの細密探索
        for (let dy = -2; dy <= 2; dy++) {
          for (let dx = -2; dx <= 2; dx++) {
            const nx = cand.x + dx;
            const ny = cand.y + dy;
            if (nx < 1 || ny < 1 || nx + bw > w - 1 || ny + bh > h - 1) continue;
            const sc = this.evalCandidate(nx, ny, bw, bh, useTemplate);
            if (sc > bestSc) {
              bestSc = sc;
              bx = nx;
              by = ny;
            }
          }
        }

        // 放物線サブピクセル補間（X / Y / スケール）
        let subX = bx;
        let subY = by;
        if (bx > 1 && bx + bw < w - 1) {
          const sL = this.evalCandidate(bx - 1, by, bw, bh, useTemplate);
          const sR = this.evalCandidate(bx + 1, by, bw, bh, useTemplate);
          const denom = 2 * (sL - 2 * bestSc + sR);
          if (Math.abs(denom) > 1e-4 && denom < 0) {
            subX += clamp((sL - sR) / denom, -0.5, 0.5);
          }
        }
        if (by > 1 && by + bh < h - 1) {
          const sU = this.evalCandidate(bx, by - 1, bw, bh, useTemplate);
          const sD = this.evalCandidate(bx, by + 1, bw, bh, useTemplate);
          const denom = 2 * (sU - 2 * bestSc + sD);
          if (Math.abs(denom) > 1e-4 && denom < 0) {
            subY += clamp((sU - sD) / denom, -0.5, 0.5);
          }
        }

        // スケールの連続補間（前後距離の滑らかさを確保）
        let subW = bw;
        const dW = Math.max(2, Math.round(bw * 0.05));
        const wLo = bw - dW;
        const wHi = bw + dW;
        const hLo = Math.round(wLo * 1.18);
        const hHi = Math.round(wHi * 1.18);
        const cx0 = subX + bw * 0.5;
        const cy0 = subY + bh * 0.5;
        if (wLo >= 18 && cx0 - wHi * 0.5 >= 1 && cx0 + wHi * 0.5 <= w - 1 && cy0 - hHi * 0.5 >= 1 && cy0 + hHi * 0.5 <= h - 1) {
          const sLo = this.evalCandidate(cx0 - wLo * 0.5, cy0 - hLo * 0.5, wLo, hLo, useTemplate);
          const sHi = this.evalCandidate(cx0 - wHi * 0.5, cy0 - hHi * 0.5, wHi, hHi, useTemplate);
          const denom = 2 * (sLo - 2 * bestSc + sHi);
          if (Math.abs(denom) > 1e-4 && denom < 0) {
            subW += clamp((sLo - sHi) / denom, -0.5, 0.5) * dW;
          }
        }
        const subH = subW * 1.18;
        let cx = cx0;
        let cy = cy0;

        // 顔ボックス内の左右目暗部（瞳）による微調整
        const eyeBoxL = this.findDarkestSubBlock(subX + 0.16 * subW, subY + 0.27 * subH, 0.26 * subW, 0.18 * subH);
        const eyeBoxR = this.findDarkestSubBlock(subX + 0.58 * subW, subY + 0.27 * subH, 0.26 * subW, 0.18 * subH);
        if (eyeBoxL && eyeBoxR) {
          const eyeDist = eyeBoxR.x - eyeBoxL.x;
          if (eyeDist > subW * 0.24 && eyeDist < subW * 0.62) {
            const eyeMidX = 0.5 * (eyeBoxL.x + eyeBoxR.x);
            const eyeMidY = 0.5 * (eyeBoxL.y + eyeBoxR.y) + subH * 0.13;
            cx = cx * 0.72 + eyeMidX * 0.28;
            cy = cy * 0.78 + eyeMidY * 0.22;
          }
        }

        return {
          x: cx - subW * 0.5,
          y: cy - subH * 0.5,
          cx,
          cy,
          w: subW,
          h: subH,
          score: bestSc,
          structScore: this.evalCandidate(bx, by, bw, bh, false),
        };
      }

      findDarkestSubBlock(x0, y0, rw, rh) {
        const ix0 = clamp(Math.floor(x0), 1, this.w - 2);
        const iy0 = clamp(Math.floor(y0), 1, this.h - 2);
        const ix1 = clamp(Math.ceil(x0 + rw), ix0 + 1, this.w - 1);
        const iy1 = clamp(Math.ceil(y0 + rh), iy0 + 1, this.h - 1);
        const gray = this.gray;
        const w = this.w;
        let minV = 256;
        let sumX = 0;
        let sumY = 0;
        let wSum = 0;
        for (let y = iy0; y < iy1; y++) {
          const row = y * w;
          for (let x = ix0; x < ix1; x++) {
            const v = gray[row + x];
            if (v < minV) minV = v;
          }
        }
        const thresh = minV + 26;
        for (let y = iy0; y < iy1; y++) {
          const row = y * w;
          for (let x = ix0; x < ix1; x++) {
            const v = gray[row + x];
            if (v <= thresh) {
              const wt = (thresh - v + 1);
              sumX += x * wt;
              sumY += y * wt;
              wSum += wt;
            }
          }
        }
        if (wSum <= 0) return null;
        return { x: sumX / wSum, y: sumY / wSum };
      }

      detect(video) {
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        if (!vw || !vh) return null;
        this.ensureBuffers(vw, vh);
        this.buildMaps(video);
        this.frameIdx++;

        let chosen = null;
        const ACQUIRE_THRESH = 1.28;
        const TRACK_STRUCT_THRESH = 0.98;
        const TRACK_TOTAL_THRESH = 1.38;

        if (this.lock) {
          const localBest = this.localSearch(this.lock);
          if (localBest) {
            const refined = this.refineSubpixel(localBest, true);
            if (refined.score >= TRACK_TOTAL_THRESH && refined.structScore >= TRACK_STRUCT_THRESH) {
              chosen = refined;
            }
          }
          // 定期フルスキャンでより確かな顔へ自動乗り換え（大きな移動やロストからの即復帰）
          if (!chosen || this.frameIdx % 8 === 0 || chosen.structScore < 1.45) {
            const globalBest = this.fullScan();
            if (globalBest && globalBest.score >= ACQUIRE_THRESH) {
              const gRef = this.refineSubpixel(globalBest, false);
              if (!chosen) {
                if (gRef.structScore >= ACQUIRE_THRESH) {
                  chosen = gRef;
                  this.hasTemplate = false;
                }
              } else {
                const dist = Math.hypot(gRef.cx - chosen.cx, gRef.cy - chosen.cy);
                const sizeRatio = Math.max(gRef.w / chosen.w, chosen.w / gRef.w);
                if ((dist > chosen.w * 0.65 || sizeRatio > 1.28) && gRef.structScore > chosen.structScore * 1.22) {
                  this.switchStreak++;
                  if (this.switchStreak >= 1) {
                    chosen = gRef;
                    this.hasTemplate = false;
                    this.switchStreak = 0;
                  }
                } else {
                  this.switchStreak = 0;
                }
              }
            }
          }
        } else {
          const globalBest = this.fullScan();
          if (globalBest && globalBest.score >= ACQUIRE_THRESH) {
            const gRef = this.refineSubpixel(globalBest, false);
            if (gRef.structScore >= ACQUIRE_THRESH) {
              chosen = gRef;
            }
          }
        }

        if (!chosen) {
          this.missFrames++;
          if (this.missFrames >= 12) {
            this.lock = null;
            this.hasTemplate = false;
          }
          return null;
        }

        this.missFrames = 0;
        this.lock = {
          cx: chosen.cx,
          cy: chosen.cy,
          w: chosen.w,
          h: chosen.h,
          score: chosen.score,
        };
        if (chosen.structScore >= 1.20) {
          this.updateTemplate(chosen.x, chosen.y, chosen.w, chosen.h, this.hasTemplate ? 0.08 : 1.0);
        }

        const minDim = Math.min(this.w, this.h);
        const confidence = clamp((chosen.structScore - 0.85) / 1.45, 0.15, 1.0);
        return {
          rawX: chosen.cx / this.w,
          rawY: chosen.cy / this.h,
          rawScale: chosen.w / minDim,
          confidence,
          box: {
            x: chosen.x / this.w,
            y: chosen.y / this.h,
            w: chosen.w / this.w,
            h: chosen.h / this.h,
          },
          engine: 'builtin',
        };
      }
    }

    // ===== カメラ視点追従（Off-Axis Projection：仮想「窓」モデル） =====
    const WIN_Z = HALF_Z + GLASS_T; // +0.154 m（水槽の前面ガラス面＝ゼロ視差の「窓」）
    const WIN_Y = -0.002;
    const WIN_BASE_HALF_H = 0.212;
    const WIN_MIN_ASPECT = 0.96;
    const BASE_EYE_Y = 0.052;
    const BASE_REL_Z = 0.58;

    // ===== 昼／夜（ライトアップ）照明切替 =====
    let currentLighting = 'day'; // 'day' | 'night'
    let headtrackMenuOpen = false;

    const LIGHTING_PRESETS = {
      day: {
        bg: 0xb9cad6,
        exposure: 0.94,
        envIntensity: 0.28,
        hemiSky: 0xd4e8f2,
        hemiGround: 0x525d62,
        hemiInt: 0.44,
        ledColor: 0xf6fcff,
        ledInt: 1.75,
        fillColor: 0xa4d6eb,
        fillInt: 0.24,
        rimColor: 0xb8ecfc,
        rimInt: 0.28,
        pointColor: 0xeefaff,
        pointInt: 0.46,
        pointDist: 0.62,
        ledStripColor: 0xf4fcff,
        fogColor: 0x529ba8,
        fogStrength: 0.20,
        causticsBoost: 1.0,
        rayStrength: 0.075,
        deskShadowOp: 1.0,
        nightMix: 0.0,
      },
      night: {
        bg: 0x09131c,
        exposure: 1.00,
        envIntensity: 0.16,
        hemiSky: 0x224664,
        hemiGround: 0x0a141d,
        hemiInt: 0.24,
        ledColor: 0xdff5ff,
        ledInt: 1.95,
        fillColor: 0x4ca2cc,
        fillInt: 0.26,
        rimColor: 0x62cae8,
        rimInt: 0.40,
        pointColor: 0xd4f4ff,
        pointInt: 0.74,
        pointDist: 0.56,
        ledStripColor: 0xd8f8ff,
        fogColor: 0x0d364a,
        fogStrength: 0.25,
        causticsBoost: 1.42,
        rayStrength: 0.125,
        deskShadowOp: 0.90,
        nightMix: 1.0,
      },
    };

    function applyLightingMode(mode) {
      if (mode !== 'day' && mode !== 'night') return false;
      currentLighting = mode;
      const p = LIGHTING_PRESETS[mode];
      const isNight = mode === 'night';

      scene.background.setHex(p.bg);
      renderer.toneMappingExposure = p.exposure;
      if ('environmentIntensity' in scene) {
        scene.environmentIntensity = p.envIntensity;
      }
      hemiLight.color.setHex(p.hemiSky);
      hemiLight.groundColor.setHex(p.hemiGround);
      hemiLight.intensity = p.hemiInt;
      ledLight.color.setHex(p.ledColor);
      ledLight.intensity = p.ledInt;
      fillLight.color.setHex(p.fillColor);
      fillLight.intensity = p.fillInt;
      rimLight.color.setHex(p.rimColor);
      rimLight.intensity = p.rimInt;
      tankLampPoint.color.setHex(p.pointColor);
      tankLampPoint.intensity = p.pointInt;
      tankLampPoint.distance = p.pointDist;
      if (ledStripMat) ledStripMat.color.setHex(p.ledStripColor);
      if (deskShadowMat) deskShadowMat.opacity = p.deskShadowOp;

      envUniforms.uNightMix.value = p.nightMix;
      envUniforms.uCausticsBoost.value = p.causticsBoost;
      envUniforms.uWaterFogColor.value.setHex(p.fogColor);
      envUniforms.uWaterFogStrength.value = p.fogStrength;
      envUniforms.uRayStrength.value = p.rayStrength;

      document.body.classList.toggle('is-night', isNight);
      lightToggleBtn.classList.toggle('is-night', isNight);
      lightToggleBtn.setAttribute('aria-pressed', String(isNight));
      lightToggleBtn.textContent = isNight ? '昼モード' : '夜ライト';

      renderCurrentMode();
      return true;
    }

    const builtinTracker = new BuiltinFaceTracker();
    const filterX = new OneEuroFilter(1.25, 2.8, 1.0);
    const filterY = new OneEuroFilter(1.25, 2.8, 1.0);
    const filterScale = new OneEuroFilter(0.78, 1.45, 1.0);

    const savedOrbitCamPos = camera.position.clone();
    const savedOrbitTarget = controls.target.clone();

    const ht = {
      active: false,
      starting: false,
      virtualMode: false,
      status: 'idle', // 'idle' | 'starting' | 'tracking' | 'searching' | 'fallback'
      engine: 'none', // 'none' | 'native' | 'builtin' | 'virtual'
      stream: null,
      nativeDetector: null,
      nativeFailed: false,
      nativeBusy: false,
      nativeEmptyStreak: 0,
      lastDetectMs: 0,
      lastSeenMs: 0,
      stableFrames: 0,
      confidence: 0,
      rawX: 0.5,
      rawY: 0.46,
      rawScale: 0.28,
      calib: { x: 0.5, y: 0.46, scale: 0.28, autoScaleDone: false },
      headX: 0, // ユーザー視点：右が +
      headY: 0, // ユーザー視点：上が +
      scaleRatio: 1.0, // 近づくと > 1
      targetEyeX: 0,
      targetEyeY: BASE_EYE_Y,
      targetEyeZ: WIN_Z + BASE_REL_Z,
      eyeX: 0,
      eyeY: BASE_EYE_Y,
      eyeZ: WIN_Z + BASE_REL_Z,
      box: null,
      fallbackReason: null,
      previewVisible: true,
      lastFrustum: { left: 0, right: 0, top: 0, bottom: 0, relZ: BASE_REL_Z },
    };

    function getWindowHalfExtents() {
      const w = Math.max(1, window.innerWidth);
      const h = Math.max(1, window.innerHeight);
      const aspect = w / h;
      if (aspect < WIN_MIN_ASPECT) {
        const halfW = WIN_BASE_HALF_H * WIN_MIN_ASPECT;
        return { halfW, halfH: halfW / Math.max(aspect, 0.25) };
      }
      const halfH = WIN_BASE_HALF_H;
      return { halfW: halfH * aspect, halfH };
    }

    function updateHeadTrackTargets(headX, headY, scaleRatio) {
      ht.headX = clamp(headX, -1.25, 1.25);
      ht.headY = clamp(headY, -1.25, 1.25);
      ht.scaleRatio = clamp(scaleRatio, 0.52, 2.25);

      // 顔の移動量 → 水槽を覗き込む仮想目線位置（机天板の下には絶対潜らない）
      ht.targetEyeX = clamp(ht.headX * 0.42, -0.44, 0.44);
      ht.targetEyeY = clamp(BASE_EYE_Y + ht.headY * 0.30, DESK_Y + 0.042, 0.40);
      const relZ = clamp(BASE_REL_Z / Math.pow(ht.scaleRatio, 0.92), 0.25, 0.96);
      ht.targetEyeZ = WIN_Z + relZ;
    }

    function applyOffAxisCamera(dt) {
      // 未検出が一定時間続いたらゆっくり正面へ戻す
      if (ht.active && !ht.virtualMode && ht.status === 'searching') {
        const lostSec = (performance.now() - ht.lastSeenMs) / 1000;
        if (lostSec > 0.65) {
          const backRate = 1 - Math.exp(-1.6 * dt);
          ht.targetEyeX += (0 - ht.targetEyeX) * backRate;
          ht.targetEyeY += (BASE_EYE_Y - ht.targetEyeY) * backRate;
          ht.targetEyeZ += (WIN_Z + BASE_REL_Z - ht.targetEyeZ) * backRate;
        }
      }

      const followRate = ht.virtualMode ? 1.0 : (1 - Math.exp(-14.0 * dt));
      ht.eyeX += (ht.targetEyeX - ht.eyeX) * followRate;
      ht.eyeY += (ht.targetEyeY - ht.eyeY) * followRate;
      ht.eyeZ += (ht.targetEyeZ - ht.eyeZ) * followRate;

      const { halfW, halfH } = getWindowHalfExtents();
      const near = 0.02;
      const far = 20.0;
      const relX = ht.eyeX;
      const relY = ht.eyeY - WIN_Y;
      const relZ = Math.max(0.18, ht.eyeZ - WIN_Z);
      const s = near / relZ;

      const left = (-halfW - relX) * s;
      const right = (halfW - relX) * s;
      const bottom = (-halfH - relY) * s;
      const top = (halfH - relY) * s;

      // Off-Axis Projection：カメラは回転せず窓面(-Z)を真っすぐ向き、視錐台を非対称にせん断
      camera.position.set(ht.eyeX, ht.eyeY, ht.eyeZ);
      camera.quaternion.identity();
      camera.near = near;
      camera.far = far;
      camera.projectionMatrix.makePerspective(left, right, top, bottom, near, far);
      camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
      camera.updateMatrixWorld();

      ht.lastFrustum.left = Number(left.toFixed(6));
      ht.lastFrustum.right = Number(right.toFixed(6));
      ht.lastFrustum.top = Number(top.toFixed(6));
      ht.lastFrustum.bottom = Number(bottom.toFixed(6));
      ht.lastFrustum.relZ = Number(relZ.toFixed(4));
    }

    function updateCamHudUI() {
      const isCamOn = currentMode === 'headtrack' && (ht.active || ht.virtualMode);
      if (!isCamOn) headtrackMenuOpen = false;
      document.body.classList.toggle('is-headtrack', isCamOn);
      document.body.classList.toggle('is-menu-open', isCamOn && headtrackMenuOpen);

      cameraTrackBtn.classList.toggle('is-active', isCamOn);
      cameraTrackBtn.classList.toggle('is-busy', ht.starting);
      cameraTrackBtn.setAttribute('aria-pressed', String(isCamOn));
      cameraTrackBtnLabel.textContent = ht.starting
        ? 'カメラを起動中…'
        : isCamOn
          ? '止める'
          : 'カメラ視点追従をはじめる';
      recenterBtn.classList.toggle('visible', isCamOn);
      menuToggleBtn.setAttribute('aria-expanded', String(headtrackMenuOpen));
      menuToggleBtn.textContent = headtrackMenuOpen ? '閉じる' : 'メニュー';

      camMonitorEl.classList.toggle('visible', isCamOn && !ht.virtualMode);
      camMonitorEl.classList.toggle('is-minimized', !ht.previewVisible);
      camTogglePreviewBtn.textContent = ht.previewVisible ? '映像を隠す' : '映像を表示';

      camStatusDotEl.classList.remove('tracking', 'searching');
      if (ht.status === 'tracking') {
        camStatusDotEl.classList.add('tracking');
        camStatusTextEl.textContent = '顔を認識中';
      } else if (ht.status === 'searching') {
        camStatusDotEl.classList.add('searching');
        camStatusTextEl.textContent = '顔をさがしています';
      } else if (ht.status === 'starting') {
        camStatusDotEl.classList.add('searching');
        camStatusTextEl.textContent = '起動中…';
      } else {
        camStatusTextEl.textContent = '停止中';
      }
    }

    function setTipMessage(text, isNotice = false) {
      hudTipEl.textContent = text;
      hudTipEl.classList.toggle('is-notice', isNotice);
    }

    function drawCamPreview() {
      if (!ht.active || !ht.previewVisible || ht.virtualMode) return;
      const vw = headtrackVideo.videoWidth;
      const vh = headtrackVideo.videoHeight;
      if (!vw || !vh) return;
      const cw = camPreviewCanvas.width;
      const ch = camPreviewCanvas.height;

      camPreviewCtx.save();
      // 鏡像反転して直感的に見せる
      camPreviewCtx.translate(cw, 0);
      camPreviewCtx.scale(-1, 1);
      camPreviewCtx.drawImage(headtrackVideo, 0, 0, cw, ch);
      camPreviewCtx.restore();

      if (ht.status === 'tracking' && ht.box) {
        const bx = (1 - ht.box.x - ht.box.w) * cw;
        const by = ht.box.y * ch;
        const bw = ht.box.w * cw;
        const bh = ht.box.h * ch;
        const r = Math.min(10, bw * 0.25, bh * 0.25);

        camPreviewCtx.save();
        camPreviewCtx.strokeStyle = '#38f0a4';
        camPreviewCtx.lineWidth = 2.2;
        camPreviewCtx.beginPath();
        // 4隅のコーナー括弧
        camPreviewCtx.moveTo(bx, by + r); camPreviewCtx.lineTo(bx, by); camPreviewCtx.lineTo(bx + r, by);
        camPreviewCtx.moveTo(bx + bw - r, by); camPreviewCtx.lineTo(bx + bw, by); camPreviewCtx.lineTo(bx + bw, by + r);
        camPreviewCtx.moveTo(bx + bw, by + bh - r); camPreviewCtx.lineTo(bx + bw, by + bh); camPreviewCtx.lineTo(bx + bw - r, by + bh);
        camPreviewCtx.moveTo(bx + r, by + bh); camPreviewCtx.lineTo(bx, by + bh); camPreviewCtx.lineTo(bx, by + bh - r);
        camPreviewCtx.stroke();

        // 認識中心ドット
        const cx = (1 - ht.rawX) * cw;
        const cy = ht.rawY * ch;
        camPreviewCtx.fillStyle = '#aefce0';
        camPreviewCtx.beginPath();
        camPreviewCtx.arc(cx, cy, 2.5, 0, Math.PI * 2);
        camPreviewCtx.fill();
        camPreviewCtx.restore();
      }
    }

    function ingestFaceDetection(det, nowMs) {
      if (!det) {
        if (ht.status !== 'searching' && nowMs - ht.lastSeenMs > 450) {
          ht.status = 'searching';
          ht.confidence = 0;
          ht.box = null;
          updateCamHudUI();
        }
        return;
      }

      const dtSec = ht.lastSeenMs > 0 ? clamp((nowMs - ht.lastSeenMs) / 1000, 1 / 120, 0.25) : 0.033;
      ht.lastSeenMs = nowMs;
      ht.rawX = det.rawX;
      ht.rawY = det.rawY;
      ht.rawScale = det.rawScale;
      ht.confidence = det.confidence;
      ht.box = det.box;
      ht.engine = det.engine;
      ht.stableFrames++;

      // 最初の安定検出時に現在距離（顔サイズ）を標準基準として馴染ませる
      if (!ht.calib.autoScaleDone && ht.stableFrames >= 4) {
        ht.calib.scale = clamp(det.rawScale, 0.16, 0.54);
        ht.calib.autoScaleDone = true;
      }

      const fx = filterX.filter(det.rawX, dtSec);
      const fy = filterY.filter(det.rawY, dtSec);
      const fScale = filterScale.filter(det.rawScale, dtSec);

      // 生カメラ座標：ユーザーが自分の右へ動くと rawX が減る → (calib.x - fx) が +（右）
      const headX = (ht.calib.x - fx) * 2.0;
      const headY = (ht.calib.y - fy) * 2.0;
      const scaleRatio = fScale / Math.max(0.08, ht.calib.scale);
      updateHeadTrackTargets(headX, headY, scaleRatio);

      if (ht.status !== 'tracking') {
        ht.status = 'tracking';
        updateCamHudUI();
      }
    }

    function stepFaceDetection(nowMs) {
      if (!ht.active || ht.virtualMode) return;
      if (headtrackVideo.readyState < 2 || !headtrackVideo.videoWidth || !headtrackVideo.videoHeight) return;
      if (nowMs - ht.lastDetectMs < 32) return; // 最大約30fpsで軽量処理
      ht.lastDetectMs = nowMs;

      // Tier 0：対応ブラウザのネイティブ FaceDetector を優先試行（エラーや空連続時は内蔵へ自動移行）
      if (ht.nativeDetector && !ht.nativeFailed && ht.nativeEmptyStreak < 8) {
        if (!ht.nativeBusy) {
          ht.nativeBusy = true;
          ht.nativeDetector.detect(headtrackVideo).then((faces) => {
            ht.nativeBusy = false;
            if (!ht.active || ht.virtualMode) return;
            if (faces && faces.length > 0) {
              ht.nativeEmptyStreak = 0;
              // 最も大きい顔を採用
              let best = faces[0];
              let bestArea = best.boundingBox.width * best.boundingBox.height;
              for (let i = 1; i < faces.length; i++) {
                const area = faces[i].boundingBox.width * faces[i].boundingBox.height;
                if (area > bestArea) { best = faces[i]; bestArea = area; }
              }
              const bb = best.boundingBox;
              const vw = headtrackVideo.videoWidth;
              const vh = headtrackVideo.videoHeight;
              const minDim = Math.min(vw, vh);
              let cx = bb.x + bb.width * 0.5;
              let cy = bb.y + bb.height * 0.5;
              // 両目ランドマークがあれば目線中心を優先ブレンド
              if (best.landmarks && best.landmarks.length > 0) {
                const eyes = best.landmarks.filter((lm) => lm.type === 'eye' && lm.locations && lm.locations.length > 0);
                if (eyes.length >= 2) {
                  const e0 = eyes[0].locations[0];
                  const e1 = eyes[1].locations[0];
                  cx = cx * 0.45 + 0.5 * (e0.x + e1.x) * 0.55;
                  cy = cy * 0.55 + (0.5 * (e0.y + e1.y) + bb.height * 0.08) * 0.45;
                }
              }
              ingestFaceDetection({
                rawX: clamp(cx / vw, 0, 1),
                rawY: clamp(cy / vh, 0, 1),
                rawScale: clamp(bb.width / minDim, 0.08, 0.9),
                confidence: 0.96,
                box: { x: bb.x / vw, y: bb.y / vh, w: bb.width / vw, h: bb.height / vh },
                engine: 'native',
              }, performance.now());
            } else {
              ht.nativeEmptyStreak++;
              const fallbackDet = builtinTracker.detect(headtrackVideo);
              if (fallbackDet) {
                ht.nativeEmptyStreak = 8; // 内蔵エンジンで確実に検出できたので切替
                ingestFaceDetection(fallbackDet, performance.now());
              } else {
                ingestFaceDetection(null, performance.now());
              }
            }
            drawCamPreview();
          }).catch(() => {
            ht.nativeBusy = false;
            ht.nativeFailed = true;
          });
        }
        return;
      }

      // Tier 1：内蔵オンデバイス顔検出＆トラッカー（完全ローカル）
      const det = builtinTracker.detect(headtrackVideo);
      ingestFaceDetection(det, nowMs);
      drawCamPreview();
    }

    function stopCameraStream() {
      if (ht.stream) {
        const tracks = ht.stream.getTracks();
        for (let i = 0; i < tracks.length; i++) {
          try { tracks[i].stop(); } catch (_) {}
        }
        ht.stream = null;
      }
      headtrackVideo.srcObject = null;
      ht.active = false;
      ht.starting = false;
      ht.virtualMode = false;
      ht.nativeBusy = false;
      ht.box = null;
      ht.confidence = 0;
      ht.status = 'idle';
      ht.engine = 'none';
      builtinTracker.reset();
      filterX.reset();
      filterY.reset();
      filterScale.reset();
    }

    function recenterHeadTrack() {
      if (ht.status === 'tracking') {
        ht.calib.x = clamp(ht.rawX, 0.15, 0.85);
        ht.calib.y = clamp(ht.rawY, 0.15, 0.85);
        ht.calib.scale = clamp(ht.rawScale, 0.14, 0.62);
        ht.calib.autoScaleDone = true;
        filterX.reset();
        filterY.reset();
        filterScale.reset();
        updateHeadTrackTargets(0, 0, 1.0);
        setTipMessage('現在の顔の位置を正面に合わせました。顔を動かして水槽の中を覗き込んでください', false);
      } else {
        ht.calib = { x: 0.5, y: 0.46, scale: 0.28, autoScaleDone: false };
        updateHeadTrackTargets(0, 0, 1.0);
        setTipMessage('正面位置を初期値に戻しました', false);
      }
    }

    async function startCameraTracking() {
      if (ht.starting) return false;
      if (ht.active && currentMode === 'headtrack') {
        applyMode('normal');
        return false;
      }

      // 事前にカメラAPIの存在を確認（HTTP非対応やカメラ無しでもエラーを出さずドラッグ継続）
      if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
        ht.status = 'fallback';
        ht.fallbackReason = 'unsupported';
        applyMode('normal');
        setTipMessage('この環境ではカメラが使えないため、ドラッグ・ホイール操作で見回せます', true);
        updateCamHudUI();
        return false;
      }

      ht.starting = true;
      ht.status = 'starting';
      ht.fallbackReason = null;
      updateCamHudUI();
      setTipMessage('前面カメラの使用許可を確認しています（映像は端末内のみで処理します）…', false);

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'user' },
            width: { ideal: 640 },
            height: { ideal: 480 },
          },
          audio: false,
        });

        // 許可待ちの間に別モードへ切り替えられていたら即解放
        if (!ht.starting) {
          stream.getTracks().forEach((t) => t.stop());
          return false;
        }

        ht.stream = stream;
        headtrackVideo.srcObject = stream;
        try {
          await headtrackVideo.play();
        } catch (_) {
          // 自動再生が遅延してもフレーム準備後に進行
        }

        // ネイティブ FaceDetector があれば用意（失敗時は自動で内蔵エンジンにフォールバック）
        if (!ht.nativeDetector && !ht.nativeFailed && typeof window.FaceDetector === 'function') {
          try {
            ht.nativeDetector = new window.FaceDetector({ fastMode: true, maxDetectedFaces: 1 });
          } catch (_) {
            ht.nativeFailed = true;
          }
        }

        // 現在のドラッグカメラ位置を退避し、窓モードへ滑らかに移行
        savedOrbitCamPos.copy(camera.position);
        savedOrbitTarget.copy(controls.target);

        builtinTracker.reset();
        filterX.reset();
        filterY.reset();
        filterScale.reset();
        ht.calib = { x: 0.5, y: 0.46, scale: 0.28, autoScaleDone: false };
        ht.stableFrames = 0;
        ht.nativeEmptyStreak = 0;
        ht.lastDetectMs = 0;
        ht.lastSeenMs = performance.now();
        ht.starting = false;
        ht.active = true;
        ht.virtualMode = false;
        ht.status = 'searching';
        ht.engine = (ht.nativeDetector && !ht.nativeFailed) ? 'native' : 'builtin';
        ht.eyeX = 0;
        ht.eyeY = BASE_EYE_Y;
        ht.eyeZ = WIN_Z + BASE_REL_Z;
        updateHeadTrackTargets(0, 0, 1.0);

        currentMode = 'headtrack';
        controls.enabled = false;
        stereoGuidesEl.classList.remove('visible');
        for (const btn of modeButtons) {
          btn.classList.remove('is-active');
          btn.setAttribute('aria-pressed', 'false');
        }
        hudModeLabelEl.textContent = MODE_LABELS.headtrack;
        setTipMessage(MODE_HINTS.headtrack, false);
        updateCamHudUI();
        applyOffAxisCamera(0.016);
        renderCurrentMode();
        return true;
      } catch (err) {
        stopCameraStream();
        const name = err && err.name ? err.name : 'Error';
        ht.status = 'fallback';
        ht.fallbackReason = name;

        let msg = 'カメラを起動できないため、ドラッグ・ホイール操作で見回せます';
        if (name === 'NotAllowedError' || name === 'PermissionDeniedError' || name === 'SecurityError') {
          msg = 'カメラが許可されなかったため、ドラッグ・ホイール操作で見回せます';
        } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError' || name === 'OverconstrainedError') {
          msg = '前面カメラが見つからないため、ドラッグ・ホイール操作で見回せます';
        } else if (name === 'NotReadableError' || name === 'TrackStartError') {
          msg = 'カメラが他のアプリで使用中のため、ドラッグ・ホイール操作で見回せます';
        }

        // エラーをコンソールに出さず、既存のドラッグ操作モードへ確実に復帰
        applyMode('normal');
        setTipMessage(msg, true);
        updateCamHudUI();
        return false;
      }
    }

    function updateCameraProjectionForMode() {
      if (currentMode === 'headtrack') {
        applyOffAxisCamera(0.016);
        return;
      }
      const w = Math.max(1, window.innerWidth);
      const h = Math.max(1, window.innerHeight);
      const fullAspect = w / h;
      const effAspect = (currentMode === 'cross' || currentMode === 'parallel') ? fullAspect * 0.5 : fullAspect;
      // 縦長スマホでも立体視の左右画面内に 30cm 水槽全体が収まるよう視野角を自動調整
      const baseHalfTan = Math.tan(THREE.MathUtils.degToRad(BASE_FOV * 0.5));
      const adjFov = effAspect < 0.86
        ? clamp(THREE.MathUtils.radToDeg(2 * Math.atan(baseHalfTan * (0.86 / Math.max(effAspect, 0.25)))), BASE_FOV, 68)
        : BASE_FOV;
      camera.aspect = fullAspect;
      camera.fov = adjFov;
      camera.near = 0.02;
      camera.far = 20;
      camera.updateProjectionMatrix();
    }

    function applyMode(name) {
      if (!VALID_MODES.includes(name)) return false;

      if (name === 'headtrack') {
        startCameraTracking();
        return true;
      }

      const wasHeadTrack = currentMode === 'headtrack' || ht.active || ht.starting || ht.virtualMode;
      if (wasHeadTrack) {
        stopCameraStream();
        camera.position.copy(savedOrbitCamPos);
        controls.target.copy(savedOrbitTarget);
        controls.enabled = true;
      }

      currentMode = name;
      for (const btn of modeButtons) {
        const active = btn.dataset.mode === name;
        btn.classList.toggle('is-active', active);
        btn.setAttribute('aria-pressed', String(active));
      }
      hudModeLabelEl.textContent = MODE_LABELS[name];
      setTipMessage(MODE_HINTS[name], false);

      const isSideBySide = name === 'cross' || name === 'parallel';
      stereoGuidesEl.classList.toggle('visible', isSideBySide);
      if (name === 'cross') {
        eyeTagLeftEl.textContent = '左：右目用';
        eyeTagRightEl.textContent = '右：左目用';
      } else if (name === 'parallel') {
        eyeTagLeftEl.textContent = '左：左目用';
        eyeTagRightEl.textContent = '右：右目用';
      }
      updateCamHudUI();
      updateCameraProjectionForMode();
      controls.update();
      renderCurrentMode();
      return true;
    }

    cameraTrackBtn.addEventListener('click', () => {
      if (currentMode === 'headtrack' && (ht.active || ht.virtualMode)) {
        applyMode('normal');
      } else {
        startCameraTracking();
      }
    });

    recenterBtn.addEventListener('click', () => {
      recenterHeadTrack();
    });

    lightToggleBtn.addEventListener('click', () => {
      applyLightingMode(currentLighting === 'day' ? 'night' : 'day');
    });

    menuToggleBtn.addEventListener('click', () => {
      headtrackMenuOpen = !headtrackMenuOpen;
      updateCamHudUI();
    });

    camTogglePreviewBtn.addEventListener('click', () => {
      ht.previewVisible = !ht.previewVisible;
      updateCamHudUI();
    });

    for (const btn of modeButtons) {
      btn.addEventListener('click', () => applyMode(btn.dataset.mode));
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === '1') applyMode('normal');
      else if (e.key === '2') applyMode('cross');
      else if (e.key === '3') applyMode('parallel');
      else if (e.key === '4') applyMode('anaglyph');
      else if (e.key === 'n' || e.key === 'N' || e.key === 'l' || e.key === 'L') {
        applyLightingMode(currentLighting === 'day' ? 'night' : 'day');
      } else if (e.key === 'r' || e.key === 'R') {
        if (currentMode === 'headtrack') recenterHeadTrack();
      }
    });

    window.addEventListener('pagehide', stopCameraStream);
    window.addEventListener('beforeunload', stopCameraStream);

    window.addEventListener('resize', () => {
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      updateCameraProjectionForMode();
      if (currentMode === 'anaglyph') ensureAnaglyphTargets();
      renderCurrentMode();
    });

    function computeFishExtents() {
      let maxAbsX = 0;
      let maxAbsY = 0;
      let maxAbsZ = 0;
      let maxBodyAbsX = 0;
      let maxBodyAbsY = 0;
      let maxBodyAbsZ = 0;
      for (let i = 0; i < fishAgents.length; i++) {
        const ag = fishAgents[i];
        const p = ag.actor.object.position;
        const ax = Math.abs(p.x);
        const ay = Math.abs(p.y);
        const az = Math.abs(p.z);
        if (ax > maxAbsX) maxAbsX = ax;
        if (ay > maxAbsY) maxAbsY = ay;
        if (az > maxAbsZ) maxAbsZ = az;

        const halfL = ag.actor.length * 0.5;
        const halfH = ag.lim.bodyHalfY;
        if (ax + halfL > maxBodyAbsX) maxBodyAbsX = ax + halfL;
        if (ay + halfH > maxBodyAbsY) maxBodyAbsY = ay + halfH;
        if (az + halfL > maxBodyAbsZ) maxBodyAbsZ = az + halfL;
      }
      return {
        maxAbsX: Number(maxAbsX.toFixed(5)),
        maxAbsY: Number(maxAbsY.toFixed(5)),
        maxAbsZ: Number(maxAbsZ.toFixed(5)),
        halfX: HALF_X,
        halfY: HALF_Y,
        halfZ: HALF_Z,
        maxBodyAbsX: Number(maxBodyAbsX.toFixed(5)),
        maxBodyAbsY: Number(maxBodyAbsY.toFixed(5)),
        maxBodyAbsZ: Number(maxBodyAbsZ.toFixed(5)),
        inside: maxAbsX <= HALF_X && maxAbsY <= HALF_Y && maxAbsZ <= HALF_Z,
      };
    }

    const stereoHook = {
      ready: false,
      fishCount: 0,
      mode: () => currentMode,
      setMode: (name) => applyMode(name),
      fishExtents: () => computeFishExtents(),
      headTrack: () => ({
        active: ht.active,
        virtualMode: ht.virtualMode,
        status: ht.status,
        engine: ht.engine,
        confidence: Number(ht.confidence.toFixed(3)),
        rawX: Number(ht.rawX.toFixed(4)),
        rawY: Number(ht.rawY.toFixed(4)),
        rawScale: Number(ht.rawScale.toFixed(4)),
        headX: Number(ht.headX.toFixed(4)),
        headY: Number(ht.headY.toFixed(4)),
        scaleRatio: Number(ht.scaleRatio.toFixed(4)),
        eyePos: [
          Number(ht.eyeX.toFixed(4)),
          Number(ht.eyeY.toFixed(4)),
          Number(ht.eyeZ.toFixed(4)),
        ],
        frustum: { ...ht.lastFrustum },
        cameraPos: [
          Number(camera.position.x.toFixed(4)),
          Number(camera.position.y.toFixed(4)),
          Number(camera.position.z.toFixed(4)),
        ],
        controlsEnabled: controls.enabled,
        fallbackReason: ht.fallbackReason,
      }),
      // カメラ非接続環境での Off-Axis 投影単体検証用
      setVirtualHead: (hx, hy, scaleRatio = 1.0) => {
        if (hx === null || hx === undefined) {
          applyMode('normal');
          return stereoHook.headTrack();
        }
        const alreadyVirtual = currentMode === 'headtrack' && ht.virtualMode;
        if (currentMode !== 'headtrack') {
          savedOrbitCamPos.copy(camera.position);
          savedOrbitTarget.copy(controls.target);
        }
        if (!alreadyVirtual) {
          stopCameraStream();
          fishReaction.prevHeadValid = false;
        }
        currentMode = 'headtrack';
        ht.virtualMode = true;
        ht.status = 'tracking';
        ht.engine = 'virtual';
        controls.enabled = false;
        stereoGuidesEl.classList.remove('visible');
        for (const btn of modeButtons) {
          btn.classList.remove('is-active');
          btn.setAttribute('aria-pressed', 'false');
        }
        hudModeLabelEl.textContent = MODE_LABELS.headtrack;
        setTipMessage(MODE_HINTS.headtrack, false);
        updateHeadTrackTargets(hx, hy, scaleRatio);
        ht.eyeX = ht.targetEyeX;
        ht.eyeY = ht.targetEyeY;
        ht.eyeZ = ht.targetEyeZ;
        updateCamHudUI();
        applyOffAxisCamera(0.016);
        if (stereoHook.ready) {
          updateHeadStartle(0.05);
        }
        renderCurrentMode();
        return stereoHook.headTrack();
      },
      recenter: () => recenterHeadTrack(),
      lighting: () => currentLighting,
      setLighting: (mode) => applyLightingMode(mode),
      fishState: () => {
        let sx = 0, sz = 0, sc = 0;
        let hoverCount = 0, restCount = 0, lookingCount = 0, startledCount = 0;
        let maxLookAt = 0;
        const speciesMotion = {};
        for (let i = 0; i < fishAgents.length; i++) {
          const ag = fishAgents[i];
          if (ag.cfg.school) {
            sx += Math.sin(ag.yaw);
            sz += Math.cos(ag.yaw);
            sc++;
          }
          if (ag.behavior === 'hover') hoverCount++;
          if (ag.behavior === 'rest') restCount++;
          if (ag.lookAtAmount > 0.15) lookingCount++;
          if (ag.lookAtAmount > maxLookAt) maxLookAt = ag.lookAtAmount;
          if (ag.startleTimer > 0) startledCount++;
          if (!speciesMotion[ag.species]) speciesMotion[ag.species] = [];
          speciesMotion[ag.species].push({
            behavior: ag.behavior,
            motion: ag.actor.motion,
            speed: Number(ag.actor.currentSpeed.toFixed(4)),
            lookAt: Number(ag.lookAtAmount.toFixed(3)),
            startled: ag.startleTimer > 0,
            lenCm: Number((ag.actor.length * 100).toFixed(2)),
          });
        }
        return {
          schoolAlignment: sc > 0 ? Number((Math.hypot(sx, sz) / sc).toFixed(4)) : 0,
          schoolHeadingDeg: Math.round((schoolYaw * 180) / Math.PI),
          hoverCount,
          restCount,
          viewerProximity: Number(fishReaction.viewerProximity.toFixed(3)),
          lookingCount,
          maxLookAt: Number(maxLookAt.toFixed(3)),
          startleCount: fishReaction.startleCount,
          lastStartleReason: fishReaction.lastStartleReason,
          startledCount,
          speciesMotion,
        };
      },
    };
    window.__STEREO = stereoHook;

    // ===== 10. 描画パス（カメラ視点追従 / 通常 / 交差法 / 平行法 / アナグリフ） =====
    function updateStereoRig(aspectScale) {
      const dist = camera.position.distanceTo(controls.target);
      // ゼロ視差面を水槽手前寄りに置き、前方の魚や泡が飛び出し奥の水草が沈む奥行きを作る
      camera.focus = Math.max(0.24, dist * 0.94);
      stereo.aspect = aspectScale;
      stereo.eyeSep = clamp(dist * 0.072, 0.028, 0.066);
      camera.updateMatrixWorld();
      stereo.update(camera);
      stereo.cameraL.updateMatrixWorld();
      stereo.cameraR.updateMatrixWorld();
    }

    function renderCurrentMode() {
      const w = Math.max(1, window.innerWidth);
      const h = Math.max(1, window.innerHeight);

      if (currentMode === 'headtrack' || currentMode === 'normal') {
        renderer.setRenderTarget(null);
        renderer.setScissorTest(false);
        renderer.setViewport(0, 0, w, h);
        renderer.render(scene, camera);
        return;
      }

      if (currentMode === 'cross' || currentMode === 'parallel') {
        updateStereoRig(0.5);
        const halfW = Math.floor(w / 2);
        // 交差法：左に右目用・右に左目用 / 平行法：左に左目用・右に右目用
        const leftHalfCam = currentMode === 'cross' ? stereo.cameraR : stereo.cameraL;
        const rightHalfCam = currentMode === 'cross' ? stereo.cameraL : stereo.cameraR;

        renderer.setRenderTarget(null);
        renderer.setScissorTest(true);

        renderer.setScissor(0, 0, halfW, h);
        renderer.setViewport(0, 0, halfW, h);
        renderer.render(scene, leftHalfCam);

        renderer.setScissor(halfW, 0, w - halfW, h);
        renderer.setViewport(halfW, 0, w - halfW, h);
        renderer.render(scene, rightHalfCam);

        renderer.setScissorTest(false);
        renderer.setViewport(0, 0, w, h);
        return;
      }

      if (currentMode === 'anaglyph') {
        ensureAnaglyphTargets();
        updateStereoRig(1.0);
        renderer.setScissorTest(false);

        renderer.setRenderTarget(anaglyphRTLeft);
        renderer.clear();
        renderer.render(scene, stereo.cameraL);

        renderer.setRenderTarget(anaglyphRTRight);
        renderer.clear();
        renderer.render(scene, stereo.cameraR);

        renderer.setRenderTarget(null);
        renderer.setViewport(0, 0, w, h);
        anaglyphUniforms.uExposure.value = renderer.toneMappingExposure;
        renderer.render(anaglyphScene, anaglyphCamera);
      }
    }

    // ===== 11. 魚キットの非同期読込＆メインループ =====
    let simTime = 0;
    const clock = new THREE.Clock();

    async function initAquarium() {
      try {
        const speciesIds = [...new Set(FISH_ROSTER.map((r) => r.species))];
        await loadFish('./vendor/fish-kit/fish/', speciesIds);

        for (const cfg of FISH_ROSTER) {
          for (let i = 0; i < cfg.count; i++) {
            const lenCm = cfg.lenMin + Math.random() * (cfg.lenMax - cfg.lenMin);
            const actor = createFish(cfg.species, lenCm);
            applyCausticsToFish(actor, 0.42, 0.56);

            const lim = computeFishLimits(actor.length);
            let startPos;
            let yaw;
            let behavior = 'swim';
            let behaviorTimer = 3.2 + Math.random() * 3.0;
            let spotIdx = -1;
            const schoolOffset = new THREE.Vector3(
              (Math.random() - 0.5) * 0.068,
              (Math.random() - 0.5) * 0.040,
              (Math.random() - 0.5) * 0.076
            );

            if (cfg.school) {
              // カタクチイワシは最初から進行方向が揃った銀の群れとして配置
              const cos0 = Math.cos(schoolYaw);
              const sin0 = Math.sin(schoolYaw);
              const fx = schoolOffset.x * cos0 + schoolOffset.z * sin0;
              const fz = -schoolOffset.x * sin0 + schoolOffset.z * cos0;
              startPos = new THREE.Vector3(
                clamp(_schoolCenter.x + fx, -lim.limX + 0.016, lim.limX - 0.016),
                clamp(_schoolCenter.y + schoolOffset.y, cfg.yMin, Math.min(cfg.yMax, lim.maxY)),
                clamp(_schoolCenter.z + fz, -lim.limZ + 0.016, lim.limZ - 0.016)
              );
              yaw = wrapAngle(schoolYaw + (Math.random() - 0.5) * 0.14);
            } else if (cfg.canRest) {
              // カサゴは底砂の岩陰で静かに休む状態から開始
              const picked = pickRockSpot(KASAGO_SPOTS, lim, -1);
              startPos = picked.spot;
              spotIdx = picked.idx;
              yaw = 0.65 + (Math.random() - 0.5) * 0.4;
              behavior = 'rest';
              behaviorTimer = 5.5 + Math.random() * 3.5;
            } else if (cfg.canHover) {
              // メバルは 1 匹目を岩陰ホバリング、2 匹目をゆっくり巡回から開始
              const picked = pickRockSpot(MEBARU_SPOTS, lim, i === 0 ? 1 : 0);
              startPos = picked.spot;
              spotIdx = picked.idx;
              yaw = i === 0 ? 0.55 : -0.85;
              behavior = i === 0 ? 'hover' : 'swim';
              behaviorTimer = i === 0 ? (4.8 + Math.random() * 2.5) : (3.2 + Math.random() * 2.0);
            } else {
              startPos = pickFishWaypoint(cfg, lim);
              yaw = Math.random() * Math.PI * 2 - Math.PI;
            }

            actor.setMotion(behavior === 'hover' || behavior === 'rest' ? 'hover' : 'swim');
            actor.object.position.copy(startPos);
            actor.object.rotation.set(0, yaw, 0, 'YXZ');
            scene.add(actor.object);

            const initWaypoint = (cfg.canHover || cfg.canRest)
              ? pickRockSpot(cfg.canRest ? KASAGO_SPOTS : MEBARU_SPOTS, lim, spotIdx).spot
              : pickFishWaypoint(cfg, lim);

            fishAgents.push({
              species: cfg.species,
              cfg,
              actor,
              lim,
              yaw,
              pitch: 0,
              turnRate: 0,
              drive: { speed: behavior === 'swim' ? cfg.speed : 0, turnRate: 0 },
              waypoint: initWaypoint,
              waypointTimer: 1.5 + Math.random() * 3.5,
              speedBias: (Math.random() - 0.5) * 0.008,
              speedPhase: Math.random() * Math.PI * 2,
              schoolOffset,
              curiousOffset: new THREE.Vector3(
                (Math.random() - 0.5) * 0.095,
                (Math.random() - 0.5) * 0.055,
                (Math.random() - 0.5) * 0.036
              ),
              behavior,
              behaviorTimer,
              spotIdx,
              hoverAnchor: startPos.clone(),
              hoverYaw: yaw,
              lookAtAmount: 0,
              startleTimer: 0,
              startleYaw: yaw,
            });
          }
        }

        // 初期状態を 1 ステップ進めて全個体のシェーダー uniform を同期
        updateFishAgents(0.016, 0);
        updateFishShadows();
        updateBubbles(0.016, 0);
        updateMotes(0.016, 0);

        stereoHook.fishCount = fishAgents.length;
        fishCountLabelEl.textContent = String(fishAgents.length);
        statusOverlayEl.classList.add('hidden');
        updateCamHudUI();
        updateCameraProjectionForMode();
        renderCurrentMode();
        stereoHook.ready = true;
      } catch (err) {
        stereoHook.ready = false;
        const msg = err && err.message ? err.message : String(err);
        console.error('Stereo tank load failed:', err);
        statusBoxEl.classList.add('error');
        statusBoxEl.textContent = `読み込みに失敗しました: ${msg}`;
      }
    }

    initAquarium();

    renderer.setAnimationLoop(() => {
      const rawDt = clock.getDelta();
      const dt = Math.min(rawDt > 0 ? rawDt : 0.016, 0.05);
      simTime += dt;
      envUniforms.uTime.value = simTime;

      if (currentMode === 'headtrack') {
        stepFaceDetection(performance.now());
        applyOffAxisCamera(dt);
        if (stereoHook.ready) updateHeadStartle(dt);
      } else {
        fishReaction.prevHeadValid = false;
        controls.update();
      }

      updateBubbles(dt, simTime);
      updateMotes(dt, simTime);
      if (stereoHook.ready) {
        updateFishAgents(dt, simTime);
        updateFishShadows();
      }
      renderCurrentMode();
    });
  </script>
</body>
</html>
