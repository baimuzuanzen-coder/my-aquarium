    const FISH_SPECS = {

      kurodai:   { zoneCenter: 0.8,  zoneHalf: 0.4,  speed: 0.22, lengthCm: 40, count: 2 },
      buri:      { zoneCenter: 1.2,  zoneHalf: 0.55, speed: 0.55, lengthCm: 85, count: 2 },

    const { clamp, smoothstep } = THREE.MathUtils;

    // ===== 決定論的ノイズ =====
    function hash2(ix, iz, seed = 0) {
      const n = Math.sin(ix * 127.1 + iz * 311.7 + seed * 74.7) * 43758.5453123;
      return n - Math.floor(n);
    }

    function valueNoise2D(x, z, seed = 0) {
      const ix = Math.floor(x);
      const iz = Math.floor(z);
      const fx = x - ix;
      const fz = z - iz;
      const ux = fx * fx * (3 - 2 * fx);
      const uz = fz * fz * (3 - 2 * fz);
      const a = hash2(ix, iz, seed);
      const b = hash2(ix + 1, iz, seed);
      const c = hash2(ix, iz + 1, seed);
      const d = hash2(ix + 1, iz + 1, seed);
      return a + (b - a) * ux + (c - a) * uz + (a - b - c + d) * ux * uz;
    }

    function fbm2D(x, z, seed = 0) {
      let val = 0;
      let amp = 0.5;
      let freq = 1;
      for (let i = 0; i < 3; i++) {
        val += (valueNoise2D(x * freq, z * freq, seed + i * 19) * 2 - 1) * amp;
        freq *= 2.05;
        amp *= 0.5;
      }
      return val;
    }

    function hash3(ix, iy, iz, seed = 0) {
      const n = Math.sin(ix * 127.1 + iy * 311.7 + iz * 191.999 + seed * 53.3) * 43758.5453123;
      return n - Math.floor(n);
    }

    function valueNoise3D(x, y, z, seed = 0) {
      const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
      const fx = x - ix, fy = y - iy, fz = z - iz;
      const ux = fx * fx * (3 - 2 * fx);
      const uy = fy * fy * (3 - 2 * fy);
      const uz = fz * fz * (3 - 2 * fz);
      const lerp = (a, b, t) => a + (b - a) * t;
      const c000 = hash3(ix, iy, iz, seed);
      const c100 = hash3(ix + 1, iy, iz, seed);
      const c010 = hash3(ix, iy + 1, iz, seed);
      const c110 = hash3(ix + 1, iy + 1, iz, seed);
      const c001 = hash3(ix, iy, iz + 1, seed);
      const c101 = hash3(ix + 1, iy, iz + 1, seed);
      const c011 = hash3(ix, iy + 1, iz + 1, seed);
      const c111 = hash3(ix + 1, iy + 1, iz + 1, seed);
      const x00 = lerp(c000, c100, ux);
      const x10 = lerp(c010, c110, ux);
      const x01 = lerp(c001, c101, ux);
      const x11 = lerp(c011, c111, ux);
      return lerp(lerp(x00, x10, uy), lerp(x01, x11, uy), uz);
    }

    function wrapAngle(a) {
      let r = (a + Math.PI) % (Math.PI * 2);
      if (r < 0) r += Math.PI * 2;
      return r - Math.PI;
    }

    // ===== レンダラ・シーン・環境・照明・カメラ =====
    const renderer = new THREE.WebGLRenderer({ antialias: true });

    const scene = new THREE.Scene();

    scene.fog = new THREE.FogExp2(BG_COLOR, STYLE.fogDensity);

    const pmrem = new THREE.PMREMGenerator(renderer);
    const roomEnv = new RoomEnvironment();
    scene.environment = pmrem.fromScene(roomEnv, 0.04).texture;
    roomEnv.dispose();
    pmrem.dispose();
    if ('environmentIntensity' in scene) {

    }

    scene.add(new THREE.HemisphereLight(STYLE.hemiSkyColor, STYLE.hemiGroundColor, STYLE.hemiIntensity));
    const sunLight = new THREE.DirectionalLight(STYLE.sunColor, STYLE.sunIntensity);
    sunLight.position.set(...STYLE.sunPosition);
    scene.add(sunLight);

    const camera = new THREE.PerspectiveCamera(STYLE.cameraFov, window.innerWidth / window.innerHeight, 0.05, 60);
    camera.position.set(...STYLE.cameraPosition);

    const controls = new OrbitControls(camera, renderer.domElement);

    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = -0.4;
    controls.minDistance = 1.2;
    controls.maxDistance = 7.5;
    controls.maxPolarAngle = Math.PI * 0.54;
    controls.update();

    window.addEventListener('resize', () => {

      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);

    // ===== 手続き生成テクスチャ（粒・粒子・光の筋） =====
    function buildGrainTexture(size = STYLE.grainTexSize) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const img = ctx.createImageData(size, size);
      const data = img.data;
      // 決定論的 PRNG で 1〜2px の明度粒ノイズを生成
      let seed = 133791;
      const rand = () => {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
      };
      for (let i = 0; i < size * size; i++) {
        const v = Math.floor(92 + rand() * 72);
        const o = i * 4;
        data[o] = v;
        data[o + 1] = v;
        data[o + 2] = v;
        data[o + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      // 2px 相当の鉱物粒を重ね、ミップマップ越しでも質感が残るようにする
      const count2px = Math.floor(size * size * 0.22);
      for (let i = 0; i < count2px; i++) {
        const gx = Math.floor(rand() * size);
        const gy = Math.floor(rand() * size);
        const shade = rand() > 0.5 ? Math.floor(175 + rand() * 75) : Math.floor(25 + rand() * 65);
        ctx.fillStyle = `rgb(${shade},${shade},${shade})`;
        ctx.fillRect(gx, gy, 2, 2);
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.anisotropy = 4;
      return tex;
    }

    function cloneTextureWithRepeat(baseTex, rx, ry) {
      const t = baseTex.clone();
      t.wrapS = THREE.RepeatWrapping;
      t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(rx, ry);
      t.needsUpdate = true;
      return t;
    }

    // ===== 部品：コースティクス (applyCaustics, 砂・岩共用) =====
    function applyCaustics(material, options = {}) {
      const mode = options.mode === 'rock' ? 'rock' : 'sand';
      const maxGain = mode === 'sand' ? 0.30 : 0.20;
      const gain = Math.min(options.gain ?? (mode === 'sand' ? STYLE.causticsSandGain : STYLE.causticsRockGain), maxGain);
      const uniforms = {
        uCausticTime: { value: 0 },
        uCausticGain: { value: gain },
        uCausticScale1: { value: options.scale1 ?? STYLE.causticsScale1 },
        uCausticScale2: { value: options.scale2 ?? STYLE.causticsScale2 },
        uCausticSpeed1: { value: options.speed1 ?? STYLE.causticsSpeed1 },
        uCausticSpeed2: { value: options.speed2 ?? STYLE.causticsSpeed2 },
        uCausticPow: { value: options.pow ?? STYLE.causticsPow },
        uCausticColor: { value: new THREE.Color(options.color ?? STYLE.causticsColor) },
        uCausticRadius: { value: new THREE.Vector2(options.radiusX ?? STYLE.causticsSandRadiusX, options.radiusZ ?? STYLE.causticsSandRadiusZ) },
        uCausticMaskRange: { value: new THREE.Vector2(options.inner ?? STYLE.causticsSandInner, options.outer ?? STYLE.causticsSandOuter) },
      };

      material.userData.causticsUniforms = uniforms;
      material.customProgramCacheKey = () => `aq-caustics-${mode}`;

      const prevOnBeforeCompile = material.onBeforeCompile;
      material.onBeforeCompile = (shader, rendererRef) => {
        if (prevOnBeforeCompile) prevOnBeforeCompile(shader, rendererRef);
        Object.assign(shader.uniforms, uniforms);

        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', '#include <common>\nvarying vec3 vCausticWorldPos;')
          .replace('#include <project_vertex>', '#include <project_vertex>\nvCausticWorldPos = ( modelMatrix * vec4( transformed, 1.0 ) ).xyz;');

        const causticPars = `
#include <common>
uniform float uCausticTime;
uniform float uCausticGain;
uniform float uCausticScale1;
uniform float uCausticScale2;
uniform float uCausticSpeed1;
uniform float uCausticSpeed2;
uniform float uCausticPow;
uniform vec3 uCausticColor;
uniform vec2 uCausticRadius;
uniform vec2 uCausticMaskRange;
varying vec3 vCausticWorldPos;

float aqCausticLayer(vec2 p, float t) {
  float a = sin(p.x * 2.1 + t * 1.15 + cos(p.y * 1.7 - t * 0.85));
  float b = cos(p.y * 2.3 - t * 0.95 + sin(p.x * 1.9 + t * 0.75));
  float c = sin((p.x + p.y) * 1.6 + t * 0.65);
  float v = abs(a + b + c * 0.5) / 2.5;
  float ridge = 1.0 - clamp(v, 0.0, 1.0);
  return pow(ridge, uCausticPow);
}

float aqCausticPattern(vec2 xz, float t) {
  vec2 p1 = xz * uCausticScale1 + vec2(t * 0.12, -t * 0.08);
  vec2 p2 = vec2(xz.x * 0.8 - xz.y * 0.6, xz.x * 0.6 + xz.y * 0.8) * uCausticScale2 + vec2(-t * 0.09, t * 0.14);
  float l1 = aqCausticLayer(p1, t * uCausticSpeed1);
  float l2 = aqCausticLayer(p2, t * uCausticSpeed2);
  return clamp(max(l1, l2) * 0.78 + l1 * l2 * 0.55, 0.0, 1.0);
}
`;
        const causticInject = mode === 'sand'
          ? `
#include <lights_fragment_end>
{
  float d = length(vCausticWorldPos.xz / uCausticRadius);
  float lightPoolMask = 1.0 - smoothstep(uCausticMaskRange.x, uCausticMaskRange.y, d);
  float cPat = aqCausticPattern(vCausticWorldPos.xz, uCausticTime);
  reflectedLight.directDiffuse *= mix(0.76, 0.88 + 0.12 * cPat, lightPoolMask);
  float causticContrib = cPat * lightPoolMask * uCausticGain;
  reflectedLight.directDiffuse += diffuseColor.rgb * uCausticColor * causticContrib;
}
`
          : `
#include <lights_fragment_end>
{
  vec3 wNormal = transformNormalByInverseViewMatrix(normal, viewMatrix);
  float up = clamp(wNormal.y, 0.0, 1.0);
  float upMask = up * up;
  float cPat = aqCausticPattern(vCausticWorldPos.xz + vCausticWorldPos.y * 0.2, uCausticTime);
  reflectedLight.directDiffuse += diffuseColor.rgb * uCausticColor * (cPat * upMask * uCausticGain);
}
`;
        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', causticPars)
          .replace('#include <lights_fragment_end>', causticInject);
      };
      material.needsUpdate = true;

      const update = (time) => {
        uniforms.uCausticTime.value = time;
      };
      update.uniforms = uniforms;
      return update;
    }

    // ===== 部品：筐体の台座と砂の側面 (buildCabinet) =====
    function buildCabinet(options = {}) {
      const tankW = options.tankW ?? TANK_W;
      const tankD = options.tankD ?? TANK_D;
      const grainTex = options.grainTex;

      const group = new THREE.Group();
      group.name = 'cabinet';

      // 台座
      const pedW = options.pedestalWidth ?? STYLE.pedestalWidth;
      const pedH = options.pedestalHeight ?? STYLE.pedestalHeight;
      const pedD = options.pedestalDepth ?? STYLE.pedestalDepth;
      const pedY = options.pedestalCenterY ?? STYLE.pedestalCenterY;

      const pedGeo = new THREE.BoxGeometry(pedW, pedH, pedD);
      const pedMat = new THREE.MeshStandardMaterial({
        color: options.pedestalColor ?? STYLE.pedestalColor,
        roughness: options.pedestalRoughness ?? STYLE.pedestalRoughness,
        metalness: options.pedestalMetalness ?? STYLE.pedestalMetalness,
      });
      const pedestal = new THREE.Mesh(pedGeo, pedMat);
      pedestal.position.y = pedY;
      pedestal.name = 'cabinet-pedestal';
      group.add(pedestal);

      // 台座上面の縁トリム 4 辺
      const trimW = options.trimWidth ?? STYLE.pedestalTrimWidth;
      const trimH = options.trimHeight ?? STYLE.pedestalTrimHeight;
      const trimY = pedY + pedH / 2 + trimH / 2;
      const trimMat = new THREE.MeshStandardMaterial({
        color: options.trimColor ?? STYLE.pedestalTrimColor,
        roughness: options.trimRoughness ?? STYLE.pedestalTrimRoughness,
        metalness: options.trimMetalness ?? STYLE.pedestalTrimMetalness,
      });
      const trimSpecs = [
        { w: pedW, d: trimW, x: 0, z:  pedD / 2 - trimW / 2, name: 'trim-front' },
        { w: pedW, d: trimW, x: 0, z: -pedD / 2 + trimW / 2, name: 'trim-back' },
        { w: trimW, d: pedD - trimW * 2, x: -pedW / 2 + trimW / 2, z: 0, name: 'trim-left' },
        { w: trimW, d: pedD - trimW * 2, x:  pedW / 2 - trimW / 2, z: 0, name: 'trim-right' },
      ];
      const trimMeshes = trimSpecs.map((ts) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(ts.w, trimH, ts.d), trimMat);
        m.position.set(ts.x, trimY, ts.z);
        m.name = ts.name;
        group.add(m);
        return m;
      });

      // 砂の側面（単一マテリアル時は groups だけでは除外されないため +y/-y のインデックス自体を外す）
      const sideH = options.sandSideHeight ?? STYLE.sandSideHeight;
      const sideY = options.sandSideCenterY ?? STYLE.sandSideCenterY;
      const sandSideGeo = new THREE.BoxGeometry(tankW, sideH, tankD);
      const rawSideIdx = sandSideGeo.getIndex();
      const sideIndices = [];
      for (const g of sandSideGeo.groups) {
        if (g.materialIndex === 2 || g.materialIndex === 3) continue;
        for (let i = 0; i < g.count; i++) {
          sideIndices.push(rawSideIdx.getX(g.start + i));
        }
      }
      sandSideGeo.setIndex(sideIndices);
      sandSideGeo.clearGroups();
      const sandSideMat = new THREE.MeshStandardMaterial({
        color: options.sandSideColor ?? STYLE.sandSideColor,
        roughness: options.sandSideRoughness ?? STYLE.sandSideRoughness,
        metalness: 0.0,
        bumpMap: grainTex ? cloneTextureWithRepeat(grainTex, ...(options.sandSideBumpRepeat ?? STYLE.sandSideBumpRepeat)) : null,
        bumpScale: options.sandSideBumpScale ?? STYLE.sandSideBumpScale,
      });
      const sandSide = new THREE.Mesh(sandSideGeo, sandSideMat);
      sandSide.position.y = sideY;
      sandSide.name = 'sand-side';
      group.add(sandSide);

      return { group, pedestal, trimMeshes, sandSide };
    }

    // ===== 部品：ガラスと枠 (buildGlassTank) =====
    function buildGlassTank(options = {}) {
      const tankW = options.tankW ?? TANK_W;
      const tankD = options.tankD ?? TANK_D;
      const tankH = options.tankH ?? WATER_Y;
      const hx = tankW / 2;
      const hz = tankD / 2;

      const group = new THREE.Group();
      group.name = 'glass-tank';

      // ガラス 4 枚（前面・背面・左右側面、上部は開放）
      const glassOpacity = Math.min(options.glassOpacity ?? STYLE.glassOpacity, 0.08);
      const glassMat = new THREE.MeshStandardMaterial({
        color: options.glassColor ?? STYLE.glassColor,
        transparent: true,
        opacity: glassOpacity,
        roughness: options.glassRoughness ?? STYLE.glassRoughness,
        metalness: options.glassMetalness ?? STYLE.glassMetalness,
        side: THREE.DoubleSide,
        depthWrite: false,
        envMapIntensity: options.glassEnvMapIntensity ?? STYLE.glassEnvMapIntensity,
        envMap: options.envMap ?? null,
      });

      const paneSpecs = [
        { w: tankW, h: tankH, x: 0,   y: tankH / 2, z:  hz, ry: 0,           name: 'glass-front' },
        { w: tankW, h: tankH, x: 0,   y: tankH / 2, z: -hz, ry: Math.PI,     name: 'glass-back' },
        { w: tankD, h: tankH, x: -hx, y: tankH / 2, z: 0,   ry: -Math.PI/2,  name: 'glass-left' },
        { w: tankD, h: tankH, x:  hx, y: tankH / 2, z: 0,   ry:  Math.PI/2,  name: 'glass-right' },
      ];
      const glassMeshes = paneSpecs.map((ps) => {
        const m = new THREE.Mesh(new THREE.PlaneGeometry(ps.w, ps.h), glassMat);
        m.position.set(ps.x, ps.y, ps.z);
        m.rotation.y = ps.ry;
        m.name = ps.name;
        m.renderOrder = 6;
        group.add(m);
        return m;
      });

      // 枠 12 本（縦 4 本 + 横 8 本）
      const t = options.frameThickness ?? STYLE.frameThickness;
      const frameMat = new THREE.MeshStandardMaterial({
        color: options.frameColor ?? STYLE.frameColor,
        roughness: options.frameRoughness ?? STYLE.frameRoughness,
        metalness: options.frameMetalness ?? STYLE.frameMetalness,
      });
      const frameMeshes = [];
      const addBar = (bw, bh, bd, x, y, z, name) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), frameMat);
        m.position.set(x, y, z);
        m.name = name;
        group.add(m);
        frameMeshes.push(m);
      };

      // 縦 4 本（高さ tankH = 2.6）
      addBar(t, tankH, t, -hx, tankH / 2, -hz, 'frame-v-fl-back');
      addBar(t, tankH, t,  hx, tankH / 2, -hz, 'frame-v-fr-back');
      addBar(t, tankH, t, -hx, tankH / 2,  hz, 'frame-v-fl-front');
      addBar(t, tankH, t,  hx, tankH / 2,  hz, 'frame-v-fr-front');

      // 横 X 方向 4 本（長さ tankW + t で角の継ぎ目を綺麗に閉じる、Zファイティング回避のため断面僅差）
      const tx = t - 0.001;
      addBar(tankW + t, tx, tx, 0, 0,     -hz, 'frame-x-bot-back');
      addBar(tankW + t, tx, tx, 0, 0,      hz, 'frame-x-bot-front');
      addBar(tankW + t, tx, tx, 0, tankH, -hz, 'frame-x-top-back');
      addBar(tankW + t, tx, tx, 0, tankH,  hz, 'frame-x-top-front');

      // 横 Z 方向 4 本（長さ tankD - t で角柱にぴったり収める）
      const tz = t - 0.002;
      addBar(tz, tz, tankD - t, -hx, 0,     0, 'frame-z-bot-left');
      addBar(tz, tz, tankD - t,  hx, 0,     0, 'frame-z-bot-right');
      addBar(tz, tz, tankD - t, -hx, tankH, 0, 'frame-z-top-left');
      addBar(tz, tz, tankD - t,  hx, tankH, 0, 'frame-z-top-right');

      return { group, glassMeshes, frameMeshes };
    }

    // ===== 部品：粒子・マリンスノー (buildMarineSnow, 2層: 本体1500 + ボケ100) =====
    function buildMarineSnow(options = {}) {
      const mainCount = options.mainCount ?? STYLE.particleMainCount;
      const bokehCount = options.bokehCount ?? STYLE.particleBokehCount;
      const count = mainCount + bokehCount;
      const maxX = (options.tankW ?? TANK_W) / 2 - (options.marginX ?? STYLE.particleMarginX);
      const maxZ = (options.tankD ?? TANK_D) / 2 - (options.marginZ ?? STYLE.particleMarginZ);
      const swayAmp = options.swayAmp ?? STYLE.particleSwayAmp;
      const baseMaxX = Math.max(0.1, maxX - swayAmp);
      const baseMaxZ = Math.max(0.1, maxZ - swayAmp);
      const spawnMinY = options.spawnMinY ?? STYLE.particleSpawnMinY;
      const wrapMinY = options.minY ?? STYLE.particleMinY;
      const maxY = options.maxY ?? STYLE.particleMaxY;
      const speedMin = options.speedMin ?? STYLE.particleSpeedMin;
      const speedMax = options.speedMax ?? STYLE.particleSpeedMax;
      const freqMin = options.swayFreqMin ?? STYLE.particleSwayFreqMin;
      const freqMax = options.swayFreqMax ?? STYLE.particleSwayFreqMax;

      const buildSpriteTex = (stops) => {
        const spriteCanvas = document.createElement('canvas');
        spriteCanvas.width = 64;
        spriteCanvas.height = 64;
        const sCtx = spriteCanvas.getContext('2d');
        const grad = sCtx.createRadialGradient(32, 32, 0, 32, 32, 31);
        for (const [offset, alpha] of stops) {
          grad.addColorStop(offset, `rgba(255, 255, 255, ${alpha})`);
        }
        sCtx.fillStyle = grad;
        sCtx.fillRect(0, 0, 64, 64);
        return new THREE.CanvasTexture(spriteCanvas);
      };

      const mainTex = buildSpriteTex([[0.0, 1.0], [0.35, 0.72], [0.75, 0.16], [1.0, 0.0]]);
      const bokehTex = buildSpriteTex([[0.0, 0.85], [0.55, 0.62], [0.85, 0.22], [1.0, 0.0]]);

      const createLayer = ({ layerCount, color, size, opacity, spriteTex, name, renderOrder }) => {
        const positions = new Float32Array(layerCount * 3);
        const baseX = new Float32Array(layerCount);
        const baseZ = new Float32Array(layerCount);
        const fallSpeed = new Float32Array(layerCount);
        const phaseX = new Float32Array(layerCount);
        const phaseZ = new Float32Array(layerCount);
        const freqX = new Float32Array(layerCount);
        const freqZ = new Float32Array(layerCount);

        for (let i = 0; i < layerCount; i++) {
          const bx = (Math.random() * 2 - 1) * baseMaxX;
          const bz = (Math.random() * 2 - 1) * baseMaxZ;
          const py = spawnMinY + Math.random() * (maxY - spawnMinY);
          baseX[i] = bx;
          baseZ[i] = bz;
          fallSpeed[i] = speedMin + Math.random() * (speedMax - speedMin);
          phaseX[i] = Math.random() * Math.PI * 2;
          phaseZ[i] = Math.random() * Math.PI * 2;
          freqX[i] = freqMin + Math.random() * (freqMax - freqMin);
          freqZ[i] = freqMin + Math.random() * (freqMax - freqMin);
          positions[i * 3] = bx + Math.sin(phaseX[i]) * swayAmp;
          positions[i * 3 + 1] = py;
          positions[i * 3 + 2] = bz + Math.cos(phaseZ[i]) * swayAmp;
        }

        const geo = new THREE.BufferGeometry();
        const posAttr = new THREE.BufferAttribute(positions, 3);
        geo.setAttribute('position', posAttr);

        const mat = new THREE.PointsMaterial({
          map: spriteTex,
          color,
          size,
          sizeAttenuation: true,
          transparent: true,
          opacity,
          depthWrite: false,
        });

        const points = new THREE.Points(geo, mat);
        points.name = name;
        points.renderOrder = renderOrder;

        const updateLayer = (dt, elapsed) => {
          for (let i = 0; i < layerCount; i++) {
            const idx = i * 3;
            let y = positions[idx + 1] - fallSpeed[i] * dt;
            if (y < wrapMinY) y = maxY;
            positions[idx] = clamp(baseX[i] + Math.sin(elapsed * freqX[i] + phaseX[i]) * swayAmp, -maxX, maxX);
            positions[idx + 1] = y;
            positions[idx + 2] = clamp(baseZ[i] + Math.cos(elapsed * freqZ[i] + phaseZ[i]) * swayAmp, -maxZ, maxZ);
          }
          posAttr.needsUpdate = true;
        };

        return { points, positions, count: layerCount, update: updateLayer };
      };

      const mainLayer = createLayer({
        layerCount: mainCount,
        color: options.mainColor ?? STYLE.particleMainColor,
        size: options.mainSize ?? STYLE.particleMainSize,
        opacity: options.mainOpacity ?? STYLE.particleMainOpacity,
        spriteTex: mainTex,
        name: 'marine-snow-main',
        renderOrder: 4,
      });

      const bokehLayer = createLayer({
        layerCount: bokehCount,
        color: options.bokehColor ?? STYLE.particleBokehColor,
        size: options.bokehSize ?? STYLE.particleBokehSize,
        opacity: options.bokehOpacity ?? STYLE.particleBokehOpacity,
        spriteTex: bokehTex,
        name: 'marine-snow-bokeh',
        renderOrder: 5,
      });

      const layers = [mainLayer, bokehLayer];
      const points = [mainLayer.points, bokehLayer.points];

      const update = (dt, elapsed) => {
        for (const layer of layers) layer.update(dt, elapsed);
      };

      const sample = (n = 10) => {
        const out = [];
        const bokehTake = Math.min(bokehLayer.count, n >= 2 ? Math.max(1, Math.floor(n * 0.2)) : 0);
        const mainTake = Math.min(mainLayer.count, Math.max(0, n - bokehTake));
        for (let i = 0; i < mainTake; i++) {
          out.push([
            mainLayer.positions[i * 3],
            mainLayer.positions[i * 3 + 1],
            mainLayer.positions[i * 3 + 2],
          ]);
        }
        for (let i = 0; i < bokehTake; i++) {
          out.push([
            bokehLayer.positions[i * 3],
            bokehLayer.positions[i * 3 + 1],
            bokehLayer.positions[i * 3 + 2],
          ]);
        }
        return out;
      };

      const countOutOfBounds = () => {
        let oob = 0;
        for (const layer of layers) {
          for (let i = 0; i < layer.count; i++) {
            const x = layer.positions[i * 3];
            const y = layer.positions[i * 3 + 1];
            const z = layer.positions[i * 3 + 2];
            if (Math.abs(x) > maxX + 1e-6 || Math.abs(z) > maxZ + 1e-6 || y < wrapMinY - 1e-6 || y > maxY + 1e-6) {
              oob++;
            }
          }
        }
        return oob;
      };

      return { points, layers, update, count, sample, countOutOfBounds };
    }

    // ===== 部品：光の筋 (buildLightRays) =====
    function buildLightRays(options = {}) {
      const count = options.count ?? STYLE.rayCount;
      const configs = (options.rayConfigs ?? STYLE.rayConfigs).slice(0, count);
      const widthScale = options.widthScale ?? STYLE.rayWidthScale ?? 1.0;
      const height = options.height ?? STYLE.rayHeight;
      const centerY = options.centerY ?? STYLE.rayCenterY;
      const opMin = options.opacityMin ?? STYLE.rayOpacityMin;
      const opMax = Math.min(options.opacityMax ?? STYLE.rayOpacityMax, STYLE.rayMaxOpacity);
      const swayAmp = options.swayAmp ?? STYLE.raySwayAmp;

      // 上が濃く下で消える縦グラデーション＋左右エッジフェードを alphaMap として生成
      const rayCanvas = document.createElement('canvas');
      rayCanvas.width = 128;
      rayCanvas.height = 256;
      const rCtx = rayCanvas.getContext('2d');
      const rImg = rCtx.createImageData(128, 256);
      for (let y = 0; y < 256; y++) {
        const v = y / 255; // 0: top, 1: bottom
        const topEdge = smoothstep(v, 0.0, 0.04);
        const vertGrad = Math.pow(1.0 - smoothstep(v, 0.24, 1.0), 1.08);
        const vProfile = topEdge * vertGrad;
        for (let x = 0; x < 128; x++) {
          const u = x / 127;
          const streak = 0.88 + 0.12 * Math.sin(u * Math.PI * 5.0 + 0.4);
          const hProfile = Math.pow(Math.sin(Math.PI * u), 0.58) * streak;
          const lum = Math.round(clamp(vProfile * hProfile, 0, 1) * 255);
          const o = (y * 128 + x) * 4;
          rImg.data[o] = lum;
          rImg.data[o + 1] = lum;
          rImg.data[o + 2] = lum;
          rImg.data[o + 3] = 255;
        }
      }
      rCtx.putImageData(rImg, 0, 0);
      const rayAlphaTex = new THREE.CanvasTexture(rayCanvas);

      const group = new THREE.Group();
      group.name = 'light-rays';

      const rays = configs.map((cfg, idx) => {
        const width = cfg.width * widthScale;
        const geo = new THREE.PlaneGeometry(width, height);
        const mat = new THREE.MeshBasicMaterial({
          color: options.color ?? STYLE.rayColor,
          alphaMap: rayAlphaTex,
          transparent: true,
          opacity: options.baseOpacity ?? STYLE.rayBaseOpacity,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          side: THREE.DoubleSide,
          fog: false,
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(cfg.x, centerY, cfg.z);
        mesh.rotation.y = cfg.rotY ?? 0;
        mesh.rotation.z = cfg.tiltZ ?? -STYLE.rayTiltZ;
        mesh.renderOrder = 3;
        mesh.name = `light-ray-${idx + 1}`;
        group.add(mesh);
        return { mesh, cfg, width };
      });

      const update = (elapsed) => {
        const opMid = (opMin + opMax) * 0.5;
        const opHalf = (opMax - opMin) * 0.5;
        for (const r of rays) {
          const w = (Math.PI * 2) / r.cfg.period;
          const s = Math.sin(elapsed * w + r.cfg.phase);
          r.mesh.material.opacity = clamp(opMid + s * opHalf, 0, STYLE.rayMaxOpacity);
          r.mesh.rotation.z = r.cfg.tiltZ + Math.sin(elapsed * w * 0.85 + r.cfg.phase * 1.3) * swayAmp;
        }
      };

      update(0);
      return { group, rays, update };
    }

    // ===== 部品：背景グラデーション板 (buildBackdropGradient) =====
    function buildBackdropGradient(options = {}) {
      const width = options.width ?? STYLE.backdropWidth;
      const height = options.height ?? STYLE.backdropHeight;
      const centerY = options.centerY ?? STYLE.backdropCenterY;
      const posZ = options.z ?? STYLE.backdropZ;
      const topColor = options.topColor ?? STYLE.backdropTopColor;
      const midColor = options.midColor ?? STYLE.backdropMidColor;
      const bottomColor = options.bottomColor ?? STYLE.backdropBottomColor;
      const midStop = options.midStop ?? STYLE.backdropMidStop;
      const bottomStop = options.bottomStop ?? STYLE.backdropBottomStop;

      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0.0, topColor);
      grad.addColorStop(midStop, midColor);
      grad.addColorStop(bottomStop, bottomColor);
      grad.addColorStop(1.0, bottomColor);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 両端の暗がり（上は明るく、下と両端が暗い目標写真トーンに合わせる）
      const sideGrad = ctx.createLinearGradient(0, 0, canvas.width, 0);
      sideGrad.addColorStop(0.0, 'rgba(2, 20, 46, 0.72)');
      sideGrad.addColorStop(0.18, 'rgba(2, 20, 46, 0.0)');
      sideGrad.addColorStop(0.82, 'rgba(2, 20, 46, 0.0)');
      sideGrad.addColorStop(1.0, 'rgba(2, 20, 46, 0.72)');
      ctx.fillStyle = sideGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 水槽ガラス枠（y<=2.6, |x|<=4.5）の外側へはみ出ないよう外周を滑らかに透過
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const px = imgData.data;
      const halfW = width * 0.5;
      const halfH = height * 0.5;
      for (let py = 0; py < canvas.height; py++) {
        const wy = centerY + halfH - (py / (canvas.height - 1)) * height;
        const topMask = 1.0 - smoothstep(wy, WATER_Y - 0.02, WATER_Y + 0.03);
        for (let pxX = 0; pxX < canvas.width; pxX++) {
          const wx = -halfW + (pxX / (canvas.width - 1)) * width;
          const sideMask = 1.0 - smoothstep(Math.abs(wx), HALF_X - 0.02, HALF_X + 0.08);
          const idx = (py * canvas.width + pxX) * 4;
          px[idx + 3] = Math.round(255 * topMask * sideMask);
        }
      }
      ctx.putImageData(imgData, 0, 0);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;

      const geo = new THREE.PlaneGeometry(width, height);
      const mat = new THREE.MeshBasicMaterial({
        map: tex,
        transparent: true,
        depthWrite: false,
        fog: false,
        side: THREE.FrontSide,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(0, centerY, posZ);
      mesh.renderOrder = -1;
      mesh.name = 'backdrop-gradient';
      return { mesh, material: mat, texture: tex };
    }

    // ===== 部品：水面の光だまり (buildSurfaceGlow) =====
    function buildSurfaceGlow(options = {}) {
      const tankW = options.tankW ?? TANK_W;
      const tankD = options.tankD ?? TANK_D;
      const posY = options.y ?? STYLE.surfaceGlowY;
      const opacity = options.opacity ?? STYLE.surfaceGlowOpacity;
      const centerColor = options.centerColor ?? STYLE.surfaceGlowCenterColor;
      const midColor = options.midColor ?? STYLE.surfaceGlowMidColor;
      const edgeColor = options.edgeColor ?? STYLE.surfaceGlowEdgeColor;

      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(128, 128, 4, 128, 128, 124);
      grad.addColorStop(0.0, centerColor);
      grad.addColorStop(0.45, midColor);
      grad.addColorStop(1.0, edgeColor);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;

      const geo = new THREE.PlaneGeometry(tankW, tankD);
      // 下面（-Y）向きに回転し、水面より上から見た際は FrontSide で裏面カリングされる
      geo.rotateX(Math.PI / 2);
      const mat = new THREE.MeshBasicMaterial({
        map: tex,
        transparent: true,
        opacity,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.FrontSide,
        fog: false,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(0, posY, 0);
      mesh.renderOrder = 1;
      mesh.name = 'surface-glow';
      return { mesh, material: mat, texture: tex };
    }

    // ===== 砂床 (PlaneGeometry(9, 5.5, 90, 55)) =====
    function buildSandFloor(grainTex) {
      const geo = new THREE.PlaneGeometry(TANK_W, TANK_D, 90, 55);
      geo.rotateX(-Math.PI / 2);
      const pos = geo.attributes.position;
      const colors = new Float32Array(pos.count * 3);
      const baseR = 0x9a / 255;
      const baseG = 0x8a / 255;
      const baseB = 0x68 / 255;
      const tmpColor = new THREE.Color();

      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const z = pos.getZ(i);
        // 端を確実に y=0 に収めるフェード
        const fadeX = smoothstep(HALF_X - Math.abs(x), 0, 0.55);
        const fadeZ = smoothstep(HALF_Z - Math.abs(z), 0, 0.45);
        const edgeFade = fadeX * fadeZ;

        const ripple = Math.sin(x * 2.4 + Math.sin(z * 1.1) * 0.9) * 0.45
                     + Math.sin(x * 5.2 - z * 2.1) * 0.18;
        const n = clamp(fbm2D(x * 0.85, z * 0.85, 3) * 0.68 + ripple * 0.42, -1, 1);
        const y = n * 0.056 * edgeFade; // 振幅 <= 0.056m (<= 0.06m)
        pos.setY(i, y);

        // 頂点カラー：#9a8a68 ±9%（v2第2パス：コースティクスと競合しないよう濃淡を抑制）
        const cLow = fbm2D(x * 1.2 + 11.3, z * 1.2 - 7.1, 17);
        const cHigh = fbm2D(x * 4.8 - 3.7, z * 4.8 + 5.2, 29);
        const cRipple = Math.sin(x * 2.4 + Math.sin(z * 1.1) * 0.9) * 0.35;
        const cMix = clamp(cLow * 0.55 + cHigh * 0.45 + cRipple * 0.35 + n * 0.15, -1, 1);
        const sandVar = STYLE.sandShadeVariance;
        const shade = clamp(1 + cMix * sandVar, 1 - sandVar, 1 + sandVar);
        tmpColor.setRGB(
          clamp(baseR * shade, 0, 1),
          clamp(baseG * shade, 0, 1),
          clamp(baseB * shade, 0, 1),
          THREE.SRGBColorSpace
        );
        colors[i * 3] = tmpColor.r;
        colors[i * 3 + 1] = tmpColor.g;
        colors[i * 3 + 2] = tmpColor.b;
      }

      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geo.computeVertexNormals();
      const mat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 1.0,
        metalness: 0.0,
        bumpMap: grainTex ? cloneTextureWithRepeat(grainTex, ...STYLE.sandBumpRepeat) : null,
        bumpScale: STYLE.sandBumpScale,
      });
      const updateCaustics = applyCaustics(mat, { mode: 'sand' });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.name = 'sand-floor';
      return { mesh, material: mat, updateCaustics };
    }

    // ===== 岩 9 個 (既存 6 個 + 中央奥の主役岩組み 3 個, 玄武岩 #38342f, ridged 稜線 + 窪み暗転) =====
    function buildRocks(grainTex) {
      const rockConfigs = [
        // v1 既存 6 個（位置維持）
        { x: -3.75, z: -2.02, r: 0.44, sx: 1.05, sy: 0.74, sz: 0.92, ry: 0.4, seed: 11, detail: 1 },
        { x: -3.05, z: -2.25, r: 0.31, sx: 1.00, sy: 0.80, sz: 0.95, ry: 1.9, seed: 23, detail: 1 },
        { x:  3.72, z: -1.98, r: 0.41, sx: 1.08, sy: 0.72, sz: 0.90, ry: 2.7, seed: 37, detail: 1 },
        { x:  3.95, z: -1.32, r: 0.30, sx: 0.95, sy: 0.82, sz: 1.05, ry: 0.9, seed: 51, detail: 1 },
        { x: -3.65, z:  1.85, r: 0.36, sx: 1.04, sy: 0.76, sz: 0.92, ry: 4.1, seed: 67, detail: 1 },
        { x:  3.45, z:  1.88, r: 0.34, sx: 0.98, sy: 0.78, sz: 1.02, ry: 5.2, seed: 83, detail: 1 },
        // v2 第2パス：主役の岩組み 3 個（中心 z=-1.5 付近へ寄せ、z スケール 0.8 倍・向きを調整して背面ガラス貫通を防止）
        { x: -0.15, z: -1.45, r: 0.90, sx: 1.12, sy: 0.86, sz: 0.74 * 0.8, ry: 0.30, seed: 101, detail: 3, hero: true },
        { x:  0.60, z: -1.46, r: 0.70, sx: 1.04, sy: 0.82, sz: 0.80 * 0.8, ry: 2.15, seed: 119, detail: 3, hero: true },
        { x: -0.82, z: -1.43, r: 0.55, sx: 1.06, sy: 0.80, sz: 0.84 * 0.8, ry: 4.35, seed: 137, detail: 3, hero: true },
      ];
      const rockMat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: STYLE.rockRoughness,
        metalness: 0.0,
        bumpMap: grainTex ? cloneTextureWithRepeat(grainTex, ...STYLE.rockBumpRepeat) : null,
        bumpScale: STYLE.rockBumpScale,
      });
      const updateCaustics = applyCaustics(rockMat, { mode: 'rock' });
      const group = new THREE.Group();
      group.name = 'rocks';
      const v = new THREE.Vector3();

      const baseSRGB = {
        r: ((STYLE.rockBaseColor >> 16) & 255) / 255,
        g: ((STYLE.rockBaseColor >> 8) & 255) / 255,
        b: (STYLE.rockBaseColor & 255) / 255,
      };
      const tmpColor = new THREE.Color();

      for (let idx = 0; idx < rockConfigs.length; idx++) {
        const cfg = rockConfigs[idx];
        const geo = new THREE.IcosahedronGeometry(cfg.r, cfg.detail ?? 1);
        const pos = geo.attributes.position;
        const colors = new Float32Array(pos.count * 3);
        const posY = cfg.hero ? -cfg.r * cfg.sy * 0.22 : -cfg.r * cfg.sy * 0.08;
        const maxDisp = cfg.hero ? STYLE.rockHeroDispMax : STYLE.rockDispMax;

        for (let i = 0; i < pos.count; i++) {
          v.fromBufferAttribute(pos, i);
          const dir = v.clone().normalize();
          // 単位方向ベクトルからサンプルして共有頂点の割れを防ぎつつ、ridged 成分 (1 - |noise|) で稜線を作る
          const n1 = valueNoise3D(dir.x * 2.5 + 3.0, dir.y * 2.5 + 5.0, dir.z * 2.5 + 7.0, cfg.seed) * 2 - 1;
          const n2 = valueNoise3D(dir.x * 5.6 + 9.0, dir.y * 5.6 + 1.0, dir.z * 5.6 + 4.0, cfg.seed + 5) * 2 - 1;
          const ridge1 = Math.pow(1.0 - Math.abs(n1), 1.4) * 2.0 - 1.0;
          const ridge2 = Math.pow(1.0 - Math.abs(n2), 1.4) * 2.0 - 1.0;
          const raw = ridge1 * 0.55 + n1 * 0.25 + ridge2 * 0.30;
          const disp = clamp(raw * maxDisp, -maxDisp, maxDisp);
          v.multiplyScalar(1 + disp);

          // 主役の大きな岩は埋設下部が台座下面を貫通しないよう底を安全整形
          if (cfg.hero) {
            if (v.y < 0) v.y *= 0.28;
            const maxLocalY = (-0.22 - posY) / cfg.sy;
            if (v.y < maxLocalY) v.y = maxLocalY;
          }
          pos.setXYZ(i, v.x, v.y, v.z);

          // 頂点カラー：変位が低い窪みを 0.72〜1.0 の係数で暗くし、玄武岩 #38342f に自然な明暗を付ける
          const dispNorm = clamp((disp / maxDisp + 1) * 0.5, 0, 1);
          const creviceShade = STYLE.rockCreviceMin + (1.0 - STYLE.rockCreviceMin) * dispNorm;
          const cN = valueNoise3D(dir.x * 3.1 + 2.0, dir.y * 3.1 + 6.0, dir.z * 3.1 + 1.0, cfg.seed + 31) * 2 - 1;
          const shade = clamp(creviceShade * (1.0 + cN * STYLE.rockColorVariance * 0.4), STYLE.rockCreviceMin * 0.92, 1.04);
          tmpColor.setRGB(
            clamp(baseSRGB.r * shade, 0, 1),
            clamp(baseSRGB.g * shade, 0, 1),
            clamp(baseSRGB.b * shade, 0, 1),
            THREE.SRGBColorSpace
          );
          colors[i * 3] = tmpColor.r;
          colors[i * 3 + 1] = tmpColor.g;
          colors[i * 3 + 2] = tmpColor.b;
        }

        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geo.computeVertexNormals();
        const mesh = new THREE.Mesh(geo, rockMat);
        mesh.scale.set(cfg.sx, cfg.sy, cfg.sz);
        mesh.rotation.y = cfg.ry;
        // 下半分を砂（y=0）に埋める
        mesh.position.set(cfg.x, posY, cfg.z);
        mesh.name = `rock-${idx + 1}`;
        group.add(mesh);
      }
      return { group, material: rockMat, updateCaustics };
    }

    // ===== 水面 (y=2.6, sin波で ±0.02m, 周期 >= 6秒) =====
    function buildWaterSurface(options = {}) {
      const geo = new THREE.PlaneGeometry(TANK_W, TANK_D, 54, 33);
      geo.rotateX(-Math.PI / 2);
      const pos = geo.attributes.position;
      const baseXZ = new Float32Array(pos.count * 2);
      for (let i = 0; i < pos.count; i++) {
        baseXZ[i * 2] = pos.getX(i);
        baseXZ[i * 2 + 1] = pos.getZ(i);
      }
      const mat = new THREE.MeshStandardMaterial({
        color: options.color ?? STYLE.waterColor,
        transparent: true,
        opacity: options.opacity ?? STYLE.waterOpacity,
        side: THREE.DoubleSide,
        roughness: options.roughness ?? STYLE.waterRoughness,
        metalness: options.metalness ?? STYLE.waterMetalness,
        envMapIntensity: options.envMapIntensity ?? STYLE.waterEnvMapIntensity,
        envMap: options.envMap ?? null,
        depthWrite: false,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.y = WATER_Y;
      mesh.name = 'water-surface';
      mesh.renderOrder = 2;

      const update = (elapsed) => {
        const w1 = (Math.PI * 2) / 7.5;  // 周期 7.5 秒 (>= 6 秒)
        const w2 = (Math.PI * 2) / 10.5; // 周期 10.5 秒 (>= 6 秒)
        for (let i = 0; i < pos.count; i++) {
          const x = baseXZ[i * 2];
          const z = baseXZ[i * 2 + 1];
          const dy = 0.011 * Math.sin(x * 0.85 + z * 0.40 + elapsed * w1)
                   + 0.008 * Math.sin(-x * 0.50 + z * 1.05 + elapsed * w2);
          pos.setY(i, dy);
        }
        pos.needsUpdate = true;
        geo.computeVertexNormals();
      };

      update(0);
      return { mesh, update };
    }

    const grainTex = buildGrainTexture();
    const backdrop = buildBackdropGradient();
    scene.add(backdrop.mesh);

    const cabinet = buildCabinet({ grainTex });
    scene.add(cabinet.group);

    const sandResult = buildSandFloor(grainTex);
    scene.add(sandResult.mesh);

    const rockResult = buildRocks(grainTex);
    const rockGroup = rockResult.group;
    scene.add(rockGroup);

    const surfaceGlow = buildSurfaceGlow();
    scene.add(surfaceGlow.mesh);

    const water = buildWaterSurface({ envMap: scene.environment });
    scene.add(water.mesh);

    const lightRays = buildLightRays();
    scene.add(lightRays.group);

    const marineSnow = buildMarineSnow();
    for (const pts of marineSnow.points) scene.add(pts);

    const glassTank = buildGlassTank({ envMap: scene.environment });
    scene.add(glassTank.group);

    // ===== 状態・検証用フック (__MYAQ) =====
    const schoolAgents = [];
    const otherFishAgents = [];
    const squidAgents = [];

    const residentTotalEl = document.getElementById('resident-total');
    const schoolLabelEl = document.getElementById('school-label');
    const btnDecEl = document.getElementById('btn-school-dec');
    const btnIncEl = document.getElementById('btn-school-inc');
    const btnAutoCamEl = document.getElementById('btn-auto-cam');
    const statusOverlayEl = document.getElementById('status-overlay');
    const statusBoxEl = document.getElementById('status-box');

    function computeCounts() {
      const katakuchi = schoolAgents.length;
      let aji = 0, madai = 0, kurodai = 0, buri = 0;
      for (const f of otherFishAgents) {
        if (f.species === 'aji') aji++;
        else if (f.species === 'madai') madai++;
        else if (f.species === 'kurodai') kurodai++;
        else if (f.species === 'buri') buri++;
      }
      const squid = squidAgents.length;
      return {
        katakuchi,
        aji,
        madai,
        kurodai,
        buri,
        squid,
        total: katakuchi + aji + madai + kurodai + buri + squid,
      };
    }

    const _centerTmp = new THREE.Vector3();
    function getAllPositions() {
      const out = [];
      for (const f of schoolAgents) {
        const p = f.actor.object.position;
        out.push([p.x, p.y, p.z]);
      }
      for (const f of otherFishAgents) {
        const p = f.actor.object.position;
        out.push([p.x, p.y, p.z]);
      }
      for (const s of squidAgents) {
        s.actor.getCenter(_centerTmp);
        out.push([_centerTmp.x, _centerTmp.y, _centerTmp.z]);
      }
      return out;
    }

    function getSchoolCentroid() {
      if (schoolAgents.length === 0) return [0, 0, 0];
      let sx = 0, sy = 0, sz = 0;
      for (const f of schoolAgents) {
        const p = f.actor.object.position;
        sx += p.x;
        sy += p.y;
        sz += p.z;
      }
      const n = schoolAgents.length;
      return [sx / n, sy / n, sz / n];
    }

    function inspectScene() {
      let egiVisibleCount = 0;
      let lineVisibleCount = 0;
      scene.traverse((obj) => {
        if (obj.name && obj.name.toLowerCase().includes('egi') && obj.visible) {
          egiVisibleCount++;
        }
      });
      const squids = squidAgents.map((s) => {
        if (s.actor.egi?.obj?.visible) egiVisibleCount++;
        if (s.actor.line?.visible) lineVisibleCount++;
        const c = s.actor.getCenter(new THREE.Vector3());
        return {
          home: [s.actor.brain.home.x, s.actor.brain.home.y, s.actor.brain.home.z],
          center: [c.x, c.y, c.z],
          motion: s.actor.motion,
          egiVisible: Boolean(s.actor.egi?.obj?.visible),
          egiShown: Boolean(s.actor.brain?.egiShown),
          targetColor: {
            dark: s.actor.squid.target.dark,
            pale: s.actor.squid.target.pale,
            cloud: s.actor.squid.target.cloud,
          },
          uniformColor: {
            uDark: s.actor.squid.uniforms.uDark.value,
            uPale: s.actor.squid.uniforms.uPale.value,
            uCloud: s.actor.squid.uniforms.uCloud.value,
          },
        };
      });
      return {
        simTime,
        squids,
        egiVisibleCount,
        lineVisibleCount,
        rockCount: rockGroup.children.length,
        cameraPos: [camera.position.x, camera.position.y, camera.position.z],
        targetPos: [controls.target.x, controls.target.y, controls.target.z],
      };
    }

    const myaq = {
      ready: false,
      get counts() {
        return computeCounts();
      },
      positions: getAllPositions,
      schoolCentroid: getSchoolCentroid,
      inspect: inspectScene,
      v2: {
        cabinet: Boolean(cabinet.pedestal),
        glassCount: glassTank.glassMeshes.length,
        frameCount: glassTank.frameMeshes.length,
        particleCount: marineSnow.count,
        particleSample: () => marineSnow.sample(10),
        causticsTime: () => sandResult.updateCaustics.uniforms.uCausticTime.value,
        rayCount: lightRays.rays.length,
        rockCount: rockGroup.children.length,
        bgColor: scene.background.getHex(),
        cameraFov: camera.fov,
        rayOpacities: () => lightRays.rays.map((r) => r.mesh.material.opacity),
        particlesOutOfBounds: () => marineSnow.countOutOfBounds(),
        glassMaxOpacity: () => Math.max(...glassTank.glassMeshes.map((m) => m.material.opacity)),
        glassEnvMapIntensity: glassTank.glassMeshes[0].material.envMapIntensity,
        waterEnvMapIntensity: water.mesh.material.envMapIntensity,
        waterOpacity: water.mesh.material.opacity,
        glassMaterialInfo: () => ({
          color: glassTank.glassMeshes[0].material.color.getHex(),
          opacity: glassTank.glassMeshes[0].material.opacity,
          roughness: glassTank.glassMeshes[0].material.roughness,
          envMapIntensity: glassTank.glassMeshes[0].material.envMapIntensity,
        }),
        waterMaterialInfo: () => ({
          color: water.mesh.material.color.getHex(),
          opacity: water.mesh.material.opacity,
          roughness: water.mesh.material.roughness,
          envMapIntensity: water.mesh.material.envMapIntensity,
        }),
        particleLayers: () => marineSnow.points.map((pts) => ({
          name: pts.name,
          count: pts.geometry.attributes.position.count,
          size: pts.material.size,
          opacity: pts.material.opacity,
          color: pts.material.color.getHex(),
        })),
        causticsInfo: () => ({
          scale1: STYLE.causticsScale1,
          scale2: STYLE.causticsScale2,
          speed1: STYLE.causticsSpeed1,
          speed2: STYLE.causticsSpeed2,
          pow: STYLE.causticsPow,
          sandGain: STYLE.causticsSandGain,
          rockGain: STYLE.causticsRockGain,
          color: STYLE.causticsColor,
        }),
        rayMaterialInfo: () => lightRays.rays.map((r) => ({
          name: r.mesh.name,
          width: r.width,
          opacity: r.mesh.material.opacity,
          hasAlphaMap: Boolean(r.mesh.material.alphaMap),
        })),
        rockMaterialInfo: () => ({
          baseColor: STYLE.rockBaseColor,
          vertexColors: Boolean(rockResult.material.vertexColors),
          bumpMap: Boolean(rockResult.material.bumpMap),
          bumpScale: rockResult.material.bumpScale,
          roughness: rockResult.material.roughness,
        }),
        sandMaterialInfo: () => ({
          vertexColors: Boolean(sandResult.material.vertexColors),
          bumpMap: Boolean(sandResult.material.bumpMap),
          bumpScale: sandResult.material.bumpScale,
          shadeVariance: STYLE.sandShadeVariance,
          causticsGain: STYLE.causticsSandGain,
        }),
        rockBounds: () => rockGroup.children.map((m) => {
          m.updateMatrixWorld(true);
          const box = new THREE.Box3().setFromObject(m);
          return { name: m.name, min: box.min.toArray(), max: box.max.toArray() };
        }),
      },
      v3: {
        get bgColor() {
          return scene.background.getHex();
        },
        get rayCount() {
          return lightRays.rays.length;
        },
        get rayWidths() {
          return lightRays.rays.map((r) => r.width);
        },
        get rayOpacities() {
          return lightRays.rays.map((r) => r.mesh.material.opacity);
        },
        get surfaceGlowOpacity() {
          return surfaceGlow.mesh.material.opacity;
        },
        get backdropPresent() {
          return Boolean(backdrop && backdrop.mesh && backdrop.mesh.parent === scene);
        },
      },
    };
    Object.defineProperty(myaq.v3, 'detail', {
      enumerable: false,
      value: () => ({
        fogDensity: STYLE.fogDensity,
        exposure: renderer.toneMappingExposure,
        hemiIntensity: STYLE.hemiIntensity,
        hemiSkyColor: STYLE.hemiSkyColor,
        sunIntensity: STYLE.sunIntensity,
        sunColor: STYLE.sunColor,
        sunPosition: STYLE.sunPosition,
        rayBaseOpacity: STYLE.rayBaseOpacity,

        backdropSize: [STYLE.backdropWidth, STYLE.backdropHeight],
        surfaceGlowY: surfaceGlow.mesh.position.y,
        surfaceGlowSide: surfaceGlow.material.side,
        surfaceGlowBlending: surfaceGlow.material.blending,
      }),
    });
    window.__MYAQ = myaq;

    // ===== 群れ・遊泳制御 =====
    const schoolState = {
      pos: new THREE.Vector3(0.0, FISH_SPECS.katakuchi.zoneCenter, 0.0),
      goal: new THREE.Vector3(1.8, 1.55, -0.7),
      vel: new THREE.Vector3(),
      timer: 10,
    };

    function pickSchoolGoal(currentPos) {
      const next = new THREE.Vector3();
      for (let tries = 0; tries < 8; tries++) {
        next.set(
          (Math.random() * 2 - 1) * 2.75,
          1.5 + (Math.random() * 2 - 1) * 0.22,
          (Math.random() * 2 - 1) * 1.25
        );
        if (next.distanceTo(currentPos) >= 1.6) break;
      }
      return next;
    }

    function halton(index, base) {
      let result = 0;
      let f = 1 / base;
      let i = index + 1;
      while (i > 0) {
        result += f * (i % base);
        i = Math.floor(i / base);
        f /= base;
      }
      return result;
    }

    function schoolSlotOffset(slotIndex, t, out) {
      // 個体ごとに独立した低食い違い列（Halton 2/3/5）で固定位相・半径（<=0.86m）を割り当て、立体的な群れを保ちつつ回す
      const basePhase = halton(slotIndex, 2) * Math.PI * 2;
      const r = 0.18 + 0.68 * Math.cbrt(halton(slotIndex, 3));
      const dy = (halton(slotIndex, 5) - 0.5) * 0.58 + 0.05 * Math.sin(t * 0.45 + basePhase);
      const ang = basePhase + t * 0.28;
      return out.set(Math.cos(ang) * r, dy, Math.sin(ang) * r);
    }

    function pickFishWaypoint(spec) {
      return new THREE.Vector3(
        (Math.random() * 2 - 1) * 3.45,
        spec.zoneCenter + (Math.random() * 2 - 1) * spec.zoneHalf * 0.85,
        (Math.random() * 2 - 1) * 1.75
      );
    }

    const _steerGoal = new THREE.Vector3();
    const _fwd = new THREE.Vector3();
    const _slotNow = new THREE.Vector3();
    const _slotAhead = new THREE.Vector3();
    const _toSlot = new THREE.Vector3();

    function stepFishAgent(agent, desiredGoal, desiredSpeed, dt) {
      const actor = agent.actor;
      const pos = actor.object.position;
      const spec = agent.spec;
      const zoneMin = spec.zoneCenter - spec.zoneHalf;
      const zoneMax = spec.zoneCenter + spec.zoneHalf;

      // 壁（|x|>4.0, |z|>2.2）や遊泳帯上下限に近づいたら中心方向へ目標方位を寄せる
      const wallX = smoothstep(Math.abs(pos.x), 3.45, 4.02);
      const wallZ = smoothstep(Math.abs(pos.z), 1.68, 2.22);
      const wallWeight = Math.max(wallX, wallZ);

      _steerGoal.copy(desiredGoal);
      if (wallWeight > 0) {
        _steerGoal.lerp(_centerTmp.set(0, spec.zoneCenter, 0), wallWeight);
      }

      if (pos.y < zoneMin + 0.14) {
        const pull = smoothstep(zoneMin + 0.14 - pos.y, 0, 0.22);
        _steerGoal.y = THREE.MathUtils.lerp(_steerGoal.y, spec.zoneCenter + spec.zoneHalf * 0.35, pull);
      } else if (pos.y > zoneMax - 0.14) {
        const pull = smoothstep(pos.y - (zoneMax - 0.14), 0, 0.22);
        _steerGoal.y = THREE.MathUtils.lerp(_steerGoal.y, spec.zoneCenter - spec.zoneHalf * 0.35, pull);
      }
      _steerGoal.y = clamp(_steerGoal.y, zoneMin, zoneMax);

      // 目標方位への滑らかな旋回（turnRate 最大 0.9 rad/s）
      const dx = _steerGoal.x - pos.x;
      const dz = _steerGoal.z - pos.z;
      const targetYaw = Math.atan2(dx, dz);
      const diff = wrapAngle(targetYaw - agent.yaw);
      const wantTurn = clamp(diff * 1.85, -MAX_TURN_RATE, MAX_TURN_RATE);
      agent.turnRate += (wantTurn - agent.turnRate) * Math.min(1, dt * 6);
      agent.turnRate = clamp(agent.turnRate, -MAX_TURN_RATE, MAX_TURN_RATE);

      // 垂直方向の滑らかな追従
      const dy = _steerGoal.y - pos.y;
      const wantVy = clamp(dy * 0.85, -0.22, 0.22);
      const wantPitch = clamp(-Math.atan2(wantVy, Math.max(actor.currentSpeed, 0.2)), -0.24, 0.24);
      agent.pitch += (wantPitch - agent.pitch) * Math.min(1, dt * 4);

      // FishActor に速度・旋回率を渡し、体アニメーションを更新
      actor.drive = { speed: desiredSpeed, turnRate: agent.turnRate };
      actor.update(dt);

      // +Z 前進と Y 軸回りの回転は呼び出し側が担当（FishActor 仕様）
      agent.yaw = wrapAngle(agent.yaw + agent.turnRate * dt);
      actor.object.rotation.set(agent.pitch, agent.yaw, 0, 'YXZ');
      _fwd.set(0, 0, 1).applyEuler(actor.object.rotation);
      pos.addScaledVector(_fwd, actor.currentSpeed * dt);

      // 水槽内寸（|x|<=4.5, |z|<=2.75, 0<=y<=2.6）を確実に保つ安全クランプ
      pos.x = clamp(pos.x, -HALF_X + 0.08, HALF_X - 0.08);
      pos.z = clamp(pos.z, -HALF_Z + 0.08, HALF_Z - 0.08);
      pos.y = clamp(pos.y, 0.12, WATER_Y - 0.12);
    }

    function createSchoolFish(slotIndex, simTime) {
      const spec = FISH_SPECS.katakuchi;
      const actor = createFish('katakuchi');
      actor.setMotion('swim');

      schoolSlotOffset(slotIndex, simTime, _slotNow).add(schoolState.pos);
      actor.object.position.set(
        clamp(_slotNow.x, -HALF_X + 0.2, HALF_X - 0.2),
        clamp(_slotNow.y, spec.zoneCenter - spec.zoneHalf + 0.05, spec.zoneCenter + spec.zoneHalf - 0.05),
        clamp(_slotNow.z, -HALF_Z + 0.2, HALF_Z - 0.2)
      );

      const tangentAngle = halton(slotIndex, 2) * Math.PI * 2 + simTime * 0.28 + Math.PI / 2;
      const yaw = wrapAngle(Math.atan2(Math.cos(tangentAngle), Math.sin(tangentAngle)) + (Math.random() - 0.5) * 0.35);
      actor.object.rotation.set(0, yaw, 0, 'YXZ');
      scene.add(actor.object);

      return {
        species: 'katakuchi',
        spec,
        actor,
        slotIndex,
        yaw,
        pitch: 0,
        turnRate: 0,
        speedOffset: (Math.random() - 0.5) * 0.04,
      };
    }

    function setSchoolCount(targetCount, simTime) {
      const clamped = clamp(Math.round(targetCount / SCHOOL_STEP) * SCHOOL_STEP, SCHOOL_MIN, SCHOOL_MAX);
      while (schoolAgents.length < clamped) {
        const agent = createSchoolFish(schoolAgents.length, simTime);
        schoolAgents.push(agent);
      }
      while (schoolAgents.length > clamped) {
        const removed = schoolAgents.pop();
        removed.actor.dispose();
      }
      updateHudUI();
    }

    function updateHudUI() {
      const c = computeCounts();
      residentTotalEl.textContent = String(c.total);
      schoolLabelEl.textContent = `群れ ${c.katakuchi}`;
      btnDecEl.disabled = c.katakuchi <= SCHOOL_MIN;
      btnIncEl.disabled = c.katakuchi >= SCHOOL_MAX;
    }

    // ===== メイン初期化 & ループ =====
    let simTime = 0;

    btnDecEl.addEventListener('click', () => {
      if (!myaq.ready) return;
      setSchoolCount(schoolAgents.length - SCHOOL_STEP, simTime);
    });

    btnIncEl.addEventListener('click', () => {
      if (!myaq.ready) return;
      setSchoolCount(schoolAgents.length + SCHOOL_STEP, simTime);
    });

    btnAutoCamEl.addEventListener('click', () => {
      controls.autoRotate = !controls.autoRotate;
      btnAutoCamEl.classList.toggle('is-on', controls.autoRotate);
      btnAutoCamEl.setAttribute('aria-pressed', String(controls.autoRotate));
      btnAutoCamEl.textContent = controls.autoRotate ? '自動カメラ ON' : '自動カメラ OFF';
    });

    async function initAquarium() {
      try {
        await Promise.all([
          loadFish('./vendor/fish-kit/fish/', ['katakuchi', 'aji', 'madai', 'kurodai', 'buri']),
          loadSquids('./vendor/squid-kit/', ['aori']),
        ]);

        // カタクチイワシ 42 匹の群れ
        setSchoolCount(INITIAL_SCHOOL_COUNT, 0);

        // その他 4 種の魚（アジ 5, マダイ 2, クロダイ 2, ブリ 2）
        for (const species of ['aji', 'madai', 'kurodai', 'buri']) {
          const spec = FISH_SPECS[species];
          for (let i = 0; i < spec.count; i++) {
            const actor = createFish(species, spec.lengthCm);
            actor.setMotion('swim');
            const startPos = pickFishWaypoint(spec);
            const yaw = Math.random() * Math.PI * 2 - Math.PI;
            actor.object.position.copy(startPos);
            actor.object.rotation.set(0, yaw, 0, 'YXZ');
            scene.add(actor.object);
            otherFishAgents.push({
              species,
              spec,
              actor,
              yaw,
              pitch: 0,
              turnRate: 0,
              waypoint: pickFishWaypoint(spec),
              waypointTimer: 4 + Math.random() * 5,
              speedBias: (Math.random() - 0.5) * 0.04,
            });
          }
        }

        // アオリイカ 2 匹（home = (±1.6, 1.0, ∓0.6), floorY = 0）
        const squidConfigs = [
          { home: new THREE.Vector3( 1.6, 1.0, -0.6), initialDelay: 16.5, colorPhase: 0.4 },
          { home: new THREE.Vector3(-1.6, 1.0,  0.6), initialDelay: 24.0, colorPhase: 3.1 },
        ];
        for (const cfg of squidConfigs) {
          const actor = createSquid('aori', { home: cfg.home, floorY: 0 });
          actor.setMotion('hover');
          // SquidBrain.update が毎フレーム target を NEUTRAL で初期化するため、
          // brain.update 直後・squid.update 直前に穏やかな色変化を target に反映する
          const origBrainUpdate = actor.brain.update.bind(actor.brain);
          actor.brain.update = (stepDt) => {
            origBrainUpdate(stepDt);
            const cT = simTime + cfg.colorPhase;
            const tg = actor.squid.target;
            tg.dark = 0.33 + 0.14 * Math.sin(cT * 0.32) + 0.05 * Math.sin(cT * 0.17 + 1.1);
            tg.cloud = Math.max(0, Math.sin(cT * 0.24 + 0.7) - 0.35) * 0.45;
            tg.pale = Math.max(0, Math.sin(cT * 0.19 + 2.2) - 0.58) * 0.42;
          };
          // squid.object は移動・回転・拡縮しない（キット仕様）
          scene.add(actor.object);
          squidAgents.push({
            actor,
            timer: cfg.initialDelay,
            isForward: false,
          });
        }

        updateHudUI();
        statusOverlayEl.classList.add('hidden');
        myaq.ready = true;
      } catch (err) {
        myaq.ready = false;
        const msg = err && err.message ? err.message : String(err);
        console.error('Aquarium load failed:', err);
        statusBoxEl.classList.add('error');
        statusBoxEl.textContent = `読み込みに失敗しました: ${msg}`;
      }
    }

    initAquarium();

    const clock = new THREE.Clock();
    const _desiredVel = new THREE.Vector3();
    const _schoolDiff = new THREE.Vector3();

    function stepSimulation(dt) {
      simTime += dt;

      // 1) 群れ目標点の滑らかな移動（8〜15 秒ごとに次の点へ）
      schoolState.timer -= dt;
      _schoolDiff.subVectors(schoolState.goal, schoolState.pos);
      const distToGoal = _schoolDiff.length();
      if (schoolState.timer <= 0 || distToGoal < 0.25) {
        schoolState.goal = pickSchoolGoal(schoolState.pos);
        schoolState.timer = 8 + Math.random() * 7;
        _schoolDiff.subVectors(schoolState.goal, schoolState.pos);
      }
      const goalDist = _schoolDiff.length();
      if (goalDist > 1e-4) {
        const cruise = Math.min(0.24, goalDist * 0.35);
        _desiredVel.copy(_schoolDiff).multiplyScalar(cruise / goalDist);
      } else {
        _desiredVel.set(0, 0, 0);
      }
      schoolState.vel.lerp(_desiredVel, 1 - Math.exp(-1.4 * dt));
      schoolState.pos.addScaledVector(schoolState.vel, dt);
      schoolState.pos.x = clamp(schoolState.pos.x, -3.0, 3.0);
      schoolState.pos.y = clamp(schoolState.pos.y, 1.25, 1.75);
      schoolState.pos.z = clamp(schoolState.pos.z, -1.5, 1.5);

      // 2) カタクチイワシ群れの更新
      const lookAhead = 0.75;
      for (const agent of schoolAgents) {
        schoolSlotOffset(agent.slotIndex, simTime, _slotNow).add(schoolState.pos);
        schoolSlotOffset(agent.slotIndex, simTime + lookAhead, _slotAhead)
          .add(schoolState.pos)
          .addScaledVector(schoolState.vel, lookAhead);

        _toSlot.subVectors(_slotNow, agent.actor.object.position);
        const lagDist = _toSlot.length();
        _fwd.set(0, 0, 1).applyEuler(agent.actor.object.rotation);
        const aheadScore = _toSlot.dot(_fwd);
        const speed = clamp(
          agent.spec.speed + agent.speedOffset + aheadScore * 0.22 + Math.max(0, lagDist - 0.7) * 0.14,
          0.26,
          0.48
        );
        stepFishAgent(agent, _slotAhead, speed, dt);
      }

      // 3) その他 4 種の魚を更新
      for (const agent of otherFishAgents) {
        agent.waypointTimer -= dt;
        if (agent.waypointTimer <= 0 || agent.actor.object.position.distanceTo(agent.waypoint) < 0.75) {
          agent.waypoint = pickFishWaypoint(agent.spec);
          agent.waypointTimer = 4.5 + Math.random() * 5.5;
        }
        const speed = Math.max(0.15, agent.spec.speed + agent.speedBias);
        stepFishAgent(agent, agent.waypoint, speed, dt);
      }

      // 4) アオリイカ 2 匹を更新（基本 hover、15〜30 秒ごとに数秒 forward）
      for (const s of squidAgents) {
        s.timer -= dt;
        if (s.timer <= 0) {
          if (!s.isForward) {
            s.isForward = true;
            s.actor.setMotion('forward');
            s.timer = 4.0 + Math.random() * 2.0;
          } else {
            s.isForward = false;
            s.actor.setMotion('hover');
            s.timer = 15.0 + Math.random() * 15.0;
          }
        }
        s.actor.update(dt);
      }
    }

    renderer.setAnimationLoop(() => {
      const rawDt = Math.min(clock.getDelta(), 0.25);

      if (myaq.ready) {
        let rem = rawDt;
        while (rem > 1e-6) {
          const stepDt = Math.min(rem, 0.05);
          stepSimulation(stepDt);
          rem -= stepDt;
        }
      } else {
        simTime += rawDt;
      }

      water.update(simTime);
      marineSnow.update(rawDt, simTime);
      lightRays.update(simTime);
      sandResult.updateCaustics(simTime);
      rockResult.updateCaustics(simTime);

      // OrbitControls の target とカメラ位置を水槽周辺の安全範囲へ制限
      controls.target.x = clamp(controls.target.x, -4.0, 4.0);
      controls.target.y = clamp(controls.target.y, 0.25, 2.35);
      controls.target.z = clamp(controls.target.z, -2.3, 2.3);
      controls.update();
      if (camera.position.y < 0.15) camera.position.y = 0.15;

      renderer.render(scene, camera);
    });
  </script>
