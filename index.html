            vec3 col = mix(uMidCol, uEdgeCol, smoothstep(0.28, 1.08, radial));

            // 光柱の真上に並ぶ明るい水面スカイライトだまり
            float p1 = exp(-dot((p - vec2(-0.03, -0.15)) / vec2(0.97, 1.15), (p - vec2(-0.03, -0.15)) / vec2(0.97, 1.15)));
            float p2 = exp(-dot((p - vec2( 0.95, -0.42)) / vec2(0.87, 1.05), (p - vec2( 0.95, -0.42)) / vec2(0.87, 1.05)));
            float p3 = exp(-dot((p - vec2(-1.10,  0.10)) / vec2(0.77, 0.95), (p - vec2(-1.10,  0.10)) / vec2(0.77, 0.95)));
            float p4 = exp(-dot((p - vec2( 1.83, -0.70)) / vec2(0.63, 0.85), (p - vec2( 1.83, -0.70)) / vec2(0.63, 0.85)));
            float pool = clamp(p1 * 0.85 + p2 * 0.72 + p3 * 0.56 + p4 * 0.44, 0.0, 1.0);

            // 波紋のきらめき（見上げた水面が生きているように揺らめく）
            float r1 = waveRipple(p * 1.15, uTime);
            float r2 = waveRipple(p * 2.35 + vec2(3.1, -1.7), uTime * 1.25);
            float crest = pow(clamp(0.52 + 0.48 * (r1 * 0.65 + r2 * 0.35), 0.0, 1.0), 2.4);
            float sparkle = pow(clamp(0.5 + 0.5 * r2, 0.0, 1.0), 5.0) * pool * 0.55;

            col = mix(col, uCenterCol, clamp(pool * (0.45 + 0.55 * crest) + sparkle, 0.0, 0.92));
            col *= (0.78 + 0.34 * crest);

            gl_FragColor = vec4(col, uOpacity);
            #include <tonemapping_fragment>
            #include <colorspace_fragment>
          }
        `,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(0, posY, 0);
      mesh.renderOrder = 1;
      mesh.name = 'surface-glow';
      const update = (elapsed) => {
        uniforms.uTime.value = elapsed;
      };
      return { mesh, material: mat, uniforms, update };
    }

    // ===== 部品：砂床 (buildSandFloor, 貝殻砂利テクスチャ＋岩・構造物直下の接触影 AO＋コースティクス) =====
    function buildSandFloor(sandTex, shadowDiscs = []) {
      const geo = new THREE.PlaneGeometry(TANK_W, TANK_D, 108, 66);
      geo.rotateX(-Math.PI / 2);
      const pos = geo.attributes.position;
      const colors = new Float32Array(pos.count * 3);
      const baseR = ((STYLE.sandBaseColor >> 16) & 255) / 255;
      const baseG = ((STYLE.sandBaseColor >> 8) & 255) / 255;
      const baseB = (STYLE.sandBaseColor & 255) / 255;
      const tmpColor = new THREE.Color();

      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const z = pos.getZ(i);
        const y = sampleSandHeight(x, z);
        pos.setY(i, y);

        const cLow = fbm2D((x / TANK_SCALE) * 1.15 + 11.3, (z / TANK_SCALE) * 1.15 - 7.1, 17);
        const cHigh = fbm2D((x / TANK_SCALE) * 4.5 - 3.7, (z / TANK_SCALE) * 4.5 + 5.2, 29);
        const cMix = clamp(cLow * 0.58 + cHigh * 0.42, -1, 1);
        const sandVar = STYLE.sandShadeVariance;
        let shade = clamp(1.0 + cMix * sandVar, 1.0 - sandVar, 1.0 + sandVar);

        // 手前の明るい砂だまりと両端・奥の自然な暗がり
        const edgeDark = 1.0 - smoothstep(Math.abs(x) / HALF_X, 0.72, 1.0) * 0.34;
        const backDark = 1.0 - smoothstep(-z / HALF_Z, 0.45, 1.0) * 0.30;
        shade *= edgeDark * backDark;

        // 岩や沈んだ構造物の直下に接触影（AO）を焼き込み、浮き感をゼロにする
        let ao = 1.0;
        for (let d = 0; d < shadowDiscs.length; d++) {
          const sd = shadowDiscs[d];
          const dx = (x - sd.x) / sd.rx;
          const dz = (z - sd.z) / sd.rz;
          const dist = Math.hypot(dx, dz);
          if (dist < 1.35) {
            const occ = (1.0 - smoothstep(dist, 0.35, 1.35)) * (sd.strength ?? STYLE.sandContactShadowStrength);
            ao *= (1.0 - occ);
          }
        }
        shade *= clamp(ao, 0.24, 1.0);

        tmpColor.setRGB(
          clamp(baseR * shade, 0, 1),
          clamp(baseG * shade, 0, 1),
          clamp(baseB * shade, 0, 1),
          THREE.SRGBColorSpace
        );
        colors[i * 3] = tmpColor.r;
        colors[i * 3 + 1] = tmpColor.g;
        colors[i * 3 + 2] = tmpColor.b;
      }

      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geo.computeVertexNormals();
      const mat = new THREE.MeshStandardMaterial({
        map: sandTex.map,
        vertexColors: true,
        roughness: 0.96,
        metalness: 0.0,
        bumpMap: sandTex.bump,
        bumpScale: STYLE.sandBumpScale,
      });
      const updateCaustics = applyCaustics(mat, { mode: 'sand', cacheTag: 'sand-uw' });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.name = 'sand-floor';
      return { mesh, material: mat, updateCaustics };
    }

    // ===== 部品：瀬戸内海・岩礁群 (buildRocks, 層状崖＋暗赤褐色の石灰藻＆苔斑＋水槽内厳密クランプ) =====
    function buildRocks(rockTex, options = {}) {
      const rockConfigs = options.rockConfigs ?? STYLE.rockConfigs;
      const photoMap = options.photoMap ?? null;   // v7：写真テクスチャ（無ければ v6 の手続き生成）
      const rockMat = new THREE.MeshStandardMaterial({
        map: photoMap ?? rockTex.map,
        vertexColors: true,
        roughness: STYLE.rockRoughness,
        metalness: 0.02,
        bumpMap: rockTex.bump,
        bumpScale: STYLE.rockBumpScale,
      });
      // v7：写真は世界座標の 3 方向投影で貼る（コースティクスより先に組み込む）
      const triplanar = photoMap ? applyRockTriplanar(rockMat) : null;
      const updateCaustics = applyCaustics(rockMat, { mode: 'rock', cacheTag: photoMap ? 'rock-uw-tri' : 'rock-uw' });

      const group = new THREE.Group();
      group.name = 'rocks';
      const shadowDiscs = [];

      const baseCol = new THREE.Color(STYLE.rockBaseColor);
      const mossCol = new THREE.Color(STYLE.rockMossColor);
      const corallineCol = new THREE.Color(STYLE.rockCorallineColor);
      const hiCol = new THREE.Color(STYLE.rockHighlightColor);
      const whiteCol = new THREE.Color(1, 1, 1);
      const tmpColor = new THREE.Color();
      const v = new THREE.Vector3();

      for (let idx = 0; idx < rockConfigs.length; idx++) {
        const cfg = rockConfigs[idx];
        // インデックス共有の SphereGeometry を使い、フラット三角面を無くして滑らかな有機岩礁法線を得る
        const segW = cfg.hero ? 52 : 36;
        const segH = cfg.hero ? 36 : 26;
        const geo = new THREE.SphereGeometry(cfg.r, segW, segH);
        const pos = geo.attributes.position;
        const posY = cfg.lowFloor ? -cfg.r * cfg.sy * 0.25 : -cfg.r * cfg.sy * 0.14;
        const maxDisp = cfg.hero ? STYLE.rockHeroDispMax : STYLE.rockDispMax;
        const strataWeight = cfg.strata ?? 0.8;

        const cosR = Math.cos(cfg.ry);
        const sinR = Math.sin(cfg.ry);
        const dispCache = new Float32Array(pos.count);
        const dirCache = new Float32Array(pos.count * 3);

        for (let i = 0; i < pos.count; i++) {
          v.fromBufferAttribute(pos, i);
          const dir = v.clone().normalize();
          dirCache[i * 3] = dir.x;
          dirCache[i * 3 + 1] = dir.y;
          dirCache[i * 3 + 2] = dir.z;

          const n1 = valueNoise3D(dir.x * 2.4 + 3.1, dir.y * 2.4 + 5.3, dir.z * 2.4 + 7.2, cfg.seed) * 2 - 1;
          const n2 = valueNoise3D(dir.x * 5.6 + 9.2, dir.y * 5.6 + 1.4, dir.z * 5.6 + 4.7, cfg.seed + 7) * 2 - 1;
          const n3 = valueNoise3D(dir.x * 11.2 + 2.0, dir.y * 11.2 + 8.0, dir.z * 11.2 + 3.0, cfg.seed + 19) * 2 - 1;
          const ridge1 = Math.pow(1.0 - Math.abs(n1), 1.45) * 2.0 - 1.0;
          const ridge2 = Math.pow(1.0 - Math.abs(n2), 1.35) * 2.0 - 1.0;
          // 地層の段差テラス感
          const strata = Math.sin(dir.y * 11.5 + n1 * 2.6) * STYLE.rockStrataAmp * strataWeight;
          const raw = ridge1 * 0.44 + n1 * 0.28 + ridge2 * 0.26 + n3 * 0.14;
          const disp = clamp(raw * maxDisp + strata, -maxDisp, maxDisp);
          dispCache[i] = disp;
          v.multiplyScalar(1 + disp);

          // 岩底を砂床の下へ確実に埋め込みつつ台座下面を貫通しないよう整形
          if (v.y < 0) v.y *= 0.32;

          // スケール・Y回転・平行移動を世界座標へベイクし、水槽ガラス＆魚巡回帯を絶対に侵さないよう滑らかに整形
          const sx = v.x * cfg.sx;
          const sy = v.y * cfg.sy;
          const sz = v.z * cfg.sz;
          let wx = cfg.x + sx * cosR + sz * sinR;
          let wy = posY + sy;
          let wz = cfg.z - sx * sinR + sz * cosR;

          // 水槽内安全マージン（v6 の |x| <= 4.40, |z| <= 2.66, -0.22 <= y <= 2.38 を倍率どおりに縮める）
          wx = clamp(wx, -HALF_X + tl(0.10), HALF_X - tl(0.10));
          wz = clamp(wz, -HALF_Z + tl(0.09), HALF_Z - tl(0.09));
          wy = clamp(wy, tl(-0.22), WATER_Y - tl(0.22));

          // 魚の巡回経路保護（v6 の値 × 倍率）：手前岩は z >= 1.80 に、奥岩は z <= -1.79 に収める、低い平岩は y <= 0.28
          if (cfg.fgGuard && wy > tl(0.10)) {
            wz = Math.max(wz, tl(1.08));
          } else if (cfg.z < tl(-1.11) && wy > tl(0.12)) {
            wz = Math.min(wz, tl(-1.07));
          } else if (cfg.x < tl(-2.37) && wy > tl(0.12) && wz > tl(-1.07) && wz < tl(1.07)) {
            wx = Math.min(wx, tl(-2.33));
          } else if (cfg.x > tl(2.37) && wy > tl(0.12) && wz > tl(-1.07) && wz < tl(1.07)) {
            wx = Math.max(wx, tl(2.33));
          }
          if (cfg.lowFloor) {
            wy = Math.min(wy, tl(0.28));
          }

          pos.setXYZ(i, wx - cfg.x, wy - posY, wz - cfg.z);
        }

        geo.computeVertexNormals();
        // SphereGeometry の UV 継ぎ目（列 0 と列 segW）の法線を平均化して継ぎ目を完全に消す
        const normAttr = geo.attributes.normal;
        const rowStride = segW + 1;
        for (let r = 0; r <= segH; r++) {
          const i0 = r * rowStride;
          const i1 = r * rowStride + segW;
          const nx = normAttr.getX(i0) + normAttr.getX(i1);
          const ny = normAttr.getY(i0) + normAttr.getY(i1);
          const nz = normAttr.getZ(i0) + normAttr.getZ(i1);
          const len = Math.hypot(nx, ny, nz) || 1.0;
          normAttr.setXYZ(i0, nx / len, ny / len, nz / len);
          normAttr.setXYZ(i1, nx / len, ny / len, nz / len);
        }
        normAttr.needsUpdate = true;
        const colors = new Float32Array(pos.count * 3);

        for (let i = 0; i < pos.count; i++) {
          const dx = dirCache[i * 3];
          const dy = dirCache[i * 3 + 1];
          const dz = dirCache[i * 3 + 2];
          const ny = normAttr.getY(i);
          const disp = dispCache[i];

          const dispNorm = clamp((disp / maxDisp + 1.0) * 0.5, 0, 1);
          const creviceShade = STYLE.rockCreviceMin + (1.0 - STYLE.rockCreviceMin) * Math.pow(dispNorm, 0.85);
          const patchA = valueNoise3D(dx * 3.4 + 2.1, dy * 3.4 + 6.4, dz * 3.4 + 1.3, cfg.seed + 31);
          const patchB = valueNoise3D(dx * 5.8 - 4.2, dy * 5.8 + 2.7, dz * 5.8 - 3.1, cfg.seed + 47);

          tmpColor.copy(baseCol);
          // 石灰藻の暗赤褐色パッチ
          tmpColor.lerp(corallineCol, smoothstep(patchA, 0.42, 0.82) * 0.65);
          // 上向き面の深い苔・海藻斑（favorite-01.png の主役岩頂部・左崖テラスの緑苔）
          const mossAmt = smoothstep(ny, 0.36, 0.84) * smoothstep(patchB, 0.38, 0.78) * (cfg.moss ?? 0.75) * 0.72;
          tmpColor.lerp(mossCol, mossAmt);
          // 鋭い稜線のわずかな石灰質ハイライト
          const ridgeAmt = smoothstep(dispNorm, 0.72, 0.98) * smoothstep(ny, 0.15, 0.75) * 0.24;
          tmpColor.lerp(hiCol, ridgeAmt);

          const microVar = 1.0 + (patchB * 2 - 1) * STYLE.rockColorVariance * 0.55;
          const totalShade = clamp(creviceShade * microVar, STYLE.rockCreviceMin * 0.85, 1.12);
          if (photoMap) {
            // v7：写真の色を活かすため、色味を明るさ 1 にそろえてから白へ寄せ、STYLE.rockPhotoTintMix の割合だけ残す
            // （v6 の頂点カラーは明るい灰色の手続きテクスチャ用で、そのまま写真にかけると黒くつぶれる。くぼみの陰影はそのまま）
            const peak = Math.max(tmpColor.r, tmpColor.g, tmpColor.b, 1e-4);
            tmpColor.multiplyScalar(1 / peak).lerp(whiteCol, 1 - STYLE.rockPhotoTintMix).multiplyScalar(STYLE.rockPhotoBrightness);
          }
          tmpColor.multiplyScalar(totalShade);

          colors[i * 3] = tmpColor.r;
          colors[i * 3 + 1] = tmpColor.g;
          colors[i * 3 + 2] = tmpColor.b;
        }

        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        if (triplanar) {
          // 岩ごとに投影の位置をずらす（どの岩も同じ模様・同じ対称の軸にならないように）
          const rnd = makePrng(cfg.seed * 7919 + 17);
          const off = [rnd() * 7.3, rnd() * 7.3, rnd() * 7.3];
          const offArr = new Float32Array(pos.count * 3);
          for (let i = 0; i < pos.count; i++) offArr.set(off, i * 3);
          geo.setAttribute('triOffset', new THREE.BufferAttribute(offArr, 3));
        }
        const mesh = new THREE.Mesh(geo, rockMat);
        mesh.position.set(cfg.x, posY, cfg.z);
        mesh.name = cfg.name || `rock-${idx + 1}`;
        group.add(mesh);

        // 砂床接触影用ディスクを登録
        shadowDiscs.push({
          x: cfg.x,
          z: cfg.z,
          rx: Math.max(tl(0.35), cfg.r * Math.max(cfg.sx, cfg.sz) * 1.15),
          rz: Math.max(tl(0.35), cfg.r * Math.max(cfg.sz, cfg.sx) * 0.95),
          strength: cfg.hero ? 0.60 : 0.44,
        });
      }

      return { group, material: rockMat, updateCaustics, shadowDiscs, photoMap, triplanar };
    }

    // ===== 部品：瀬戸内海の生活感・沈んだ構造物群 (buildSunkenProps) =====
    // favorite-01.png の「土管クラスター・白コルゲート管・蛸壺・錆びた魚礁ボックス・沈んだ木樽・流木・小石群」を関数分離
    function buildSunkenProps(propTex, rockTex) {
      const group = new THREE.Group();
      group.name = 'sunken-props';
      // v7：小物は v6 の座標・大きさで組み立て、群ごと倍率で縮める（砂の高さ・接触影も同じ倍率で合わせる）
      group.scale.setScalar(TANK_SCALE);
      const props = [];
      const shadowDiscs = [];
      const causticUpdaters = [];

      const makePropMat = (tex, bumpTex, opts = {}) => {
        const mat = new THREE.MeshStandardMaterial({
          map: tex,
          color: opts.color ?? 0xffffff,
          roughness: opts.roughness ?? 0.90,
          metalness: opts.metalness ?? 0.05,
          bumpMap: bumpTex ?? null,
          bumpScale: opts.bumpScale ?? 0.16,
        });
        causticUpdaters.push(applyCaustics(mat, { mode: 'rock', gain: opts.causticGain ?? 0.15, cacheTag: opts.cacheTag }));
        return mat;
      };

      const clayMat = makePropMat(propTex.clayPipe, rockTex.bump, { roughness: 0.92, bumpScale: 0.18, cacheTag: 'prop-clay' });
      const clayDarkMat = makePropMat(propTex.clayPipe, rockTex.bump, { color: 0x382818, roughness: 0.96, bumpScale: 0.12, causticGain: 0.04, cacheTag: 'prop-clay-in' });
      const terraMat = makePropMat(propTex.clayPipe, rockTex.bump, { color: 0xb06d4a, roughness: 0.88, bumpScale: 0.16, cacheTag: 'prop-terra' });
      const palePipeMat = makePropMat(propTex.palePipe, rockTex.bump, { roughness: 0.84, bumpScale: 0.22, cacheTag: 'prop-pale' });
      const rustMat = makePropMat(propTex.rustIron, rockTex.bump, { roughness: 0.86, metalness: 0.24, bumpScale: 0.24, cacheTag: 'prop-rust' });
      const woodMat = makePropMat(propTex.barrelWood, rockTex.bump, { roughness: 0.88, metalness: 0.04, bumpScale: 0.20, cacheTag: 'prop-wood' });
      const hoopMat = makePropMat(propTex.rustIron, rockTex.bump, { color: 0x463026, roughness: 0.72, metalness: 0.52, bumpScale: 0.15, cacheTag: 'prop-hoop' });
      const cobbleMat = makePropMat(rockTex.map, rockTex.bump, { color: 0x5c362c, roughness: 0.94, bumpScale: 0.28, cacheTag: 'prop-cobble' });

      // ヘルパー：厚みのある中空円筒（土管）を LatheGeometry で生成（内壁まで実造形）
      function createHollowPipeMesh(outerR, innerR, len, mat, bellEnd = true) {
        const hl = len * 0.5;
        const pts = [
          new THREE.Vector2(innerR, -hl),
          new THREE.Vector2(outerR, -hl),
          new THREE.Vector2(outerR, hl * 0.78),
        ];
        if (bellEnd) {
          pts.push(
            new THREE.Vector2(outerR * 1.12, hl * 0.84),
            new THREE.Vector2(outerR * 1.12, hl),
            new THREE.Vector2(innerR * 1.04, hl),
            new THREE.Vector2(innerR, hl * 0.86)
          );
        } else {
          pts.push(
            new THREE.Vector2(outerR, hl),
            new THREE.Vector2(innerR, hl)
          );
        }
        pts.push(new THREE.Vector2(innerR, -hl));
        const geo = new THREE.LatheGeometry(pts, 28);
        geo.rotateX(Math.PI / 2); // 軸を +Z 向きに揃える
        geo.computeVertexNormals();
        const mesh = new THREE.Mesh(geo, mat);
        // 内部奥の暗影コア（管の中が本物のように暗く見える）
        const innerPlug = new THREE.Mesh(
          new THREE.CylinderGeometry(innerR * 0.97, innerR * 0.97, len * 0.84, 20, 1, true),
          clayDarkMat
        );
        innerPlug.rotation.x = Math.PI / 2;
        innerPlug.material.side = THREE.BackSide;
        const wrap = new THREE.Group();
        wrap.add(mesh);
        wrap.add(innerPlug);
        return wrap;
      }

      // ヘルパー：円孔が開いた四角枠ブロック（角型土管・魚礁ボックス）
      function createPerforatedSquareBlock(sizeW, sizeH, depth, holeR, mat) {
        const hw = sizeW * 0.5;
        const hh = sizeH * 0.5;
        const ch = Math.min(hw, hh) * 0.14;
        const shape = new THREE.Shape();
        shape.moveTo(-hw + ch, -hh);
        shape.lineTo( hw - ch, -hh);
        shape.lineTo( hw, -hh + ch);
        shape.lineTo( hw,  hh - ch);
        shape.lineTo( hw - ch,  hh);
        shape.lineTo(-hw + ch,  hh);
        shape.lineTo(-hw,  hh - ch);
        shape.lineTo(-hw, -hh + ch);
        shape.closePath();

        const hole = new THREE.Path();
        hole.absarc(0, 0, holeR, 0, Math.PI * 2, true);
        shape.holes.push(hole);

        const geo = new THREE.ExtrudeGeometry(shape, {
          depth,
          bevelEnabled: true,
          bevelThickness: 0.008,
          bevelSize: 0.008,
          bevelSegments: 2,
          curveSegments: 20,
        });
        geo.translate(0, 0, -depth * 0.5);
        geo.computeVertexNormals();
        return new THREE.Mesh(geo, mat);
      }

      // --- 1. 手前左の土管クラスター（favorite-01.png 左下：丸土管 2 本＋上に載る角孔管＋横の小土管） ---
      const pipeCluster = new THREE.Group();
      pipeCluster.name = 'prop-clay-pipes';

      const pipeL = createHollowPipeMesh(0.185, 0.138, 0.52, clayMat, true);
      pipeL.position.set(-1.16, 0.14, 1.28);
      pipeL.rotation.set(-0.04, 0.24, 0.03);
      pipeCluster.add(pipeL);

      const pipeR = createHollowPipeMesh(0.172, 0.128, 0.50, clayMat, true);
      pipeR.position.set(-0.90, 0.13, 1.27);
      pipeR.rotation.set(-0.03, 0.16, -0.02);
      pipeCluster.add(pipeR);

      const topCulvert = createPerforatedSquareBlock(0.24, 0.24, 0.44, 0.082, clayMat);
      topCulvert.position.set(-1.03, 0.34, 1.25);
      topCulvert.rotation.set(-0.05, 0.20, -0.09);
      pipeCluster.add(topCulvert);

      const smallPotPipe = createHollowPipeMesh(0.112, 0.082, 0.34, terraMat, true);
      smallPotPipe.position.set(-0.72, 0.095, 1.37);
      smallPotPipe.rotation.set(-0.08, 0.22, 0.04);
      pipeCluster.add(smallPotPipe);

      group.add(pipeCluster);
      props.push(pipeCluster);
      shadowDiscs.push({ x: -1.01, z: 2.26, rx: 0.72, rz: 0.44, strength: 0.56 });

      // --- 2. 主役岩の左斜面に立て掛けられた白コルゲート管（favorite-01.png の白い斜めパイプ） ---
      const corrPts = [];
      const corrLen = 0.66;
      const corrSteps = 36;
      for (let i = 0; i <= corrSteps; i++) {
        const t = i / corrSteps;
        const y = (t - 0.5) * corrLen;
        const rib = 0.070 + 0.010 * Math.sin(t * Math.PI * 2 * 16);
        corrPts.push(new THREE.Vector2(rib, y));
      }
      const corrGeo = new THREE.LatheGeometry(corrPts, 20);
      corrGeo.computeVertexNormals();
      const leaningPipe = new THREE.Mesh(corrGeo, palePipeMat);
      leaningPipe.name = 'prop-leaning-pipe';
      leaningPipe.position.set(-0.51, 0.25, 1.4);
      leaningPipe.rotation.set(-0.22, 0.16, -0.68);
      group.add(leaningPipe);
      props.push(leaningPipe);

      // --- 3. 手前右の錆びた魚礁ボックス 2 基＋沈んだ木樽＋赤茶の小石群（favorite-01.png 右下） ---
      const rightReefSet = new THREE.Group();
      rightReefSet.name = 'prop-reef-boxes-and-barrel';

      // 錆びた中空魚礁ボックス（前後・左右 4 面を円孔パネルで組む）
      const makeRustCube = (size, holeR) => {
        const g = new THREE.Group();
        const wallT = 0.028;
        const panelF = createPerforatedSquareBlock(size, size, wallT, holeR, rustMat);
        panelF.position.z = size * 0.5 - wallT * 0.5;
        const panelB = createPerforatedSquareBlock(size, size, wallT, holeR, rustMat);
        panelB.position.z = -size * 0.5 + wallT * 0.5;
        const panelL = createPerforatedSquareBlock(size - wallT * 2, size, wallT, holeR * 0.85, rustMat);
        panelL.rotation.y = Math.PI / 2;
        panelL.position.x = -size * 0.5 + wallT * 0.5;
        const panelR = createPerforatedSquareBlock(size - wallT * 2, size, wallT, holeR * 0.85, rustMat);
        panelR.rotation.y = Math.PI / 2;
        panelR.position.x = size * 0.5 - wallT * 0.5;
        const topPlate = new THREE.Mesh(new THREE.BoxGeometry(size, wallT, size), rustMat);
        topPlate.position.y = size * 0.5 - wallT * 0.5;
        const botPlate = new THREE.Mesh(new THREE.BoxGeometry(size, wallT, size), rustMat);
        botPlate.position.y = -size * 0.5 + wallT * 0.5;
        g.add(panelF, panelB, panelL, panelR, topPlate, botPlate);
        return g;
      };

      const rustBoxA = makeRustCube(0.28, 0.088);
      rustBoxA.position.set(0.69, 0.11, 1.36);
      rustBoxA.rotation.set(0.06, -0.28, 0.12);
      rightReefSet.add(rustBoxA);

      const rustBoxB = makeRustCube(0.25, 0.078);
      rustBoxB.position.set(0.91, 0.10, 1.37);
      rustBoxB.rotation.set(-0.08, 0.22, -0.07);
      rightReefSet.add(rustBoxB);

      // 沈んだ木樽（膨らみのある樽断面＋鉄輪 3 本、砂に半分埋もれて横倒し）
      const barrelGroup = new THREE.Group();
      barrelGroup.name = 'prop-sunken-barrel';
      const bPts = [
        new THREE.Vector2(0.001, -0.22),
        new THREE.Vector2(0.145, -0.22),
        new THREE.Vector2(0.155, -0.24),
        new THREE.Vector2(0.188, -0.10),
        new THREE.Vector2(0.198,  0.00),
        new THREE.Vector2(0.188,  0.10),
        new THREE.Vector2(0.155,  0.24),
        new THREE.Vector2(0.145,  0.22),
        new THREE.Vector2(0.001,  0.22),
      ];
      const barrelGeo = new THREE.LatheGeometry(bPts, 24);
      barrelGeo.computeVertexNormals();
      const barrelBody = new THREE.Mesh(barrelGeo, woodMat);
      barrelGroup.add(barrelBody);
      for (const [hy, hr] of [[-0.175, 0.173], [0.0, 0.200], [0.175, 0.173]]) {
        const hoop = new THREE.Mesh(new THREE.CylinderGeometry(hr, hr, 0.024, 24, 1, true), hoopMat);
        hoop.position.y = hy;
        barrelGroup.add(hoop);
      }
      barrelGroup.position.set(1.16, 0.145, 1.32);
      barrelGroup.rotation.set(0.12, -0.42, Math.PI * 0.5 + 0.08);
      rightReefSet.add(barrelGroup);

      group.add(rightReefSet);
      props.push(rightReefSet);
      shadowDiscs.push({ x: 0.92, z: 2.26, rx: 0.78, rz: 0.44, strength: 0.54 });

      // 魚礁ボックス＆土管周囲のゴロタ小石（赤茶の砕石を独立グループに分離して砂に埋め込む）
      const cobbleGroup = new THREE.Group();
      cobbleGroup.name = 'prop-cobbles';
      const cobbleRand = makePrng(5117);
      const cobbleCenters = [
        [0.55, 1.42, 0.09], [0.64, 1.45, 0.08], [0.77, 1.46, 0.10], [0.89, 1.4, 0.085],
        [1.01, 1.44, 0.095], [1.12, 1.45, 0.08], [1.25, 1.42, 0.09], [0.81, 1.27, 0.08],
        [-1.30, 1.43, 0.085], [-1.05, 1.46, 0.075], [-0.81, 1.47, 0.09], [-0.59, 1.48, 0.08],
        [-1.53, 1.36, 0.095], [1.37, 1.38, 0.09], [1.93, 1.38, 0.085], [0.15, 1.48, 0.08],
      ];
      for (let i = 0; i < cobbleCenters.length; i++) {
        const [cx, cz, cr] = cobbleCenters[i];
        const cg = new THREE.DodecahedronGeometry(cr, 1);
        const cp = cg.attributes.position;
        for (let k = 0; k < cp.count; k++) {
          const vx = cp.getX(k);
          const vy = cp.getY(k);
          const vz = cp.getZ(k);
          const f = 0.80 + cobbleRand() * 0.36;
          cp.setXYZ(k, vx * f * 1.2, vy * f * 0.68, vz * f * 1.05);
        }
        cg.computeVertexNormals();
        const cMesh = new THREE.Mesh(cg, cobbleMat);
        const sy = sampleSandHeight(cx * TANK_SCALE, cz * TANK_SCALE) / TANK_SCALE;   // v6 座標での砂の高さ
        cMesh.position.set(cx, sy + cr * 0.14, cz);
        cMesh.rotation.set(cobbleRand() * 0.4, cobbleRand() * Math.PI * 2, cobbleRand() * 0.4);
        cMesh.name = `prop-cobble-${i + 1}`;
        cobbleGroup.add(cMesh);
      }
      group.add(cobbleGroup);
      props.push(cobbleGroup);

      // --- 4. 左手前砂地の沈木・流木（low profile, 砂に半分埋まる） ---
      const driftGroup = new THREE.Group();
      driftGroup.name = 'prop-driftwood';
      const trunkCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-2.12, -0.02, 1.31),
        new THREE.Vector3(-1.88,  0.07, 1.27),
        new THREE.Vector3(-1.64,  0.11, 1.33),
        new THREE.Vector3(-1.45,  0.03, 1.3),
      ]);
      const trunkMesh = new THREE.Mesh(new THREE.TubeGeometry(trunkCurve, 18, 0.068, 10, false), woodMat);
      driftGroup.add(trunkMesh);
      const branchCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-1.81, 0.08, 1.28),
        new THREE.Vector3(-1.70, 0.18, 1.21),
        new THREE.Vector3(-1.61, 0.21, 1.18),
      ]);
      const branchMesh = new THREE.Mesh(new THREE.TubeGeometry(branchCurve, 10, 0.032, 8, false), woodMat);
      driftGroup.add(branchMesh);
      group.add(driftGroup);
      props.push(driftGroup);
      shadowDiscs.push({ x: -1.79, z: 2.16, rx: 0.62, rz: 0.28, strength: 0.40 });

      // --- 5. 右手前岩陰の素焼き蛸壺（瀬戸内海らしい生活感） ---
      const jarPts = [
        new THREE.Vector2(0.001, -0.17),
        new THREE.Vector2(0.085, -0.16),
        new THREE.Vector2(0.125, -0.04),
        new THREE.Vector2(0.118,  0.06),
        new THREE.Vector2(0.078,  0.13),
        new THREE.Vector2(0.095,  0.17),
        new THREE.Vector2(0.076,  0.17),
        new THREE.Vector2(0.064,  0.12),
        new THREE.Vector2(0.092, -0.04),
      ];
      const jarGeo = new THREE.LatheGeometry(jarPts, 20);
      jarGeo.computeVertexNormals();
      const amphora = new THREE.Mesh(jarGeo, terraMat);
      amphora.name = 'prop-amphora';
      amphora.position.set(2.15, 0.09, 1.28);
      amphora.rotation.set(0.15, -0.65, Math.PI * 0.44);
      group.add(amphora);
      props.push(amphora);
      shadowDiscs.push({ x: 2.15, z: 2.14, rx: 0.28, rz: 0.24, strength: 0.42 });

      const updateCaustics = (t) => {
        for (const fn of causticUpdaters) fn(t);
      };

      // 接触影は砂床（実寸）に渡すので倍率をかけて返す
      const worldDiscs = shadowDiscs.map((d) => ({ ...d, x: d.x * TANK_SCALE, z: d.z * TANK_SCALE, rx: d.rx * TANK_SCALE, rz: d.rz * TANK_SCALE }));
      return { group, props, updateCaustics, shadowDiscs: worldDiscs };
    }

    // ===== 部品：格子状の板（PlaneGeometry）の法線を配列から直接求める（v7：毎フレームの computeVertexNormals の代わり） =====
    // 横方向の差 U と縦方向の差 V（PlaneGeometry は行番号が増えると下へ進むので「上の行 − 下の行」）の外積を正規化する
    function computeGridNormals(posArr, nrmArr, cols, rows) {
      for (let iy = 0; iy < rows; iy++) {
        const iyUp = iy > 0 ? iy - 1 : iy;
        const iyDn = iy < rows - 1 ? iy + 1 : iy;
        for (let ix = 0; ix < cols; ix++) {
          const ixL = ix > 0 ? ix - 1 : ix;
          const ixR = ix < cols - 1 ? ix + 1 : ix;
          const r = (iy * cols + ixR) * 3;
          const l = (iy * cols + ixL) * 3;
          const u = (iyUp * cols + ix) * 3;
          const d = (iyDn * cols + ix) * 3;
          const ux = posArr[r] - posArr[l];
          const uy = posArr[r + 1] - posArr[l + 1];
          const uz = posArr[r + 2] - posArr[l + 2];
          const vx = posArr[u] - posArr[d];
          const vy = posArr[u + 1] - posArr[d + 1];
          const vz = posArr[u + 2] - posArr[d + 2];
          const nx = uy * vz - uz * vy;
          const ny = uz * vx - ux * vz;
          const nz = ux * vy - uy * vx;
          const inv = 1 / (Math.sqrt(nx * nx + ny * ny + nz * nz) || 1);
          const o = (iy * cols + ix) * 3;
          nrmArr[o] = nx * inv;
          nrmArr[o + 1] = ny * inv;
          nrmArr[o + 2] = nz * inv;
        }
      }
    }

    // ===== 部品：ゆらめく海藻・有機ケルプ葉群 (buildSeaweed) =====
    // 波打つ葉縁テクスチャ付きの自然な濃緑褐色の海藻を、左崖と奥岩礁の窪みに非対称に群生させる
    function buildSeaweed() {
      const group = new THREE.Group();
      group.name = 'seaweed';
      // v7：海藻は v6 の座標・大きさで組み立て、群ごと倍率で縮める
      group.scale.setScalar(TANK_SCALE);

      // 有機的な波打ち葉縁の海藻テクスチャ（中央主脈＋うねる半透明葉縁）
      const kCanvas = document.createElement('canvas');
      kCanvas.width = 64;
      kCanvas.height = 256;
      const kCtx = kCanvas.getContext('2d');
      kCtx.clearRect(0, 0, 64, 256);
      for (let y = 0; y < 256; y++) {
        const v = 1.0 - y / 255; // 0: root, 1: tip
        const halfW = (20 * Math.sin(Math.pow(v, 0.72) * Math.PI) + 3.5) * (0.76 + 0.24 * Math.sin(v * 24.0));
        const shift = Math.sin(v * 11.0) * 5.0;
        const cx = 32 + shift;
        const x0 = Math.max(0, Math.floor(cx - halfW));
        const x1 = Math.min(63, Math.ceil(cx + halfW));
        for (let x = x0; x <= x1; x++) {
          const edge = Math.abs(x - cx) / Math.max(halfW, 1);
          const midrib = Math.exp(-Math.pow(edge * 4.5, 2));
          const r = Math.round(32 + midrib * 20 + v * 16);
          const g = Math.round(58 + midrib * 28 + v * 26);
          const b = Math.round(28 + midrib * 10 + v * 12);
          const alpha = clamp(1.0 - Math.pow(edge, 3.2), 0, 1);
          kCtx.fillStyle = `rgba(${r},${g},${b},${alpha.toFixed(2)})`;
          kCtx.fillRect(x, y, 1, 1);
        }
      }
      const kelpTex = new THREE.CanvasTexture(kCanvas);
      kelpTex.colorSpace = THREE.SRGBColorSpace;

      const kelpMat = new THREE.MeshStandardMaterial({
        map: kelpTex,
        alphaTest: 0.18,
        roughness: 0.78,
        metalness: 0.02,
        side: THREE.DoubleSide,
      });
      const updateCaustics = applyCaustics(kelpMat, {
        mode: 'rock',
        gain: 0.10,
        underwaterScatterRate: perM(0.13),
        cacheTag: 'kelp-uw-v6',
      });

      // 左崖・左奥岩礁の窪みに自然な房として偏在配置（中央を均等に並べない）
      const strandSpecs = [
        // 左奥テラスのケルプ房
        { x: -2.28, y: 0.92, z: -1.21, h: 1.05, w: 0.24, leanX:  0.22, leanZ: 0.10, rotY:  0.35, phase: 0.3, period: 7.4 },
        { x: -2.17, y: 0.88, z: -1.28, h: 0.88, w: 0.20, leanX:  0.16, leanZ: 0.12, rotY: -0.45, phase: 1.2, period: 8.2 },
        { x: -1.97, y: 0.78, z: -1.24, h: 0.96, w: 0.22, leanX:  0.24, leanZ: 0.08, rotY:  0.75, phase: 2.4, period: 6.9 },
        // 左中段崖の低い海藻房（x <= -3.55）
        { x: -2.45, y: 0.72, z: -0.71, h: 0.72, w: 0.22, leanX:  0.18, leanZ: 0.14, rotY:  1.15, phase: 1.7, period: 6.6 },
        { x: -2.41, y: 0.64, z: -0.58, h: 0.58, w: 0.18, leanX:  0.14, leanZ: 0.10, rotY:  0.40, phase: 3.1, period: 7.5 },
        { x: -2.44, y: 0.55, z:  0.17, h: 0.64, w: 0.20, leanX:  0.15, leanZ: 0.12, rotY:  1.30, phase: 4.2, period: 7.9 },
        // 奥左中〜奥右の岩陰アクセント（控えめな丈で青い水の抜けを邪魔しない）
        { x: -1.41, y: 0.58, z: -1.3, h: 0.76, w: 0.21, leanX:  0.18, leanZ: 0.08, rotY: -0.25, phase: 2.9, period: 8.4 },
        { x: -1.29, y: 0.54, z: -1.33, h: 0.62, w: 0.18, leanX:  0.12, leanZ: 0.10, rotY:  0.60, phase: 4.7, period: 7.1 },
        { x:  1.84, y: 0.66, z: -1.28, h: 0.78, w: 0.22, leanX: -0.18, leanZ: 0.09, rotY:  0.50, phase: 3.8, period: 8.0 },
        { x:  1.99, y: 0.62, z: -1.32, h: 0.64, w: 0.19, leanX: -0.14, leanZ: 0.11, rotY: -0.65, phase: 5.3, period: 7.3 },
        { x:  2.41, y: 0.64, z: -0.89, h: 0.68, w: 0.20, leanX: -0.16, leanZ: 0.10, rotY: -1.10, phase: 0.8, period: 6.8 },
        { x:  2.44, y: 0.52, z:  0.39, h: 0.54, w: 0.18, leanX: -0.12, leanZ: 0.08, rotY: -1.35, phase: 2.1, period: 7.7 },
      ];

      const strands = strandSpecs.map((sp, idx) => {
        const segY = 14;
        const geo = new THREE.PlaneGeometry(sp.w, sp.h, 2, segY);
        geo.translate(0, sp.h * 0.5, 0);
        const pos = geo.attributes.position;
        const basePos = new Float32Array(pos.array);
        const mesh = new THREE.Mesh(geo, kelpMat);
        mesh.position.set(sp.x, sp.y, sp.z);
        mesh.rotation.y = sp.rotY ?? 0;
        mesh.name = `seaweed-${idx + 1}`;
        group.add(mesh);
        return { mesh, geo, pos, basePos, sp, normal: geo.attributes.normal, rows: segY + 1 };
      });

      const update = (elapsed) => {
        updateCaustics(elapsed);
        for (const st of strands) {
          const { pos, basePos, sp } = st;
          const w = (Math.PI * 2) / sp.period;
          for (let i = 0; i < pos.count; i++) {
            const bx = basePos[i * 3];
            const by = basePos[i * 3 + 1];
            const bz = basePos[i * 3 + 2];
            const f = clamp(by / sp.h, 0, 1);
            const flex = f * f;
            const waveX = Math.sin(elapsed * w + sp.phase - f * 2.6) * 0.11 * flex + sp.leanX * flex;
            const waveZ = Math.cos(elapsed * w * 0.82 + sp.phase * 1.3 - f * 2.2) * 0.09 * flex + sp.leanZ * flex;
            const wy = Math.min(by, WATER_Y / TANK_SCALE - 0.16 - sp.y);   // 群の中は v6 の座標
            pos.setXYZ(i, bx + waveX, wy, bz + waveZ);
          }
          pos.needsUpdate = true;
          // v7：computeVertexNormals の代わりに格子の隣どうしの差から直接求める（使い捨てなし）
          computeGridNormals(pos.array, st.normal.array, 3, st.rows);
          st.normal.needsUpdate = true;
        }
      };

      update(0);
      return { group, strands, update };
    }

    // ===== 部品：水面 (y=WATER_Y, sin波で ±0.019m×倍率, 裏面の波紋きらめきバンプ付き) =====
    function buildWaterSurface(options = {}) {
      const geo = new THREE.PlaneGeometry(TANK_W, TANK_D, 54, 33);
      geo.rotateX(-Math.PI / 2);
      const pos = geo.attributes.position;
      const baseXZ = new Float32Array(pos.count * 2);
      for (let i = 0; i < pos.count; i++) {
        // v7：波の式は v6 の座標で評価し、高さに倍率をかける（傾き＝法線は倍率によらず v6 と同じ）
        baseXZ[i * 2] = pos.getX(i) / TANK_SCALE;
        baseXZ[i * 2 + 1] = pos.getZ(i) / TANK_SCALE;
      }
      const rippleTex = options.rippleTex ?? buildWaterRippleTexture();
      const mat = new THREE.MeshStandardMaterial({
        color: options.color ?? STYLE.waterColor,
        transparent: true,
        opacity: options.opacity ?? STYLE.waterOpacity,
        side: THREE.DoubleSide,
        roughness: options.roughness ?? STYLE.waterRoughness,
        metalness: options.metalness ?? STYLE.waterMetalness,
        envMapIntensity: options.envMapIntensity ?? STYLE.waterEnvMapIntensity,
        envMap: options.envMap ?? null,
        bumpMap: rippleTex,
        bumpScale: options.bumpScale ?? STYLE.waterBumpScale,
        depthWrite: false,
        fog: false,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.y = WATER_Y;
      mesh.name = 'water-surface';
      mesh.renderOrder = 2;

      const posArr = pos.array;
      const nrmAttr = geo.attributes.normal;
      const nrmArr = nrmAttr.array;
      const update = (elapsed) => {
        const w1 = (Math.PI * 2) / 7.5;
        const w2 = (Math.PI * 2) / 10.5;
        for (let i = 0; i < pos.count; i++) {
          const x = baseXZ[i * 2];
          const z = baseXZ[i * 2 + 1];
          const a1 = x * 0.85 + z * 0.40 + elapsed * w1;
          const a2 = -x * 0.50 + z * 1.05 + elapsed * w2;
          const dy = 0.011 * Math.sin(a1) + 0.008 * Math.sin(a2);
          // v7：法線は波の式の傾きから直接求める（v6 は毎フレーム computeVertexNormals：三角形ごとの計算と使い捨てが重い）
          const c1 = Math.cos(a1);
          const c2 = Math.cos(a2);
          const dydx = 0.011 * 0.85 * c1 - 0.008 * 0.50 * c2;
          const dydz = 0.011 * 0.40 * c1 + 0.008 * 1.05 * c2;
          const inv = 1 / Math.sqrt(dydx * dydx + 1 + dydz * dydz);
          posArr[i * 3 + 1] = dy * TANK_SCALE;
          nrmArr[i * 3] = -dydx * inv;
          nrmArr[i * 3 + 1] = inv;
          nrmArr[i * 3 + 2] = -dydz * inv;
        }
        pos.needsUpdate = true;
        nrmAttr.needsUpdate = true;
        rippleTex.offset.set(elapsed * 0.018, -elapsed * 0.013);
      };

      update(0);
      return { mesh, update };
    }

    // ===== 環境・水槽シーンの組み立て =====
    const grainTex = buildGrainTexture();
    const sandTex = buildSandTexture();
    const rockTex = buildRockTexture();
    const propTex = buildPropTextures();
    const rippleTex = buildWaterRippleTexture();

    const viewingRoom = buildViewingRoom();
    scene.add(viewingRoom.group);

    const backdrop = buildBackdropGradient();
    scene.add(backdrop.mesh);

    const cabinet = buildCabinet({ grainTex });
    scene.add(cabinet.group);

    // v7：岩肌の写真テクスチャを読み込んでから岩を作る（読み込みに失敗したら v6 の手続き生成テクスチャで続ける）
    const rockPhoto = await loadRockPhotoTexture().catch((err) => {
      console.warn('rock photo texture failed, fallback to procedural:', err);
      return null;
    });
    const rockResult = buildRocks(rockTex, { photoMap: rockPhoto });
    const rockGroup = rockResult.group;
    scene.add(rockGroup);

    const propsResult = buildSunkenProps(propTex, rockTex);
    scene.add(propsResult.group);

    const allShadowDiscs = [...rockResult.shadowDiscs, ...propsResult.shadowDiscs];
    const sandResult = buildSandFloor(sandTex, allShadowDiscs);
    scene.add(sandResult.mesh);

    const seaweedResult = buildSeaweed();
    scene.add(seaweedResult.group);

    const surfaceGlow = buildSurfaceGlow();
    scene.add(surfaceGlow.mesh);

    const water = buildWaterSurface({ envMap: scene.environment, rippleTex });
    scene.add(water.mesh);

    const lightRays = buildLightRays();
    scene.add(lightRays.group);

    const marineSnow = buildMarineSnow();
    for (const pts of marineSnow.points) scene.add(pts);

    // v7：前面ガラスには鑑賞室の環境マップを映す（水中用の環境マップとは別）
    const roomEnvMap = buildViewingRoomEnvMap(renderer);
    const glassTank = buildGlassTank({ envMap: scene.environment, roomEnvMap });
    scene.add(glassTank.group);

    // ===== 状態・検証用フック (__MYAQ) =====
    const schoolAgents = [];
    const otherFishAgents = [];
    const squidAgents = [];

    const residentTotalEl = document.getElementById('resident-total');
    const schoolLabelEl = document.getElementById('school-label');
    const btnDecEl = document.getElementById('btn-school-dec');
    const btnIncEl = document.getElementById('btn-school-inc');

    function computeCounts() {
      const katakuchi = schoolAgents.length;
      let aji = 0, madai = 0, kurodai = 0, buri = 0;
      for (const f of otherFishAgents) {
        if (f.species === 'aji') aji++;
        else if (f.species === 'madai') madai++;
        else if (f.species === 'kurodai') kurodai++;
        else if (f.species === 'buri') buri++;
      }
      const squid = squidAgents.length;
      return {
        katakuchi,
        aji,
        madai,
        kurodai,
        buri,
        squid,
        total: katakuchi + aji + madai + kurodai + buri + squid,
      };
    }

    const _centerTmp = new THREE.Vector3();
    function getAllPositions() {
      const out = [];
      for (const f of schoolAgents) {
        const p = f.actor.object.position;
        out.push([p.x, p.y, p.z]);
      }
      for (const f of otherFishAgents) {
        const p = f.actor.object.position;
        out.push([p.x, p.y, p.z]);
      }
      for (const s of squidAgents) {
        s.actor.getCenter(_centerTmp);
        out.push([_centerTmp.x, _centerTmp.y, _centerTmp.z]);
      }
      return out;
    }

    function getSchoolCentroid() {
      if (schoolAgents.length === 0) return [0, 0, 0];
      let sx = 0, sy = 0, sz = 0;
      for (const f of schoolAgents) {
        const p = f.actor.object.position;
        sx += p.x;
        sy += p.y;
        sz += p.z;
      }
      const n = schoolAgents.length;
      return [sx / n, sy / n, sz / n];
    }

    function computeSchoolSpread() {
      const n = schoolAgents.length;
      if (n === 0) return { rms: 0, maxDist: 0, count: 0 };
      const [cx, cy, cz] = getSchoolCentroid();
      let sumSq = 0;
      let maxDist = 0;
      for (const f of schoolAgents) {
        const p = f.actor.object.position;
        const dx = p.x - cx;
        const dy = p.y - cy;
        const dz = p.z - cz;
        const d2 = dx * dx + dy * dy + dz * dz;
        sumSq += d2;
        const d = Math.sqrt(d2);
        if (d > maxDist) maxDist = d;
      }
      return {
        rms: Math.sqrt(sumSq / n),
        maxDist,
        count: n,
      };
    }

    function inspectScene() {
      let egiVisibleCount = 0;
      let lineVisibleCount = 0;
      scene.traverse((obj) => {
        if (obj.name && obj.name.toLowerCase().includes('egi') && obj.visible) {
          egiVisibleCount++;
        }
      });
      const squids = squidAgents.map((s) => {
        if (s.actor.egi?.obj?.visible) egiVisibleCount++;
        if (s.actor.line?.visible) lineVisibleCount++;
        const c = s.actor.getCenter(new THREE.Vector3());
        return {
          home: [s.actor.brain.home.x, s.actor.brain.home.y, s.actor.brain.home.z],
          center: [c.x, c.y, c.z],
          motion: s.actor.motion,
          egiVisible: Boolean(s.actor.egi?.obj?.visible),
          egiShown: Boolean(s.actor.brain?.egiShown),
          targetColor: {
            dark: s.actor.squid.target.dark,
            pale: s.actor.squid.target.pale,
            cloud: s.actor.squid.target.cloud,
          },
          uniformColor: {
            uDark: s.actor.squid.uniforms.uDark.value,
            uPale: s.actor.squid.uniforms.uPale.value,
            uCloud: s.actor.squid.uniforms.uCloud.value,
          },
        };
      });
      return {
        simTime,
        squids,
        egiVisibleCount,
        lineVisibleCount,
        rockCount: rockGroup.children.length,
        cameraPos: [camera.position.x, camera.position.y, camera.position.z],

    }

    // 検証用（v7）：生き物の体が水槽（ガラスの内側・水面の下・砂の上）からはみ出していないか
    const _extFwd = new THREE.Vector3();
    const _extBox = new THREE.Box3();
    const _extPart = new THREE.Box3();
    function computeBodyExtents() {
      const floorY = -0.06; // 砂の起伏（±0.035）の少し下まで
      const bySpecies = {};
      let outsideCount = 0;
      const record = (species, box) => {
        const r = bySpecies[species] ?? (bySpecies[species] = { count: 0, outside: 0, maxAbsX: 0, maxAbsZ: 0, maxY: -Infinity, minY: Infinity });
        r.count++;
        r.maxAbsX = Math.max(r.maxAbsX, Math.abs(box.min.x), Math.abs(box.max.x));
        r.maxAbsZ = Math.max(r.maxAbsZ, Math.abs(box.min.z), Math.abs(box.max.z));
        r.maxY = Math.max(r.maxY, box.max.y);
        r.minY = Math.min(r.minY, box.min.y);
        const outside = box.min.x < -HALF_X || box.max.x > HALF_X || box.min.z < -HALF_Z || box.max.z > HALF_Z ||
          box.max.y > WATER_Y || box.min.y < floorY;
        if (outside) { r.outside++; outsideCount++; }
      };
      const fishBox = (agent) => {
        const obj = agent.actor.object;
        const lim = agent.limits;
        _extFwd.set(0, 0, 1).applyEuler(obj.rotation);
        const p = obj.position;
        const side = lim.bodyLength * 0.08;
        _extBox.makeEmpty();
        _extBox.expandByPoint(_extPart.min.copy(p).addScaledVector(_extFwd, lim.half));
        _extBox.expandByPoint(_extPart.min.copy(p).addScaledVector(_extFwd, -lim.half));
        _extBox.min.x -= side; _extBox.max.x += side;
        _extBox.min.z -= side; _extBox.max.z += side;
        _extBox.min.y -= lim.halfH; _extBox.max.y += lim.halfH;
        return _extBox;
      };
      for (const a of schoolAgents) record('katakuchi', fishBox(a));
      for (const a of otherFishAgents) record(a.species, fishBox(a));
      for (const s of squidAgents) {
        _extBox.makeEmpty();
        s.actor.object.updateMatrixWorld(true);
        s.actor.object.traverseVisible((o) => {
          if (!o.isMesh || !o.geometry) return;
          o.geometry.computeBoundingBox();
          _extPart.copy(o.geometry.boundingBox).applyMatrix4(o.matrixWorld);
          _extBox.union(_extPart);
        });
        record('squid', _extBox);
      }
      return { tank: { halfX: HALF_X, halfZ: HALF_Z, waterY: WATER_Y, floorY }, outsideCount, bySpecies };
    }

    function collectObjectBounds(list) {
      return list.map((m) => {
        m.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(m);
        const cx = (box.min.x + box.max.x) * 0.5;
        const cz = (box.min.z + box.max.z) * 0.5;
        const sandY = sampleSandHeight(cx, cz);
        const insideTank =
          box.min.x >= -HALF_X + 0.02 && box.max.x <= HALF_X - 0.02 &&
          box.min.z >= -HALF_Z + 0.02 && box.max.z <= HALF_Z - 0.02 &&
          box.min.y >= tl(-0.45) && box.max.y <= WATER_Y - 0.04;
        const grounded = box.min.y <= sandY + 0.06;
        return {
          name: m.name,
          min: box.min.toArray(),
          max: box.max.toArray(),
          sandY,
          insideTank,
          grounded,
        };
      });
    }

    const myaq = {

      get counts() {

      positions: getAllPositions,
      schoolCentroid: getSchoolCentroid,
      inspect: inspectScene,
      v2: {

        particleSample: () => marineSnow.sample(10),
        causticsTime: () => sandResult.updateCaustics.uniforms.uCausticTime.value,

        sandMaterialInfo: () => ({

      v3: {

      v4: {

      },
      v5: {

      v6: {
        get roomPresent() { return Boolean(viewingRoom && viewingRoom.group.parent === scene); },
        get waterEnclosurePresent() { return Boolean(backdrop && backdrop.mesh.parent === scene); },
        get propCount() { return propsResult.props.length; },

        propBounds: () => collectObjectBounds(propsResult.props),
        rockCheckBounds: () => collectObjectBounds(rockGroup.children),
        seaweedBounds: () => collectObjectBounds(seaweedResult.strands.map((s) => s.mesh)),
        lightingInfo: () => ({
          bgColor: scene.background.getHex(),
          fogColor: scene.fog.color.getHex(),
          fogDensity: scene.fog.density,
          hemiSkyColor: hemiLight.color.getHex(),
          hemiGroundColor: hemiLight.groundColor.getHex(),
          hemiIntensity: hemiLight.intensity,
          sunColor: sunLight.color.getHex(),
          sunIntensity: sunLight.intensity,
          sunPosition: sunLight.position.toArray(),
          fillColor: fillLight.color.getHex(),
          fillIntensity: fillLight.intensity,
          fillPosition: fillLight.position.toArray(),
          rimColor: rimLight.color.getHex(),
          rimIntensity: rimLight.intensity,
          rimPosition: rimLight.position.toArray(),
          spotColor: poolSpot.color.getHex(),
          spotIntensity: poolSpot.intensity,
          spotPosition: poolSpot.position.toArray(),
          environmentIntensity: scene.environmentIntensity,
          exposure: renderer.toneMappingExposure,
          cameraFov: camera.fov,
          cameraPosition: camera.position.toArray(),
          cameraTarget: controls.target.toArray(),
        }),
        setWideCamera: () => {
          controls.autoRotate = false;
          btnAutoCamEl.classList.remove('is-on');
          btnAutoCamEl.setAttribute('aria-pressed', 'false');
          btnAutoCamEl.textContent = '自動カメラ OFF';
          camera.position.set(...STYLE.cameraPosition);
          controls.target.set(...STYLE.cameraTarget);
          controls.update();
          renderer.render(scene, camera);
          return {
            cameraPos: camera.position.toArray(),
            targetPos: controls.target.toArray(),
          };
        },
        checkFishClearance: () => {
          const rockBoxes = rockGroup.children.map((m) => {
            m.updateMatrixWorld(true);
            return { name: m.name, box: new THREE.Box3().setFromObject(m) };
          });
          const propBoxes = propsResult.props.map((m) => {
            m.updateMatrixWorld(true);
            return { name: m.name, box: new THREE.Box3().setFromObject(m) };
          });
          const obstacles = [...rockBoxes, ...propBoxes];
          const hits = [];
          const checkPoint = (label, p) => {
            for (const ob of obstacles) {
              if (ob.box.containsPoint(p)) {
                hits.push({ fish: label, obstacle: ob.name, pos: p.toArray() });
              }
            }
          };
          for (let i = 0; i < schoolAgents.length; i++) {
            checkPoint(`katakuchi-${i}`, schoolAgents[i].actor.object.position);
          }
          for (let i = 0; i < otherFishAgents.length; i++) {
            checkPoint(`${otherFishAgents[i].species}-${i}`, otherFishAgents[i].actor.object.position);
          }
          for (let i = 0; i < squidAgents.length; i++) {
            squidAgents[i].actor.getCenter(_centerTmp);
            checkPoint(`squid-${i}`, _centerTmp);
          }
          return { hitCount: hits.length, hits };
        },
      },
      v7: {
        // 水槽の実寸（定数ではなく、実際のガラス・台座・砂・水面のメッシュから読む）と v6 の値
        tankInfo: () => {
          const front = glassTank.glassMeshes[0].geometry.parameters;
          const side = glassTank.glassMeshes[2].geometry.parameters;
          const ped = cabinet.pedestal.geometry.parameters;
          const sand = sandResult.mesh.geometry.parameters;
          return {
            tankScale: TANK_SCALE,
            width: front.width,
            depth: side.width,
            glassHeight: front.height,
            waterY: water.mesh.position.y,
            sandFloor: [sand.width, sand.height],
            pedestal: [ped.width, ped.height, ped.depth],
            frameThickness: glassTank.frameMeshes[0].geometry.parameters.width,
            v6: { width: 9, depth: 5.5, glassHeight: 2.6, waterY: 2.6, sandFloor: [9, 5.5], pedestal: [9.7, 1.0, 6.2], frameThickness: 0.095 },
          };
        },
        // 体の先端・尾の先端・背と腹（魚）、見えている部分の外接箱（イカ）が水槽の内側にあるか
        bodyExtents: () => computeBodyExtents(),
        // 前面ガラスの映り込みの設定値（STYLE の 5 つ）と、正面から見たときの反射の不透明度
        glassReflection: () => {
          const u = glassTank.frontReflection;
          if (!u) return { enabled: false };
          return {
            enabled: true,
            pane: glassTank.glassMeshes[0].name,
            strength: u.uGlassReflect.value,
            fresnelF0: u.uGlassF0.value,
            max: u.uGlassReflectMax.value,
            roughness: u.uGlassReflectRoughness.value,
            roomGlow: STYLE.glassRoomGlow,
            alphaAtNormalIncidence: Math.min(u.uGlassF0.value * u.uGlassReflect.value, u.uGlassReflectMax.value),
            baseGlassOpacity: glassTank.glassMeshes[0].material.opacity,
            roomEnvMap: Boolean(u.uRoomEnv.value),
          };
        },
        // 性能まわりの現在値（描画解像度の上限と実際の値、直前の描画の呼び出し数、群れの描画呼び出し数）
        perfInfo: () => ({
          maxPixelRatio: STYLE.maxPixelRatio,
          devicePixelRatio: window.devicePixelRatio || 1,
          pixelRatio: renderer.getPixelRatio(),
          drawingBuffer: [renderer.domElement.width, renderer.domElement.height],
          lastFrameDrawCalls: renderer.info.render.calls,
          lastFrameTriangles: renderer.info.render.triangles,
          schoolDrawCalls: schoolRenderer.meshes.length,
          schoolInstances: schoolRenderer.meshes[0].count,
        }),
        // 比較用：映り込みの強さを一時的に変える（0 で映り込みなし）。STYLE は変えない
        setGlassReflection: (v) => {
          if (glassTank.frontReflection) glassTank.frontReflection.uGlassReflect.value = v;
          return v;
        },
        // 岩のマテリアルに写真テクスチャ（埋め込み data URI）が貼られているか
        rockTexture: () => {
          const m = rockResult.material.map;
          const src = m && m.image && typeof m.image.src === 'string' ? m.image.src : '';
          return {
            usesPhoto: Boolean(rockResult.photoMap) && m === rockResult.photoMap,
            source: 'my-aquarium/work/rock-texture-v7-512.jpg',
            embeddedDataUri: src.startsWith('data:image/jpeg;base64,'),
            embeddedChars: src.length,
            width: m && m.image ? m.image.width : null,
            height: m && m.image ? m.image.height : null,
            srgb: Boolean(m) && m.colorSpace === THREE.SRGBColorSpace,
            mirroredRepeat: Boolean(m) && m.wrapS === THREE.MirroredRepeatWrapping && m.wrapT === THREE.MirroredRepeatWrapping,
            projection: rockResult.triplanar ? 'triplanar-world' : 'uv',
            tileSizeMeters: STYLE.rockPhotoTileSize,
            tintMix: STYLE.rockPhotoTintMix,
            vertexColors: Boolean(rockResult.material.vertexColors),
          };
        },
        schoolBend: () => {
          const g = schoolRenderer.template.bodyGeometry;
          if (!g.boundingBox) g.computeBoundingBox();
          return {
            ...schoolRenderer.info(),
            mode: 'gpu-vertex-shader',
            snoutX: schoolRenderer.sharedUniforms.uSdShape.value.x,
            snoutXFromBody: g.boundingBox.max.x,
          };
        },
      },
      v9: {
        // 緩急の寄り具合（0 = calm、1 = flow）
        tempo: () => schoolState.tempo,
        // 群れ中心（schoolState.pos）が実際に動いた速さ（m/s）
        schoolSpeed: () => schoolState.speedActual,
        // 驚き・逃避の強さ（0..1。バースト中 1、その後 STYLE.schoolFleeRecover 秒で 0）
        fleeLevel: () => schoolState.flee,
        // 群れ中心から最も近いブリ／マダイ／クロダイの中心までの距離（m）。いなければ null
        nearestBigFish: () => {
          let best = Infinity;
          for (const f of otherFishAgents) {
            if (f.species !== 'buri' && f.species !== 'madai' && f.species !== 'kurodai') continue;
            best = Math.min(best, f.actor.object.position.distanceTo(schoolState.pos));
          }
          return Number.isFinite(best) ? best : null;
        },
      },
    };
    // v9 の内訳（検証用。列挙しない）：進み方・目標の速さ・驚きの回数・締まり・曲がり具合・中心の範囲・周回、
    // イワシと大きな魚の体の中心線の最小距離（今の瞬間）
    Object.defineProperty(myaq.v9, 'detail', {
      enumerable: false,
      value: () => {
        const q = new THREE.Vector3();
        const fwd = new THREE.Vector3();
        const a = new THREE.Vector3();
        const b = new THREE.Vector3();
        let minClear = Infinity;
        for (const f of otherFishAgents) {
          if (!STYLE.schoolThreats[f.species]) continue;
          const o = f.actor.object;
          fwd.set(0, 0, 1).applyEuler(o.rotation);
          a.copy(o.position).addScaledVector(fwd, -f.limits.half);
          b.copy(o.position).addScaledVector(fwd, f.limits.half);
          for (const s of schoolAgents) {
            closestPointOnSegment(a, b, s.actor.object.position, q);
            minClear = Math.min(minClear, q.distanceTo(s.actor.object.position));
          }
        }
        return {
          guide: schoolState.guide,
          tempoRaw: schoolState.tempoRaw,
          tempoTarget: schoolState.tempoTarget,
          tempoHold: schoolState.tempoHold,
          speed: schoolState.speed,
          speedTarget: schoolState.speedTarget,
          burstEnv: schoolState.burstEnv,
          startleCount: schoolState.startleCount,
          startleCooldown: schoolState.startleCooldown,
          threatNear: schoolState.threatNear,
          bendCurv: schoolState.bendCurv,
          shape: { ...schoolState.shape },
          range: { ...schoolState.range },
          loop: { ...schoolState.loop, cx: schoolState.loopCx, dir: schoolState.loopDir },
          flowSpeed: schoolState.flowSpeed,
          free: { ...SCHOOL_FREE },
          minBigFishClearance: Number.isFinite(minClear) ? minClear : null,
          squidGuardStops: squidAgents.map((s) => s.guardStops || 0),
        };
      },
    });
    Object.defineProperty(myaq.v5, 'detail', {
      enumerable: false,
      value: () => {
        const phases = new Set();
        let allSardine = schoolAgents.length > 0;
        let maxRotError = 0;
        let nanVertices = 0;
        let forwardDotMin = Infinity;
        const _snout = new THREE.Vector3();
        const _tail = new THREE.Vector3();
        const _dir = new THREE.Vector3();
        const _fwdCheck = new THREE.Vector3();

        for (const agent of schoolAgents) {
          const info = agent.actor.sardineInfo ? agent.actor.sardineInfo() : null;
          if (!info || info.modelName !== 'sardine') {
            allSardine = false;
            continue;
          }
          phases.add(info.phase.toFixed(4));
          maxRotError = Math.max(maxRotError, Math.abs(info.rotY + Math.PI / 2));

          agent.actor.object.updateMatrixWorld(true);
          const sardineObj = agent.actor.object.children[0]?.children[0];
          const bodyMesh = sardineObj?.getObjectByName('body');
          const posAttr = bodyMesh?.geometry?.getAttribute('position');
          if (posAttr) {
            const arr = posAttr.array;
            for (let k = 0; k < arr.length; k++) {
              if (!Number.isFinite(arr[k])) nanVertices++;
            }
            const frontIdx = posAttr.count - 2;
            const backIdx = posAttr.count - 1;
            _snout.fromBufferAttribute(posAttr, frontIdx).applyMatrix4(bodyMesh.matrixWorld);
            _tail.fromBufferAttribute(posAttr, backIdx).applyMatrix4(bodyMesh.matrixWorld);
            _dir.subVectors(_snout, _tail).normalize();
            _fwdCheck.set(0, 0, 1).applyEuler(agent.actor.object.rotation).normalize();
            const dot = _dir.dot(_fwdCheck);
            if (dot < forwardDotMin) forwardDotMin = dot;
          }
        }
        return {
          schoolModel: myaq.v5.schoolModel,
          count: schoolAgents.length,
          allSardine,
          uniquePhaseCount: phases.size,
          maxRotError,
          nanVertices,
          forwardDotMin: Number.isFinite(forwardDotMin) ? forwardDotMin : 0,
        };
      },
    });
    Object.defineProperty(myaq.v4, 'detail', {
      enumerable: false,
      value: () => {
        let minPairDist = Infinity;
        for (let i = 0; i < schoolAgents.length; i++) {
          const pi = schoolAgents[i].actor.object.position;
          for (let j = i + 1; j < schoolAgents.length; j++) {
            const d = pi.distanceTo(schoolAgents[j].actor.object.position);
            if (d < minPairDist) minPairDist = d;
          }
        }
        return {
          headingYaw: schoolState.headingYaw,
          schoolPos: schoolState.pos.toArray(),
          schoolSpeed: schoolState.vel.length(),
          minPairDist: schoolAgents.length >= 2 ? minPairDist : 0,
          radius: [STYLE.schoolRadiusX, STYLE.schoolRadiusY, STYLE.schoolRadiusZ],
          cohesion: STYLE.schoolCohesion,
          wobbleAmp: STYLE.schoolWobbleAmp,

    });
    Object.defineProperty(myaq.v4, 'focusSchool', {
      enumerable: false,
      value: (dist = 1.95) => {

        const a1 = schoolState.headingYaw + 1.15;
        const a2 = schoolState.headingYaw - 1.15;
        const viewAngle = Math.cos(a1) >= Math.cos(a2) ? a1 : a2;
        controls.autoRotate = false;
        btnAutoCamEl.classList.remove('is-on');
        btnAutoCamEl.setAttribute('aria-pressed', 'false');
        btnAutoCamEl.textContent = '自動カメラ OFF';
        controls.target.set(cx, cy, cz);
        camera.position.set(
          clamp(cx + Math.sin(viewAngle) * dist, -HALF_X + tl(0.65), HALF_X - tl(0.65)),
          clamp(cy - 0.14, tl(0.92), WATER_Y - tl(0.35)),
          clamp(cz + Math.cos(viewAngle) * dist, -HALF_Z + tl(0.65), HALF_Z - tl(0.15))
        );
        controls.update();
        renderer.render(scene, camera);
