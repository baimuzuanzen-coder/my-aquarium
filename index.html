    });
    Object.defineProperty(myaq.v3, 'detail', {
      enumerable: false,
      value: () => ({
        fogColor: scene.fog.color.getHex(),
        fogDensity: scene.fog.density,
        exposure: renderer.toneMappingExposure,
        hemiIntensity: hemiLight.intensity,
        hemiSkyColor: hemiLight.color.getHex(),
        hemiGroundColor: hemiLight.groundColor.getHex(),
        sunIntensity: sunLight.intensity,
        sunColor: sunLight.color.getHex(),
        sunPosition: sunLight.position.toArray(),
        rimIntensity: rimLight.intensity,
        rimColor: rimLight.color.getHex(),
        spotIntensity: poolSpot.intensity,
        rayBaseOpacity: STYLE.rayBaseOpacity,
        rayOpacityMin: STYLE.rayOpacityMin,
        rayOpacityMax: STYLE.rayOpacityMax,
        rayWidthScale: STYLE.rayWidthScale,
        causticsSandGain: STYLE.causticsSandGain,
        backdropFog: backdrop.material.fog,
        backdropPosition: backdrop.mesh.position.toArray(),
        backdropSize: [STYLE.backdropWidth, STYLE.backdropHeight],
        surfaceGlowY: surfaceGlow.mesh.position.y,
        surfaceGlowSide: surfaceGlow.material.side,
        surfaceGlowBlending: surfaceGlow.material.blending,
      }),
    });
    window.__MYAQ = myaq;

    // ===== 群れ・遊泳制御 =====
    const schoolState = {
      pos: new THREE.Vector3(tl(-0.1), STYLE.schoolGoalCenterY, tl(-0.15)),
      goal: new THREE.Vector3(tl(1.25), STYLE.schoolGoalCenterY + tl(0.04), tl(-0.35)),
      vel: new THREE.Vector3(),       // v9：群れ中心の実際の速度（位置の変化 ÷ 時間）
      timer: 10,
      headingYaw: Math.atan2(1.25, -0.35),
      // v9：緩急（tempo 0 = calm、1 = flow）
      tempoRaw: 0,                    // 直線的に動く内部値
      tempo: 0,                       // なめらかにした値（フック tempo() が返す）
      tempoTarget: 0,
      tempoHold: 12,                  // 今の状態を保つ残り秒数
      tempoRate: 1 / 14,              // 切り替えの速さ（1/秒）
      guide: 'calm',                  // 中心の進み方：'calm'（目標点を巡る）／'flow'（周回）
      loopDir: 1,                     // flow の周回の向き（+1/-1）
      loopCx: 0,                      // flow の周回の中心のずれ（x）
      speedTarget: 0,
      speed: 0,                       // 中心の進む速さ（向きに沿って）
      speedActual: 0,                 // 実際に動いた速さ（範囲の端で止められた分を含む。フック schoolSpeed()）
      yawRate: 0,                     // 向きの変わる速さ（rad/s）
      bendCurv: 0,                    // 隊形を弓なりに曲げる曲がり具合（1/m）
      swirlPhase: 0,                  // 隊形の中の渦の角度（速さを変えても飛ばないよう積分する）
      // v9：大きな魚・驚き
      threatNear: 0,                  // 大きな魚の近さ（0..1、群れ全体の締まり）
      flee: 0,                        // 驚き（0..1、フック fleeLevel()）
      burstT: -1,                     // バースト開始からの秒数（-1 = なし）
      burstYaw: 0,                    // バーストで向かう向き
      startleCooldown: 0,
      startleCount: 0,
      burstEnv: 0,                    // バーストの強さ（0..1）
      threats: [],                    // 大きな魚の体の棒（senseSchoolThreats が毎ステップ更新）
      threatCount: 0,
      // 隊形の形（updateSchoolShape が毎ステップ更新）：前後・上下・横の倍率、個体の揺らぎ、匹数による大きさ
      shape: { scaleF: 1, scaleV: 1, scaleL: 1, wobbleAmp: STYLE.schoolWobbleAmp, countScale: 1 },
      range: { x: 1, z: 1 },          // 群れ中心が動いてよい範囲（schoolCenterRange の結果）
      loop: { x: 0.6, z: 0.4 },       // flow の周回の半径
      flowSpeed: STYLE.schoolFlowSpeed,
    };
    schoolState.tempoHold = randRange(STYLE.schoolTempoFirstHold);

    function randRange(r) {
      return r[0] + Math.random() * (r[1] - r[0]);
    }

    // v9：イワシ 1 匹ぶんの自由域（ガラス際で曲がり始める手前）。いちばん長い個体（0.126m）で見積もる
    const SCHOOL_FREE = (() => {
      const L = computePatrolLimits(0.126, FISH_SPECS.katakuchi.speed, STYLE.schoolFishTurnRate);
      return { x: L.startX, z: L.startZ };
    })();

    // v9：range（{ x, z }）で範囲を渡せる（既定は従来の STYLE.schoolGoalRangeX/Z）
    function pickSchoolGoal(currentPos, out = new THREE.Vector3(), range = null) {
      const next = out;   // v7：既存のベクトルに書き込む（新しく作らない）
      const rx = range ? range.x : STYLE.schoolGoalRangeX;
      const rz = range ? range.z : STYLE.schoolGoalRangeZ;
      const minMove = range ? Math.min(tl(1.1), Math.hypot(rx, rz) * 0.8) : tl(1.1);
      for (let tries = 0; tries < 8; tries++) {
        next.set(
          (Math.random() * 2 - 1) * rx,
          STYLE.schoolGoalCenterY + (Math.random() * 2 - 1) * STYLE.schoolGoalRangeY,
          (Math.random() * 2 - 1) * rz
        );
        if (next.distanceTo(currentPos) >= minMove) break;
      }
      return next;
    }

    function halton(index, base) {
      let result = 0;
      let f = 1 / base;
      let i = index + 1;
      while (i > 0) {
        result += f * (i % base);
        i = Math.floor(i / base);
        f /= base;
      }
      return result;
    }

    // 部品：群れ楕円体スロット基底の生成（流用要件：パラメータ外出し・関数分離）
    function buildSchoolSlotSeeds(maxCount = SCHOOL_MAX, options = {}) {
      const rx = options.radiusX ?? STYLE.schoolRadiusX;
      const ry = options.radiusY ?? STYLE.schoolRadiusY;
      const rz = options.radiusZ ?? STYLE.schoolRadiusZ;
      const densityPow = options.densityPow ?? STYLE.schoolDensityPow;
      const minSlotGap = options.minSlotGap ?? STYLE.schoolMinSlotGap;

      const seeds = [];
      for (let i = 0; i < maxCount; i++) {
        const r = Math.pow(halton(i, 3), densityPow);
        const uCos = halton(i, 2) * 2 - 1;
        const uPhi = halton(i, 5) * Math.PI * 2;
        const sinTheta = Math.sqrt(Math.max(0, 1 - uCos * uCos));
        seeds.push(new THREE.Vector3(
          r * sinTheta * Math.cos(uPhi) * rx,
          r * uCos * ry,
          r * sinTheta * Math.sin(uPhi) * rz
        ));
      }

      for (let iter = 0; iter < 14; iter++) {
        for (let i = 0; i < maxCount; i++) {
          for (let j = i + 1; j < maxCount; j++) {
            const dx = seeds[j].x - seeds[i].x;
            const dy = seeds[j].y - seeds[i].y;
            const dz = seeds[j].z - seeds[i].z;
            const d2 = dx * dx + dy * dy + dz * dz;
            if (d2 < minSlotGap * minSlotGap) {
              const d = Math.max(1e-4, Math.sqrt(d2));
              const push = (minSlotGap - d) * 0.52;
              const w1 = i < 12 ? 0.25 : 0.45;
              const w2 = 1.0 - w1;
              seeds[i].x -= (dx / d) * push * w1;
              seeds[i].y -= (dy / d) * push * w1;
              seeds[i].z -= (dz / d) * push * w1;
              seeds[j].x += (dx / d) * push * w2;
              seeds[j].y += (dy / d) * push * w2;
              seeds[j].z += (dz / d) * push * w2;
            }
          }
          const s = seeds[i];
          const ellip = Math.hypot(s.x / rx, s.y / ry, s.z / rz);
          if (ellip > 1.0) s.divideScalar(ellip);
        }
      }
      return seeds;
    }

    // 毎ステップ呼ばれる関数の既定引数（{} を毎回作らないための共有の空オブジェクト）
    const NO_OPTS = Object.freeze({});

    // キャッシュの照合は数値の比較で行う（v6 は毎回キー文字列を組み立てていた）
    const slotSeedCache = { maxCount: -1, rx: 0, ry: 0, rz: 0, densityPow: 0, minSlotGap: 0, seeds: [] };
    function getSchoolSlotSeeds(options = NO_OPTS) {
      const rx = options.radiusX ?? STYLE.schoolRadiusX;
      const ry = options.radiusY ?? STYLE.schoolRadiusY;
      const rz = options.radiusZ ?? STYLE.schoolRadiusZ;
      const densityPow = options.densityPow ?? STYLE.schoolDensityPow;
      const minSlotGap = options.minSlotGap ?? STYLE.schoolMinSlotGap;
      const maxCount = options.maxCount ?? SCHOOL_MAX;
      const c = slotSeedCache;
      if (c.maxCount !== maxCount || c.rx !== rx || c.ry !== ry || c.rz !== rz || c.densityPow !== densityPow || c.minSlotGap !== minSlotGap) {
        c.seeds = buildSchoolSlotSeeds(maxCount, options);
        c.maxCount = maxCount;
        c.rx = rx;
        c.ry = ry;
        c.rz = rz;
        c.densityPow = densityPow;
        c.minSlotGap = minSlotGap;
      }
      return c.seeds;
    }

    // 部品：群れ各個体の楕円体オフセット計算（進行方向回転＋穏やかなトルネード渦循環＋個体数スケーリング）
    function schoolSlotOffset(slotIndex, t, out, options = NO_OPTS) {
      const rx = options.radiusX ?? STYLE.schoolRadiusX;
      const ry = options.radiusY ?? STYLE.schoolRadiusY;
      const rz = options.radiusZ ?? STYLE.schoolRadiusZ;
      const seeds = options.seeds ?? getSchoolSlotSeeds(options);
      const count = options.count ?? Math.max(schoolAgents.length, 1);
      const baseCount = options.baseCount ?? STYLE.schoolBaseCount;
      const scaleExp = options.scaleExp ?? STYLE.schoolScaleExp;
      const wobbleAmp = options.wobbleAmp ?? STYLE.schoolWobbleAmp;
      const wobbleFreq = options.wobbleFreq ?? STYLE.schoolWobbleFreq;
      const swirlRate = options.swirlRate ?? STYLE.schoolSwirlRate;
      const wobblePhase = options.wobblePhase ?? (halton(slotIndex, 7) * Math.PI * 2);
      const headingYaw = options.headingYaw ?? schoolState.headingYaw;
      // v9：渦の角度（積分した値を渡せる）、締まり（前後・上下・横の倍率）、弓なりの曲がり具合（1/m、+ で右回り側へ曲げる）
      const swirlPhase = options.swirlPhase ?? t * swirlRate;
      const scaleF = options.scaleForward ?? 1;
      const scaleV = options.scaleVertical ?? 1;
      const scaleL = options.scaleLateral ?? 1;
      const bend = options.bendCurv ?? 0;

      const scale = Math.pow(Math.max(1, count) / baseCount, scaleExp);
      const s = seeds[slotIndex % seeds.length];

      // 楕円体正規化空間で緩やかに螺旋回転させ、ベイトボール／トルネードのうねりを出す（楕円体境界は維持）
      const nx = s.x / rx;
      const ny = s.y / ry;
      const nz = s.z / rz;
      const swirlAngle = swirlPhase + ny * 0.55;
      const swCos = Math.cos(swirlAngle);
      const swSin = Math.sin(swirlAngle);
      const rxSw = (nx * swCos - nz * swSin) * rx;
      const rzSw = (nx * swSin + nz * swCos) * rz;

      const wbT = t * wobbleFreq + wobblePhase;
      let lx = rxSw * scale * scaleF + Math.sin(wbT * 1.1) * wobbleAmp;
      const ly = s.y * scale * scaleV + Math.sin(wbT * 0.85 + 1.3) * wobbleAmp * 0.65;
      let lz = rzSw * scale * scaleL + Math.cos(wbT * 0.95 + 2.1) * wobbleAmp * 0.75;

      // v9：方向転換のとき、隊形を進む道筋の弧に沿って弓なりに曲げる（先頭は曲がる先へ、後ろは来た道に残る＝塊のうねり）
      if (Math.abs(bend) > 1e-4) {
        const phi = bend * lx;
        const sinP = Math.sin(phi);
        const cosP = Math.cos(phi);
        const fwd = sinP / bend - lz * sinP;
        lz = (1 - cosP) / bend + lz * cosP;
        lx = fwd;
      }

      const hSin = Math.sin(headingYaw);
      const hCos = Math.cos(headingYaw);
      return out.set(
        lx * hSin + lz * hCos,
        ly,
        lx * hCos - lz * hSin
      );
    }

    // 部品：群れの進行方向更新
    function computeSchoolHeadingYaw(state, dt, options = NO_OPTS) {
      const turnRate = options.turnRate ?? MAX_TURN_RATE;
      const speedXZ = Math.hypot(state.vel.x, state.vel.z);
      if (speedXZ > 0.02) {
        const targetHeading = Math.atan2(state.vel.x, state.vel.z);
        const hDiff = wrapAngle(targetHeading - state.headingYaw);
        const maxStep = turnRate * 0.72 * dt;
        const gain = Math.min(1, dt * 4 * smoothstep(speedXZ, 0.02, 0.14));
        state.headingYaw = wrapAngle(state.headingYaw + clamp(hDiff * gain, -maxStep, maxStep));
      }
      return state.headingYaw;
    }

    // ===== v9：群れの緩急と反応（大洗「IWASHI LIFE」の観察 R1〜R6 を部品に分けたもの） =====

    // 部品（v9）：緩急の状態。calm（0）と flow（1）を、保つ時間・切り替えの時間をそれぞれ範囲から選んで行き来する（R1）
    function updateSchoolTempo(state, dt) {
      if (state.tempoRaw === state.tempoTarget) {
        state.tempoHold -= dt;
        if (state.tempoHold <= 0) {
          state.tempoTarget = 1 - state.tempoTarget;
          state.tempoRate = 1 / randRange(STYLE.schoolTempoRamp);
        }
      } else {
        const dir = Math.sign(state.tempoTarget - state.tempoRaw);
        state.tempoRaw += dir * state.tempoRate * dt;
        if ((dir > 0 && state.tempoRaw >= state.tempoTarget) || (dir < 0 && state.tempoRaw <= state.tempoTarget)) {
          state.tempoRaw = state.tempoTarget;
          state.tempoHold = randRange(state.tempoTarget === 1 ? STYLE.schoolTempoFlowHold : STYLE.schoolTempoCalmHold);
        }
      }
      state.tempo = smoothstep(state.tempoRaw, 0, 1);
      return state.tempo;
    }

    // 部品（v9）：隊形の形。flow は横と高さを締め、大きな魚が近い間・驚いている間は全体を締める（R3・R6）。揺らぎは flow と驚きで控えめ（R5）
    function updateSchoolShape(state, count) {
      const sh = state.shape;
      const tE = state.tempo;
      const squeeze = 1 - STYLE.schoolThreatCompress * state.threatNear - STYLE.schoolFleeCompress * state.flee;
      sh.scaleF = (1 + (STYLE.schoolFlowForwardScale - 1) * tE) * squeeze;
      sh.scaleL = (1 + (STYLE.schoolFlowLateralScale - 1) * tE) * squeeze;
      sh.scaleV = (1 + (STYLE.schoolFlowVerticalScale - 1) * tE) * squeeze;
      sh.wobbleAmp = STYLE.schoolWobbleAmp * (1 + (STYLE.schoolFlowWobbleScale - 1) * Math.max(tE, state.flee));
      sh.countScale = Math.pow(Math.max(1, count) / STYLE.schoolBaseCount, STYLE.schoolScaleExp);
      return sh;
    }

    // 部品（v9）：schoolSlotOffset へ渡す引数に、今の隊形の形を書き込む
    function applySchoolShapeOptions(state, opts) {
      const sh = state.shape;
      opts.swirlPhase = state.swirlPhase;
      opts.scaleForward = sh.scaleF;
      opts.scaleVertical = sh.scaleV;
      opts.scaleLateral = sh.scaleL;
      opts.wobbleAmp = sh.wobbleAmp;
      opts.bendCurv = state.bendCurv;
      return opts;
    }

    // 部品（v9）：群れ中心が動いてよい範囲（|x|・|z| の上限）。個体の自由域から、向き yaw のときの隊形の広がり × fit を引く
    function schoolCenterRange(state, yaw, fit, out) {
      const sh = state.shape;
      const a = STYLE.schoolRadiusX * sh.countScale * sh.scaleF;   // 前後（進む向き）
      const b = STYLE.schoolRadiusZ * sh.countScale * sh.scaleL;   // 横
      const s = Math.sin(yaw);
      const c = Math.cos(yaw);
      out.x = Math.max(0.05, SCHOOL_FREE.x - Math.sqrt(a * a * s * s + b * b * c * c) * fit);
      out.z = Math.max(0.05, SCHOOL_FREE.z - Math.sqrt(a * a * c * c + b * b * s * s) * fit);
      return out;
    }

    // 部品（v9）：大きな魚（STYLE.schoolThreats の種）を毎ステップ見て、①体の棒（局所反応用）、②近さ（群れ全体の締まり）、
    // ③急接近による驚き（バースト）を更新する。群れ全体は逃げない（R2）
    const _thFwd = new THREE.Vector3();
    const _thQ = new THREE.Vector3();
    const _thRel = new THREE.Vector3();
    function senseSchoolThreats(state, fishAgents, dt) {
      let n = 0;
      let near = 0;
      for (const f of fishAgents) {
        const cfg = STYLE.schoolThreats[f.species];
        if (!cfg) continue;
        const th = state.threats[n] ?? (state.threats[n] = { a: new THREE.Vector3(), b: new THREE.Vector3(), side: new THREE.Vector3(), radius: 0, dart: 0 });
        const o = f.actor.object;
        _thFwd.set(0, 0, 1).applyEuler(o.rotation);
        const half = f.limits.half;
        th.a.copy(o.position).addScaledVector(_thFwd, -half);
        th.b.copy(o.position).addScaledVector(_thFwd, half + f.actor.currentSpeed * cfg.lead);
        th.side.set(_thFwd.z, 0, -_thFwd.x);
        if (th.side.lengthSq() < 1e-8) th.side.set(1, 0, 0);
        th.side.normalize();
        th.radius = cfg.radius;
        th.dart = STYLE.schoolThreatDart * cfg.weight;
        n++;

        // 群れ全体の締まり：群れ中心から体の線分までの距離が sense 以内で効き始め、radius で最大
        closestPointOnSegment(th.a, th.b, state.pos, _thQ);
        const dSeg = _thQ.distanceTo(state.pos);
        near = Math.max(near, cfg.weight * (1 - smoothstep(dSeg, cfg.radius, cfg.sense)));

        // 驚き：群れ中心から dist 以内で、近づく速さが closing 以上（急接近）。慣れのため間をあける（R4）
        const st = STYLE.schoolStartle[f.species];
        if (st && state.startleCooldown <= 0) {
          const dC = o.position.distanceTo(state.pos);
          if (dC <= st.dist && dC > 1e-4) {
            _thRel.copy(_thFwd).multiplyScalar(f.actor.currentSpeed).sub(state.vel);
            const closing = (_thRel.x * (state.pos.x - o.position.x) + _thRel.y * (state.pos.y - o.position.y) + _thRel.z * (state.pos.z - o.position.z)) / dC;
            if (closing >= st.closing) triggerSchoolBurst(state, o.position);
          }
        }
      }
      state.threatCount = n;
      state.threatNear += (near - state.threatNear) * (1 - Math.exp(-STYLE.schoolThreatEase * dt));
    }

    // 部品（v9）：驚きの開始。向きは今の進行方向から ±1 rad 以内で、「前に空きがある」と「脅威から離れる」が良い向きを選ぶ
    const _burstRange = { x: 1, z: 1 };
    function triggerSchoolBurst(state, threatPos) {
      state.burstT = 0;
      state.flee = 1;
      state.startleCooldown = STYLE.schoolStartleCooldown;
      state.startleCount++;
      let awayX = state.pos.x - threatPos.x;
      let awayZ = state.pos.z - threatPos.z;
      const al = Math.hypot(awayX, awayZ) || 1;
      awayX /= al;
      awayZ /= al;
      let best = state.headingYaw;
      let bestScore = -Infinity;
      for (let k = -4; k <= 4; k++) {
        const yaw = state.headingYaw + k * 0.25;
        const s = Math.sin(yaw);
        const c = Math.cos(yaw);
        schoolCenterRange(state, yaw, 1.0, _burstRange);
        // その向きに進んで範囲の端に当たるまでの距離（1m で頭打ち）
        let room = 1;
        if (Math.abs(s) > 1e-4) room = Math.min(room, ((s > 0 ? _burstRange.x : -_burstRange.x) - state.pos.x) / s);
        if (Math.abs(c) > 1e-4) room = Math.min(room, ((c > 0 ? _burstRange.z : -_burstRange.z) - state.pos.z) / c);
        const score = Math.max(0, room) + 0.6 * Math.max(0, s * awayX + c * awayZ) - 0.15 * Math.abs(k * 0.25);
        if (score > bestScore) { bestScore = score; best = yaw; }
      }
      state.burstYaw = wrapAngle(best);
    }

    // 部品（v9）：flow の周回（楕円）の大きさと速さを決める。周回は自由域から隊形の横幅を引いた内側に収め、
    // 1 周が STYLE.schoolFlowMinLap 秒より短くなる小さな水槽では速さを下げる
    function setupSchoolFlowLoop(state) {
      const sh = state.shape;
      const b = STYLE.schoolRadiusZ * sh.countScale * STYLE.schoolFlowLateralScale;   // flow の横幅
      state.loopCx = (Math.random() * 2 - 1) * 0.1;
      const lx = Math.max(0.08, (SCHOOL_FREE.x - b) * STYLE.schoolFlowLoopFit - Math.abs(state.loopCx));
      const lz = Math.max(0.08, (SCHOOL_FREE.z - b) * STYLE.schoolFlowLoopFit);
      state.loop.x = lx;
      state.loop.z = lz;
      const perim = Math.PI * (3 * (lx + lz) - Math.sqrt((3 * lx + lz) * (lx + 3 * lz)));
      state.flowSpeed = Math.min(STYLE.schoolFlowSpeed, perim / STYLE.schoolFlowMinLap);
      // 今の向きに近い回り方を選ぶ（切り替えで急に向きを変えない）
      const th = Math.atan2(state.pos.z / lz, (state.pos.x - state.loopCx) / lx);
      const tx = -Math.sin(th) * lx;   // 角度が増える向きの接線
      const tz = Math.cos(th) * lz;
      state.loopDir = (tx * Math.sin(state.headingYaw) + tz * Math.cos(state.headingYaw)) >= 0 ? 1 : -1;
    }

    // 部品（v9）：群れ中心の更新。向きに沿って進み（横滑りしない）、向きは上限つきで曲がる。
    // calm は目標点を巡ってゆっくり漂い、flow は楕円の周回を速く回る。驚くと一瞬だけ速くなる（R1・R4・R5）
    const _ctrPrev = new THREE.Vector3();
    const _ctrTarget = new THREE.Vector3();
    const _ctrRange = { x: 1, z: 1 };
    function updateSchoolCenter(state, dt, count) {
      updateSchoolTempo(state, dt);
      updateSchoolShape(state, count);
      const tE = state.tempo;

      // バーストの強さ：立ち上がり → 保つ → 収まる。驚き（flee）はバースト中 1、その後 schoolFleeRecover 秒で 0 へ
      let burstEnv = 0;
      if (state.burstT >= 0) {
        state.burstT += dt;
        const r = STYLE.schoolBurstRise;
        const h = STYLE.schoolBurstHold;
        const f = STYLE.schoolBurstFall;
        const bt = state.burstT;
        if (bt < r) burstEnv = bt / r;
        else if (bt < r + h) burstEnv = 1;
        else if (bt < r + h + f) burstEnv = 1 - smoothstep(bt, r + h, r + h + f);
        else state.burstT = -1;
      }
      state.burstEnv = burstEnv;
      if (state.burstT >= 0) state.flee = 1;
      else state.flee = Math.max(0, state.flee - dt / STYLE.schoolFleeRecover);
      state.startleCooldown = Math.max(0, state.startleCooldown - dt);

      // 進み方の切り替え（calm の目標点巡り ⇔ flow の周回）
      if (state.guide === 'calm' && state.tempoTarget === 1 && state.tempoRaw > 0.15) {
        state.guide = 'flow';
        setupSchoolFlowLoop(state);
      } else if (state.guide === 'flow' && state.tempoTarget === 0 && state.tempoRaw < 0.4) {
        state.guide = 'calm';
        state.timer = 0;   // 次の目標点をすぐ選ぶ
      }

      let baseSpeed;
      if (state.guide === 'flow') {
        const lx = state.loop.x;
        const lz = state.loop.z;
        const th = Math.atan2(state.pos.z / lz, (state.pos.x - state.loopCx) / lx) + state.loopDir * STYLE.schoolFlowLookAhead;
        _ctrTarget.set(state.loopCx + Math.cos(th) * lx, STYLE.schoolGoalCenterY + Math.sin(th * 2) * STYLE.schoolFlowBob, Math.sin(th) * lz);
        baseSpeed = STYLE.schoolCalmSpeed + (state.flowSpeed - STYLE.schoolCalmSpeed) * tE;
      } else {
        // calm：目標点は「その向きで進んだときの範囲」の内側に選ぶ（範囲の端で止まって着かない、を防ぐ）
        state.timer -= dt;
        const toGoal = state.goal.distanceTo(state.pos);
        if (state.timer <= 0 || toGoal < tl(0.25)) {
          _ctrRange.x =Math.max(0.05, SCHOOL_FREE.x - STYLE.schoolRadiusZ * state.shape.countScale * STYLE.schoolRoamFit);
          _ctrRange.z = Math.max(0.05, SCHOOL_FREE.z - STYLE.schoolRadiusZ * state.shape.countScale * STYLE.schoolRoamFit);
          // 今の向きから ±100° 以内の目標点を優先する（雲がその場で反転して、先端の個体が大回りしないため）
          const hs = Math.sin(state.headingYaw);
          const hc = Math.cos(state.headingYaw);
          for (let tries = 0; tries < 6; tries++) {
            pickSchoolGoal(state.pos, state.goal, _ctrRange);
            const gx = state.goal.x - state.pos.x;
            const gz = state.goal.z - state.pos.z;
            if ((gx * hs + gz * hc) / (Math.hypot(gx, gz) || 1) > -0.17) break;
          }
          const gy = Math.atan2(state.goal.x - state.pos.x, state.goal.z - state.pos.z);
          schoolCenterRange(state, gy, STYLE.schoolRoamFit, _ctrRange);
          state.goal.x = clamp(state.goal.x, -_ctrRange.x, _ctrRange.x);
          state.goal.z = clamp(state.goal.z, -_ctrRange.z, _ctrRange.z);
          state.timer = 10 + Math.random() * 8;
        }
        _ctrTarget.copy(state.goal);
        const arrive = 0.4 + 0.6 * smoothstep(state.goal.distanceTo(state.pos), 0.08, STYLE.schoolCalmArrive);
        baseSpeed = (STYLE.schoolCalmSpeed + (state.flowSpeed - STYLE.schoolCalmSpeed) * tE) * arrive;
      }

      // 速さ：原則じわじわ。バーストだけは瞬時に上げる
      const burstPeak = Math.max(STYLE.schoolBurstSpeed, baseSpeed * STYLE.schoolBurstFlowMul);
      state.speedTarget = baseSpeed + (burstPeak - baseSpeed) * burstEnv + STYLE.schoolFleeTailSpeed * state.flee;
      const rate = burstEnv > 0 && state.speed < state.speedTarget ? 10 : STYLE.schoolSpeedEase;
      state.speed += (state.speedTarget - state.speed) * (1 - Math.exp(-rate * dt));

      // 向き：上限つきで曲がる（曲がる速さもなめらかに変える＝隊形の弓なりがなめらか）
      const targetYaw = state.burstT >= 0
        ? state.burstYaw
        : Math.atan2(_ctrTarget.x - state.pos.x, _ctrTarget.z - state.pos.z);
      const turnMax = state.burstT >= 0
        ? STYLE.schoolBurstTurnRate
        : STYLE.schoolCalmTurnRate + (STYLE.schoolFlowTurnRate - STYLE.schoolCalmTurnRate) * tE;
      const wantRate = clamp(wrapAngle(targetYaw - state.headingYaw) * 2.0, -turnMax, turnMax);
      state.yawRate += (wantRate - state.yawRate) * Math.min(1, dt * 3);
      state.headingYaw = wrapAngle(state.headingYaw + state.yawRate * dt);

      // 移動：向きに沿って進む。上下は目標の高さへゆっくり
      _ctrPrev.copy(state.pos);
      const vy = clamp((_ctrTarget.y - state.pos.y) * 0.6, -0.08, 0.08);
      state.pos.x += Math.sin(state.headingYaw) * state.speed * dt;
      state.pos.z += Math.cos(state.headingYaw) * state.speed * dt;
      state.pos.y += vy * dt;
      schoolCenterRange(state, state.headingYaw, state.guide === 'flow' ? 1.0 : STYLE.schoolRoamFit, state.range);
      state.pos.x = clamp(state.pos.x, -state.range.x, state.range.x);
      state.pos.z = clamp(state.pos.z, -state.range.z, state.range.z);
      state.pos.y = clamp(state.pos.y, tl(1.28), tl(1.74));
      if (dt > 0) state.vel.subVectors(state.pos, _ctrPrev).multiplyScalar(1 / dt);
      state.speedActual = state.vel.length();

      // 隊形の中の渦（flow では控えめ）と、弓なりの曲げ（曲がる速さ ÷ 進む速さ。先端の曲げ角に上限）
      state.swirlPhase += STYLE.schoolSwirlRate * (1 + (STYLE.schoolFlowSwirlScale - 1) * Math.max(tE, state.flee)) * dt;
      const reach = STYLE.schoolRadiusX * state.shape.countScale * state.shape.scaleF;
      const maxCurv = STYLE.schoolBendMaxAngle / Math.max(reach, 0.05);
      // 曲げは進んでいるときだけ（calm でその場で向きを変えるときは、雲のまま向きを変える）
      const bendWeight = smoothstep(state.speed, STYLE.schoolBendSpeedRange[0], STYLE.schoolBendSpeedRange[1]);
      const curv = clamp(state.yawRate / Math.max(state.speed, STYLE.schoolBendMinSpeed), -maxCurv, maxCurv) * bendWeight;
      state.bendCurv += (curv - state.bendCurv) * (1 - Math.exp(-STYLE.schoolBendEase * dt));
      return state;
    }

    // 部品（v9・最終段）：イワシを大きな魚の体の中心線（鼻先〜尾）から最小距離まで押し出す（体が重ならない保証）
    // 押し出し先は「すべての大きな魚から最小距離以上」かつ「水槽の内側（後段で押し戻されない範囲）」の候補から選ぶ。
    // 大きな魚が 2 匹並んでいる間や、ガラス・砂の近くでも、片方から押し出して別の方へ近づけることがないように
    const _sepSegs = [];
    const _sepFwd = new THREE.Vector3();
    const _sepQ = new THREE.Vector3();
    const _sepC = new THREE.Vector3();
    const _sepDir = new THREE.Vector3();
    const _sepBest = new THREE.Vector3();
    const SEP_CANDIDATES = 9;
    function separateSchoolFromBigFish(agents, fishAgents) {
      let n = 0;
      for (const f of fishAgents) {
        if (!STYLE.schoolThreats[f.species]) continue;
        const sg = _sepSegs[n] ?? (_sepSegs[n] = { a: new THREE.Vector3(), b: new THREE.Vector3(), c: new THREE.Vector3(), side: new THREE.Vector3(), minD: 0, reach2: 0 });
        const o = f.actor.object;
        const half = f.limits.half;
        sg.minD = Math.max(STYLE.schoolBigFishHardMin, f.limits.halfH + STYLE.schoolBigFishHardGap);
        _sepFwd.set(0, 0, 1).applyEuler(o.rotation);
        sg.a.copy(o.position).addScaledVector(_sepFwd, -half);
        sg.b.copy(o.position).addScaledVector(_sepFwd, half);
        sg.c.copy(o.position);
        sg.side.set(_sepFwd.z, 0, -_sepFwd.x);
        if (sg.side.lengthSq() < 1e-8) sg.side.set(1, 0, 0);
        sg.side.normalize();
        sg.reach2 = (half + sg.minD) * (half + sg.minD);
        n++;
      }
      // 点 p が全部の大きな魚から離れている度合い（最小距離との差の最小値。0 以上なら合格）と、いちばん食い込んでいる魚
      const clearance = (p) => {
        let worst = Infinity;
        let worstK = -1;
        for (let k = 0; k < n; k++) {
          const sg = _sepSegs[k];
          if (p.distanceToSquared(sg.c) > sg.reach2) continue;
          const m = closestPointOnSegment(sg.a, sg.b, p, _sepQ).distanceTo(p) - sg.minD;
          if (m < worst) { worst = m; worstK = k; }
        }
        return { worst, worstK };
      };
      for (const s of agents) {
        const p = s.actor.object.position;
        let cl = clearance(p);
        if (cl.worst >= 0) continue;
        const lim = s.limits;
        const inBounds = (q) => Math.abs(q.x) <= lim.limX - 0.02 && Math.abs(q.z) <= lim.limZ - 0.02 && q.y >= lim.minY + 0.03 && q.y <= lim.maxY - 0.03;
        for (let pass = 0; pass < 3 && cl.worst < 0; pass++) {
          const sg = _sepSegs[cl.worstK];
          closestPointOnSegment(sg.a, sg.b, p, _sepQ);
          const qx = _sepQ.x, qy = _sepQ.y, qz = _sepQ.z;
          _sepDir.set(p.x - qx, p.y - qy, p.z - qz);
          if (_sepDir.lengthSq() < 1e-10) _sepDir.copy(sg.side);
          _sepDir.normalize();
          let bestScore = -Infinity;
          // 候補：まっすぐ外へ／x を除く／z を除く／上／下／横（左右）／斜め上下
          for (let k = 0; k < SEP_CANDIDATES; k++) {
            const dx = _sepDir.x, dy = _sepDir.y, dz = _sepDir.z;
            if (k === 0) _sepC.set(dx, dy, dz);
            else if (k === 1) _sepC.set(0, dy, dz);
            else if (k === 2) _sepC.set(dx, dy, 0);
            else if (k === 3) _sepC.set(0, 1, 0);
            else if (k === 4) _sepC.set(0, -1, 0);
            else if (k === 5) _sepC.copy(sg.side);
            else if (k === 6) _sepC.copy(sg.side).negate();
            else if (k === 7) _sepC.set(dx, Math.abs(dy) + 0.8, dz);
            else _sepC.set(dx, -Math.abs(dy) - 0.8, dz);
            if (_sepC.lengthSq() < 1e-8) continue;
            _sepC.normalize().multiplyScalar(sg.minD + 0.002);
            _sepC.x += qx; _sepC.y += qy; _sepC.z += qz;
            const c = clearance(_sepC);
            // 合格（全部の魚から離れていて水槽の内側）の候補は移動の少ない順、なければ食い込みの少ない候補
            const ok = c.worst >= -1e-4 && inBounds(_sepC);
            const score = ok ? 10 - _sepC.distanceTo(p) : Math.min(c.worst, 0) - (inBounds(_sepC) ? 0 : 1);
            if (score > bestScore) { bestScore = score; _sepBest.copy(_sepC); }
          }
          p.copy(_sepBest);
          cl = clearance(p);
        }
      }
    }

    // 部品（v9・最終段）：魚 1 匹の体の外接箱（v7 の検証フック bodyExtents と同じ形：鼻先・尾・左右に体長×0.08・上下に体高の半分）
    const _guardFwd = new THREE.Vector3();
    const _guardBox = new THREE.Box3();
    const _guardTmp = new THREE.Vector3();
    function computeFishBodyBox(agent, out) {
      const obj = agent.actor.object;
      const lim = agent.limits;
      _guardFwd.set(0, 0, 1).applyEuler(obj.rotation);
      const p = obj.position;
      const side = lim.bodyLength * 0.08;
      out.makeEmpty();
      out.expandByPoint(_guardTmp.copy(p).addScaledVector(_guardFwd, lim.half));
      out.expandByPoint(_guardTmp.copy(p).addScaledVector(_guardFwd, -lim.half));
      out.min.x -= side; out.max.x += side;
      out.min.z -= side; out.max.z += side;
      out.min.y -= lim.halfH; out.max.y += lim.halfH;
      return out;
    }

    // 部品（v9・最終段）：体の外接箱がガラス・水面・砂からはみ出していたら、はみ出した分だけ位置を戻す（全種の魚）
    function keepFishBodyInTank(agent) {
      const box = computeFishBodyBox(agent, _guardBox);
      const p = agent.actor.object.position;
      const g = STYLE.tankGuardGap;
      if (box.min.x < -HALF_X + g) p.x += (-HALF_X + g) - box.min.x;
      else if (box.max.x > HALF_X - g) p.x -= box.max.x - (HALF_X - g);
      if (box.min.z < -HALF_Z + g) p.z += (-HALF_Z + g) - box.min.z;
      else if (box.max.z > HALF_Z - g) p.z -= box.max.z - (HALF_Z - g);
      if (box.max.y > WATER_Y - g) p.y -= box.max.y - (WATER_Y - g);
      else if (box.min.y < STYLE.tankGuardFloorY) p.y += STYLE.tankGuardFloorY - box.min.y;
    }

    // 部品（v9・最終段）：イカ。squid-kit の約束で squid.object は動かせないので、前進中に見えている体の外接箱が
    // 水槽の端へ squidGuardMargin まで近づいたら、その場でとどまる動き（hover：home へ戻る）に切り替える
    const _squidBox = new THREE.Box3();
    const _squidPart = new THREE.Box3();
    // （頂点はキット側で毎フレーム動くので外接箱は毎回計算し直す。重いので呼ぶ側で数ステップに 1 回に間引く）
    function guardSquidRange(s) {
      if (!s.isForward) return false;
      _squidBox.makeEmpty();
      s.actor.object.updateMatrixWorld(true);
      s.actor.object.traverseVisible((o) => {
        if (!o.isMesh || !o.geometry) return;
        o.geometry.computeBoundingBox();
        _squidPart.copy(o.geometry.boundingBox).applyMatrix4(o.matrixWorld);
        _squidBox.union(_squidPart);
      });
      const m = STYLE.squidGuardMargin;
      const near = _squidBox.min.x < -HALF_X + m || _squidBox.max.x > HALF_X - m ||
        _squidBox.min.z < -HALF_Z + m || _squidBox.max.z > HALF_Z - m || _squidBox.max.y > WATER_Y - m;
      if (near) {
        s.isForward = false;
        s.actor.setMotion('hover');
        s.timer = 15.0 + Math.random() * 15.0;
        s.guardStops = (s.guardStops || 0) + 1;
      }
      return near;
    }

    const _schoolSlotWorld = new THREE.Vector3();
    const _schoolSep = new THREE.Vector3();
    const _schoolToSlot = new THREE.Vector3();
    const _schoolSlotOpts = { count: 1, headingYaw: 0, wobblePhase: 0 };

    // 部品：群れ個体の凝集＋近距離分離＋目標速度算出
    function computeSchoolSteer(agent, agents, state, t, outGoal, options = NO_OPTS) {
      const cohesion = options.cohesion ?? STYLE.schoolCohesion;
      const speedGain = options.speedGain ?? STYLE.schoolSpeedGain;
      const alignLead = options.alignLead ?? STYLE.schoolAlignLead;
      const minForwardBias = options.minForwardBias ?? STYLE.schoolMinForwardBias;
      const sepDist = options.separationDist ?? STYLE.schoolSeparationDist;
      const sepMinDist = options.separationMinDist ?? STYLE.schoolSeparationMinDist;
      const sepWeight = options.separationWeight ?? STYLE.schoolSeparationWeight;
      const sepSpeedGain = options.separationSpeedGain ?? STYLE.schoolSeparationSpeedGain;
      const minSpeed = options.minSpeed ?? STYLE.schoolMinSpeed;
      const maxSpeed = options.maxSpeed ?? STYLE.schoolMaxSpeed;

      const catchUpSpeed = options.catchUpSpeed ?? STYLE.schoolCatchUpSpeed;

      // 既定（options なし）では使い回しの引数オブジェクトを渡す。options 指定時だけ従来どおり複製する
      const slotOpts = options === NO_OPTS ? _schoolSlotOpts : { ...options };
      slotOpts.count = agents.length;
      slotOpts.headingYaw = state.headingYaw;
      slotOpts.wobblePhase = agent.wobblePhase;
      applySchoolShapeOptions(state, slotOpts);   // v9：緩急・締まり・弓なりの曲げ
      schoolSlotOffset(agent.slotIndex, t, _schoolSlotWorld, slotOpts).add(state.pos);

      const pos = agent.actor.object.position;
      _schoolSep.set(0, 0, 0);
      const sepDist2 = sepDist * sepDist;
      for (const other of agents) {
        if (other === agent) continue;
        const op = other.actor.object.position;
        const dx = pos.x - op.x;
        const dy = pos.y - op.y;
        const dz = pos.z - op.z;
        const d2 = dx * dx + dy * dy + dz * dz;
        if (d2 > 1e-8 && d2 < sepDist2) {
          const d = Math.sqrt(d2);
          const t1 = (sepDist - d) / sepDist;
          const t2 = Math.max(0, (sepMinDist - d) / sepMinDist);
          const push = t1 + 2.2 * t2;
          _schoolSep.x += (dx / d) * push;
          _schoolSep.y += (dy / d) * push;
          _schoolSep.z += (dz / d) * push;
        }
      }

      _schoolSlotWorld.addScaledVector(_schoolSep, sepWeight);

      // v9：大きな魚の近くでは狙う点を体のまわりから押し出す（群れがへこみ・分かれる。通過すれば元のスロットへ戻って閉じる）
      _schoolSlotBefore.copy(_schoolSlotWorld);
      const dart = applySchoolThreatDent(_schoolSlotWorld, pos, state.threats, state.threatCount);
      // 押し出した点は群れの外形（隊形の前後・横・上下の半径で測った楕円体。元のスロットか schoolDentEnvelope の外側の大きい方）
      // より外へ出さない。へこみは「外へ膨らむ」のではなく「まわりが密になる」形にする（R2・R3）
      // （押し出されていない点は n1 = n0 なので変わらない）
      if (_schoolSlotWorld.distanceToSquared(_schoolSlotBefore) > 1e-10) {
        const n0 = schoolEnvelopeRadius(state, _schoolSlotBefore);
        const n1 = schoolEnvelopeRadius(state, _schoolSlotWorld);
        const nMax = Math.max(n0, STYLE.schoolDentEnvelope);
        if (n1 > nMax) _schoolSlotWorld.sub(state.pos).multiplyScalar(nMax / n1).add(state.pos);
      }
      // v9：狙う点は個体の自由域（ガラス際で曲がり始める手前）に収める。届かない点を狙って壁際で大回りしないため
      const lim = agent.limits;
      _schoolSlotWorld.x = clamp(_schoolSlotWorld.x, -lim.startX, lim.startX);
      _schoolSlotWorld.z = clamp(_schoolSlotWorld.z, -lim.startZ, lim.startZ);

      _schoolToSlot.subVectors(_schoolSlotWorld, pos);
      // v9：スロットから離れるほど引力を強め、進行方向へそろえる力を弱める（まず戻ることを優先）
      const slotDist = _schoolToSlot.length();
      const leash = smoothstep(slotDist, STYLE.schoolLeashStart, STYLE.schoolLeashFull);
      const coh = cohesion * (1 + (STYLE.schoolLeashGain - 1) * leash);
      const tempo = state.tempo;
      // calm（雲）では進行方向へそろえる力と前向きの下限を弱める：向きがゆるくばらけ、後ろのスロットへも向き直れる
      const alignScale = STYLE.schoolCalmAlignScale + (STYLE.schoolFlowAlignScale - STYLE.schoolCalmAlignScale) * tempo;
      const align = alignLead * alignScale * (1 - 0.6 * leash);

      const hSin = Math.sin(state.headingYaw);
      const hCos = Math.cos(state.headingYaw);
      outGoal.set(
        hSin * align + _schoolToSlot.x * coh,
        0,
        hCos * align + _schoolToSlot.z * coh
      );
      const fwdComp = outGoal.x * hSin + outGoal.z * hCos;
      const fwdBias = minForwardBias * (STYLE.schoolCalmForwardBiasScale + (1 - STYLE.schoolCalmForwardBiasScale) * tempo) * (1 - leash);
      if (fwdComp < fwdBias) {
        const boost = fwdBias - fwdComp;
        outGoal.x += hSin * boost;
        outGoal.z += hCos * boost;
      }
      // v9：自分の向きが狙う方向と大きくずれている間は減速する（全速のまま大回りして群れから離れない）
      const goalYaw = Math.atan2(outGoal.x, outGoal.z);
      const facing = smoothstep(Math.cos(goalYaw - agent.yaw), 0.3, 0.95);
      const offHeadingMul = STYLE.schoolOffHeadingSpeedMin + (1 - STYLE.schoolOffHeadingSpeedMin) * facing;

      outGoal.x += pos.x;
      outGoal.y = _schoolSlotWorld.y + _schoolToSlot.y * 0.45;
      outGoal.z += pos.z;

      const schoolSpeed = state.vel.length();
      const sepFwd = _schoolSep.x * hSin + _schoolSep.z * hCos;
      const aheadAlongHeading = _schoolToSlot.x * hSin + _schoolToSlot.z * hCos + sepFwd * sepSpeedGain;
      // 離れているときは「進行方向に沿った遅れ」ではなく「スロットまでの距離」で追いつく
      const ahead = aheadAlongHeading + (slotDist - aheadAlongHeading) * leash;
      const speed = schoolSpeed + agent.speedOffset * (1 - 0.6 * tempo) + ahead * speedGain + dart;
      // 最高速は flow・追いつき・驚きのときに上げる。速さの追従も驚き・追いつきのときは速い
      const urgency = Math.max(tempo, leash, state.flee);
      agent.accel = (state.flee > 0.05 || leash > 0.3) ? STYLE.schoolFishBurstAccel : STYLE.schoolFishAccel;
      // 向きのずれによる減速は上限で頭打ちにした後にかける（大きく遅れていても、向き直るまでは速く泳がない）
      return Math.max(minSpeed, clamp(speed, minSpeed, maxSpeed + (catchUpSpeed - maxSpeed) * urgency) * offHeadingMul);
    }

    // 部品（v9）：点 p が群れの外形（隊形の前後・横・上下の半径の楕円体、弓なりの曲げは含めない）の何倍の位置にあるか
    const _schoolSlotBefore = new THREE.Vector3();
    function schoolEnvelopeRadius(state, p) {
      const sh = state.shape;
      const a = STYLE.schoolRadiusX * sh.countScale * sh.scaleF;
      const b = STYLE.schoolRadiusZ * sh.countScale * sh.scaleL;
      const v = STYLE.schoolRadiusY * sh.countScale * sh.scaleV;
      const hs = Math.sin(state.headingYaw);
      const hc = Math.cos(state.headingYaw);
      const dx = p.x - state.pos.x;
      const dz = p.z - state.pos.z;
      const f = dx * hs + dz * hc;
      const l = dx * hc - dz * hs;
      return Math.hypot(f / a, l / b, (p.y - state.pos.y) / v);
    }

    // 部品（v9）：線分 a-b 上で点 p に最も近い点を out に入れる
    function closestPointOnSegment(a, b, p, out) {
      const abx = b.x - a.x, aby = b.y - a.y, abz = b.z - a.z;
      const L2 = abx * abx + aby * aby + abz * abz;
      let u = 0;
      if (L2 > 1e-12) u = clamp(((p.x - a.x) * abx + (p.y - a.y) * aby + (p.z - a.z) * abz) / L2, 0, 1);
      return out.set(a.x + abx * u, a.y + aby * u, a.z + abz * u);
    }

    // 部品（v9）：大きな魚の体（鼻先〜尾の線分を進む先へ少し伸ばした棒）のまわりから、イワシの狙う点を押し出す。
    // 狙う点（スロット）が棒の中にあれば、棒の外へ向けて上限 STYLE.schoolDentMaxShift までずらす（へこみ。近くほど密になる）。
    // ずらす量に上限があるので、群れを大きく崩さず、大きな魚が通り過ぎればすぐ閉じる。体どうしが重ならないことは最終段
    // （separateSchoolFromBigFish）が保証する。threats は senseSchoolThreats が毎ステップ作る { a, b, side, radius, dart }。
    // 戻り値は棒の中にいる個体の速さの上乗せ（m/s、さっと身をかわす）
    const _dentQ = new THREE.Vector3();
    const _dentSide = new THREE.Vector3();
    const _dentShift = new THREE.Vector3();
    function applySchoolThreatDent(target, fishPos, threats, count) {
      let dart = 0;
      _dentShift.set(0, 0, 0);
      for (let i = 0; i < count; i++) {
        const th = threats[i];
        const sd = closestPointOnSegment(th.a, th.b, fishPos, _dentQ).distanceTo(fishPos);
        if (sd < th.radius) dart = Math.max(dart, th.dart * (1 - sd / th.radius));
        closestPointOnSegment(th.a, th.b, target, _dentQ);
        _dentSide.subVectors(target, _dentQ);
        const td = _dentSide.length();
        if (td >= th.radius) continue;
        if (td > 1e-4) _dentShift.addScaledVector(_dentSide, (th.radius - td) / td);
        else _dentShift.addScaledVector(th.side, th.radius);
      }
      const len = _dentShift.length();
      if (len > STYLE.schoolDentMaxShift) _dentShift.multiplyScalar(STYLE.schoolDentMaxShift / len);
      target.add(_dentShift);
      return dart;
    }

    // 部品：魚 1 匹ぶんの巡回の限界（v7）。体長の半分＋すき間を必ずガラスから離し（はみ出し 0）、
    // 旋回半径（速さ ÷ 最大旋回速度）が大きい魚ほど壁の手前で早めに中央へ曲がり始める
    // v9：turnRate（旋回の速さの上限）を魚ごとに渡せる（イワシは STYLE.schoolFishTurnRate）
    function computePatrolLimits(bodyLength, turnSpeed, turnRate = MAX_TURN_RATE) {
      const half = bodyLength * 0.5;
      const gap = STYLE.fishGlassGap;
      const limX = HALF_X - gap - half;
      const limZ = HALF_Z - gap - half;
      const turnR = turnSpeed / turnRate;
      const fullX = Math.min(STYLE.fishWallFullX, limX - turnR * STYLE.fishTurnMargin);
      const fullZ = Math.min(STYLE.fishWallFullZ, limZ - turnR * STYLE.fishTurnMargin);
      const startX = Math.min(STYLE.fishWallStartX, fullX - STYLE.fishWallRamp);
      const startZ = Math.min(STYLE.fishWallStartZ, fullZ - STYLE.fishWallRamp);
      const halfH = bodyLength * STYLE.fishBodyHalfHeight;
      const yMargin = Math.max(tl(0.12), halfH + gap);
      return {
        bodyLength,
        half,
        halfH,
        turnR,
        limX,
        limZ,
        startX,
        startZ,
        fullX,
        fullZ,
        patrolX: Math.max(0.2, Math.min(STYLE.fishPatrolX, startX)),
        patrolZ: Math.max(0.2, Math.min(STYLE.fishPatrolZ, startZ)),
        minY: yMargin,
        maxY: WATER_Y - yMargin,
      };
    }

    function pickFishWaypoint(spec, limits, out = new THREE.Vector3()) {
      return out.set(
        (Math.random() * 2 - 1) * limits.patrolX,
        spec.zoneCenter + (Math.random() * 2 - 1) * spec.zoneHalf * 0.85,
        (Math.random() * 2 - 1) * limits.patrolZ
      );
    }

    const _steerGoal = new THREE.Vector3();
    const _fwd = new THREE.Vector3();
    const _slotNow = new THREE.Vector3();
    const _slotAhead = new THREE.Vector3();

    function stepFishAgent(agent, desiredGoal, desiredSpeed, dt) {
      const actor = agent.actor;
      const pos = actor.object.position;
      const spec = agent.spec;
      const zoneMin = spec.zoneCenter - spec.zoneHalf;
      const zoneMax = spec.zoneCenter + spec.zoneHalf;

      // 壁や遊泳帯上下限に近づいたら中心方向へ目標方位を寄せる（v7：寄せ始め・寄せ切りは魚ごとの限界 limits）
      const lim = agent.limits;
      const wallX = smoothstep(Math.abs(pos.x), lim.startX, lim.fullX);
      const wallZ = smoothstep(Math.abs(pos.z), lim.startZ, lim.fullZ);
      const wallWeight = Math.max(wallX, wallZ);

      _steerGoal.copy(desiredGoal);
      if (wallWeight > 0) {
        _steerGoal.lerp(_centerTmp.set(0, spec.zoneCenter, 0), wallWeight);
      }

      if (pos.y < zoneMin + tl(0.14)) {
        const pull = smoothstep(zoneMin + tl(0.14) - pos.y, 0, tl(0.22));
        _steerGoal.y = THREE.MathUtils.lerp(_steerGoal.y, spec.zoneCenter + spec.zoneHalf * 0.35, pull);
      } else if (pos.y > zoneMax - tl(0.14)) {
        const pull = smoothstep(pos.y - (zoneMax - tl(0.14)), 0, tl(0.22));
        _steerGoal.y = THREE.MathUtils.lerp(_steerGoal.y, spec.zoneCenter - spec.zoneHalf * 0.35, pull);
      }
      _steerGoal.y = clamp(_steerGoal.y, zoneMin, zoneMax);

      const dx = _steerGoal.x - pos.x;
      const dz = _steerGoal.z - pos.z;
      const targetYaw = Math.atan2(dx, dz);
      let diff = wrapAngle(targetYaw - agent.yaw);
      // v9（イワシのみ）：目標がほぼ真後ろのとき、左右の判定が毎ステップ入れ替わって旋回が打ち消し合い、
      // 向き直れないまま離れていく（v8 の離れ魚の主因）。今回っている向きを保って回り切る
      if (agent.turnMax !== undefined && Math.abs(diff) > 2.5 && agent.turnRate * diff < 0) {
        diff -= Math.sign(diff) * Math.PI * 2;
      }
      // v9：旋回・上下の傾きの上限は魚ごと（イワシは小回りが利く。他の魚は従来どおり MAX_TURN_RATE・0.24）
      const turnMax = agent.turnMax ?? MAX_TURN_RATE;
      const pitchMax = agent.pitchMax ?? 0.24;
      const wantTurn = clamp(diff * 1.85, -turnMax, turnMax);
      agent.turnRate += (wantTurn - agent.turnRate) * Math.min(1, dt * 6);
      agent.turnRate = clamp(agent.turnRate, -turnMax, turnMax);

      const dy = _steerGoal.y - pos.y;
      const wantVy = clamp(dy * 0.85, -0.22, 0.22);
      const wantPitch = clamp(-Math.atan2(wantVy, Math.max(actor.currentSpeed, 0.2)), -pitchMax, pitchMax);
      agent.pitch += (wantPitch - agent.pitch) * Math.min(1, dt * 4);

      // drive は個体ごとに 1 つを使い回す（毎ステップ新しいオブジェクトを作らない。fish-kit は値を読むだけ）
      if (!agent.drive) agent.drive = { speed: 0, turnRate: 0, accel: 0 };
      agent.drive.speed = desiredSpeed;
      agent.drive.turnRate = agent.turnRate;
      agent.drive.accel = agent.accel ?? 0;   // v9：イワシだけが読む（速さの追従の速さ。0 なら既定値）
      actor.drive = agent.drive;
      actor.update(dt);

      agent.yaw = wrapAngle(agent.yaw + agent.turnRate * dt);
      actor.object.rotation.set(agent.pitch, agent.yaw, 0, 'YXZ');
      _fwd.set(0, 0, 1).applyEuler(actor.object.rotation);
      pos.addScaledVector(_fwd, actor.currentSpeed * dt);

      // v7：体の中心ではなく体の先端がガラス・水面・砂から出ないよう、体長の半分＋すき間で止める
      pos.x = clamp(pos.x, -lim.limX, lim.limX);
      pos.z = clamp(pos.z, -lim.limZ, lim.limZ);
      pos.y = clamp(pos.y, lim.minY, lim.maxY);
    }

    // ===== 部品：群れの描画（v7 性能対策：イワシ全員を「体・鰭・目」の 3 回の描画呼び出しでまとめて描く） =====
    // v6 は 1 匹ごとに createSardine を呼び、sardine.update() が全頂点を毎フレーム CPU で曲げていた
    // （42 匹で 1 フレーム約 5.5MB の使い捨てオブジェクト、頂点バッファの再転送、1 匹 10 回の描画呼び出し）。
    // v7 は createSardine を手本として 1 回だけ呼び（sardine.js 本体・import は無変更）、その形と材質から
    // InstancedMesh を 3 つ作る。屈伸は sardine.js の evaluateSwimWave と同じ式を頂点シェーダーで評価し、
    // CPU は個体ごとに「位相」と「尾の振幅」の 2 値だけを渡す。目も同じ式で頭の横ずれに追従する。
    // 個体の位置・向き・体長は従来どおり個体ごとの Object3D（object → bank → 'sardine'）で決め、その行列を写すだけ。
    const SARDINE_FIN_PARTS = ['tailFin', 'dorsalFin', 'analFin', 'pectoralFinR', 'pectoralFinL', 'pelvicFinR', 'pelvicFinL'];
    const SARDINE_BEND_GLSL_PARS = `
attribute float aSdPhase;
attribute float aSdTailAmp;
uniform vec4 uSdEnv;
uniform vec3 uSdShape;
`;
    // evaluateSwimWave と同じ：横ずれ dz と傾き slope。法線は slope で傾けて正規化
    const SARDINE_BEND_GLSL_NORMAL = `
#include <beginnormal_vertex>
float sdS = clamp((uSdShape.x - position.x) / uSdShape.y, 0.0, 1.0);
float sdEnv = uSdEnv.x + uSdEnv.y * sdS + uSdEnv.z * pow(sdS, uSdEnv.w);
float sdK = 6.28318530718 / uSdShape.z;
float sdArg = aSdPhase - sdK * sdS;
float sdSin = sin(sdArg);
float sdCos = cos(sdArg);
float sdDz = aSdTailAmp * sdEnv * sdSin;
float sdDEnv = uSdEnv.y + uSdEnv.z * uSdEnv.w * pow(max(sdS, 1e-6), uSdEnv.w - 1.0);
float sdSlope = -aSdTailAmp * (sdDEnv * sdSin - sdEnv * sdK * sdCos) / uSdShape.y;
objectNormal = normalize(vec3(objectNormal.x - sdSlope * objectNormal.z, objectNormal.y, objectNormal.z + sdSlope * objectNormal.x));
`;

    function applySardineBend(material, sharedUniforms) {
      material.onBeforeCompile = (shader) => {
        Object.assign(shader.uniforms, sharedUniforms);
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', `#include <common>\n${SARDINE_BEND_GLSL_PARS}`)
          .replace('#include <beginnormal_vertex>', SARDINE_BEND_GLSL_NORMAL)
          .replace('#include <begin_vertex>', '#include <begin_vertex>\ntransformed.z += sdDz;');
      };
      material.customProgramCacheKey = () => 'aq-sardine-bend-v7';
      material.needsUpdate = true;
    }

    function buildSchoolRenderer(capacity = SCHOOL_MAX, options = {}) {
      const template = createSardine({
        length: 0.12, // 手本は基準長。個体ごとの体長は行列の拡大で与える
        phase: 0,
        metalness: options.metalness ?? STYLE.sardineMetalness,
        roughness: options.roughness ?? STYLE.sardineRoughness,
      });
      template.object.updateMatrixWorld(true);
      const spec = template.object.userData.sardineSpec;
      const swimParams = spec.swimParams;
      const baseLength = spec.baseLength;
      const sharedUniforms = {
        uSdEnv: { value: new THREE.Vector4(swimParams.envHead, swimParams.envLin, swimParams.envPow, swimParams.envExp) },
        // sardine.js: SNOUT_X = BASE_LENGTH * 0.5（鼻先の極点。v7 フック schoolBend() で体の外接箱の先端と一致を確認）
        uSdShape: { value: new THREE.Vector3(baseLength * 0.5, baseLength, swimParams.wavelength) },
      };
      const maxTailAmp = baseLength * swimParams.ampRatio * swimParams.maxSpeedForAmp;
      const bodyMesh = template.object.getObjectByName('body');

      const phaseAttr = new THREE.InstancedBufferAttribute(new Float32Array(capacity), 1);
      const ampAttr = new THREE.InstancedBufferAttribute(new Float32Array(capacity), 1);
      phaseAttr.setUsage(THREE.DynamicDrawUsage);
      ampAttr.setUsage(THREE.DynamicDrawUsage);

      // 同じ材質の部位を 1 つの形にまとめる（鰭 7 枚 → 1、目 2 つ → 1）
      const mergeParts = (names) => {
        const meshes = names.map((n) => template.object.getObjectByName(n)).filter(Boolean);
        const geos = meshes.map((m) => m.geometry.clone().applyMatrix4(m.matrix));
        const geo = geos.length === 1 ? geos[0] : mergeGeometries(geos, false);
        if (geos.length > 1) geos.forEach((g) => g.dispose());
        geo.computeBoundingSphere();
        geo.boundingSphere.radius += maxTailAmp; // 曲がった分の余裕（以後は再計算しない）
        geo.setAttribute('aSdPhase', phaseAttr);
        geo.setAttribute('aSdTailAmp', ampAttr);
        return { geo, material: meshes[0].material, renderOrder: meshes[0].renderOrder, sourceMeshes: meshes.length };
      };
      const parts = [
        { name: 'school-body', ...mergeParts(['body']) },
        { name: 'school-fins', ...mergeParts(SARDINE_FIN_PARTS) },
        { name: 'school-eyes', ...mergeParts(['eyeR', 'eyeL']) },
      ];

      const group = new THREE.Group();
      group.name = 'school-instanced';
      let sharedMatrix = null;
      const meshes = parts.map((p) => {
        applySardineBend(p.material, sharedUniforms);
        const im = new THREE.InstancedMesh(p.geo, p.material, capacity);
        if (sharedMatrix) {
          im.instanceMatrix = sharedMatrix; // 3 部位で同じ行列を共有（転送は 1 回）
        } else {
          im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
          sharedMatrix = im.instanceMatrix;
        }
        im.count = 0;
        im.name = p.name;
        im.renderOrder = p.renderOrder;
        group.add(im);
        return im;
      });

      // 個体側の見えない手本（検証フック v5.detail が体の形と向きを読む）
      const proxyMaterial = new THREE.MeshBasicMaterial({ visible: false });

      const update = (agents) => {
        const n = Math.min(agents.length, capacity);
        const mArr = sharedMatrix.array;
        const phArr = phaseAttr.array;
        const ampArr = ampAttr.array;
        for (let i = 0; i < n; i++) {
          const actor = agents[i].actor;
          actor.object.updateMatrixWorld(true);
          mArr.set(actor.renderNode.matrixWorld.elements, i * 16);
          phArr[i] = actor.bendPhase;
          ampArr[i] = actor.bendTailAmp;
        }
        for (const attr of [sharedMatrix, phaseAttr, ampAttr]) {
          attr.clearUpdateRanges();
          attr.addUpdateRange(0, n * attr.itemSize);
          attr.needsUpdate = true;
        }
        for (const im of meshes) {
          im.count = n;
          im.computeBoundingSphere();
        }
      };

      return {
        group,
        meshes,
        sharedUniforms,
        update,
        template: {
          modelName: template.object.name,
          spec,
          baseLength,
          bodyGeometry: bodyMesh.geometry,
          proxyMaterial,
        },
        info: () => ({
          drawCalls: meshes.length,
          instanceCount: meshes[0].count,
          capacity,
          parts: parts.map((p) => ({ name: p.name, sourceMeshes: p.sourceMeshes, vertices: p.geo.attributes.position.count })),
        }),
      };
    }

    // 部品：群れ専用オリジナルモデル（sardine.js）のアダプタ（sardine.js 本体は未変更）
    const schoolRenderer = buildSchoolRenderer();
    scene.add(schoolRenderer.group);

    // v7：描画は群れの InstancedMesh（buildSchoolRenderer）が行い、個体は位置・向き・体長・泳ぎの位相だけを持つ
    function createSardineActor(options = {}) {
      const length = options.length ?? 0.12;
      const phase = options.phase ?? 0;
      const tpl = schoolRenderer.template;
      const swimParams = tpl.spec.swimParams;

      const object = new THREE.Group();
      object.name = 'sardine-actor';

      const bankGroup = new THREE.Group();
      bankGroup.name = 'sardine-bank';
      // sardine.js の object と同じ名前・向き・体長（+X 前方を +Z 前方へ）。中の 'body' は見えない手本
      const renderNode = new THREE.Group();
      renderNode.name = tpl.modelName;
      renderNode.rotation.y = -Math.PI / 2;
      renderNode.scale.setScalar(length / tpl.baseLength);
      const bodyProxy = new THREE.Mesh(tpl.bodyGeometry, tpl.proxyMaterial);
      bodyProxy.name = 'body';
      bodyProxy.visible = false;
      renderNode.add(bodyProxy);
      bankGroup.add(renderNode);
      object.add(bankGroup);

      const nominalSpeed = options.nominalSpeed ?? FISH_SPECS.katakuchi.speed;

      let speed = options.initialSpeed ?? 0.18;
      let turn = 0;
      let roll = 0;
      let swimCycles = 0;

      const actor = {
        object,
        renderNode,
        bendPhase: phase,
        bendTailAmp: 0,
        drive: null,
        get currentSpeed() {
          return speed;
        },
        setMotion() {},
        update(dt) {
          const wantSpeed = actor.drive ? Math.max(0, actor.drive.speed) : nominalSpeed;
          const wantTurn = actor.drive ? actor.drive.turnRate : 0;

          // v9：速さの追従は drive.accel（驚いたとき・追いつくときは速い）。尾の振りは実際の速さに合わせ、範囲は STYLE
          const accel = actor.drive && actor.drive.accel > 0 ? actor.drive.accel : STYLE.schoolFishAccel;
          speed += (wantSpeed - speed) * Math.min(1, dt * accel);
          turn += (wantTurn - turn) * Math.min(1, dt * 5.0);
          const targetRoll = clamp(-turn * 0.28, -0.45, 0.45);
          roll += (targetRoll - roll) * Math.min(1, dt * 4.0);
          bankGroup.rotation.z = roll;

          const swimIntensity = clamp(speed / Math.max(nominalSpeed, 0.1), STYLE.schoolSwimIntensityMin, STYLE.schoolSwimIntensityMax);
          const freqHz = swimParams.baseFreqHz + swimParams.freqPerSpeed * swimIntensity;
          swimCycles += dt * freqHz;
          // sardine.update(swimCycles / freqHz, swimIntensity) と同じ位相・振幅（位相は 2π で折り返して精度を保つ）
          actor.bendPhase = (swimCycles - Math.floor(swimCycles)) * Math.PI * 2 + phase;
          actor.bendTailAmp = tpl.baseLength * swimParams.ampRatio * Math.min(swimIntensity, swimParams.maxSpeedForAmp);
        },
        dispose() {
          // 形と材質は群れ全体で共有しているので捨てない（個体の手本を外すだけ）
          object.removeFromParent();
        },
      };
      Object.defineProperty(actor, 'sardineInfo', {
        enumerable: false,
        value: () => ({
          length,
          phase,
          swimIntensity: clamp(speed / Math.max(nominalSpeed, 0.1), STYLE.schoolSwimIntensityMin, STYLE.schoolSwimIntensityMax),
          swimCycles,
          modelName: renderNode.name,
          rotY: renderNode.rotation.y,
        }),
      });
      return actor;
    }

    function createSchoolFish(slotIndex, simTime, targetCount = INITIAL_SCHOOL_COUNT) {
      const spec = FISH_SPECS.katakuchi;
      const swimPhase = ((slotIndex * 0.61803398875) % 1) * Math.PI * 2;
      const length = 0.114 + halton(slotIndex, 17) * 0.012;
      const actor = createSardineActor({
        length,
        phase: swimPhase,
        nominalSpeed: spec.speed,
      });
      actor.setMotion('swim');

      const wobblePhase = halton(slotIndex, 7) * Math.PI * 2;
      // v9：今の隊形の形（緩急・締まり・弓なり）のスロットに置く
      schoolSlotOffset(slotIndex, simTime, _slotNow, applySchoolShapeOptions(schoolState, {
        count: targetCount,
        headingYaw: schoolState.headingYaw,
        wobblePhase,
      })).add(schoolState.pos);
      actor.object.position.set(
        clamp(_slotNow.x, -HALF_X + tl(0.2), HALF_X - tl(0.2)),
        clamp(_slotNow.y, spec.zoneCenter - spec.zoneHalf + 0.05, spec.zoneCenter + spec.zoneHalf - 0.05),
        clamp(_slotNow.z, -HALF_Z + tl(0.2), HALF_Z - tl(0.2))
      );

      const yaw = wrapAngle(schoolState.headingYaw + (Math.random() - 0.5) * 0.16);
      actor.object.rotation.set(0, yaw, 0, 'YXZ');
      scene.add(actor.object);

      return {
        species: 'katakuchi',
        spec,
        actor,
        // 群れの個体は隊形の目標点を追うので、旋回半径は巡航速度で見積もる（v9：イワシは小回りが利く）
        limits: computePatrolLimits(length, spec.speed, STYLE.schoolFishTurnRate),
        slotIndex,
        yaw,
        pitch: 0,
        turnRate: 0,
        turnMax: STYLE.schoolFishTurnRate,
        pitchMax: STYLE.schoolFishMaxPitch,
        accel: STYLE.schoolFishAccel,
        wobblePhase,
        speedOffset: (Math.random() - 0.5) * 0.015,
      };
    }

    function setSchoolCount(targetCount, simTime) {
      const clamped = clamp(Math.round(targetCount / SCHOOL_STEP) * SCHOOL_STEP, SCHOOL_MIN, SCHOOL_MAX);
      while (schoolAgents.length < clamped) {
        const agent = createSchoolFish(schoolAgents.length, simTime, clamped);
        schoolAgents.push(agent);
      }
      while (schoolAgents.length > clamped) {
        const removed = schoolAgents.pop();
        removed.actor.dispose();
      }
      updateHudUI();
    }

    function updateHudUI() {
      const c = computeCounts();
      residentTotalEl.textContent = String(c.total);
      schoolLabelEl.textContent = `群れ ${c.katakuchi}`;
      btnDecEl.disabled = c.katakuchi <= SCHOOL_MIN;
      btnIncEl.disabled = c.katakuchi >= SCHOOL_MAX;
    }

    // ===== メイン初期化 & ループ =====
    let simTime = 0;

    btnDecEl.addEventListener('click', () => {
      if (!myaq.ready) return;
      setSchoolCount(schoolAgents.length - SCHOOL_STEP, simTime);
    });

    btnIncEl.addEventListener('click', () => {
      if (!myaq.ready) return;
      setSchoolCount(schoolAgents.length + SCHOOL_STEP, simTime);
    });

    btnAutoCamEl.addEventListener('click', () => {
      controls.autoRotate = !controls.autoRotate;
      btnAutoCamEl.classList.toggle('is-on', controls.autoRotate);
      btnAutoCamEl.setAttribute('aria-pressed', String(controls.autoRotate));
      btnAutoCamEl.textContent = controls.autoRotate ? '自動カメラ ON' : '自動カメラ OFF';
    });

    async function initAquarium() {
      try {
        await Promise.all([
          loadFish('./vendor/fish-kit/fish/', ['aji', 'madai', 'kurodai', 'buri']),
          loadSquids('./vendor/squid-kit/', ['aori']),
        ]);

        // カタクチイワシ 42 匹の群れ
        setSchoolCount(INITIAL_SCHOOL_COUNT, 0);

        // その他 4 種の魚（アジ 5, マダイ 2, クロダイ 2, ブリ 2）— 行動ロジック不変
        for (const species of ['aji', 'madai', 'kurodai', 'buri']) {
          const spec = FISH_SPECS[species];
          for (let i = 0; i < spec.count; i++) {
            const actor = createFish(species, spec.lengthCm);
            actor.setMotion('swim');
            const speedBias = (Math.random() - 0.5) * 0.04;
            const limits = computePatrolLimits(spec.lengthCm / 100, Math.max(0.15, spec.speed + Math.abs(speedBias)));
            const startPos = pickFishWaypoint(spec, limits);
            const yaw = Math.random() * Math.PI * 2 - Math.PI;
            actor.object.position.copy(startPos);
            actor.object.rotation.set(0, yaw, 0, 'YXZ');
            scene.add(actor.object);
            otherFishAgents.push({
              species,
              spec,
              actor,
              yaw,
              pitch: 0,
              turnRate: 0,
              limits,
              waypoint: pickFishWaypoint(spec, limits),
              waypointTimer: 4 + Math.random() * 5,
              speedBias,
            });
          }
        }

        // アオリイカ 2 匹（home = STYLE.squidHomes, floorY = 0）— 行動ロジック不変
        const squidConfigs = [
          { home: new THREE.Vector3(...STYLE.squidHomes[0]), initialDelay: 16.5, colorPhase: 0.4 },
          { home: new THREE.Vector3(...STYLE.squidHomes[1]), initialDelay: 24.0, colorPhase: 3.1 },
        ];
        for (const cfg of squidConfigs) {
          const actor = createSquid('aori', { home: cfg.home, floorY: 0 });
          actor.setMotion('hover');
          const origBrainUpdate = actor.brain.update.bind(actor.brain);
          actor.brain.update = (stepDt) => {
            origBrainUpdate(stepDt);
            const cT = simTime + cfg.colorPhase;
            const tg = actor.squid.target;
            tg.dark = 0.33 + 0.14 * Math.sin(cT * 0.32) + 0.05 * Math.sin(cT * 0.17 + 1.1);
            tg.cloud = Math.max(0, Math.sin(cT * 0.24 + 0.7) - 0.35) * 0.45;
            tg.pale = Math.max(0, Math.sin(cT * 0.19 + 2.2) - 0.58) * 0.42;
          };
          scene.add(actor.object);
          squidAgents.push({
            actor,
            timer: cfg.initialDelay,
            isForward: false,
          });
        }

        updateHudUI();
        statusOverlayEl.classList.add('hidden');
        myaq.ready = true;
      } catch (err) {
        myaq.ready = false;
        const msg = err && err.message ? err.message : String(err);
        console.error('Aquarium load failed:', err);
        statusBoxEl.classList.add('error');
        statusBoxEl.textContent = `読み込みに失敗しました: ${msg}`;
      }
    }

    initAquarium();

    const clock = new THREE.Clock();

    let squidGuardTick = 0;

    function stepSimulation(dt) {
      simTime += dt;

      // 1) 群れ中心（v9）：大きな魚を感知（局所反応の棒・群れ全体の締まり・急接近の驚き）→ 緩急つきで進む。
      //    v8 までの「目標点へ速度を寄せる＋反転中は中心を遅くする」は、向きに沿って進む updateSchoolCenter に置き換えた
      senseSchoolThreats(schoolState, otherFishAgents, dt);
      updateSchoolCenter(schoolState, dt, schoolAgents.length);

      // 2) カタクチイワシ群れの更新（ベイトボール／トルネード隊形＋凝集・分離）
      for (const agent of schoolAgents) {
        const speed = computeSchoolSteer(agent, schoolAgents, schoolState, simTime, _slotAhead);
        stepFishAgent(agent, _slotAhead, speed, dt);
      }

      // 3) その他 4 種の魚を更新（v5 と同一ロジック）
      for (const agent of otherFishAgents) {
        agent.waypointTimer -= dt;
        if (agent.waypointTimer <= 0 || agent.actor.object.position.distanceTo(agent.waypoint) < tl(0.75)) {
          pickFishWaypoint(agent.spec, agent.limits, agent.waypoint);
          agent.waypointTimer = 4.5 + Math.random() * 5.5;
        }
        const speed = Math.max(0.15, agent.spec.speed + agent.speedBias);
        stepFishAgent(agent, agent.waypoint, speed, dt);
      }

      // 4) アオリイカ 2 匹を更新（v5 と同一ロジック）
      for (const s of squidAgents) {
        s.timer -= dt;
        if (s.timer <= 0) {
          if (!s.isForward) {
            s.isForward = true;
            s.actor.setMotion('forward');
            s.timer = 4.0 + Math.random() * 2.0;
          } else {
            s.isForward = false;
            s.actor.setMotion('hover');
            s.timer = 15.0 + Math.random() * 15.0;
          }
        }
        s.actor.update(dt);
      }

      // 5) 最終段（v9）：①大きな魚などの体を水槽の内側へ ②イワシを大きな魚の体から離す ③イワシの体を水槽の内側へ
      //    （①で大きな魚が動いてから②をする。③はイワシが小さいので②の距離をほとんど崩さない）
      for (const agent of otherFishAgents) keepFishBodyInTank(agent);
      separateSchoolFromBigFish(schoolAgents, otherFishAgents);
      for (const agent of schoolAgents) keepFishBodyInTank(agent);
      squidGuardTick = (squidGuardTick + 1) % 6;
      if (squidGuardTick === 0) for (const s of squidAgents) guardSquidRange(s);
    }

    renderer.setAnimationLoop(() => {
      const rawDt = Math.min(clock.getDelta(), 0.25);

      if (myaq.ready) {
        let rem = rawDt;
        while (rem > 1e-6) {
          const stepDt = Math.min(rem, 0.05);
          stepSimulation(stepDt);
          rem -= stepDt;
        }
      } else {
        simTime += rawDt;
      }

      backdrop.update(simTime);
      surfaceGlow.update(simTime);
      water.update(simTime);
      marineSnow.update(rawDt, simTime);
      lightRays.update(simTime);
      sandResult.updateCaustics(simTime);
      rockResult.updateCaustics(simTime);
      propsResult.updateCaustics(simTime);
      seaweedResult.update(simTime);
      schoolRenderer.update(schoolAgents);

      controls.target.x = clamp(controls.target.x, tl(-4.0), tl(4.0));
      controls.target.y = clamp(controls.target.y, tl(0.25), tl(2.35));
      controls.target.z = clamp(controls.target.z, tl(-2.3), tl(2.3));
      controls.update();
      if (camera.position.y < tl(0.15)) camera.position.y = tl(0.15);

      renderer.render(scene, camera);
    });
